<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>会计中级 · 经济法</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --ink:#1f2329; --sub:#8a8f99;
    --line:#eceef1; --brand:#3a6df0; --brand-d:#2f5bd0;
    --ok:#1f9d55; --ok-bg:#e7f6ed; --bad:#e0483b; --bad-bg:#fdecea;
    --un:#f4f5f7; --un-ink:#9aa0aa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;}
  #app{height:100%;}
  .view{height:100%;display:flex;flex-direction:column;}
  .hidden{display:none !important;}
  .topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-top);min-height:48px;display:flex;align-items:center;gap:8px;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;flex:1;text-align:left;}
  .syncbtn{background:linear-gradient(135deg,#f0c869,#d9a524);color:#fff;border:none;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;}
  .gearbtn{background:#eceef1;color:#555;border:none;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;}
  .userchip{background:#eef3ff;color:#2f6fed;border:1px solid #d6e2ff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis;}
  .foot #syncStat{color:var(--brand);}
  .back{width:32px;height:32px;background:#f2f3f5;border:none;border-radius:10px;font-size:18px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;}
  .topbar.quizbar{gap:8px;}
  .quizbar .prog{flex:1;min-width:0;display:flex;align-items:center;height:32px;}
  .quizbar #chTitle{font-size:15px;color:var(--ink);font-weight:600;line-height:1;}
  .topbar .stats{display:flex;align-items:center;gap:5px;height:32px;}
  .topbar .stats .qpos{font-size:12px;color:var(--sub);font-weight:600;line-height:1;display:flex;align-items:center;height:100%;}
  .topbar .stats .s-correct,.topbar .stats .s-wrong,.topbar .stats .s-left{display:flex;align-items:center;gap:3px;font-weight:700;padding:3px 7px;border-radius:8px;font-size:12px;line-height:1;}
  .topbar .stats .s-correct{color:var(--ok);background:#e7f6ed;}
  .topbar .stats .s-wrong{color:var(--bad);background:#fdecea;}
  .topbar .stats .s-left{color:var(--sub);background:#f4f5f7;}
  .topbar .stats b{font-weight:800;display:inline-block;min-width:1.1em;text-align:center;}

  /* MENU */
  #menu{padding-top:0;}
  #chapterList{padding:14px;overflow:auto;flex:1;}
  .chapter{display:flex;align-items:stretch;gap:10px;background:var(--card);border-radius:14px;
    padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .ch-duo{display:flex;align-items:stretch;gap:10px;margin-bottom:12px;}
  .ch-duo>.chapter{margin-bottom:0;flex:1 1 0;min-width:0;}
  .ch-side{display:flex;flex-direction:column;gap:10px;flex:1 1 0;min-width:0;}
  .ch-side>.chapter{margin-bottom:0;flex:1 1 0;min-width:0;}
  .ch-main{flex:1;min-width:0;}
  .ch-name{font-size:17px;font-weight:700;margin-bottom:4px;}
  .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-exam{display:inline-block;font-size:13px;color:#e8590c;font-weight:700;margin-top:8px;background:#fff4ec;border:1px solid #ffd8b8;border-radius:8px;padding:3px 9px;}
  .ch-exam b{font-size:16px;color:#d9480f;}
  .ch-bar{height:7px;background:#eef0f3;border-radius:5px;overflow:hidden;}
  .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#5b8bff);border-radius:5px;}
  .ch-reset{background:#fff;border:1px solid var(--line);color:var(--sub);border-radius:10px;
    font-size:13px;padding:0 12px;align-self:center;}
  .ch-wrong{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#f0fff4);
    border:1.5px solid #bfe3c8;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(31,157,85,.08);}
  .ch-wrong .ch-main{flex:1;min-width:0;}
  .ch-wrong .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#1f9d55;display:flex;align-items:center;white-space:nowrap;}
  .ch-wrong .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#1f9d55;border-radius:8px;
    padding:1px 9px;margin-left:8px;}
  .ch-wrong .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-wrong .ch-bar{height:7px;background:#e2f5e9;border-radius:5px;overflow:hidden;}
  .ch-wrong .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd08a,#1f9d55);border-radius:5px;}
  .ch-wrong .go{background:#1f9d55;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;
    padding:0 14px;align-self:center;}
  .ch-fav{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#fff8e6);
    border:1.5px solid #ffe2a8;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(214,156,26,.10);}
  .ch-fav .ch-main{flex:1;min-width:0;}
  .ch-fav .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#c8920e;display:flex;align-items:center;white-space:nowrap;}
  .ch-fav .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#d9a524;border-radius:8px;
    padding:1px 9px;margin-left:8px;}
  .ch-fav .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  /* 手机窄屏：保持左右两列（左每日成就一行、右错题库+收藏夹两行），仅缩小内边距与字号以容纳 */
  @media (max-width:560px){
    .ch-duo{gap:8px;}
    .ch-side{gap:8px;}
    .chapter{padding:11px;}
    .ch-name{font-size:15px;}
    .ch-meta{font-size:11px;margin-bottom:4px;}
    .ch-achv .ch-meta{font-size:11px;}
  }
  .ch-fav .ch-bar{height:7px;background:#fff0cf;border-radius:5px;overflow:hidden;}
  .ch-fav .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#f0c869,#d9a524);border-radius:5px;}
  .ch-fav .go{background:#d9a524;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;
    padding:0 14px;align-self:center;}
  .ch-rand{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#f3f0ff);
    border:1.5px solid #d9ccff;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(124,93,250,.08);}
  .ch-rand .ch-main{flex:1;min-width:0;}
  .ch-rand .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#6a3cf5;display:flex;align-items:center;white-space:nowrap;}
  .ch-rand .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#6a3cf5;border-radius:8px;
    padding:1px 9px;margin-left:8px;}
  .ch-rand .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-rand .ch-bar{height:7px;background:#ece4ff;border-radius:5px;overflow:hidden;}
  .ch-rand .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#9d7bff,#6a3cf5);border-radius:5px;}
  .ch-rand .go{background:#6a3cf5;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;
    padding:0 14px;align-self:center;}
  .rand-done{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;
    background:var(--ok-bg);color:var(--ok);text-align:center;}
  .foot{text-align:center;color:var(--sub);font-size:12px;padding:12px;}

  /* MENU */
  /* QUIZ */
  #cardWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 96px;}
  #card{min-height:60%;}
  .qno{font-size:16px;color:var(--ink);margin-bottom:10px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .qno .typ{background:#eef2ff;color:var(--brand);border-radius:8px;padding:3px 10px;margin-left:0;font-weight:800;font-size:14px;}
  .qno .yr{background:#fff4e6;color:#d98a00;border-radius:8px;padding:3px 10px;margin-left:0;font-weight:700;font-size:14px;}
  .qno .idx{color:var(--ink);font-weight:800;font-size:18px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:4px 12px;}
  .qtitle{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:16px;}
  .qn-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;}
  .favbtn{background:#fff;border:1px solid var(--line);color:#d9a400;border-radius:10px;font-size:20px;line-height:1;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;}
  .favbtn.on{background:#fff7e0;color:#e0a200;border-color:#f0d28a;}
  .remove{margin-top:12px;background:var(--bad-bg);color:var(--bad);border:1px solid #f3c5bb;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;width:100%;}
  .unfav{margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 14px;font-size:14px;width:100%;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;
    transition:.12s;word-break:break-word;}
  .opt .lab{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#f0f2f5;color:var(--sub);
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .opt .otext{flex:1;line-height:1.5;}
  .opt.correct .lab{background:var(--ok);color:#fff;}
  .opt.wrong .lab{background:var(--bad);color:#fff;}
  .opt.sel .lab{background:var(--brand);color:#fff;}
  .fillwrap{margin:4px 0 2px;}
  .fillInput{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none;}
  .fillInput:focus{border-color:var(--brand);}
  .fillInput:disabled{background:#f3f4f6;color:#666;}
  .opt.sel{border-color:var(--brand);background:#f3f7ff;}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);color:#0f6b39;font-weight:600;}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:#a5281c;font-weight:600;}
  .opt.dim{opacity:.5;}
  .confirm{margin-top:16px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:13px;font-size:16px;font-weight:600;}
  .result{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;}
  .result.r-ok{background:var(--ok-bg);color:var(--ok);}
  .result.r-bad{background:var(--bad-bg);color:var(--bad);}
  .explain{margin-top:10px;background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:14px 15px;
    font-size:16.5px;color:#3a3f47;line-height:1.75;}
  .explain b{color:var(--ink);}
  .retry{margin-top:12px;background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 14px;font-size:14px;}

  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);}
  .navbar button{flex:1;background:#f4f5f7;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;color:var(--ink);}
  .navbar button:nth-child(2){background:#fff;border:1px solid var(--line);color:var(--brand);}

  /* GRID overlay */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;}
  .sheet{position:relative;background:#fff;width:100%;border-radius:18px 18px 0 0;max-height:80%;display:flex;flex-direction:column;
    animation:up .2s ease;}
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;font-size:16px;font-weight:700;}
  .sheet-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;background:transparent;border-radius:50%;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;z-index:2;}
  .sheet-x:active{background:rgba(0,0,0,.07);}
  .sheet-hd button{background:#f2f3f5;border:none;border-radius:10px;padding:7px 14px;font-size:14px;color:var(--sub);}
  .legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 18px 12px;font-size:12px;color:var(--sub);}
  .login-sheet{max-width:560px;margin:0 auto;align-self:flex-end;width:100%;padding-bottom:env(safe-area-inset-bottom);}
  .login-title{padding:22px 18px 4px;font-size:19px;font-weight:800;text-align:center;}
  .login-sub{padding:0 18px 14px;font-size:13px;color:var(--sub);text-align:center;}
  .login-users{display:flex;gap:12px;padding:4px 18px 16px;}
  .ubtn{flex:1;background:linear-gradient(135deg,#eef3ff,#dce7ff);color:#2f6fed;border:1px solid #cfe0ff;border-radius:14px;padding:16px 0;font-size:17px;font-weight:800;}
  .ubtn.small{flex:none;padding:12px 18px;font-size:14px;}
  .login-other{display:flex;gap:10px;padding:0 18px 22px;}
  .login-other input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;}
  .login-other input:focus{border-color:#2f6fed;}
  .legend i{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:2px;}
  .g-un{background:var(--un);border:1px solid var(--line);} .g-ok{background:var(--ok);} .g-bad{background:var(--bad);} .g-cur{background:#fff;border:2px solid var(--brand);}
  #gridCells{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:4px 16px 22px;overflow:auto;}
  .cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--un);color:var(--un-ink);}
  .cell.ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  .cell.bad{background:var(--bad);color:#fff;border-color:var(--bad);}
  .cell.cur{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:0 0 0 2px rgba(58,109,240,.18);}
  .cell.un{background:#fff;color:var(--un-ink);}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,34,40,.9);
    color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:80%;text-align:center;}
  #toast.show{opacity:1;}

  /* 每日成就 */
  .ch-achv{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#eef3ff);
    border:1.5px solid #cfe0ff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(58,109,240,.08);}
  .ch-achv .ch-main{flex:1;min-width:0;}
  .ch-achv .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#2f6fed;display:flex;align-items:center;}
  .ch-achv .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#3a6df0;border-radius:8px;padding:1px 9px;margin-left:8px;}
  .ch-achv .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-achv .ch-bar{height:7px;background:#e3ebff;border-radius:5px;overflow:hidden;}
  .ch-achv .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#5b8bff,#3a6df0);border-radius:5px;}
  .ch-achv .go{background:#3a6df0;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;padding:0 14px;align-self:center;}
  .achv-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .achv-h{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:8px;}
  .achv-today .achv-big{font-size:34px;font-weight:800;color:var(--brand);line-height:1.1;}
  .achv-today .achv-big span{font-size:15px;color:var(--sub);font-weight:600;margin-left:4px;}
  .achv-sub{font-size:13px;color:var(--sub);margin-top:6px;}
  .achv-ov{display:flex;gap:8px;margin-bottom:12px;}
  .achv-ov .ov{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .achv-ov .ov b{display:block;font-size:20px;font-weight:800;color:var(--ink);}
  .achv-ov .ov span{font-size:12px;color:var(--sub);}
  .achv-list .day-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .achv-list .day-row:last-child{border-bottom:none;}
  .achv-list .day-d{width:62px;font-size:13px;color:var(--ink);font-weight:600;flex:none;}
  .achv-list .day-n{width:48px;font-size:13px;color:var(--sub);flex:none;text-align:right;}
  .achv-list .day-bar{flex:1;height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;}
  .achv-list .day-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#5b8bff);border-radius:5px;}
  .achv-list .day-c{width:74px;font-size:12px;color:var(--sub);flex:none;text-align:right;}
  .achv-list .day-row.zero{opacity:.4;}
  .heat-wrap{overflow-x:auto;padding-bottom:4px;}
  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;width:max-content;}
  .heat .hc{width:13px;height:13px;border-radius:3px;background:#ebedf0;}
  .heat .hc.l1{background:#cfe9da;}
  .heat .hc.l2{background:#9bd5b2;}
  .heat .hc.l3{background:#4fae7e;}
  .heat .hc.l4{background:#1f9d55;}
  .heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--sub);margin-top:8px;}
  .heat-legend .hc{width:11px;height:11px;}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="view">
    <header class="topbar"><h1>会计中级 · 经济法</h1><span id="userChip" class="userchip" onclick="switchUser()" title="点击切换账号"></span><button class="gearbtn" onclick="setGistToken()" title="设置 gist token">⚙</button><button class="syncbtn" onclick="manualSync()">☁ 上云</button></header>
    <div id="chapterList"></div>
    <footer class="foot">最近上云：<span id="lastSync">—</span> · <span id="syncStat">进度自动上云</span></footer>
  </section>

  <section id="quiz" class="view hidden">
    <header class="topbar quizbar">
      <button class="back" onclick="showMenu()">‹</button>
      <div class="prog">
        <span id="chTitle"></span>
      </div>
      <div class="stats">
        <span id="pos" class="qpos"></span>
        <span class="s-correct">对<b id="cOk">0</b></span>
        <span class="s-wrong">错<b id="cBad">0</b></span>
        <span class="s-left">未答<b id="cLeft">0</b></span>
      </div>
    </header>
    <div id="cardWrap"><div id="card"></div></div>
    <nav class="navbar">
      <button onclick="prev()">上一题</button>
      <button onclick="openGrid()">题号</button>
      <button onclick="next()">下一题</button>
    </nav>
  </section>

  <section id="achv" class="view hidden">
    <header class="topbar">
      <button class="back" onclick="showMenu()">‹</button>
      <h1 style="font-size:17px;">每日成就</h1>
    </header>
    <div id="achvBody" style="flex:1;overflow:auto;padding:14px 16px 96px;"></div>
  </section>

  <section id="grid" class="overlay hidden" onclick="if(event.target===this)closeGrid()">
    <div class="sheet">
      <div class="sheet-hd"><span id="gridTitle">小地图 · 点击跳题</span><button onclick="closeGrid()">关闭</button></div>
      <div class="legend">
        <i class="g-un"></i>未答 <i class="g-ok"></i>答对 <i class="g-bad"></i>答错 <i class="g-cur"></i>当前
      </div>
      <div id="gridCells"></div>
    </div>
  </section>

球帽的行为有效，但电脑价值过高，超出王某的行为能力，赠送电脑的行为效力待定。"}, {"type": "single", "year": "", "title": "16 周岁的小林参加中学生科技创意大赛，其作品“厨房定时器”获得组委会奖励。张某对此非常感兴趣，现场支付给小林5 万元，买下该作品的制作方法。下列关于该合同效力的表述中，符合合同法律制度规定的是（）。", "options": ["该合同可撤销，因小林是限制民事行为能力人", "该合同无效，因小林是限制民事行为能力人", "该合同有效，因该合同对小林而言是纯获利益的", "该合同效力待定，因需要由小林的法定代理人决定是否同意或追认"], "answer": [3], "explain": "（1）16 周岁的小林还在读中学，属于限制民事行为能力人；（2）本案不属于限制 民事行为能力人实施的纯获利益（因为小林支付了对价，即“作品的制作方法”）的民事法律行 为，也不属于与限制民事行为能力人的年龄、智力、精神健康状况相适应的民事法律行为，行为 效力待定，经法定代理人同意或者追认后有效，因此，选项D 正确；（3）小林的法定代理人可以 主动表示同意或追认，但如果张某（相对人）催告小林的法定代理人追认，而小林的法定代理人 1 个月内未作回复，应视为拒绝追认，合同无效；（4）由于该比赛明示为“中学生”参加的比赛， 张某对小林属于限制民事行为能力人应当知情，张某不属于善意相对人，不享有撤销权。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列行为中，属于可撤销民事法律行为的有（）。", "options": ["刘某超越代理权以甲公司的名义与乙公司签订买卖合同", "陈某受王某胁迫与其签订房屋租赁合同", "孙某受蔡某欺诈与其签订买卖合同", "李某误以为赵某的镀金表为纯金表而花高价购买"], "answer": [1, 2, 3], "explain": "（1）选项A：刘某越权代理以甲公司的名义与乙公司签订买卖合同，即属于狭义 无权代理所为的民事法律行为，系效力待定的民事法律行为；（2）选项B：一方或者第三人以 胁迫手段，使对方在违背真实意思的情况下实施的民事法律行为，受胁迫方有权请求人民法院 或者仲裁机构予以撤销；（3）选项C：一方以欺诈手段，使对方在违背真实意思的情况下实施 的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销；（4）选项D：李某误以 为赵某的镀金表为纯金表，系对于标的物品质错误认识，属于“重大误解”，而基于重大误解 实施的民事法律行为，行为人有权请求人民法院或者仲裁机构予以撤销。选项B、C、D 当选。"}, {"type": "single", "year": "", "title": "2024 年1 月5 日，甲在乙商场购买一个标明“原装进口”的智能手机配件。1 月8 日，甲将该配件拿到专业维修店检测，检测结果显示所买配件为国产。甲遂与乙商场交涉，由于多次交涉未果，甲诉至法院，请求法院撤销该手机配件买卖合同。根据《民法典》的规定，甲的撤销权的行使期间为（）。", "options": ["自2024 年1 月5 日起1 年内", "自2024 年1 月5 日起5 年内", "自2024 年1 月8 日起90 日内", "自2024 年1 月8 日起1 年内"], "answer": [3], "explain": "本案考查欺诈行为的撤销期间，即当事人自知道或者应当知道撤销事由之日起 （2024 年1 月8 日）1 年内行使撤销权。"}, {"type": "multi", "year": "", "title": "根据《民法典》的规定，下列关于撤销权消灭情形的表述中，正确的有（）。（2021 年）", "options": ["当事人自民事法律行为发生之日起5 年内没有行使撤销权的，撤销权消灭", "当事人自应当知道撤销事由之日起1 个月内没有行使撤销权的，撤销权消灭", "当事人受胁迫，自胁迫行为终止之日起1 年内没有行使撤销权的，撤销权消灭", "重大误解的当事人自知道或者应当知道撤销事由之日起90 日内没有行使撤销权的，撤销权消灭"], "answer": [0, 2, 3], "explain": "撤销权的存续期间：（1）当事人自民事法律行为发生之日起5 年内没有行使撤 销权的，撤销权消灭，选项A 当选；（2）当事人知道撤销事由后明确表示或者以自己的行为表 明放弃撤销权的，撤销权消灭，选项B 不当选；（3）当事人受胁迫，自胁迫行为终止之日起1 年内没有行使撤销权的，撤销权消灭，选项C 当选；（4）重大误解的当事人自知道或者应当 知道撤销事由之日起90 日内没有行使撤销权的，撤销权消灭，选项D 当选；（5）其他可撤销 情形下，当事人自知道或者应当知道撤销事由之日起1 年内没有行使撤销权的，撤销权消灭。"}, {"type": "single", "year": "", "title": "下列情形中，属于无效民事法律行为的是（）。（2025 年）", "options": ["王某为逃避债务而与赵某恶意串通签订借款合同", "高某故意将高仿品作为真品卖给李某", "19 周岁的大学生未经父母同意购买品牌手机", "受胁迫而签订的合同"], "answer": [0], "explain": "行为人与相对人恶意串通，损害他人合法权益的民事法律行为无效，选项A 当选； 受欺诈、受胁迫而实施的法律行为，属于可撤销法律行为，选项B、D 不当选；选项C 属于有效 的法律行为，不当选。"}, {"type": "single", "year": "", "title": "赵某为逃避债务，与钱某通谋将自己的房产低价转让给钱某，同时约定3 年后赵某向钱某回购该房产，赵某将房产卖给钱某的行为是（）。（2025 年）", "options": ["可撤销法律行为", "效力待定法律行为", "有效法律行为", "无效法律行为"], "answer": [3], "explain": "当事人通谋虚假表示实施的，或者恶意串通，损害他人合法权益的民事法律行为 无效。选项D 当选。"}, {"type": "judge", "year": "", "title": "违背公序良俗的民事法律行为无效。（）。（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "违背公序良俗的民事法律行为无效。本题表述正确。"}, {"type": "judge", "year": "", "title": "6 周岁的王某获赠一瓶可乐属于无效民事法律行为。（）。", "options": ["对", "错"], "answer": [0], "explain": "无民事行为能力人独立实施的任何民事法律行为均无效。本题表述正确。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列关于无效法律行为的表述中，正确的有（）。（2020 年）", "options": ["双方恶意串通，实施法律行为损害第三人利益的，应当追缴双方取得的财产并返还第三人", "法律行为部分无效，不影响其他部分效力的，其他部分仍然有效", "双方对法律行为无效都有过错的，应当各自承担相应的责任", "无效的法律行为，从行为被确认无效之日起不具有法律约束力"], "answer": [0, 1, 2], "explain": "选项D:无效的民事法律行为，从行为开始时起就没有法律约束。选项A、B、C 当选。"}, {"type": "single", "year": "", "title": "甲、乙签订买卖合同，并对合同的生效作出约定。下列约定属于附条件的民事法律行为的是（）。（2025 年）", "options": ["甲考上研究生时合同生效", "2026 年国庆节时合同生效", "甲的父亲去世时合同生效", "下一次月全食时合同生效"], "answer": [0], "explain": "附期限的法律行为，是指当事人在法律行为中约定一定的期限，并以该期限的到来 作为法律行为生效或解除的根据。选项B、C、D 是必然会到来的，是附期限的法律行为，不当选； 附条件的法律行为中，是指当事人在法律行为中约定一定的条件，并以将来该条件的发生或不发 生作为法律行为效力发生或消灭的根据，选项A 是否实现不确定，是附条件的法律行为，当选。"}, {"type": "multi", "year": "", "title": "周某和外甥约定，若外甥考上重点大学奖励一辆车，该约定行为属于（）。（2025 年）", "options": ["附期限法律行为", "附条件法律行为", "多方法律行为", "单方法律行为"], "answer": [1, 2], "explain": "周某外甥能否考上重点大学属于不确定的事实，是附条件的双方法律行为，选项B、 C 当选。"}, {"type": "judge", "year": "", "title": "陈某与李某约定，在李某结婚时，陈某将自己的一套房屋赠与李某。该赠与行为是附期限的法律行为。（）", "options": ["对", "错"], "answer": [1], "explain": "“结婚”不一定会发生，属于“附条件”的民事法律行为。"}, {"type": "single", "year": "", "title": "2022 年10 月15 日，钱某与孙某签订房屋租赁合同，约定如果钱某出国定居，钱某现住房将出租给孙某，租期10 年。该房屋租赁合同在钱某出国定居前属于（）。", "options": ["未成立、未生效的合同", "已成立、未生效的合同", "未成立、已生效的合同", "已成立、已生效的合同"], "answer": [1], "explain": "附生效条件或期限的民事法律行为，在当事人已经达成合意但条件未成就或期限 未届至时，处于已成立但未生效状态。"}, {"type": "single", "year": "", "title": "下列民事法律行为中，可以适用代理的是（）。（2025 年）", "options": ["订立遗嘱", "婚姻登记", "收养子女", "申请仲裁"], "answer": [3], "explain": "依照法律规定、当事人约定或者民事法律行为的性质，应当由本人实施的民事法 律行为，不得代理，如订立遗嘱、婚姻登记、收养子女等；本人未亲自实施的，应当认定行为 无效。选项D 当选。"}, {"type": "judge", "year": "", "title": "委托代理，应当采用书面形式。（）（2024 年）", "options": ["对", "错"], "answer": [1], "explain": "委托代理，可以采用书面形式或者口头形式。"}, {"type": "judge", "year": "", "title": "无民事行为能力人、限制民事行为能力人的监护人是其法定代理人。（）（2020 年）", "options": ["对", "错"], "answer": [0], "explain": "题干表述正确。"}, {"type": "multi", "year": "", "title": "下列行为中，属于滥用代理权的有（）。", "options": ["代理人甲以被代理人乙的名义将乙的一双球鞋卖给自己", "代理人甲以被代理人乙的名义卖出一顶帽子，该帽子由甲以丙的名义买入", "代理人甲与买受人丁串通，将被代理人乙的一栋房屋低价卖给丁", "代理人甲在被代理人乙收回代理权后，仍以乙的名义将乙的假发卖给戊"], "answer": [0, 1, 2], "explain": "（1）滥用代理权的行为包括：自己代理（选项A）、双方代理（选项B）、代理 人与第三人恶意串通（选项C）；（2）选项D：属于无权代理。"}, {"type": "single", "year": "", "title": "甲公司授予乙公司代理权，委托乙公司向丙公司采购货物。乙公司和丙公司串通，致乙公司以甲公司名义购进的货物质次价高，使甲公司遭受严重的经济损失。关于甲公司损失承担的下列表述中，正确的是（）。", "options": ["甲公司的损失应当由甲公司和乙公司分担", "甲公司的损失应当由乙公司和丙公司承担连带赔偿责任", "甲公司的损失应当由乙公司承担全部赔偿责任", "甲公司的损失应当由乙公司和丙公司承担按份赔偿责任"], "answer": [1], "explain": "代理人和相对人恶意串通，损害被代理人合法权益的，代理人和相对人应当承担 连带责任。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列情形属于无权代理的有（）。", "options": ["超越代理权", "代理权终止后的代理", "自己代理", "双方代理"], "answer": [0, 1], "explain": "选项CD：属于代理权的滥用。"}, {"type": "judge", "year": "", "title": "行为人超越代理权以被代理人名义订立的合同，属于无效合同。（）（2022年）", "options": ["对", "错"], "answer": [1], "explain": "行为人没有代理权、超越代理权或者代理权终止后，仍然实施代理行为：（1）构 成表见代理的，合同有效；（2）不构成表见代理的，合同效力待定。"}, {"type": "judge", "year": "", "title": "行为人超越代理权实施代理行为，相对人有理由相信行为人有代理权的，代理行为有效。（）（2021 年）", "options": ["对", "错"], "answer": [0], "explain": "行为人超越代理权实施代理行为，相对人有理由相信行为人有代理权的，代理行 为有效。本题表述正确。"}, {"type": "single", "year": "", "title": "甲为乙公司业务员，负责某小区的订奶业务多年，每月月底在小区摆摊，更新订奶户并收取下月订奶款。2025 年5 月29 日，甲从乙公司辞职。5 月30 日，甲仍照常前往小区摆摊收取订奶款，订奶户不知内情，照例交款，甲亦如常开出盖有乙公司公章的订奶款收据，之后甲下落不明。根据民事法律制度的规定，下列表述中，正确的是（）。", "options": ["甲的行为构成无权处分，应由乙公司向订奶户承担损害赔偿责任后，再向甲追偿", "甲的行为构成狭义无权代理，应由甲向订奶户承担损害赔偿责任", "甲的行为与乙公司无关，应由甲向订奶户承担合同履行义务", "甲的行为构成表见代理，应由乙公司向订奶户承担合同履行义务"], "answer": [3], "explain": "行为人没有代理权、超越代理权或者代理权终止后以被代理人名义订立合同，相 对人有理由相信行为人有代理权的，该代理行为有效。"}, {"type": "single", "year": "", "title": "根据民事法律制度的规定，下列关于代理制度的表述中，正确的是（）。（2021 年）", "options": ["代理人和相对人恶意串通，损害被代理人合法权益的，代理人和相对人应当承担连带责任", "代理行为包括传递信息等非独立进行意思表示的行为", "代理行为的法律后果直接归属于代理人", "代理人必须以自己的名义实施法律行为"], "answer": [0], "explain": "代理人和相对人恶意串通，损害被代理人合法权益的，代理人和相对人应当承担 连带责任，选项A 当选；代理人在代理权限内独立地向相对人进行意思表示，非独立进行意思 表示的行为，不属于代理行为，选项B 不当选；代理行为的法律后果直接归属于被代理人，选 项C 不当选；代理人必须以被代理人的名义实施法律行为，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列情形中，属于委托代理终止的法定情形有（）。（2023 年）", "options": ["代理期限届满", "代理人死亡", "被代理人丧失民事行为能力", "被代理人取消委托"], "answer": [0, 1, 3], "explain": "委托代理终止的法定情形有：(1）代理期间届满或者代理事务完成；(2）被代理 人取消委托或者代理人辞去委托；(3）代理人丧失民事行为能力；(4）代理人或者被代理人死 亡；(5）作为代理人或者被代理人的法人、非法人组织终止。选项A、B、D 当选。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，法定代理终止的法定情形有（）。（2023 年）", "options": ["被代理人取得完全民事行为能力", "被代理人恢复完全民事行为能力", "代理人死亡", "代理人丧失民事行为能力"], "answer": [0, 1, 2, 3], "explain": "法定代理终止的法定情形有：（1）被代理人取得或恢复完全民事行为能力；（2） 代理人丧失民事行为能力；（3）代理人或者被代理人死亡；（4）法律规定的其他情形。选项A、 B、C、D 均当选。"}, {"type": "multi", "year": "", "title": "被代理人死亡后，下列情形中，委托代理人实施的行为仍然有效的有（）。（2025 年）", "options": ["被代理人死亡前已经实施，为了被代理人的利益继续代理", "被代理人的继承人承认的", "代理人不知道并且不应当知道被代理人死亡", "委托协议中明确代理权在代理事务完成时终止"], "answer": [1, 2, 3], "explain": "被代理人死亡后，有下列情形之一的，委托代理人实施的代理行为有效：（1）代 理人不知道并且不应当知道被代理人死亡；（2）被代理人的继承人予以承认；（3）授权中明 确代理权在代理事务完成时终止；(4）被代理人死亡前已经实施，为了被代理人的继承人的利 益继续代理。选项B、C、D 当选。"}, {"type": "multi", "year": "", "title": "下列案件中，适用特别程序审理的有（）。", "options": ["选民资格案件", "宣告失踪案件", "公示催告程序审理的案件", "督促程序审理的案件"], "answer": [0, 1], "explain": "选项CD：属于非讼案件，但不属于适用特别程序审理的案件。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度的规定，下列有关我国民事诉讼合议制度和独任制度的表述中，正确的是（）。", "options": ["选民资格案件，由审判员一人独任审理", "公示催告阶段审理的案件，由审判员一人独任审理", "第二审民事案件，由审判员、人民陪审员共同组成合议庭审理", "属于新类型的民事案件，可以由审判员一人独任审理"], "answer": [1], "explain": "选项A：适用简易程序、特别程序（选民资格案件及重大、疑难的案件除外）、督 促程序、公示催告程序公示催告阶段审理的民事案件，由审判员一人独任审理；选项C：第二审 民事案件，由审判员组成合议庭审理；选项D：人民法院审理下列民事案件，不得由审判员1 人 独任审理：（1）涉及国家利益、社会公共利益的案件；（2）涉及群体性纠纷，可能影响社会 稳定的案件；（3）人民群众广泛关注或者其他社会影响较大的案件；（4）属于新类型或者疑 难复杂的案件；（5）法律规定应当组成合议庭审理的案件；（6）其他不宜由审判员一人独任 审理的案件。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，下列关于两审终审制度的说法中，正确的有（）。（2025 年）", "options": ["适用特别程序审理的案件，实行两审终审", "适用简易程序中的小额诉讼程序审理的案件，实行两审终审", "公示催告程序审理的案件，实行一审终审", "最高人民法院的一审判决，是终审判决"], "answer": [2, 3], "explain": "两审终审制度存在以下例外情况：（1）适用特别程序、督促程序、公示催告程序 和简易程序中的小额诉讼程序审理的案件，实行一审终审；（2）最高人民法院所作的一审判决、 裁定，为终审判决、裁定。选项C、D 当选。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，下列有关我国民事诉讼制度的表述中，不正确的有（）。", "options": ["适用简易程序审理的民事案件，由审判员独任审理", "不公开审理的民事案件，一律不公开宣告判决", "对终审民事判决不服的，当事人可以上诉", "我国采取的审判制度是一审终审制度"], "answer": [1, 2, 3], "explain": "（1）不论案件是否公开审理，一律公开宣告判决，选项B 错误；（2）对终审判 决、裁定，当事人不得上诉。如果发现终审裁判确有错误，可以通过审判监督程序予以纠正， 选项C 错误；（3）我国采取的审判制度是两审终审制度，选项D 错误。"}, {"type": "single", "year": "", "title": "甲、乙公司因技术转让合同的履行产生纠纷，甲公司向某人民法院提起诉讼，法院受理该案件，已知该案件涉及商业秘密，下列关于该案件是否公开审理的表述中，正确的是（）。", "options": ["该案件应当公开审理", "该案件不应当公开审理", "由双方当事人协商后决定是否公开审理", "由当事人申请不公开审理的，可以不公开审理"], "answer": [3], "explain": "人民法院审理民事案件，涉及商业秘密的案件，当事人申请不公开审理的，可以 不公开审理。"}, {"type": "single", "year": "", "title": "住所地在甲市M 区的张某，其工作单位在甲市N 区，经常居住地在甲市P 区。2025 年5 月，甲市Q 区的某医院拟起诉张某要求其清偿在该院位于甲市Y 区的分院住院时拖欠的医疗费。对该诉讼有管辖权的人民法院是（）。", "options": ["甲市M 区人民法院", "甲市P 区人民法院", "甲市N 区人民法院", "甲市Q 区人民法院"], "answer": [1], "explain": "（1）因合同纠纷提起的诉讼，由被告住所地或者合同履行地（甲市Y 区）人民法 院管辖；（2）被告是公民的，被告住所地与经常居住地不一致的，由经常居住地（甲市P 区） 人民法院管辖。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，下列关于民事诉讼管辖的表述，正确的有（）。（2024 年）", "options": ["先立案的人民法院不得将案件移送给另一个有管辖权的人民法院", "人民法院立案前发现其他有管辖权的人民法院已先立案的，不得重复立案", "人民法院在立案后发现其他有管辖权的人民法院已先立案的，可以裁定移送给上级法院", "原告向两个以上有管辖权的法院起诉的，由最先立案的人民法院管"], "answer": [0, 1, 3], "explain": "两个以上人民法院都有管辖权的诉讼，原告可以向其中一个人民法院 起诉；原告向两个以上有管辖权的人民法院起诉的，由最先立案的人民法院管辖。先立案 的人民法院不得将案件移送给另一个有管辖权的人民法院。人民法院在立案前发现其他有管辖 权的人民法院已先立案的，不得重复立案；立案后发现其他有管辖权的人民法院已先立案的， 裁定将案件移送给先立案的人民法院。选项A、B、D 当选。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，下列民事诉讼案件中，适用专属管辖的有()。", "options": ["因港口码头作业中纠纷提起的诉讼", "因继承遗产纠纷提起的诉讼", "因保险合同纠纷提起的诉讼", "因侵权行为纠纷提起的诉讼"], "answer": [0, 1], "explain": "专属管辖的案件主要有三类：（1）因不动产纠纷提起的诉讼，由不动产所在地人民法 院管辖；（2）因港口作业中发生纠纷提起的诉讼，由港口所在地人民法院管辖；（3）因继承遗产 纠纷提起的诉讼，由被继承人死亡时住所地或者主要遗产所在地人民法院管辖。选项A、B 当选。"}, {"type": "single", "year": "", "title": "甲乙双方签订房屋租赁合同，双方就房屋租赁合同发生纠纷，甲欲向人民法院提起诉讼，下列法院有管辖权的是（）。（2025 年）", "options": ["乙住所地人民法院", "房屋所在地人民法院", "合同履行地人民法院", "甲住所地人民法院"], "answer": [1], "explain": "因不动产纠纷提起的诉讼，由不动产所在地人民法院专属管辖。选项B 当选。"}, {"type": "single", "year": "", "title": "甲公司因建设工程施工合同与乙公司发生纠纷并提起诉讼。下列法院对诉讼有管辖权的是（）。（2023 年）", "options": ["建设工程施工合同签订地M 县人民法院", "建设工程所在地N 县人民法院", "甲公司住所地P 县人民法院", "乙公司住所地Q 县人民法院"], "answer": [1], "explain": "因不动产纠纷提起的诉讼，由不动产所在地人民法院管辖。农村土地承包经营合 同纠纷、房屋租赁合同纠纷、建设工程施工合同纠纷、政策性房屋买卖合同纠纷，按照不动产 纠纷确定管辖。选项B 当选。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度的规定，在没有协议管辖的情况下，关于合同纠纷地域管辖的下列表述中，正确的是（）。", "options": ["因合同纠纷引起的诉讼，由原告住所地或者合同履行地人民法院管辖", "因合同纠纷引起的诉讼，由被告住所地或者合同履行地人民法院管辖", "因合同纠纷引起的诉讼，由原告住所地或者合同签订地人民法院管辖", "因合同纠纷引起的诉讼，由被告住所地或者合同签订地人民法院管辖"], "answer": [1], "explain": "因合同纠纷引起的诉讼，由被告住所地或合同履行地人民法院管辖。"}, {"type": "multi", "year": "", "title": "甲运输公司因货物在运输中发生事故造成毁损，与乙保险公司发生财产保险合同纠纷，双方在合同中未约定管辖法院，甲运输公司提起诉讼。下列人民法院中，对该诉讼有管辖权的有（）。（2023 年）", "options": ["货物运输目的地法院", "甲运输公司住所地法院", "乙保险公司住所地法院", "保险事故发生地法院"], "answer": [0, 2, 3], "explain": "因保险合同纠纷提起的诉讼，由被告住所地或者保险标的物所在地的人民法院管 辖。因财产保险合同纠纷提起的诉讼，如果保险标的物是运输工具或者运输中的货物，可以由 运输工具登记注册地、运输目的地、保险事故发生地人民法院管辖。选项A、C、D 当选。"}, {"type": "multi", "year": "", "title": "因票据权利纠纷提起的诉讼，有管辖权的人民法院有（）。（2024 年）", "options": ["票据支付地人民法院", "出票地人民法院", "债权人所在地的人民法院", "被告住所地人民法院"], "answer": [0, 3], "explain": "因票据权利纠纷提起的诉讼，由票据支付地或者被告住所地人民法院管辖。选项A、 D 当选。"}, {"type": "single", "year": "", "title": "甲县的葛某和乙县的许某分别拥有位于丙县的云峰公司50%的股份。后由于二人经营理念不合，已连续四年未召开股东会，无法形成股东会决议。许某遂向法院请求解散公司，并在法院受理后申请保全公司的主要资产（位于丁县的一幢厂房）。根据民事诉讼法律制度的规定，对本案享有管辖权的人民法院是（）。", "options": ["甲县人民法院", "乙县人民法院", "丙县人民法院", "丁县人民法院"], "answer": [2], "explain": "因公司设立、确认股东资格、股东名册记载、请求变更公司登记、股东知情权、 公司决议、公司合并、公司分立、公司减资、公司增资、分配利润、解散等纠纷提起诉讼，由 公司住所地人民法院管辖。"}, {"type": "single", "year": "", "title": "下列关于地域管辖的表述中，符合民事诉讼法律制度规定的是（）。", "options": ["对公民提起的民事诉讼，被告住所地与经常居住地不一致的，由原告经常居住地人民法院管辖", "因公路事故请求损害赔偿提起的诉讼，可由事故发生地人民法院管辖", "因保险合同纠纷提起的诉讼，当事人对管辖法院未约定的，可由合同履行地人民法院管辖", "因票据纠纷提起的诉讼，可由票据支付地人民法院管辖"], "answer": [1], "explain": "（1）选项A：对公民提起的诉讼，被告住所地与经常居住地不一致的，由经常居 住地人民法院管辖。（2）选项B：因铁路、公路、水上和航空事故请求损害赔偿提起的诉讼， 由事故发生地或者车辆、船舶最先到达地、航空器最先降落地或者被告住所地人民法院管辖。 （3）选项C：因保险合同纠纷提起的诉讼，由被告住所地或者保险标的物所在地的人民法院管 辖。（4）选项D：因票据权利纠纷提起的诉讼，由票据支付地或者被告住所地的人民法院管辖， 但是因非票据权利纠纷提起的诉讼，由被告住所地人民法院管辖。"}, {"type": "multi", "year": "", "title": "甲企业得知竞争对手乙企业在M 地的营销策略将会进行重大调整，于是到乙企业设在N 地的分部窃取到乙企业内部机密文件，随之采取相应对策，给乙企业在M 地的营销造成重大损失，乙企业经过调查掌握了甲企业的侵权证据，拟向法院提起诉讼，其可以选择提起诉讼的法院有（）。", "options": ["甲企业住所地法院", "乙企业住所地法院", "M 地法院", "N 地法院"], "answer": [0, 2, 3], "explain": "因侵权行为提起的诉讼，由侵权行为地（包括侵权行为实施地、侵权结果发生地） 或者被告住所地法院管辖。在本题中，乙企业可以选择向甲企业住所地（被告住所地）、M 地（侵 权结果发生地）、N 地（侵权行为实施地）人民法院起诉。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，提起民事诉讼必须符合的法定条件有（  ）。", "options": ["有书面诉状", "有明确的被告", "原告与本案有直接利害关系", "有具体的诉讼请求和事实、理由"], "answer": [1, 2, 3], "explain": "提起民事诉讼的法定条件：（1）原告是与本案有直接利害关系的公民、法人或其他 组织，选项C 当选；（2）有明确的被告，选项B 当选；（3）有具体的诉讼请求和事实、理由， 选项D 当选；（4）属于人民法院受理民事诉讼的范围和管辖范围，同时还必须办理法定手续。"}, {"type": "multi", "year": "", "title": "下列关于简易程序的表述中，不正确的有（）。", "options": ["适用审判监督程序的民事案件，不适用简易程序审理", "被二审人民法院发回重审的民事诉讼案件，可以适用简易程序审理", "起诉时被告下落不明的，可以适用简易程序审理", "简易程序审理的案件均由审判员一人独任审理且适用一审终审制度"], "answer": [1, 2, 3], "explain": "（1）不适用简易程序的包括：起诉时被告下落不明的；发回重审的；当事人一方 人数众多的；适用审判监督程序的；涉及国家利益、社会公共利益的；第三人起诉请求改变或 者撤销生效判决、裁定、调解书的；其他不宜适用简易程序的案件，选项A 正确、选项B、C 错 误；（2）简易程序中的小额诉讼程序审理的案件适用一审终审制度，但是其他由简易程序审理 的案件依旧适用两审终审制度。"}, {"type": "multi", "year": "", "title": "下列关于适用简易程序审理民事案件具体方式的表述中，符合民事诉讼法律制度规定的有（）。（根据2024 年考生回忆改编）", "options": ["适用简易程序审理案件，一律由审判员组成合议庭审理", "经当事人双方同意，可以采用视听传输技术等方式开庭", "已经按普通程序审理的案件在开庭后可以转为简易程序审理", "人民法院可以采取电子邮件方式向当事人送达诉讼文书"], "answer": [1, 3], "explain": "选项A：适用简易程序审理案件，由审判员独任审判，书记员担任记录，选项A 不 当选；选项C：已经按照普通程序审理的案件，在开庭后不得转为简易程序审理，选项C 不当选。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度规定，下列关于第二审程序的表述中，不正确的是（）。", "options": ["只有第一审案件的当事人才可以提起上诉", "当事人应当通过原审人民法院提交上诉状", "当事人对重审案件的判决和裁定不可以上诉", "第二审人民法院的判决和裁定是终审的判决和裁定"], "answer": [2], "explain": "选项C：当事人对重审案件的判决、裁定可以上诉。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度的规定，当事人不服地方人民法院第一审裁定的，有权在裁定书送达之日起一定期限内向上一级人民法院提起上诉，该期限为（）。", "options": ["10 日", "15 日", "20 日", "30 日"], "answer": [0], "explain": "当事人不服地方人民法院第一审裁定的，有权在裁定书送达之日起10 日内向上一 级人民法院提起上诉。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度规定，第二审人民法院对上诉案件，经审理后不得发回重审的是（）。（2023 年）", "options": ["原判决适用法律错误", "原判决认定事实错误", "原判决认定事实不清，证据不足", "原判决违反法定程序，可能影响案件正确判决"], "answer": [0], "explain": "第二审人民法院对上诉案件经过审理，原判决适用法律错误，应当依法改判而非 发回重审。"}, {"type": "single", "year": "", "title": "下列关于审判监督程序的表述中，正确的是（）。（2022 年）", "options": ["各级人民法院院长对本院已经发生法律效力的判决，发现确有错误的，有权决定再审", "当事人对已经发生法律效力的判决，认为有错误的，只能向原审人民法院申请再审", "上级人民法院对下级人民法院已经发生法律效力的判决，发现确有错误的，有权提审或指令下级法院再审", "当事人对已经发生法律效力的判决申请再审的，应当停止判决的执行"], "answer": [2], "explain": "（1）各级人民法院院长对本院已经发生法律效力的判决、裁定、调解书，发现确 有错误，认为需要再审的，提交审判委员会讨论决定，选项A 不当选；（2）最高人民法院对地 方各级人民法院、上级人民法院对下级人民法院已经发生法律效力的判决、裁定、调解书，发 现确有错误的，有权提审或者指令下级人民法院再审，选项C 当选；（3）当事人对已经发生法 律效力的判决、裁定，认为有错误的，可以向上一级人民法院申请再审；当事人一方人数众多 或者当事人双方为公民的案件，也可以向原审人民法院申请再审，选项B 不当选；（4）当事人 申请再审的，不停止判决、裁定的执行，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据民事诉讼法律制度的规定，对于当事人的下列再审申请，人民法院不予受理的有（）。", "options": ["再审申请被驳回后再次提出申请的", "在人民检察院对当事人的申请作出不予提出再审检察建议后又提出申请的", "对再审判决、裁定提出申请的", "在调解书发生法律效力后3 个月提出申请的"], "answer": [0, 1, 2], "explain": "当事人申请再审，有下列情形之一的，人民法院不予受理：（1）再审申请被驳回 后再次提出申请的；（2）对再审判决、裁定提出申请的；（3）在人民检察院对当事人的申请 作出不予提出再审检察建议或者抗诉决定后又提出申请的。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度的规定，关于法院调解，下列表述正确的是（）。（2023 年）", "options": ["调解书自作出之日起生效", "具有给付内容的调解书具有强制执行力", "对调解不服的可以提起上诉", "适用再审程序审理的民事案件不能调解"], "answer": [1], "explain": "调解书经双方当事人签收后，即具有法律效力，选项A 不当选；对调解书不得上 诉，选项C 不当选；适用一审程序、二审程序与再审程序审理的民事案件，根据当事人自愿的 原则，在事实清楚的基础上，分清是非，进行调解，选项D 不当选。"}, {"type": "single", "year": "", "title": "根据民事法律制度的规定，下列关于诉讼时效期间届满法律效力的表述中，不正确的是（）。", "options": ["诉讼时效期间届满后，权利人丧失胜诉权", "诉讼时效期间届满后，实体权利本身归于消灭", "诉讼时效期间届满后，当事人起诉的，人民法院应当受理", "诉讼时效期间届满后，当事人自愿履行义务的，不受诉讼时效限制"], "answer": [1], "explain": "选项B：诉讼时效期间届满时消灭的是胜诉权，并不消灭实体权利。"}, {"type": "multi", "year": "", "title": "根据诉讼时效法律制度的规定，下列关于诉讼时效制度适用的表述中，正确的有（）。", "options": ["当事人对诉讼时效利益的预先放弃有效", "当事人没有主张诉讼时效抗辩，人民法院可以主动释明", "诉讼时效期间届满当事人一方自愿履行，不受诉讼时效期间的限制", "当事人不可以约定延长或缩短诉讼时效期间"], "answer": [2, 3], "explain": "当事人对诉讼时效利益的预先放弃无效，选项A 不当选；义务人未提出诉讼时效 抗辩的，人民法院不应对诉讼时效问题进行释明及主动适用诉讼时效的规定进行裁判，选项B 不当选。"}, {"type": "single", "year": "", "title": "根据民事法律制度的规定，下列请求权中，适用诉讼时效的是（）。（2025 年）", "options": ["缴付出资请求权", "支付违约金请求权", "抚养费请求权", "排除妨碍请求权"], "answer": [1], "explain": "下列请求权不适用诉讼时效的规定：（1）请求停止侵害、排除妨碍、消除危险； （2）不动产物权和登记的动产物权的权利人请求返还财产；（3）请求支付抚养费、赡养费或 者扶养费；（4）依法不适用诉讼时效的其他请求权。当事人对下列债权请求权提出诉讼时效抗 辩的，人民法院不予支持：（1）支付存款本金及利息请求权；（2）兑付国债、金融债券以及 向不特定对象发行的企业债券本息请求权；（3）基于投资关系产生的缴付出资请求权；（4） 其他依法不适用诉讼时效规定的债权请求权。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列权利中，不属于诉讼时效适用对象的有（）。", "options": ["不动产物权的权利人请求返还财产", "未登记的动产物权的权利人请求返还财产", "登记的动产物权的权利人请求返还财产", "向特定对象发行的企业债券本息请求权"], "answer": [0, 2], "explain": "（1）不适用诉讼时效的债权请求权：①支付抚养费、赡养费或者扶养费的请求权； ②支付存款本金及利息请求权；③兑付国债、金融债券以及向不特定对象发行的企业债券本息 请求权，选项D 不当选；④基于投资关系产生的缴付出资请求权。（2）不适用诉讼时效的物权 请求权：①不动产物权和登记的动产物权的权利人请求返还财产的权利，选项A、C 当选，选项 B 不当选；②停止侵害、排除妨碍、消除危险的请求权。"}, {"type": "single", "year": "", "title": "赵某与钱某订立买卖合同，约定赵某于2022 年3 月1 日向钱某供货，钱某在收到货物后1 个月内支付价款。赵某依合同履约，钱某未支付价款，赵某一直未向钱某要求支付价款。赵某对钱某的价款支付请求权的诉讼时效期间届满日为（）。（2024 年）", "options": ["2024 年4 月1 日", "2024 年3 月1 日", "2025 年3 月1 日", "2025 年4 月1 日"], "answer": [3], "explain": "向人民法院请求保护民事权利的诉讼时效期间为3 年；法律另有规定的，依照其 规定。约定履行期限之债的诉讼时效，自履行期限届满之日开始计算。选项D 当选。"}, {"type": "single", "year": "", "title": "根据《民法典》的规定，向人民法院请求保护民事权利的普通诉讼时效期间为（）。", "options": ["2 年", "10 年", "3 年", "20 年"], "answer": [2], "explain": "按照期间的长度，可将诉讼时效期间分为3 年的普通时效期间和20 年的长期时效 期间。选项C 当选。"}, {"type": "single", "year": "", "title": "根据《民法典》的规定，下列关于20 年长期诉讼时效期间的表述中，正确的是（）。", "options": ["20 年长期诉讼时效期间适用中止的规定", "20 年长期诉讼时效期间适用中断的规定", "20 年长期诉讼时效期间自权利受到侵害之日起计算", "20 年长期诉讼时效期间不可以延长"], "answer": [2], "explain": "（1）选项C：20 年的长期时效期间，从权利受侵害之日起计算。 （2）选项ABD：20 年的长期时效期间不发生中止、中断问题，但可以延长。"}, {"type": "single", "year": "", "title": "根据民事法律制度的规定，有关诉讼时效制度，下列表述错误的是（）。", "options": ["诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算", "未成年人遭受性侵害的损害赔偿请求权的诉讼时效期间，自受害人受到侵害之日起计算", "当事人约定同一债务分期履行的，诉讼时效期间自最后一期履行期限届满之日起计算", "自权利受到损害之日起超过20 年的，人民法院不予保护；有特殊情况的，人民法院可以根据权利人的申请决定延长"], "answer": [1], "explain": "选项B：未成年人遭受性侵害的损害赔偿请求权的诉讼时效期间，“自受害人年满 18 周岁之日起”计算。"}, {"type": "multi", "year": "", "title": "根据民事法律制度的规定，下列关于诉讼时效中止的表述中，正确的有（）。", "options": ["引起诉讼时效中止的法定事由应发生于或存续至诉讼时效期间的最后6 个月内", "诉讼时效中止的事由消除以后，重新计算诉讼时效期间", "权利人向义务人提出履行义务请求的，诉讼时效中止", "权利人被义务人控制使其不能行使请求权，是诉讼时效中止的法定事由"], "answer": [0, 3], "explain": "（1）选项B：诉讼时效中止，自中止时效的原因消除之日起满6 个月，诉讼时效 期间届满。（2）选项C：属于诉讼时效中断的事由。"}, {"type": "multi", "year": "", "title": "下列各项中，属于在诉讼时效期间的最后6 个月内，发生诉讼时效中止情形的有（）。（2025 年）", "options": ["因不可抗力不能行使请求权", "权利人申请仲裁", "权利人被义务人或者其他人控制", "义务人同意履行义务"], "answer": [0, 2], "explain": "选项AC，属于导致诉讼时效中止情形，当选。选项BD，属于导致诉讼时效中断情 形，不当选。"}, {"type": "single", "year": "", "title": "根据民事诉讼法律制度的规定，在诉讼时效期间最后6 个月内发生的或存续的下列事由中，能够引起诉讼时效中止的是（）。（2022 年）", "options": ["权利人提起诉讼", "义务人同意履行义务", "权利被侵害的限制民事行为能力人的法定代理人死亡", "权利被侵害的完全民事行为能力人的委托代理人辞去委托"], "answer": [2], "explain": "诉讼时效的中止必须是因法定事由而发生。这些法定事由包括两大类：一是不可 抗力，如自然灾害、军事行动等，须属于当事人不可预见、不可避免和不可克服的客观情况； 二是阻碍权利人行使请求权的其他障碍，即除不可抗力外使权利人无法行使请求权的客观情况， 包括权利被侵害的无民事行为能力人或者限制民事行为能力人没有法定代理人，或者法定代理 人死亡、丧失民事行为能力、丧失代理权；继承开始后未确定继承人或者遗产管理人；权利人 被义务人或者其他人控制等。选项C 当选。"}, {"type": "multi", "year": "", "title": "王某借给李某5 万元。约定的还款期间届满后，李某未还款。在诉讼时效期间届满前发生的下列事由中，能够导致诉讼时效期间中断的有（）。", "options": ["李某向王某请求延期还款", "王某要求李某还款", "王某向人民法院提起诉讼要求李某还款", "李某向王某还款1 万元"], "answer": [0, 1, 2, 3], "explain": "（1）选项AD：属于义务人同意履行义务。（2）选项B：属于权利人向义务人提 出请求履行义务的要求。（3）选项C：属于权利人提起诉讼。"}, {"type": "multi", "year": "", "title": "根据行政复议法的规定，对于下列争议，可以提起行政复议的有（）。（2023年）", "options": ["甲对行政机关对自己作出的行政处分不服", "乙对行政机关对民事纠纷作出的调解不服", "丙对行政机关作出的强制执行措施决定不服", "丁对公安局作出的行政拘留决定不服"], "answer": [2, 3], "explain": "不服行政机关作出的行政处分或者其他人事处理决定，不能申请行政复议，选项A 不当选。不服行政机关对民事纠纷作出的调解或其他处理的，依法申请仲裁或者向人民法院提 起诉讼，不能申请行政复议，选项B 不当选。"}, {"type": "multi", "year": "", "title": "根据行政复议法律制度的规定，下列关于行政复议管辖的表述中，正确的有（）。（2025 年）", "options": ["甲公司对A 市B 县财政局的行政行为不服，应当向A 市财政局申请行政复议", "乙公司对国家市场监督管理总局的行政行为不服，应当向国务院申请行政复议", "丙公司对A 市B 县税务局的行政行为不服，应当向A 市税务局申请行政复议", "丁公司对A 市B 县司法局做出的行政行为不服，可向B 县人民政府申请行政复议，也可向A 市司法局申请行政复议"], "answer": [2, 3], "explain": "县级以上地方各级人民政府管辖对本级人民政府工作部门作出的行政行为不服的 案件，选项A 不当选。国务院部门管辖对本部门作出的行政行为不服的案件，选项B 不当选。 对海关、金融、外汇管理等实行垂直领导的行政机关、税务和国家安全机关的行政行为不服的， 向上一级主管部门申请行政复议，选项C 当选。对履行行政复议机构职责的地方人民政府司法 行政部门的行政行为不服的，可以向本级人民政府申请行政复议，也可以向上一级司法行政部 门申请行政复议，选项D 当选。"}, {"type": "multi", "year": "", "title": "甲市乙区公安局所辖派出所以李某制造噪声干扰他人正常生活为由，对李某处以500 元罚款。李某不服，申请复议，下列机关中可以作为复议机关的有（）。", "options": ["乙区公安局", "乙区人民政府", "甲市公安局", "甲市人民政府"], "answer": [1, 3], "explain": "对直辖市、设区的市人民政府工作部门按照行政区划设立的派出机构作出的行政 行为不服的，也可以由其所在地的人民政府管辖。（甲市为设区的市）本案派出所是乙区公安 局的派出机构，而乙区公安局所在地的人民政府是乙区人民政府，乙区人民政府隶属于甲市， 因此，可以作为复议机关的是甲市人民政府和乙区人民政府。"}, {"type": "single", "year": "", "title": "根据行政复议法律制度的规定，下列关于行政复议申请和受理的表述中，正确的是（）。（根据2024 年考生回忆改编）", "options": ["申请行政复议应当采用书面形式", "行政复议机关已经依法受理的，在行政复议期间可以向人民法院提起行政诉讼", "申请人可以自知道或者应当知道该行政行为之日起30 日内提出行政复议申请", "对当场作出的行政处罚决定不服的，应当先向行政机关申请复议，对复议决定不服的，可以再向人民法院提起行政诉讼"], "answer": [3], "explain": "申请行政复议可以采用书面形式也可以采用口头形式，选项A 不当选；行政复议 机关已经依法受理的，在行政复议期间不可以向人民法院提起行政诉讼，选项B 不当选；申请 人认为行政行为侵犯其合法权益的，可以自知道或者应当知道该行政行为之日起60 日内提出行 政复议申请；但是法律规定的申请期限超过60 日的除外，选项C 不当选。"}, {"type": "single", "year": "", "title": "根据行政复议法律制度的规定，下列关于行政复议申请和受理的表述中，正确的是（）。（2022 年）", "options": ["公民提起行政诉讼已由人民法院依法受理的，还可以再申请行政复议", "申请行政复议必须采用书面形式", "公民认为行政行为侵犯其合法权益的，应当自知道该行政行为之日起15 日内提出申请", "行政复议机关受理行政复议申请，不得向申请人收取任何费用"], "answer": [3], "explain": "公民、法人或者其他组织向人民法院提起行政诉讼，人民法院已经依法受理的， 不得申请行政复议，选项A 不当选。申请人申请行政复议，可以书面申请，也可以口头申请， 选项B 不当选。公民、法人或者其他组织认为行政行为侵犯其合法权益的，可以自知道该行政 行为之60 日内提出行政复议，选项C 不当选。"}, {"type": "single", "year": "", "title": "下列各项中，属于行政复议中止的事项的是（）。（2025 年）", "options": ["作为申请人的公民下落不明", "作为申请人的公民死亡，且无近亲属", "作为申请人的法人解散，无权利义务承受人", "申请人撤回行政复议申请，行政复议机构准予撤回"], "answer": [0], "explain": "行政复议期间有下列情形之一的，行政复议中止： （1）作为申请人的公民死亡，其近亲属尚未确定是否参加行政复议。 （2）作为申请人的公民丧失参加行政复议的行为能力，尚未确定法定代理人参加行政复议。 （3）作为申请人的公民下落不明。 （4）作为申请人的法人或者其他组织终止，尚未确定权利义务承受人。 （5）申请人、被申请人因不可抗力或者其他正当理由，不能参加行政复议。 （6）依照《行政复议法》规定进行调解、和解，申请人和被申请人同意中止。 （7）行政复议案件涉及的法律适用问题需要有权机关作出解释或者确认。 （8）行政复议案件审理需要以其他案件的审理结果为依据，而其他案件尚未审结。 （9）有《行政复议法》依申请或者依职权对规范性文件附带审查的情形。 （10）需要中止行政复议的其他情形。 选项B、C、D，属于行政复议终止的事项，不当选。选项A 当选。"}, {"type": "single", "year": "", "title": "根据行政诉讼法律制度的规定，下列属于行政诉讼受案范围的是（）。（2025年）", "options": ["公民张某对信访复查意见不服", "甲公司对行政机关的行政指导不服", "行政机关工作人员对本机关作出的记过决定不服", "乙公司对行政机关作出的停产停业决定不服"], "answer": [3], "explain": "人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼： （1）国家行为。如国防、外交等国家行为。 （2）抽象行政行为。如行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、 命令。 （3）内部行政行为。如行政机关对行政机关工作人员的奖惩、任免等决定。（选项C） （4）终局行政裁决行为。法律规定由行政机关最终裁决的具体行政行为。 行政诉讼法司法解释规定，下列行为不属于人民法院行政诉讼的受案范围： （1）公安、国家安全等机关依照《刑事诉讼法》的明确授权实施的行为。 （2）调解行为以及法律规定的仲裁行为。 （3）行政指导行为。（选项B） （4）驳回当事人对行政行为提起申诉的重复处理行为。 （5）行政机关作出的不产生外部法律效力的行为。 （6）行政机关为作出行政行为而实施的准备、论证、研究、层报、咨询等过程性行为。 （7）行政机关根据人民法院的生效裁判、协助执行通知书作出的执行行为，但行政机关扩 大执行范围或者采取违法方式实施的除外。 （8）上级行政机关基于内部层级监督关系对下级行政机关作出的听取报告、执法检查、督 促履责等行为。 （9）行政机关针对信访事项作出的登记、受理、交办、转送、复查、复核意见等行为。（选 项A） （10）对公民、法人或者其他组织权利义务不产生实际影响的行为。 选项D 当选。"}, {"type": "judge", "year": "", "title": "行政机关作出的调解行为不属于人民法院行政诉讼的受案范围。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "调解行为不属于人民法院行政诉讼的受案范围。本题表述正确。"}, {"type": "single", "year": "", "title": "下列属于行政诉讼受理范围的是（）。（2024 年）", "options": ["M 省人民政府对甲公司土地使用权争议作出的终局行政裁决行为", "Q 卫健委对医师钱某吊销执业许可的行政行为", "N 省民政局对孙某作出的年度考核不合格的内部行政决定", "P 县公安局依照刑事诉讼法对犯罪嫌疑人赵某刑事拘留"], "answer": [1], "explain": "人民法院不受理公民、法人或者其他组织对下列事项提起的行政诉讼： （1）国家行为。国防、外交等国家行为。 （2）抽象行政行为。行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、 命令。 （3）内部行政行为。行政机关对行政机关工作人员的奖惩、任免等决定。选项C 不当选。 （4）终局行政裁决行为。法律规定由行政机关最终裁决的具体行政行为。选项A 不当选。 （5）公安、国家安全等机关依照《刑事诉讼法》的明确授权实施的行为。选项D 不当选。 （6）调解行为以及法律规定的仲裁行为。 （7）行政指导行为。 （8）驳回当事人对行政行为提起申诉的重复处理行为。 （9）行政机关作出的不产生外部法律效力的行为。 （10）行政机关为作出行政行为而实施的准备、论证、研究、层报、咨询等过程性行为。 （11）行政机关根据人民法院的生效裁判、协助执行通知书作出的执行行为，但行政机关 扩大执行范围或者采取违法方式实施的除外。 （12）上级行政机关基于内部层级监督关系对下级行政机关作出的听取报告、执法检查、 督促履责等行为。 （13）行政机关针对信访事项作出的登记、受理、交办、转送、复查、复核意见等行为。 （14）对公民、法人或者其他组织权利义务不产生实际影响的行为。"}, {"type": "single", "year": "", "title": "甲、乙转让房产，与M 县房管局发生了争议，下列属于行政诉讼管辖法院的是（）。（2025 年）", "options": ["房屋所在地人民法院", "M 县房管局所在地人民法院", "甲住所地人民法院", "乙住所地人民法院"], "answer": [0], "explain": "因不动产提起的行政诉讼，由不动产所在地人民法院管辖。选项A 当选。"}, {"type": "single", "year": "", "title": "根据仲裁法律制度的规定，下列各项中属于《仲裁法》适用范围的是（）。（根据2025 年真题改编）", "options": ["赠与合同纠纷", "劳动争议", "继承纠纷", "竞技体育活动中发生的争议"], "answer": [0], "explain": "平等主体的自然人、法人、非法人组织之间发生的合同纠纷和其他财产权益纠纷， 可以仲裁，选项A 当选。以下纠纷不适用《仲裁法》：（1）与人身有关的婚姻、收养、监护、 扶养、继承纠纷，选项C 不当选。（2）依法应当由行政机关处理的行政争议。（3）劳动争议， 选项B 不当选。（4）农村土地承包经营纠纷。（5）体育仲裁，选项D 不当选。"}, {"type": "single", "year": "", "title": "根据《仲裁法》的规定，下列关于仲裁一裁终局原则的表述中，正确的是（）。", "options": ["仲裁裁决被人民法院撤销后，当事人不得依据重新达成的仲裁协议申请仲裁，只能向人民法院起诉", "仲裁裁决生效后，当事人就同一纠纷，不能再申请仲裁，但可以向人民法院提起诉讼", "仲裁裁决被人民法院撤销后，当事人既可以重新达成仲裁协议申请仲裁，也可以向人民法院起诉", "仲裁裁决被人民法院裁定不予执行后，当事人可以重新达成仲裁协议申请仲裁，不能向人民法院起诉"], "answer": [2], "explain": "仲裁裁决作出后，当事人就同一纠纷，不能再申请仲裁或向人民法院起诉。但是 裁决被人民法院依法裁定撤销或不予执行的，当事人可以重新达成仲裁协议申请仲裁，也可以 向人民法院起诉。选项C 当选。"}, {"type": "judge", "year": "", "title": "仲裁实行地域管辖，经济纠纷案件当事人只能向纠纷发生地仲裁机构提请仲裁。（）", "options": ["对", "错"], "answer": [1], "explain": "仲裁不实行级别管辖和地域管辖，仲裁机构由当事人协议选定。"}, {"type": "single", "year": "", "title": "下列关于仲裁机构的表述中，错误的是（）。（2025 年）", "options": ["仲裁机构不按行政区划层层设立", "仲裁机构独立于行政机关", "仲裁机构之间没有隶属关系", "仲裁机构无须经行政部门登记"], "answer": [3], "explain": "仲裁机构可以在直辖市和省、自治区人民政府所在地的市设立，也可以根据需要 在其他设区的市设立，不按行政区划层层设立。选项A 不当选。仲裁机构独立于行政机关，与 行政机关没有隶属关系。仲裁机构之间也没有隶属关系。选项B、C 不当选。仲裁机构的设立应 当经省、自治区、直辖市的司法行政部门登记。选项D 当选。"}, {"type": "single", "year": "", "title": "甲、乙公司因买卖合同发生纠纷，双方在纠纷发生前签订了有效的仲裁协议。甲公司就该纠纷向人民法院提起诉讼，未声明有仲裁协议。法院受理后，乙公司在首次开庭后提出异议并提交仲裁协议。下列表述正确的是（）。", "options": ["诉讼效力优于仲裁，法院受理该案件", "因乙公司未在首次开庭前提交仲裁协议，法院应继续审理", "因乙公司未在首次开庭前提交仲裁协议，该仲裁协议无效", "双方已经达成有效的仲裁协议，只能继续提起仲裁"], "answer": [1], "explain": "当事人达成仲裁协议，一方向人民法院提起诉讼未声明有仲裁协议，人民法院受 理后，另一方在首次开庭前提交仲裁协议的，人民法院应当驳回起诉，但仲裁协议无效或者法 律另有规定的除外；另一方在首次开庭前未对人民法院受理该案提出异议的，视为放弃仲裁协 议，人民法院应当继续审理。"}, {"type": "single", "year": "", "title": "根据仲裁法律制度的规定，下列关于仲裁协议的表述中，正确的是（）。", "options": ["可口头订立仲裁协议", "对仲裁事项或仲裁机构没有约定的仲裁协议无效", "当事人对仲裁协议的效力有异议，可以在仲裁庭开庭前请求仲裁机构或者仲裁庭作出决定", "合同无效的，仲裁条款相应无效"], "answer": [2], "explain": "仲裁协议应当以书面形式订立，口头达成仲裁的意思表示无效，选项A 不当选。 仲裁协议对仲裁事项或仲裁机构没有约定或者约定不明确的，当事人可以补充协议；达不成补 充协议的，仲裁协议无效，选项B 不当选。仲裁协议具有独立性，合同是否成立及其变更、解 除、不生效、终止、被撤销或者无效，不影响仲裁协议的效力，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，下列仲裁协议中，无效的有", "options": ["对仲裁事项或仲裁机构没有约定或者约定不明确的仲裁协议", "刘某与15 周岁的吴某因买卖合同纠纷订立的仲裁协议", "郑某采取胁迫手段，迫使王某与其订立的仲裁协议", "孙某与李某因继承纠纷订立的仲裁协议"], "answer": [1, 2, 3], "explain": "无效的仲裁协议包括：（1）约定的仲裁事项超过法律规定的仲裁范围（选项D）； （2）无民事行为能力人或者限制民事行为能力人订立的仲裁协议（选项B）；（3）一方采取胁 迫手段，迫使对方订立的仲裁协议（选项C）；（4）仲裁协议对仲裁事项或仲裁机构没有约定 或约定不明确的，当事人可以补充协议；达不成补充协议的，仲裁协议无效。继承纠纷不属于 仲裁适用范围。选项B、C、D 当选。"}, {"type": "single", "year": "", "title": "下列关于仲裁的表述中，符合仲裁法律制度规定的是（）。", "options": ["在调解书签收后当事人反悔的，仲裁庭应当及时作出裁决", "仲裁庭不能形成多数意见的，裁决应当按仲裁机构主任的意见作出", "裁决书自双方当事人签收后，即发生法律效力", "当事人没有在仲裁规则规定的期限内约定仲裁庭的组成方式或者选定仲裁员的，由仲裁机构主任按照仲裁规则确定的程序确定或者指定"], "answer": [3], "explain": "（1）选项A：在调解书签收前当事人反悔的，仲裁庭应当及时作出裁决， 选项A 不当选；（2）选项B：仲裁庭不能形成多数意见时，裁决应当按首席仲裁员的意见 作出；选项B 不当选；（3）选项C：裁决书自作出之日起发生法律效力，选项C 不当选。"}, {"type": "single", "year": "", "title": "下列关于仲裁裁决的表述中，正确的是（）。（2023 年）", "options": ["多数仲裁员与首席仲裁员意见不一致时，裁决应当按首席仲裁员的意见作出", "仲裁开庭审理后，当事人不得自行和解", "裁决书自双方当事人签收后发生法律效力", "仲裁庭在作出裁决前，可以先行调解"], "answer": [3], "explain": "裁决应按多数仲裁员的意见作出，少数仲裁员的不同意见可以记入笔录。仲裁庭不 能形成多数意见时，裁决应当按首席仲裁员的意见作出。裁决书自作出之日起发生法律效力。选 项A、C 不当选；申请仲裁后，当事人可以自行和解，选项B 不当选；仲裁庭在作出裁决前，可以 先行调解，当事人自愿调解的，仲裁庭应当调解；调解不成的，应当及时作出裁决。选项D 当选。"}, {"type": "multi", "year": "", "title": "甲、乙因合同纠纷申请仲裁，仲裁庭对案件裁决未能形成一致意见，关于该案件仲裁裁决的下列表述中，符合法律规定的有（）。", "options": ["应当按照多数仲裁员的意见作出裁决", "应当由仲裁庭达成一致意见作出裁决", "仲裁庭不能形成多数意见时，按照首席仲裁员的意见作出裁决", "仲裁庭不能形成一致意见时，提请仲裁机构作出裁决"], "answer": [0, 2], "explain": "裁决应按多数仲裁员的意见作出，少数仲裁员的不同意见可以记入笔录。仲裁庭 不能形成多数意见时，裁决应当按首席仲裁员的意见作出。"}, {"type": "judge", "year": "", "title": "一方当事人不履行生效仲裁裁决的，另一方当事人可以向仲裁机构申请强制执行。（）", "options": ["对", "错"], "answer": [1], "explain": "当事人应当履行裁决。一方当事人不履行的，另一方当事人可以依照《中华人民 共和国民事诉讼法》的有关规定向“人民法院”申请执行。受申请的人民法院应当执行。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，当事人有证据证明仲裁裁决具有应撤销情形的，可以申请撤销仲裁裁决。下列各项中，不属于仲裁裁决法定撤销情形的有（）。", "options": ["裁决所根据的证据是伪造的", "没有仲裁协议的", "仲裁庭裁决前未先行调解的", "裁决是在被申请人经书面通知，无正当理由不到庭的情况下作出的"], "answer": [2, 3], "explain": "仲裁庭在作出裁决前，“可以”先行调解。因此，未先行调解并未违反仲裁程序， 不会导致仲裁裁决可撤销。选项C 当选。被申请人经书面通知，无正当理由不到庭或者未经仲 裁庭许可中途退庭，可以缺席裁决，该裁决亦未违反仲裁程序。选项D 当选。"}, {"type": "judge", "year": "", "title": "根据《仲裁法》的规定，当事人提出证据证明仲裁裁决有依法应当撤销情形的，可在收到裁决书之日起6 个月内，向仲裁机构所在地基层人民法院申请撤销裁决。（）。", "options": ["对", "错"], "answer": [1], "explain": "根据《仲裁法》的规定，当事人提出证据证明仲裁裁决有依法应当撤销情形的， 可在收到裁决书之日起3 个月内，向仲裁机构所在地中级人民法院申请撤销裁决。"}, {"type": "single", "year": "", "title": "根据仲裁法律制度规定，当事人一方申请执行仲裁裁决，另一方申请撤销裁决的，人民法院应当首先（）。（2023 年）", "options": ["裁定终结执行仲裁裁决", "裁定中止执行仲裁裁决", "裁定撤销仲裁裁决", "裁定执行仲裁裁决"], "answer": [1], "explain": "一方当事人申请执行裁决，另一方当事人申请撤销裁决的，人民法院应当裁定中 止执行。人民法院裁定撤销裁决的，应当裁定终结执行。撤销裁决的申请被裁定驳回的，人民 法院应当裁定恢复执行。选项B 当选。"}, {"type": "judge", "year": "", "title": "仲裁活动不得通过信息网络在线进行，但当事人明确表示同意的除外。（）", "options": ["对", "错"], "answer": [1], "explain": "仲裁活动“可以”通过信息网络在线进行，但当事人“明确表示不同意”的除外。 仲裁活动通过信息网络在线进行的，与线下仲裁活动具有同等法律效力。"}, {"type": "single", "year": "", "title": "仲裁机构的设立应当经省、自治区、直辖市人民政府的（）登记。", "options": ["司法行政部门", "商务部门", "中级人民法院", "市场监督管理部门"], "answer": [0], "explain": "仲裁机构的设立应当经省、自治区、直辖市人民政府的“司法行政部门”登记。"}, {"type": "single", "year": "", "title": "当事人约定由三名仲裁员组成仲裁庭的，下列关于第三名仲裁员产生方式的表述中，不正确的是（）。", "options": ["由当事人共同选定", "由当事人共同委托仲裁机构主任选定", "由当事人各自选定的仲裁员共同选定", "由首席仲裁员选定"], "answer": [3], "explain": "当事人约定由三名仲裁员组成仲裁庭的，应当各自选定或者各自委托仲裁机构主 任按照仲裁规则确定的程序指定一名仲裁员；第三名仲裁员“由当事人共同选定”，也可以“由 当事人共同委托仲裁机构主任按照仲裁规则确定的程序指定”。当事人约定第三名仲裁员“由 其各自选定的仲裁员共同选定的”，从其约定。第三名仲裁员是首席仲裁员。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，下列关于回避制度的表述中，正确的有（）。", "options": ["因回避而重新选定或者指定仲裁员后，已进行的仲裁程序是否重新进行，由仲裁庭决定", "回避事由在首次开庭后知道的，可以在最后一次开庭终结前提出", "仲裁员是否回避，由首席仲裁员决定", "仲裁机构主任担任仲裁员时，其是否回避由仲裁庭集体决定"], "answer": [0, 1], "explain": "选项C：仲裁员是否回避，由“仲裁机构主任”决定。选项D：“仲裁机构主任” 担任仲裁员时，其是否回避由“仲裁机构的其他组成人员集体”决定。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，下列案件中，当事人不得协议公开审理的有（）。", "options": ["涉及国家秘密的案件", "涉及个人隐私的案件", "涉及本人商业秘密的案件", "涉及他人商业秘密的案件"], "answer": [0, 1, 3], "explain": "仲裁不公开进行。当事人协议公开的，可以公开进行，但涉及国家秘密、他人的 商业秘密或者个人隐私的除外。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，下列关于财产保全和证据保全的表述中，正确的有（）。", "options": ["因情况紧急，仲裁协议的当事人可以在申请仲裁前，依法向人民法院申请财产保全和证据保全", "仲裁庭认为有必要收集的证据可以自行收集", "证据应当在开庭前出示，当事人可以质证", "错误申请财产保全的，受理人应当赔偿被申请人因保全所遭受的损失"], "answer": [0, 1], "explain": "选项C：证据应当在“开庭时”出示，当事人可以质证。选项D：错误申请财产保 全的，申请人应当赔偿被申请人因保全所遭受的损失。"}, {"type": "multi", "year": "", "title": "根据仲裁法律制度的规定，下列关于涉外海事纠纷的表述中，正确的有（）。", "options": ["当事人书面约定仲裁的，可以选择由仲裁机构进行", "当事人书面约定仲裁的，可以选择以中华人民共和国为仲裁地", "依法需要报送备案信息的，应当在组庭后3 个工作日内报送备案信息", "依法需要报送备案信息的，应当向仲裁机构报送备案信息1."], "answer": [0, 1, 2], "explain": "当事人书面约定仲裁的，可以选择由仲裁机构进行；也可以选择以中华人民共和 国为仲裁地，由符合《仲裁法》规定条件的人员组成仲裁庭按照约定的仲裁规则进行，该仲裁 庭应当在组庭后3 个工作日内将当事人名称、仲裁地、仲裁庭的组成情况、仲裁规则向“仲裁 协会”备案。当事人申请财产保全、证据保全、请求责令另一方当事人作出一定行为或者禁止 其作出一定行为的，仲裁庭应当依法将当事人的申请提交人民法院，人民法院应当依法及时处 理。"}]}, "ch2": {"name": "公司法律制度", "questions": [{"type": "single", "year": "", "title": "下列关于子公司法人资格和民事责任承担的表述中，符合公司法律制度规定的是（）。（2019 年）", "options": ["子公司具有法人资格，独立承担民事责任", "子公司不具有法人资格，其财产不足以清偿的民事责任，由母公司承担", "子公司不具有法人资格，其民事责任由母公司承担", "子公司不具有法人资格，应与母公司共同承担民事责任"], "answer": [0], "explain": "公司可以设立子公司，子公司具有法人资格，依法独立承担民事责任。选项A 当选。"}, {"type": "multi", "year": "", "title": "甲有限责任公司为扩展业务，在外地设立乙分公司，下列关于乙分公司法律资格的表述中，正确的有（）。（2022 年）", "options": ["乙分公司应当领取营业执照", "乙分公司没有独立的财产", "乙分公司可以有独立的公司章程", "乙分公司不能独立承担民事责任"], "answer": [0, 1, 3], "explain": "分公司没有独立的公司名称、章程、没有独立的财产，不具有法人资格，但应当 领取营业执照进行经营活动，其民事责任由总公司承担。选项A、B、D 当选。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列人员中，属于上市公司高级管理人员的有（）。", "options": ["副经理", "监事会主席", "董事长", "董事会秘书"], "answer": [0, 3], "explain": "高级管理人员，是指公司的经理、副经理（选项A）、财务负责人，上市公司董事 会秘书（选项D）和公司章程规定的其他人员。"}, {"type": "single", "year": "", "title": "李某是甲股份有限公司（以下简称“甲公司”）的实际控制人，因借款需要请求甲公司为其提供担保。甲公司遂召开股东会对此事项进行表决。下列关于甲公司股东会决议的表述中，正确的是（）。（2018 年）", "options": ["李某不可以参加表决，该项决议由出席会议的其他股东过半数通过", "李某不可以参加表决，该项决议由出席会议的其他股东所持表决权的过半数通过", "李某可以参加表决，该项决议由全体股东所持表决权的过半数通过", "李某可以参加表决，该项决议由出席会议的股东所持表决权的过半数通过"], "answer": [1], "explain": "公司为公司股东或者实际控制人提供担保的，必须经股东会决议。接受担保的股 东或者受接受担保的实际控制人支配的股东，不得参加上述规定事项的表决。该项表决由出席 会议的其他股东所持表决权的过半数通过。"}, {"type": "single", "year": "", "title": "甲有限公司股东张某持股60%，并担任公司董事长，王某持股25%，李某持股15%。2022 年10 月，甲公司按照法定程序召开股东会，拟审议为张某的个人银行贷款提供担保的事项。三位股东都出席了股东会。已知，公司章程未对担保事项的表决作出特别规定。根据公司法律制度的规定，下列表述中，正确的是（）。", "options": ["关于担保事项的股东会决议必须经李某赞成才能成立", "张某无权出席股东会会议", "关于担保事项的股东会决议必须经王某赞成才能成立", "关于担保事项的股东会决议必须经张某赞成才能成立"], "answer": [2], "explain": "（1）张某作为接受担保的股东，不得“参加表决”（而非不得出席股东会会议）。 选项B 错误。（2）公司为股东提供担保的，应经出席会议的其他股东所持表决权（40%）的过 半数（＞20%）通过。选项C 正确。"}, {"type": "single", "year": "", "title": "2024 年7 月2 日，张某、王某、赵某、钱某共同出资设立甲有限责任公司（以下简称“甲公司”），章程规定张某担任董事长，王某出任董事，赵某出任监事，钱某出任经理。以下不能作为甲公司法定代表人的是（）。（2024 年）", "options": ["张某", "王某", "赵某", "钱某"], "answer": [2], "explain": "公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经 理担任。选项C 当选。"}, {"type": "judge", "year": "", "title": "非法人组织不得成为公司的发起人。（）（2024 年）", "options": ["对", "错"], "answer": [1], "explain": "自然人、法人、非法人组织和外国人都可以成为公司的发起人。本题表述错误。"}, {"type": "multi", "year": "", "title": "下列关于公司设立登记的说法中，正确的有（）。（2022 年）", "options": ["电子营业执照与纸质营业执照有同等法律效力", "营业执照正本和副本具有同等法律效力", "营业执照的签发日期为公司的成立日期", "设立分支机构，应当向总公司所在地的登记机构申请登记"], "answer": [0, 1, 2], "explain": "设立分支机构，应当向分支机构所在地的登记机关申请登记。选项D 不当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于公司歇业的表述中，不正确的是（）。（2024 年）", "options": ["公司应当在歇业前向登记机关办理备案", "公司歇业的期限最长不得超过2 年", "公司在歇业期间开展经营活动的，视为恢复营业", "公司应当在歇业前与职工依法协商劳动关系处理等有关事项"], "answer": [1], "explain": "选项B：公司歇业的期限最长不得超过“3 年”。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列表述中，正确的有（）。", "options": ["公司财务部门负责财务会计报告的编制，并对其真实性、完整性和准确性负责", "公司应当在每一个月度终了时编制财务会计报告，并依法经会计师事务所审计", "公司章程可以规定由监事会决定聘用、解聘承办公司审计业务的会计师事务所", "有限责任公司应按照公司章程规定的期限将财务会计报告送交各股东"], "answer": [2, 3], "explain": "选项A：公司财务会计报告应当由“董事会”负责编制，并对其真实性、完整性和 准确性负责；选项B：公司应当在每一个“会计年度终了时”编制财务会计报告，并依法经会计 师事务所审计。"}, {"type": "single", "year": "", "title": "股份有限公司召开股东会年会时，应当提前将财务会计报告置备于公司。根据公司法律制度的规定，该提前置备财务会计报告的时限是（）。", "options": ["10 日", "20 日", "30 日", "60 日"], "answer": [1], "explain": "股份有限公司的财务会计报告应当在召开股东会年会的20 日前（选项B）置备于 本公司，供股东查阅；公开发行股份的股份有限公司应当公告其财务会计报告。"}, {"type": "single", "year": "", "title": "甲公司注册资本100 万元，已经提取法定公积金46 万元，2025 年累计未分配利润50 万元，甲公司当年提取法定公积金最小的金额是（）。（2025 年）", "options": ["5 万元", "6 万元", "2 万元", "4 万元"], "answer": [0], "explain": "公司法定公积金累计额为公司注册资本的50%以上的，可以不再提取。公司分配当 年税后利润时，应当提取利润的10%列入公司法定公积金。本题中，法定公积金累计额未达到公 司注册资本的50%，应当提取法定公积金，按照10%的比例提取。选项A 当选。"}, {"type": "single", "year": "", "title": "甲公司的注册资本为100 万元，截至2024 年6 月30 日，公司法定公积金为80 万元。甲公司可以将法定公积金转增注册资本的最大限额为（）。（2024 年）", "options": ["40 万元", "45 万元", "50 万元", "55 万元"], "answer": [3], "explain": "法定公积金转为增加注册资本时，所留存的该项公积金不得少于转增前公司注册 资本的25%。甲公司所留存的该项公积金不得少于100×25%=25（万元），法定公积金转增注册 资本：80-25=55（万元）。选项D 当选。"}, {"type": "single", "year": "", "title": "某股份有限公司经营亏损，拟通过减少注册资本弥补亏损。目前亏损60 万元，盈余公积金10 万元，资本公积金5 万元，实缴注册资本5 万元，注册资本中未实缴出资为50 万元，可用于弥补亏损的注册资本最大额为（）万元。", "options": ["5", "55", "30", "45"], "answer": [0], "explain": "公司弥补亏损的顺序为：（1）税前利润补亏。（2）税后利润补亏。（3）盈余公 积金补亏。（4）资本公积金补亏。（5）减少资本补亏。本题中，该股份公司用盈余公积金、 资本公积金补亏后，仍有45 万元的亏损，此时，可通过减少资本补亏。公司以减资方式弥补亏 损时，不得免除股东缴纳出资或者股款的义务，因此不得减少未实缴的注册资本，该股份公司 只能以实缴的注册资本5 万元弥补亏损，选项A 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于公积金的表述中, 正确的是（）。", "options": ["法定公积金转为增加注册资本时，所留存的法定公积金不得少于转增后注册资本的25%", "经股东会决议，公司可以从税后利润中提取法定公积金", "超过股票票面价格所得溢价款应当列入盈余公积金", "法定公积金应当于公司向股东分配利润前提取"], "answer": [3], "explain": "法定公积金转为增加注册资本时，所留存的法定公积金不得少于“转增前”公司 注册资本的25%。选项A 不当选；公司从税后利润中提取法定公积金后，经股东会决议，还可以 从税后利润中提取“任意公积金”。选项B 不当选；超过股票票面价格所得溢价款应当列入资 本公积金。选项C 不当选。"}, {"type": "single", "year": "", "title": "甲、乙、丙、丁设立一有限责任公司，公司注册资本均为1000 万元，2023年税后利润均为500 万元。下列情形中，公司可以不再提取法定公积金的是（）。（2024 年）", "options": ["公司法定公积金500 万元，任意公积金0", "公司法定公积金400 万元，任意公积金200 万元", "公司法定公积金300 万元，任意公积金300 万元", "公司法定公积金200 万元，任意公积金500 万元"], "answer": [0], "explain": "当公司法定公积金累计额为公司注册资本的50%以上时，可以不再提取。选项A 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于公司为他人取得本公司股份提供财务资助的表述中，正确的是（）。（2024 年）", "options": ["公司实施员工持股计划时，可以提供财务资助", "董事会作出提供财务资助决议，应当经全体董事一致通过", "为公司利益，经股东会决议，公司可以为他人取得本公司股份提供累计不超过已发行股份总额20%的财务资助", "公司为他人取得本公司股份提供担保，不视为财务资助"], "answer": [0], "explain": "（1）公司不得为他人取得本公司或者其母公司的股份提供赠与、借款、担保以及 其他财务资助，公司实施员工持股计划的除外，选项A 当选；公司为他人取得本公司股份提供 担保，视为财务资助，选项D 不当选；（2）为公司利益，经股东会决议，或者董事会按照公司 章程或者股东会的授权作出决议，公司可以为他人取得本公司或者其母公司的股份提供财务资 助，但财务资助的累计总额不得超过已发行股本总额的10%，选项C 不当选；董事会作出决议应 当经全体董事的2/3 以上通过，选项B 不当选。违反前两款规定，给公司造成损失的，负有责 任的董事、监事、高级管理人员应当承担赔偿责任。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列主体中，不得成为甲有限责任公司股东的有（）。", "options": ["法官赵某", "乙个人独资企业", "有限合伙人孙某", "甲有限责任公司"], "answer": [0, 3], "explain": "（1）选项A：国家公务员（如法官、检察官、警察等）不得成为非上市公司的股 东；（2）选项D：公司不得自为（自己公司的）股东。"}, {"type": "multi", "year": "", "title": "下列关于有限责任公司章程的表述中，符合公司法律制度规定的有（）。", "options": ["公司经营范围属于公司章程的必备事项", "公司章程必须由全体股东共同制定并签名、盖章", "制定公司章程是设立有限责任公司的必经程序", "公司章程对股东没有约束力"], "answer": [0, 1, 2], "explain": "选项D：公司章程对公司、股东、董事、监事、高级管理人员具有约束力。"}, {"type": "judge", "year": "", "title": "公司不能清偿到期债务的，公司的任一债权人有权要求已认缴出资但未届出资期限的股东直接向自己清偿债务。（）", "options": ["对", "错"], "answer": [1], "explain": "公司不能清偿到期债务的，公司或者“已到期债权的债权人”有权要求已认缴出 资但未届出资期限的股东提前“向公司缴纳出资”。本题表述错误。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，关于有限责任公司设立，下列表述正确的是（）。（2023 年）", "options": ["均为股东实缴金额", "均应采用准则主义", "均为发起设立", "均无最低注册资本要求"], "answer": [2], "explain": "有符合公司章程规定的全体股东认缴的出资额是有限责任公司设立条件之一，全 体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起5 年内缴足。选项A 不当选； 一般情况下，公司设立采用准则主义。准则主义，又称登记主义，是指设立公司只要具备法律 规定的条件并提出申请即可获得政府的承认。对于特殊行业（如金融、互联网、能源行业）的 公司设立，《公司法》采用核准主义，未经审批机关批准不得申请设立登记，选项B 不当选； 有限责任公司只能发起设立，选项C 当选；有限责任公司一般没有最低注册资本要求，但法律、 行政法规以及国务院决定对有限责任公司注册资本实缴、注册资本最低限额、股东出资期限另 有规定的，从其规定，选项D 不当选。"}, {"type": "single", "year": "", "title": "甲有限责任公司于2024 年6 月3 日登记成立，其股东认缴出资期限均为2035年12 月31 日。甲公司拟修改公司章程调整股东认缴出资期限，甲公司股东认缴出资期限最晚为（）。（2025 年）", "options": ["2032 年6 月30 日", "2029 年6 月1 日", "2029 年12 月31 日", "2032 年1 月31 日"], "answer": [0], "explain": "2024 年6 月30 日前登记设立的公司，有限责任公司剩余认缴出资期限自2027 年 7 月1 日起超过5 年的，应当在2027 年6 月30 日前将其剩余认缴出资期限调整至5 年内并记载 于公司章程，股东应当在调整后的认缴出资期限内足额缴纳认缴的出资额；股份有限公司的发 起人应当在2027 年6 月30 日前按照其认购的股份全额缴纳股款。本题中，甲公司股东认缴出 资期限最晚应当在2032 年6 月30 日前。选项A 当选。"}, {"type": "multi", "year": "", "title": "有限责任公司设立时，股东可以用作出资的有（）。（2024 年）", "options": ["设定抵押的厂房", "债权", "股权", "特许经营权"], "answer": [1, 2], "explain": "股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等可以 用货币估价并可以依法转让的非货币财产作价出资；法律对数据、虚拟财产的权属等另有规定的， 股东可以按照规定使用数据、网络虚拟财产作价出资。但是，法律、行政法规规定不得作为出资 的财产除外。选项B、C 当选。劳务、信用、自然人姓名、商誉、特许经营权不能用货币估价，因 此不能出资；设定担保的财产不是清洁无负担的财产，因此也不能出资。选项A、D 不当选。"}, {"type": "multi", "year": "", "title": "下列有关有限责任公司股东缴纳出资的表述中，正确的有（）。", "options": ["股东以非货币财产出资的，应当依法办理其财产权的转移手续", "股东以货币出资的，应当按期将货币出资足额存入公司在银行开立的相关账户", "股东可以依出资证明书主张行使股东权利", "以非货币财产出资，可由股东共同协商该非货币财产的价值"], "answer": [0, 1, 3], "explain": "记载于股东名册的股东，可以依“股东名册”主张行使股东权利。"}, {"type": "single", "year": "", "title": "A 有限责任公司（下称“A 公司”）成立于2024 年1 月5 日。公司章程规定，股东甲以其名下的一套房产出资。甲于1 月7 日将房产交付A 公司，但未办理权属变更手续。5月9 日，股东乙诉至人民法院，要求甲履行出资义务。5 月31 日，人民法院责令甲于6 月12 日前办理权属变更手续，6 月6 日，甲办理了权属变更手续。根据公司法律制度的规定，甲开始享有股东权利的日期是（）。（2024 年）", "options": ["1 月5 日", "1 月7 日", "6 月6 日", "6 月12 日"], "answer": [1], "explain": "出资人以房屋出资，已经交付公司使用但未办理权属变更手续，其他股东主张认 定出资人未履行出资义务的，人民法院应当责令当事人在指定的合理期间内办理权属变更手续； 在前述期间内办理了权属变更手续的，人民法院应当认定其已经履行了出资义务；出资人主张 自其实际交付财产给公司使用时（2024 年1 月7 日）享有相应股东权利的，人民法院应予支持。 选项B 正确。"}, {"type": "single", "year": "", "title": "赵某、钱某、孙某、谢某共同出资设立甲有限责任公司（下称“甲公司”）。股东谢某以房屋出资，房屋经评估1000 万元，已经办理了权属变更手续，公司章程和股东之间的协议未对出资事项作特别约定。公司设立后，丙加入甲公司。之后谢某出资的房屋因市场原因贬值，经评估价值为800 万元，丙要求谢某承担补足出资责任，下列说法中正确的是（）。（2022 年）", "options": ["谢某应承担补足出资责任", "赵某钱某孙某承担连带责任", "谢某不承担补足出资责任", "赵某钱某孙某承担补充责任"], "answer": [2], "explain": "根据公司法律制度的规定，出资人以符合法定条件的非货币财产出资后，因市场 变化或者其他客观因素导致出资财产贬值，公司、其他股东或者公司债权人请求该出资人承担 补足出资责任的，人民法院不予支持。选项C 当选。"}, {"type": "single", "year": "", "title": "李某以违法犯罪所得的20 万元出资并取得公司股权。对李某犯罪行为处罚时，就其股权处置的下列表述中，正确的是（）。（2019 年）", "options": ["将李某的出资财产从公司中抽出，补偿受害人损失", "将李某的出资财产从公司中抽出，并将公司注册资本减少20 万元", "采取拍卖或者变卖的方式处置李某的股权", "将李某的出资财产从公司中抽出，其他股东对20 万元出资承担连带责任"], "answer": [2], "explain": "以贪污、受贿、侵占、挪用等违法犯罪所得的货币出资后取得股权的，对违法犯 罪行为予以追究、处罚时，应当采取拍卖或者变卖的方式处置其股权。选项C 正确。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列有关股东失权制度的说法中，正确的是（）。", "options": ["董事会对股东的出资情况负有核查义务", "董事会发现股东未按期足额缴纳公司章程规定的出资的，应当由董事会向该股东发出书面催缴书", "股东自收到失权通知时起，丧失其未缴纳出资的股权", "宽限期届满，股东仍未履行出资义务的，公司经董事会决议应当向该股东发出失权通知"], "answer": [0], "explain": "选项B：股东未按期足额缴纳公司章程规定的出资的，应当由公司向该股东发出书 面催缴书；选项C：自失权通知发出之日起，该股东丧失其未缴纳出资的股权；选项D：宽限期 届满，股东仍未履行出资义务的，公司经董事会决议可以向该股东发出失权通知。"}, {"type": "multi", "year": "", "title": "赵某、钱某、孙某、李某是甲有限责任公司的股东，下列情形中，甲公司可以请求人民法院认定为抽逃出资的有（）。（2025 年）", "options": ["赵某通过关联交易转出出资", "钱某虚构债权债务转出出资", "孙某虚增利润进行利润分配", "李某将5 万元的机器设备评估作价20 万元作为出资"], "answer": [0, 1, 2], "explain": "公司成立后，公司、股东或公司债权人以相关股东的行为符合下列情形之一且损 害公司权益为由，请求认定该股东抽逃出资的，人民法院应予支持：（1）通过虚构债权债务关 系将其出资转出；（2）制作虚假财务会计报表虚增利润进行分配；（3）利用关联交易将出资 转出；（4）其他未经法定程序将出资抽回的行为。选项A、B、C 当选。"}, {"type": "multi", "year": "", "title": "甲、乙、丙三人发起设立某有限公司。甲以机器设备出资100 万元，该机器设备的实际价额为40 万元，乙对此知情，丙对此不知情。1 年后，甲将股权转让给善意的丁。后戊加入公司，发现了当年甲出资不足的情况。根据公司法律制度的规定，下列说法中，正确的有（）。", "options": ["乙应当在甲出资不足的范围内承担连带责任", "丙应当在甲出资不足的范围内承担连带责任", "丁应当在甲出资不足的范围内承担连带责任", "戊应当在甲出资不足的范围内承担连带责任"], "answer": [0, 1], "explain": "（1）选项ABD：有限责任公司设立时，股东实际出资的非货币财产的实际价额显 著低于所认缴的出资额的，设立时的其他股东（乙、丙）与该股东（甲）在出资不足的范围内 承担连带责任；（2）选项C：作为出资的非货币财产的实际价额显著低于所认缴的出资额的股 东转让股权，受让人（丁）不知道且不应当知道存在该情形的，由转让人（甲）承担责任。"}, {"type": "single", "year": "", "title": "甲有限责任公司的股东林某认缴出资20 万元，出资期限为2023 年12 月31日。2024 年7 月8 日，林某在未缴纳出资的情况下将其股权全部转让给徐某。徐某知道林某未缴纳出资的情况。根据公司法律制度的规定，对于该出资义务的承担应当采取的处理方式是（）。", "options": ["由林某承担出资义务，徐某无须承担", "由徐某承担出资义务，林某无须承担", "由林某承担出资义务，徐某承担补充责任", "由林某和徐某承担连带责任"], "answer": [3], "explain": "未按照公司章程规定的出资日期缴纳出资或者作为出资的非货币财产的实际价额 显著低于所认缴的出资额的股东转让股权的，转让人与受让人在出资不足的范围内承担连带责 任；受让人不知道且不应当知道存在上述情形的，由转让人承担责任。"}, {"type": "single", "year": "", "title": "甲有限责任公司的股东吴某认缴出资20 万元，出资期限为2025 年12 月31日。2024 年7 月8 日，吴某在尚未缴纳出资的情况下将其股权全部转让给魏某。根据公司法律制度的规定，对于该出资义务的承担应当采取的处理方式是（）。", "options": ["由吴某承担出资义务，魏某无须承担", "由魏某承担出资义务，吴某无须承担", "由魏某承担出资义务，吴某承担补充责任", "由吴某承担出资义务，魏某承担补充责任"], "answer": [2], "explain": "股东转让已认缴出资但未届出资期限的股权的，由受让人承担缴纳该出资的义务； 受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承担补充责任。"}, {"type": "multi", "year": "", "title": "刘某和朱某设立一家规模较小的股份有限公司。根据公司法律制度的规定，下列各方案中，属于该公司组织机构设置可以采用的有（）。（2024 年）", "options": ["不设董事会和监事会，仅设1 名董事和1 名监事", "不设董事会，仅设1 名董事，设成员为15 人的监事会", "设成员为21 人的董事会。设审计委员会，不设监事会、也不设监事", "不设董事会，仅设1 名董事。不设监事会，也不设监事"], "answer": [0, 1, 2], "explain": "规模较小或者股东人数较少的股份有限公司，可以不设董事会，设1 名董事，行 使董事会的职权。规模较小的股份有限公司，可以不设监事会，设1 名监事，行使监事会的职 权。公司设董事会的，董事会成员为3 人以上，设监事会的，监事会成员为3 人以上。股份有 限公司可以按照公司章程的规定在董事会中设置由董事组成的审计委员会，行使监事会的职权， 不设监事会或监事，选项A、B、C 当选。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列人员或机构中，有权要求有限责任公司召开临时股东会议的有（）。", "options": ["代表1/10 以上表决权的股东", "1/3 以上的董事", "董事长", "监事会"], "answer": [0, 1, 3], "explain": "根据规定，代表1/10 以上表决权的股东（选项A），1/3 以上的董事（选项B）， 监事会（选项D）提议召开临时会议的，应当召开临时会议。因此选项A、B、D 当选。"}, {"type": "multi", "year": "", "title": "甲有限责任公司注册资本为120 万元，股东人数为9 人，董事会成员为5 人，监事会成员为5 人。股东一次缴清出资，该公司章程对股东表决权行使事项未作特别规定。根据公司法律制度的规定，该公司出现的下列情形中，属于应当召开临时股东会的有（）。（2013 年）", "options": ["出资20 万元的某股东提议召开", "公司未弥补的亏损达到40 万元", "2 名董事提议召开", "2 名监事提议召开"], "answer": [0, 2], "explain": "根据规定，代表1/10 以上表决权的股东，1/3 以上的董事或者监事会提议召开临 时会议的，应当召开临时股东会会议。本题中，公司章程对股东表决权行使事项未作特别规定， 因此按出资比例计算表决权。选项A，股东表决权的比例为20/120＝16.67%，满足条件；选项C， 董事人数占比为2/5＝40%，大于1/3，满足条件。因此选项A、C 当选。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，有限责任公司股东会会议的下列决议中，须经代表2/3 以上表决权的股东通过的有（）。", "options": ["修改公司章程", "决定利润分配方案", "对外提供担保", "增加注册资本"], "answer": [0, 3], "explain": "有限责任公司股东会作出修改公司章程（选项A）、增加或者减少注册资本的决议 （选项D），以及公司合并、分立、解散或者变更公司形式的决议，应当经代表2/3 以上表决权 的股东通过。"}, {"type": "single", "year": "", "title": "张某、王某、李某、赵某出资设立甲有限责任公司（下称“甲公司”），出资比例分别为5%、15%、36%和44%，公司章程对股东会召开及表决的事项无特别规定。下列关于甲公司股东会召开和表决的表述中，符合公司法律制度规定的是（）。", "options": ["张某、王某和李某行使表决权赞成即可通过修改公司章程的决议", "张某有权提议召开股东会临时会议", "王某和李某行使表决权赞成即可通过解散公司的决议", "首次股东会会议的召开由赵某召集和主持"], "answer": [3], "explain": "（1）有限责任公司的股东按照出资比例行使表决权，但公司章程另有规定的除外。 在本题中，甲公司章程对表决的事项无特别规定，各股东表决权按出资比例计算。（2）有限责 任公司修改公司章程、解散公司均属于股东会特别决议事项，须经代表2/3 以上表决权的股东 通过（≥66.67%）。在本题中，赵某占有44%表决权，少了赵某的赞成，特别决议事项均无法通 过。选项A、C 不当选。（3）有限责任公司中代表1/10 以上表决权的股东有权提议召临时股东 会会议。在本题中，张某的表决权仅为5%，不足1/10。选项B 不当选。有限责任公司首次股东 会由出资最多的股东召集和主持。在本题中，赵某出资最多，选项D 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列各项中，属于有限责任公司董事会职权的是（）。", "options": ["对增减注册资本作出决议", "决定公司内部管理机构的设置", "对发行公司债券作出决议", "审议批准利润分配方案"], "answer": [1], "explain": "有限责任公司董事会职权包括：（1）召集股东会会议，并向股东会报告工作；（2） 执行股东会的决议；（3）决定公司的经营计划和投资方案；（4）制订公司利润分配方案和弥 补亏损方案；（5）制订公司增加或者减少注册资本以及发行公司债券的方案；（6）制订公司 合并、分立、变更公司形式、解散的方案；（7）决定公司内部管理机构的设置；（8）决定聘 任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负 责人及其报酬事项；（9）制定公司的基本管理制度；（10）公司章程规定或者股东会授予的其 他职权。选项A、C、D 均为股东会的职权。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，有限责任公司董事长和副董事长均不能或者不履行职务时，下列主体中，有权召集和主持董事会会议的是（）。（2025 年）", "options": ["总经理", "监事会主席", "过半数董事共同推举的一名董事", "法定代表人"], "answer": [2], "explain": "董事长召集和主持董事会会议，董事长不能履行职务或者不履行职务的，由副董 事长履行职务；副董事长不能履行职务或者不履行职务的，由过半数的董事共同推举1 名董事 履行职务。选项C 当选。"}, {"type": "single", "year": "", "title": "甲有限责任公司董事会由赵某、钱某、孙某、李某四名董事组成，赵某为董事长，赵某和钱某拟辞去董事职务，下列说法正确的是（）。（2025 年）", "options": ["钱某辞任，应当以书面形式通知公司", "赵某和钱某辞任后，无需继续履行董事职务", "赵某是董事长，任期届满前不得辞职", "赵某和钱某发出辞任通知之日，辞任生效"], "answer": [0], "explain": "董事辞任的，应当以书面形式通知公司，公司收到通知之日辞任生效，但董事任 期届满未及时改选，或者董事在任期内辞任导致董事会成员低于法定人数的，在改选出的董事 就任前，原董事仍应当依照法律、行政法规和公司章程的规定，履行董事职务。选项A 当选。"}, {"type": "multi", "year": "", "title": "甲股份有限公司（简称“甲公司”）的公司章程规定公司设监事会，监事会成员为5 人。下列关于甲公司监事会的表述中，正确的有（）。（2025 年）", "options": ["甲公司的高级管理人员不得兼任监事", "甲公司的监事在任期内不得辞任", "甲公司监事会成员中职工代表至少应为2 人", "甲公司的监事不得连选连任"], "answer": [0, 2], "explain": "（1）选项A：董事、高级管理人员不得兼任监事；（2）选项B：不存在该规定； （3）选项C：监事会应当有职工代表，且比例不得低于1/3（5×1/3，至少应有2 名职工代表 监事）；（4）选项D：董事、监事任期届满，连选可以连任。"}, {"type": "multi", "year": "", "title": "某有限责任公司监事会成员人数为9 人，该公司章程规定的监事会成员中职工代表人数符合公司法律制度规定的有（）。", "options": ["1 人", "2 人", "3 人", "4 人"], "answer": [2, 3], "explain": "有限责任公司的监事会中应当 选，选项D 不当选。连续180 日以上单独或者合计持有公司3%以上股份的股东有权要求查阅 （不包括复制）公司的会计账簿、会计凭证。公司章程对持股比例有较低规定的，从其规定， 选项A、C 不当选。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列主体中，可以接受委托辅助股东行使查阅公司会计账簿、会计凭证的有（）。（CPA 考试真题）", "options": ["检察官", "税务机关工作人员", "会计师事务所", "律师事务所"], "answer": [2, 3], "explain": "股东查阅公司会计账簿、会计凭证，可以委托会计师事务所、律师事务所等中介 机构进行。"}, {"type": "single", "year": "", "title": "甲有限公司股东张某以该公司多年不向股东分配利润为由，向公司提出查阅会计账簿、会计凭证的请求。公司认为张某请求查阅有不正当目的，遂表示拒绝。随后，张某拟向人民法院提起股东知情权诉讼和解散公司诉讼。根据公司法律制度的规定，下列表述中，正确的是（）。（CPA 考试真题）", "options": ["张某对自己查阅会计账簿、会计凭证不存在不正当目的负有举证责任", "张某不得以知情权受到损害为由提起解散公司诉讼", "张某向公司提出查阅会计账簿、会计凭证的请求既可以采取口头方式，也可以采取书面方式", "即便张某的股东知情权诉讼请求得到人民法院支持，张某也必须聘请会计师查阅会计账簿、会计凭证，不得自行查阅"], "answer": [1], "explain": "（1）选项A：股东请求查阅应当说明目的，公司认为股东具有不正当目的，应由 公司举证证明；（2）选项B：股东以知情权、利润分配请求权等权益受到损害，或者公司亏损、 财产不足以偿还全部债务，以及公司被吊销营业执照未进行清算等为由，提起解散公司诉讼的， 人民法院不予受理；（3）选项C：股东要求查阅公司会计账簿、会计凭证的，应当向公司提出 书面请求，说明目的；（4）选项D：股东查阅会计账簿、会计凭证，“可以”（而非应当）委 托会计师事务所、律师事务所等中介机构进行。"}, {"type": "single", "year": "", "title": "甲有限责任公司设股东会、董事会、监事会，该公司经理王某违反法律规定，拖延向股东张某分配利润，张某拟通过诉讼维护自己的权利。下列关于张某诉讼权利的表述中，符合公司法律制度规定的是（）。", "options": ["张某有权直接向人民法院起诉王某", "张某有权书面请求监事会起诉王某", "张某有权书面请求董事会起诉王某", "张某有权书面请求股东会起诉王某"], "answer": [0], "explain": "公司董事、高级管理人员违反法律、行政法规或者公司章程的规定，损害股东利 益的，股东可以向人民法院提起诉讼。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，有限责任公司董事、高级管理人员执行公司职务时因违法给公司造成损失的，在一定情形下，股东可以为了公司利益，以自己的名义直接向人民法院提起诉讼。下列各项中，属于该情形的有（）。", "options": ["股东书面请求公司董事会向人民法院提起诉讼遭到拒绝", "股东书面请求公司董事会向人民法院提起诉讼，董事会自收到请求之日起30 日内未提起诉讼", "股东书面请求公司监事会向人民法院提起诉讼遭到拒绝", "股东书面请求公司监事会向人民法院提起诉讼，监事会自收到请求之日起30 日内未提起诉讼"], "answer": [2, 3], "explain": "公司董事、高级管理人员执行公司职务时违反法律行政法规或者公司章程的规定 的，股东通过监事会或者监事提起诉讼，因此选项AB 说法错误；监事会、不设监事会的有限公 司的监事拒绝提起诉讼或者自收到请求之日起30 日内未提起诉讼，或情况紧急、不立即提起诉 讼将会使公司利益受到难以弥补的损害的，有限责任公司的股东有权为了公司的利益，以自己 的名义直接向人民法院提起诉讼，因此选项C、D 正确。"}, {"type": "multi", "year": "", "title": "甲公司是乙股份有限公司的全资子公司，丁某连续2 年持有乙公司2%的股份，现丁某发现甲公司董事王某在公司经营期间作出对公司不利的行为。下列选项正确的有（）。（2025 年）", "options": ["丁某应先向甲公司监事会提出，请求监事会对王某提起诉讼", "丁某向甲公司监事会提出而被拒绝的，丁某可以以个人名义向人民法院提起诉讼", "丁某不是甲公司的股东，无权提出要 ）选项AB：除公司章程另有规定外，有限责任公司股东向股东以外的人转让股 权，应当将股权转让的数量、价格、支付方式和期限等事项“书面通知”其他股东，其他股东 在同等条件下有优先购买权；（2）选项C：有限责任公司股东之间转让股权的，其他股东不享 有优先购买权；（3）选项D：股东转让股权的，应当书面通知公司，请求变更股东名册，需要 办理变更登记的，应当请求公司向公司登记机关办理变更登记。"}, {"type": "judge", "year": "", "title": "张某、王某、李某三人共同出资设立了甲有限责任公司，公司章程对股权转让没有特别规定。李某拟将其拥有的股权全部转让给赵某。李某书面通知了张某和王某，两人均不愿意购买，则李某可以将股权转让给赵某。（）", "options": ["对", "错"], "answer": [0], "explain": "由于章程没有特别规定，李某对外转让股权时书面通知张某、王某即可，张某、 王某均不行使优先购买权，李某向赵某转让股权合法。"}, {"type": "single", "year": "", "title": "蓝天有限责任公司股东甲的股权被人民法院依法强制执行。人民法院将强制执行事宜通知蓝天公司及全体股东。股东乙、丙分别自接到通知之日起第15 日和第30 日向人民法院主张行使优先购买权。根据公司法律制度的规定，下列关于乙、丙行权主张的表述中，正确的是（）。", "options": ["乙、丙都可依法行使优先购买权", "乙可依法行使优先购买权，丙被视为放弃优先购买权", "乙、丙都被视为放弃优先购买权", "乙、丙在股权强制执行程序中都无权主张行使优先购买权"], "answer": [1], "explain": "本题系人民法院强制执行股权，其他股东自人民法院通知之日起“满20 日”不行 使优先购买权的，视为放弃优先购买权。"}, {"type": "single", "year": "", "title": "春华有限责任公司章程未规定股东资格继承事项，全体股东对此也没有另作约定。公司股东张甲突发疾病身亡。张甲的继承人张乙向公司主张继承张甲的股东资格，并请求变更公司股东名册。股东王某表示反对，并主张行使优先购买权。根据公司法律制度的规定，下列表述中，正确的是", "options": ["张乙仅得请求公司返还张甲的出资", "张乙可以继承张甲的股东资格", "张乙继承张甲的股东资格应当经其他股东同意", "王某对张甲的股权有优先购买权"], "answer": [1], "explain": "（1）选项ABC：在公司章程没有另外规定的情况下，自然人股东死亡后，其合法 继承人可以直接继承股东资格；（2）选项D：除公司章程另有规定或者全体股东另有约定外， 有限责任公司自然人股东因继承发生变化时，其他股东不得主张优先购买权。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列关于有限责任公司股权转让的表述中，正确的有（）。", "options": ["股权转让只是股东发生变化，公司的法人资格不发生变化", "股东转让股权后，股东应向受让人交付出资证明书", "人民法院依法强制转让股东股权的，公司的其他股东不享有优先购买权", "自然人股东因继承发生变化时，除非公司章程另有规定或全体股东另有约定，其他股东不享有优先购买权"], "answer": [0, 3], "explain": "（1）选项B：由公司向新股东签发新的出资证明书；（2）选项C：人民法院按照 法律规定的强制执行程序转让股东股权的，应当通知公司及全体股东，其他股东在同等条件下 有优先购买权。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列情形中，对有限责任公司股东会议投反对票的股东可以请求公司按照合理的价格收购其股权的有（）。（2023 年）", "options": ["公司转让主要财产", "公司对外提供担保", "公司章程规定的营业期限届满，股东会会议通过决议修改章程使公司存续", "公司连续5 年不向股东分配利润，而公司该5 年连续盈利且符合法律规定的分配利润条件"], "answer": [0, 2, 3], "explain": "有下列情形之一的，对股东会该项决议投反对票的股东可以请求公司按照合理的 价格收购其股权，退出公司：（1）公司连续5 年不向股东分配利润，而公司该5 年连续盈利， 并且符合法律规定的分配利润条件的；（2）公司合并、分立、转让主要财产的；（3）公司章 程规定的营业期限届满或者章程规定的其他解散事由出现，股东会会议通过决议修改章程使公 司存续的。另外，公司的控股股东滥用股东权利，严重损害公司或者其他股东利益的，其他股 东有权请求公司按照合理的价格收购其股权。选项A、C、D 当选。"}, {"type": "single", "year": "", "title": "王某、陈某和赵某为甲有限责任公司的股东，三人均已办理股东资格登记，公司章程对股权转让未作特别规定。王某所持股权的实际出资人为钱某，陈某和赵某对此均不知情。王某将所持股权以合理价格全部转让给陈某并办理了股权变更登记。钱某和赵某知悉后对此提出异议。下列关于该股权转让的表述中，正确的是（）。（2022 年）", "options": ["赵某有权就该股权转让行使优先购买权", "王某将股权转让给陈某须经赵某同意", "钱某可以要求王某返还股权", "陈某已合法取得该股权"], "answer": [3], "explain": "内部转让不存在优先购买权，赵某无权就该股权转让行使优先购买权，选项A 不 当选；除章程另有规定外，股东可在内部自由转让，王某将股权转让给陈某不需要经过赵某同 意，选项B 不当选；陈某善意取得该股权，名义股东王某处分股权造成实际出资人钱某的损失， 钱某有权向王某追偿，但不能要求王某返还股权，选项C 不当选，选项D 当选。"}, {"type": "judge", "year": "", "title": "有限责任公司的设立，可以采取募集设立方式。（）（2023 年）", "options": ["对", "错"], "answer": [1], "explain": "（1）有限责任公司只能采用发起设立；（2）股份有限公司可以采取发起设立或 者募集设立的方式设立。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于股份有限公司发起人的表述中，正确的是（）。", "options": ["发起人只能是自然人", "发起人的最低人数为2 人", "发起人半数以上应当在中国境内有住所", "发起人只能是中国公民"], "answer": [2], "explain": "选项AD：可以是自然人，也可以是法人；可以是中国公民，也可以是外国公民； 选项B：发起人人数为1-200 人。"}, {"type": "judge", "year": "", "title": "发起设立的股份有限公司，其注册资本为在公司登记机关登记的全体股东认缴的出资额。（）", "options": ["对", "错"], "answer": [1], "explain": "股份有限公司实行“实缴资本制”，注册资本为在公司登记机关登记的已发行股 份的股本总额。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列关于授权资本制说法中，正确的有（）。", "options": ["授权董事会发行新股的期限最长不得超过3 年", "以非货币财产作价出资的应当经股东会决议", "有限责任公司可以适用授权资本制", "董事会决定发行新股需全体董事2/3 以上通过"], "answer": [0, 1, 3], "explain": "选项C：有限责任公司不适用授权资本制。"}, {"type": "single", "year": "", "title": "某股份有限公司已发行股份数量为1 200 万股，根据公司法律制度的规定，该公司章程或者股东会可以授权董事会发行股份数量的最高限额为（）万股。", "options": ["300 万股", "600 万股", "800 万股", "1 200 万股"], "answer": [1], "explain": "公司章程或股东会可以授权董事会在3年内决定发行不超过已发行股份50%的股份。 因此，本题中可以授权董事会发行股份数量的最高限额＝12 00×50%＝600（万股）。"}, {"type": "multi", "year": "", "title": "下列关于设立股份有限公司的说法中，不正确的是（）。（2025 年）", "options": ["以发起设立方式设立股份有限公司，成立大会的召开和表决程序由公司章程或者发起人协议规定", "以发起设立方式设立股份有限公司的，发起人应当在公司成立前按照其认购的股份全额缴纳股款", "募集设立股份有限公司的，在发起人认购的股份缴足前，不得向他人募集股份", "募集设立股份有限公司只能在特定范围内募集，不得向社会公开募集"], "answer": [3], "explain": "选项D：公司向社会公开募集股份，应当经中国证监会注册，公告招股说明书。"}, {"type": "single", "year": "", "title": "甲上市公司董事会提议2023 年度股东会的召开日期。董事会提议的下列召开日期中，符合公司法律制度规定的是（）。", "options": ["2024 年6 月15 日", "2024 年7 月15 日", "2024 年8 月15 日", "2024 年9 月15 日"], "answer": [0], "explain": "上市公司的年度股东会应当于上一会计年度结束后的6 个月内举行。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，股份有限公司单独或合计持有一定比例以上股份的股东可以依法行使临时提案权，该一定比例是（）。（CPA 考试真题）", "options": ["5%", "3%", "10%", "1%"], "answer": [3], "explain": "根据规定，股份有限公司单独或合计持有1%以上股份的股东，可以在股东会召开 10 日前提出临时提案并书面提交董事会，选项D 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，在公司章程对临时股东会召开未作特别规定时，股份有限公司发生的下列情形中，应当在2 个月内召开临时股东会的是（）。", "options": ["持有丙股份有限公司5%股份的股东提议召开临时股东会", "甲股份有限公司章程规定董事人数为30 人，现实有董事19 人", "丁股份有限公司的监事提议召开临时股东会", "乙股份有限公司实收股本总额为5 000 万元，目前未弥补的亏损为1 000 万元"], "answer": [1], "explain": "选项A：股东（单独或合计）持有的股份不足10％以上，无权提议召开临时股东 会；选项B：董事人数已经不足公司章程所规定人数的2/3，应当召开临时股东会；选项C：监 事会有权提议召开临时股东会，但是单个监事提议不行；选项D：公司未弥补的亏损未达到股本 总额的1/3，无须召开临时股东会。"}, {"type": "judge", "year": "", "title": "股份有限公司股东会作出修改公司章程的决议，必须经出席会议的2/3 以上的股东通过。（）", "options": ["对", "错"], "answer": [1], "explain": "股份有限公司股东会作出修改公司章程的决议，必须经过出席会议的股东“所持 表决权”的2/3 以上通过。"}, {"type": "single", "year": "", "title": "甲股份有限公司已发行股份1 000 万股，赵某持有100 万股，甲公司章程规定，选举董事、监事应当采用累积投票制。现甲公司选举董事，共有13 名候选人（包括赵某），拟从中选举出9 名董事，赵某拟支持自己和另一名候选人李某。根据公司法律制度的规定，赵某在本次董事会选举中投给自己和李某的表决权数最多为（）万票。", "options": ["900", "1 800", "1 300", "2 600"], "answer": [0], "explain": "股份有限公司股东会选举董事、监事，可以按照公司章程的规定或者股东会的决 议，实行累积投票制。累积投票制，是指股东会选举董事或者监事时，每一股份拥有与应选董 事或者监事人数相同的表决权，股东拥有的表决权可以集中使用。本题中，应选董事是9 人， 赵某持有100 万股，因此是100 万×9=900 万票。选项A 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于股份有限公司股东会的表述中，正确的是（）。", "options": ["股东会可以依照公司章程的规定以累积投票制的方式选举董事和监事", "股东人数较少的股份有限公司，股东会会议可以每两年召开一次", "股东会作出决议，必须经全体股东所持表决权过半数通过", "股东会可以对会议通知中未列明的事项作出决议"], "answer": [0], "explain": "选项B：（非上市）股份有限公司的股东会会议应当每年召开1 次；选项C，股份 有限公司股东会作出（普通）决议，必须经“出席会议”的股东所持表决权过半数通过；选项D， 股东会不得对会议通知中未列明的事项作出决议。"}, {"type": "single", "year": "", "title": "某上市公司董事会成员共9 名，监事会成员共3 名。下列关于该公司董事会召开的情形中，符合公司法律制度规定的是（）。", "options": ["经2 名董事提议可召开董事会临时会议", "公司董事长、副董事长不能召集和主持董事会会议时，可由4 名董事共同推举1 名董事召集和主持", "经2 名监事提议可召开董事会临时会议", "董事会每年召开2 次会议，并在会议召开10 日前通知全体董事和监事"], "answer": [3], "explain": "（1）选项AC：经代表1/10 以上表决权的股东、1/3 以上的董事（≥3 人）或者监 事会（2 名监事不行）提议，可以召开股份有限公司临时董事会；（2）选项B：董事长、副董 事长不能履行职务或者不履行职务的，由过半数的董事（≥5 人）共同推举一名董事履行职务。"}, {"type": "single", "year": "", "title": "某股份有限公司共有甲、乙、丙、丁、戊、己、庚七位董事。某次董事会会议，董事甲、乙、丙、丁、戊、己参加，庚因故未能出席，也未书面委托其他董事代为出席。该次会议通过一项违反法律规定的决议，给公司造成严重损失。该次会议的会议记录记载，董事戊在该项决议表决时表明了异议。根据公司法律制度的规定，应对公司负赔偿责任的董事是（）。", "options": ["董事甲、乙、丙、丁、戊、己、庚", "董事甲、乙、丙、丁、戊、己", "董事甲、乙、丙、丁、己、庚", "董事甲、乙、丙、丁、己"], "answer": [3], "explain": "（1）庚根本未参与，免除责任； （2）戊表明了异议并记载于会议记录中，免除责任，选项D 当选。"}, {"type": "multi", "year": "", "title": "甲股份有限公司的公司章程规定，在董事会中设置由董事组成的审计委员会，行使监事会的职权，不设监事会和监事。下列关于甲公司审计委员会成员的表述中，正确的有（）。（2025 年）", "options": ["审计委员会成员均不得在公司担任除董事以外的其他职务", "审计委员会成员均不得与公司存在可能影响其独立客观判断的关系", "审计委员会成员须为3 名以上", "公司董事会成员中的职工代表可以成为审计委员会成员"], "answer": [2, 3], "explain": "选项AB：审计委员会“过半数成员”不得在公司担任除董事以外的其他职务，且 不得与公司存在任何可能影响其独立客观判断的关系。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列关于股份有限公司监事会的表述中，正确的有（）。（2023 年）", "options": ["职工代表的比例不得少于监事会成员的1/3", "总经理可以兼任监事", "监事会设主席1 人", "监事会成员不得少于3 人"], "answer": [0, 2, 3], "explain": "选项B：董事、高级管理人员不得兼任监事。"}, {"type": "judge", "year": "", "title": "面额股股票的发行价格可以低于票面金额。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "面额股股票的发行价格可以按票面金额，也可以超过票面金额，但“不得低于票 面金额”。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，股份有限公司发行无面额股的，应当将发行股份所得股款的（）计入注册资本。（CPA 考试真题）", "options": ["20%以上", "30%以上", "50%以上", "80%以上"], "answer": [2], "explain": "根据规定，股份有限公司发行无面额股所得股款，至少应将股款的1/2 计入注册 资本，选项C 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列有关无面额股的说法中，正确的是（）。", "options": ["股份有限公司的全部股份应当采用无面额股", "发行面额股的，每一股面额可以不相等", "无面额股的发行不受“股票发行价不得低于面额”的限制", "公司章程可以规定将无面额股中的1/2 转换为面额股"], "answer": [2], "explain": "（1）选项A：股份有限公司的全部股份，根据公司章程的规定择一采用面额股或 者无面额股；（2）选项B：发行面额股的，每一股面额是相等的；（3）选项D：公司可以根据 公司章程的规定将已发行的面额股全部转换为无面额股或者将无面额股全部转换为面额股。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，股份有限公司发行新股，股东会应当对特定事项作出决议。下列各项表述不正确的是（）。", "options": ["新股发行的起止日期", "新股种类及数额", "承销的证券公司", "新股发行价格"], "answer": [2], "explain": "股份有限公司发行新股，股东会应当对特定事项作出决议，该特定事项包括：①新股 种类及数额（选项B）；②新股发行价格（选项D）；③新股发行的起止日期（选项A）；④向原有 股东发行新股的种类及数额；⑤发行无面额股的，新股发行所得股款计入注册资本的金额。"}, {"type": "multi", "year": "", "title": "某股份有限公司于2024 年8 月在上海证券交易所上市，公司章程对股份转让的限制未作特别规定，该公司有关人员的下列股份转让行为中，符合公司法律制度规定的有（）。", "options": ["监事赵某于2025 年6 月转让了其所持本公司股份总数的20%", "董事钱某于2025 年9 月将其所持本公司全部股份888 股一次性转让", "总经理李某于2026 年1 月离职，2026 年3 月转让了其所持本公司股份总数的5%", "董事会秘书李某于该公司2025 年年度报告公告后15 日内，转让了其所持本公司股份总数的10%"], "answer": [1, 3], "explain": "（1）选项A：公司董事、监事、高级管理人员所持本公司股份自公司股票上市交 易之日起1 年内不得转让。（2）选项B：上市公司董事和高级管理人员所持股份不超过1 000 股的，可一次全部转让，不受25%比例的限制。（3）选项C：公司董事、监事、高级管理人员 离职后半年内，不得转让其所持有的本公司股份。（4）选项D：上市公司年度报告、半年度报 告公告前15 日内，上市公司董事、高级管理人员不得买卖本公司股票。"}, {"type": "judge", "year": "", "title": "公司不得接受本公司的股份作为质押的标的。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "公司不得接受本公司的股份作为质权的标的。"}, {"type": "single", "year": "", "title": "2025 年7 月8 日，甲股份有限公司股东会作出了关于公司合并的决议。甲公司的股东赵某对该决议持异议，要求公司收购其股份。根据公司法律制度的规定，甲公司在收购赵某的股份后，应当在特定期间内转让或者注销。该期间是（）。", "options": ["1 个月", "3 个月", "6 个月", "9 个月"], "answer": [2], "explain": "股份有限公司股东因对股东会作出的公司合并、分立决议持异议，要求公司收购 其股份的，公司应当收购，并自收购之日起6 个月内转让或者注销。"}, {"type": "multi", "year": "", "title": "2024 年5 月，甲上市公司为了维护公司价值及股东权益，经股东会授权，董事会会议决议依法收购本公司股份。下列关于本次收购的表述中，正确的有（）。", "options": ["甲上市公司应当将本次收购的股份在3 年内转让或注销", "须经三分之二以上董事出席的董事会会议决议", "甲上市公司合计持有的本公司股份数最大份额可以达到本公司已发行股份总额的15%", "甲上市公司应当通过公开的集中交易方式完成本次收购"], "answer": [0, 1, 3], "explain": "（1）选项AC：公司合计持有的本公司股份数不得超过本公司已发行股份总额的 10%，并应当在3 年内转让或者注销。（2）选项B：上市公司为维护公司价值及股东权益所必需 收购本公司股份的，可以依照公司章程的规定或者股东大会的授权，经2/3 以上董事出席的董 事会会议决议。（3）选项D：公司收购本公司股份的，应当通过公开的集中交易方式进行。"}, {"type": "single", "year": "", "title": "下列有关上市公司董事会秘书的表述中，正确的是（）。", "options": ["董事会秘书可以代表董事长", "董事会秘书可以代表董事会", "董事会秘书是董事会设置的服务席位", "董事会秘书不属于公司的高级管理人员"], "answer": [2], "explain": "（1）选项ABC：董事会秘书是董事会设置的服务席位，既不能代表董事会，也不 能代表董事长；（2）选项D：公司高级管理人员包括总经理、副总经理、财务负责人、上市公 司董事会秘书以及公司章程规定的其他人员。"}, {"type": "single", "year": "", "title": "甲上市公司董事会召开会议审议资产购买方案。董事会共11 名董事，8 名董事出席会议参与投票。未出席会议的董事中，1 名未委托其他董事代为出席或投票，2 名与审议事项有关联关系。通过该资产购买方案的决议至少应获得的赞成票票数为（）。", "options": ["5 票", "6 票", "8 票", "4 票"], "answer": [0], "explain": "上市公司董事会决议办法为“全体无关董事过半数通过”，本题中，全体无关董 事为9 名，过半数为5 名。"}, {"type": "multi", "year": "", "title": "根据公司法律制度的规定，下列关于上市公司审计委员会的表述，正确的有（）。（2024 年）", "options": ["上市公司审计委员会成员应当为不在上市公司担任高级管理人员的董事", "上市公司审计委员会召集人应当由独立董事中会计专业人士担任", "上市公司董事会对聘任财务负责人事项作出决议前，应当经审计委员会全体成员一致通过", "上市公司董事会对披露财务会计报告事项作出决议前，应当经审计委员会全体成员一致通过"], "answer": [0, 1], "explain": "上市公司应当在董事会中设置审计委员会。审计委员会成员应当为不在上市公司 担任高级管理人员的董事，其中独立董事应当过半数，并由独立董事中会计专业人士担任召集 人，选项A、B 当选。上市公司董事会对下列事项作出决议前应当经审计委员会全体成员过半数 通过：（1）聘用、解聘承办公司审计业务的会计师事务所；（2）聘任、解聘财务负责人；（3） 披露财务会计报告；（4）国务院证券监督管理机构规定的其他事项。选项C、D 不当选。"}, {"type": "multi", "year": "", "title": "下列关于上市公司独立董事的表述中，正确的有（）。（2025 年）", "options": ["独立董事可以在上市公司的附属企业任职", "上市公司独立董事占董事会成员的比例应不低于1/3", "上市公司审计委员会成员中，独立董事的人数应不低于1/2", "上市公司审计委员会应当由独立董事中的会计专业人士担任召集人"], "answer": [1, 3], "explain": "（1）选项A：最近12 个月内在上市公司或者其附属企业任职的人员及其配偶、父 母、子女、主要社会关系，不得在该上市公司担任独立董事；（2）选项C：上市公司审计委员 会成员中，独立董事应当“过半数”（过半数是＞1/2，而不低于1/2 是≥1/2）。"}, {"type": "multi", "year": "", "title": "甲上市公司拟聘请独立董事。下列候选人中，没有资格担任该公司独立董事的有（）。（2023 年）", "options": ["王某，因侵占财产被判刑，3 年有期徒刑刑满刚刚释放", "张某，甲上市公司投资的某全资子公司的法律顾问", "赵某，个人负债100 万元到期未清偿被人民法院列为失信被执行人", "李某，甲上市公司某董事的弟弟"], "answer": [0, 1, 2, 3], "explain": "（1）选项AC：不具备担任公司董事的资格；（2）选项B：属于“正在为上市公 司附属企业提供法律服务”，不得担任上市公司独立董事；（3）选项D：属于“在上市公司任 职人员的主要社会关系”，不得担任上市公司独立董事。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，国有独资公司的下列事项中，履行出资人职责的机构可以授权董事会行使的是（）。（2025 年）", "options": ["减少注册资本", "发行公司债券", "分配利润", "合并与分立"], "answer": [1], "explain": "国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权。履行出资 人职责的机构可以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改，公司的 合并、分立、解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的 机构决定。选项A、C、D 不当选，选项B 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，下列关于国有独资公司的表述中，正确的是（）。（2025 年）", "options": ["董事会成员不得兼任经理", "应当设股东会", "董事长、副董事长由履行出资人职责的机构从董事会成员中指定", "所有董事会成员均由履行出资人职责的机构委派"], "answer": [2],
