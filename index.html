付给李某，不能再行使任意撤销权。选项A 当选；（2）根据规定，具有救灾、扶贫 等社会公益、道德义务性质的赠与合同或者经过公证的赠与合同，不得撤销。选项B、C 当选； （3）根据规定，受赠人不履行赠与合同约定的义务的，赠与人可以撤销赠与。选项D 不当选。"}, {"type": "single", "year": "", "title": "2022 年3 月1 日，张某与李某签订借款合同，约定张某向李某借款50 万元，年利率为10% ，3 月5 日，李某将45 万元转账给张某，声明预扣了5 万元利息。双方未约定借款期限。下列关于该借款合同效力的表述中，正确的是（）。（2022 年）", "options": ["借款合同的成立日期是2022 年3 月1 日", "因预先扣除借款利息5 万元，借款合同无效", "借款合同的成立日期是2022 年3 月5 日", "因未约定借款期限，借款合同无效"], "answer": [2], "explain": "自然人之间的借款合同为实践合同，转账借款45 万时生效，借款合同的成立日期 为2022 年3 月5 日，选项A 不当选，选项C 当选；预先扣除利息按扣除后的金额作为借款本金 并不影响借款合同效力，选项B 不当选；对借款期限没有约定的，当事人可以协议补充，不影 响借款合同效力，选项D 不当选。"}, {"type": "multi", "year": "", "title": "2024 年5 月，一年期贷款市场报价利率为3.45%，则下列借款合同中约定的借期内利率符合规定的有（）。（2024 年）", "options": ["周某与吴某签订的借款合同，借款合同约定年利率为14%", "孙某与李某签订的借款合同，借款合同约定年利率为7%", "赵某与钱某签订的借款合同，借款合同约定年利率为3%", "郑某与王某签订的借款合同，借款合同约定年利率为1%"], "answer": [1, 2, 3], "explain": "出借人请求借款人按照合同约定利率支付利息的，人民法院应予支持，但双方约 定的利率超过合同成立时1 年期贷款市场报价利率（LPR）4 倍的除外。本题中，合同成立时1 年期贷款市场报价利率为3.45%，因此约定的利率不得超过“3.45%×4＝13.80%”。"}, {"type": "single", "year": "", "title": "2024 年6 月1 日，周某与李某订立1 年期的借款合同，合同未约定借期内利率和逾期利率。2025 年6 月1 日，借款到期后李某拒绝还款，周某向法院提起诉讼。已知：2024年6 月1 日一年期贷款市场报价利率为3.45%；2025 年6 月1 日一年期贷款市场报价利率为3%。下列周某的主张中，人民法院应予支持的是（）。（2025 年）", "options": ["主张从2024 年6 月1 日起按照3.45%利率支付借款期间的利息", "主张从2024 年6 月1 日起按照13.8%利率支付借款期间的利息", "主张从2025 年6 月1 日起按照3%利率支付逾期利息", "主张从2025 年6 月1 日起按照12%利率支付逾期利息"], "answer": [2], "explain": "借款合同对支付利息没有约定的，视为没有利息，选项A、B 不当选；借贷双方既 未约定借期内利率，也未约定逾期利率，出借人主张借款人自逾期还款之日起参照当时一年期 贷款市场报价利率标准计算的利息承担逾期还款违约责任的，人民法院应予支持，选项C 当选， 选项D 不当选。"}, {"type": "single", "year": "", "title": "陈某与李某口头约定：陈某将房屋出租给李某，租赁期1 年，月租金1 000元。1 个月后，陈某向李某主张解除租赁合同，李某不同意，遂诉至法院。诉讼中，陈某承认口头租约的存在，但否认租期为1 年，李某也无法提供双方约定租期为1 年的证据。根据合同法律制度的规定，该房屋租赁合同（）。", "options": ["无效", "可撤销", "有效，视为租赁期限为1 年", "有效，视为不定期租赁"], "answer": [3], "explain": "租赁期限6 个月以上的，合同应当采用书面形式。当事人未采用书面形式，无法 确定租赁期限的，视为不定期租赁。选项D 当选。"}, {"type": "multi", "year": "", "title": "2024 年1 月，甲租赁乙的一套房屋，租期为3 年，双方签订了租赁合同。2024年2 月，甲未经乙的同意将房屋转租给丙，乙于当月得知转租一事，直至2024 年9 月，乙仍没有作出反对转租的意思表示。2024 年10 月，丙的小猫将房屋墙体抓坏。根据合同法律制度的规定，下列说法中正确的有（）。（2024 年）", "options": ["乙未在6 个月内表示拒绝转租的视为同意转租", "甲未支付租金，乙可以直接向丙请求支付", "丙造成房屋损害的，乙可以向甲索赔", "丙代甲向乙支付租金后，超过其应支付的租金部分可以向甲追偿"], "answer": [0, 2, 3], "explain": "选项B：乙、丙之间不存在租赁关系，根据合同相对性规则，乙无权直接要求丙向 其支付租金。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于租赁合同表述中，正确的有（）。（2024年）", "options": ["因租赁物全部毁损，致使不能实现合同目的的，承租人可以解除合同", "租赁期限6 个月以上的，应当采用书面形式", "承租人经出租人同意，可以将租赁物转租给第三人", "租赁期限超过20 年，合同无效"], "answer": [0, 1, 2], "explain": "因租赁物部分或者全部毁损、灭失，致使不能实现合同目的的，承租人可以解除 合同，选项A 当选。租赁期限6 个月以上的，应当采用书面形式；当事人未采用书面形式，无 法确定租赁期限的，视为不定期租赁。选项B 当选。承租人经出租人同意，可以将租赁物转租 给第三人。选项C 当选。租赁期限不得超过20 年；超过20 年的，超过部分无效。选项D 不当 选。"}, {"type": "single", "year": "", "title": "甲公司将一套设备租赁给乙公司使用，租赁期间，经询问确认乙公司无购买意向后，甲公司将该设备卖给丙公司。根据合同法律制度的规定，下列关于买卖合同与租赁合同效力的表述中，正确的是（）。（2023 年）", "options": ["买卖合同无效，租赁合同继续有效", "租赁合同继续有效，买卖合同有效", "买卖合同有效，租赁合同自买卖合同生效之日起终止", "买卖合同有效，租赁合同须经丙公司同意后才继续有效"], "answer": [1], "explain": "租赁物在承租人按照租赁合同占有期限内发生所有权变动的，不影响租赁合同的 效力。选项B 当选。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，下列承租人有优先购买权的是（）。（2025 年）", "options": ["出租人将出租的房屋卖给儿子", "出租人将出租的房屋卖给弟弟", "出租人将出租的房屋卖给侄子", "出租人将出租的房屋卖给按份共有人"], "answer": [2], "explain": "出租人出卖出租房屋的，应当在出卖之前的合理期限内通知承租人，承租人享有 在同等条件下优先购买的权利，但是，房屋按份共有人行使优先购买权或者出租人将房屋出卖 给近亲属的除外。近亲属包括配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外 孙子女。选项C 当选。"}, {"type": "multi", "year": "", "title": "甲将自有房屋出租给乙，租赁期限为3 年，双方签订书面租赁合同但未约定优先购买权相关特殊条款。租赁第2 年，甲未提前通知乙，便与丙签订房屋买卖合同，将该房屋以市场价格出售给丙，且已完成房屋过户登记。乙得知后，认为自身权利受损。下列关于本案的说法中，正确的有（）。（2025 年）", "options": ["乙有权以甲侵害其优先购买权为由，向甲主张赔偿责任", "乙无权主张甲与丙签订的房屋买卖合同无效", "乙可以向丙主张继续租住", "可以向受让人请求赔偿"], "answer": [0, 1, 2], "explain": "出租人出卖租赁房屋的，应当在出卖之前的合理期限内通知承租人，承租人享有 以同等条件优先购买的权利；但是，房屋按份共有人行使优先购买权或者出租人将房屋出卖给 近亲属的除外。出租人出卖租赁房屋未在合理期限内通知承租人或者存在其他侵害承租人优先 购买权的情形，承租人可以请求出租人承担赔偿责任。选项A 当选，选项D 不当选。但是，出 租人与第三人订立的房屋买卖合同的效力不受影响。选项B 当选。租赁房屋在租赁期间发生所 有权变动的，承租人请求房屋受让人继续履行原租赁合同的，人民法院应予支持。选项C 当选。"}, {"type": "single", "year": "", "title": "出租人赵某就同一房屋先后与钱某、孙某、李某、吴某订立均有效的租赁合同，其中钱某最先订立合同，孙某合法占有租赁房屋，李某已经办理登记备案手续，吴某出价最高。现四位承租人均向县人民法院提起诉讼主张履行合同，应判决赵某向其履行租赁合同的是（）。（2023 年）", "options": ["孙某", "李某", "钱某", "吴某"], "answer": [0], "explain": "出租人就同一房屋订立数份租赁合同，在合同均有效的情况下，承租人均主张履 行合同的，人民法院按照下列顺序确定履行合同的承租人：（1）已经合法占有租赁房屋的；（2） 已经办理登记备案手续的；（3）合同成立在先的。不能取得租赁房屋的承租人请求解除合同、 赔偿损失的，依照民法典的有关规定处理。选项A 当选。"}, {"type": "single", "year": "", "title": "甲公司与乙公司签订大型机械设备融资租赁合同，合同约定：根据乙公司的选择，甲公司向丙公司订购一台大型机械设备，出租给乙公司使用，乙公司向甲公司支付租金。根据合同法律制度的规定，下列关于甲公司权利义务的表述中，正确的是（）。", "options": ["乙公司占有机械设备期间，甲公司履行该机械设备的维修义务", "乙公司占有机械设备期间，该机械设备造成第三人人身伤害的，甲公司承担责任", "甲公司要求丙公司变更订购的机械设备型号，无须经乙公司同意", "在租赁期间内，甲公司享有该机械设备的所有权"], "answer": [3], "explain": "（1）融资租赁期间，机械设备的维修义务由乙公司（承租人）承担。选项A 不当 选；（2）在融资租赁合同中，承租人占有租赁物期间，租赁物造成第三人人身损害或者财产损 失的，甲公司（出租人）不承担责任。选项B 不当选；（3）出租人根据承租人对出卖人、租赁 物的选择订立的买卖合同，未经乙公司（承租人）同意，出租人不得变更与承租人有关的合同 内容。选项C 不当选。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，下列关于融资租赁合同中租赁物的表述中，不正确的是（）。", "options": ["租赁物毁损、灭失的，出租人有权请求承租人继续支付租金", "在融资租赁期间出租人享有租赁物的所有权", "承租人破产的，租赁物属于破产财产", "出租人和承租人可以约定租赁期间届满租赁物的归属"], "answer": [2], "explain": "融资租赁期间，租赁物所有权归出租人所有。因此，承租人破产的，租赁物不属 于其破产财产。选项C 当选。"}, {"type": "judge", "year": "", "title": "第三人单方以书面形式向债权人作出保证，债权人接收且未提出异议的，保证合同成立。（）（2022 年）", "options": ["对", "错"], "answer": [0], "explain": "第三人单方以书面形式向债权人作出保证，债权人接收且未提出异议的，保证合 同成立。本题表述正确。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列主体中，不得作为保证人的有（）。（2019 年）", "options": ["企业法人的职能部门", "无民事行为能力人", "不具有完全代偿能力的法人", "公立大学"], "answer": [0, 1, 3], "explain": "选项AD，国家机关、学校、幼儿园、医院等以公益为目的的非营利法人、非法人 组织，企业法人的分支机构、职能部门，不得作保证人；选项B，无民事行为能力人独立实施的 法律行为无效；选项C，不具有完全代偿能力的法人、其他组织或者自然人，以保证人身份订立 保证合同后，又以自己没有代偿能力要求免除保证责任的，人民法院不予支持。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列属于无效保证合同的有（）。", "options": ["甲公立大学与乙银行签订保证合同，为丙企业的贷款提供保证", "赵某与债权人钱某签订的未约定保证担保范围的保证合同", "甲行政机关与乙银行签订保证合同，为丙公司的贷款提供保证", "孙某与债权人李某签订的未约定保证方式的保证合同"], "answer": [0, 2], "explain": "一般情形下，机关法人，以公益为目的的非营利法人、非法人组织不得为保证人， 否则保证合同无效。选项A、C 当选；当事人对保证担保的范围没有约定或者约定不明确的，保 证人应当对主债权及其利息、违约金、损害赔偿金和实现债权的费用承担责任。选项B 不当选； 当事人在保证合同中对保证方式没有约定或者约定不明确的，按照一般保证承担保证责任。选 项D 不当选。"}, {"type": "single", "year": "", "title": "保证合同约定的保证期间早于主债务履行期限的，保证期间为（）。（2023 年）", "options": ["主债务履行期限届满之日起2 年", "主债务履行期限届满之日起3 年", "主债务履行期限届满之日起6 个月", "主债务履行期限届满之日起1 年"], "answer": [2], "explain": "保证合同约定的保证期间早于或者等于主债务履行期限的，视为没有约定，保证 期间为主债务履行期届满之日起6 个月。选项C 当选。"}, {"type": "single", "year": "", "title": "2022 年3 月1 日，甲公司与乙公司签订一份买卖合同，约定乙公司向甲公司购买100 套家具，每套价格为1 万元，甲公司于6 月15 日交货，乙公司在收货后支付货款100万元，为担保乙公司按期支付货款，丙公司作为保证人与甲公司签订保证合同。2022 年4 月5日，因订单增加，乙公司向甲公司提出加购10 套家具，货款总额为110 万元，甲公司同意。2022年5 月15 日，因订单持续增加，乙公司又提出加购10 套家具，货款总额为120 万元，甲公司同意，丙公司对合同货款总额调整并不知情，下列关于丙公司保证责任承担的表述中，正确的是（）。（2022 年）", "options": ["丙公司不再承担保证责任", "丙公司应在100 万元范围内承担保证责任", "丙公司应在120 万元范围内承担保证责任", "丙公司应在110 万元范围内承担保证责任"], "answer": [1], "explain": "保证期间，债权人与债务人对主合同数量、价款、币种、利率等内容做了变动， 未经保证人书面同意的，如果减轻债务人债务的，保证人仍应当对变更后的合同承担保证责任； 如果加重债务人债务的，保证人对加重的部分不承担保证责任。选项B 当选。"}, {"type": "multi", "year": "", "title": "甲公司与乙银行签订借款合同，由丙公司作为连带责任保证人，甲公司与乙银行未征得丙公司书面同意，对借款合同内容进行协议变更。下列关于丙公司承担保证责任的表述中，正确的有（）。（2022 年）", "options": ["甲公司与乙银行协议减轻债务的，丙公司对变更后的债务承担保证责任", "甲公司与乙银行协议加重债务的，丙公司对原债务承担保证责任", "甲公司与乙银行协议加重债务的，丙公司对加重的部分亦承担保证责任", "甲公司与乙银行协议变更债务的，丙公司不再承担保证责任"], "answer": [0, 1], "explain": "在保证期间，债权人与债务人对主合同数量、价款、币种、利率等内容做了变动， 未经保证人书面同意的，如果减轻债务人债务的，保证人仍应当对变更后的合同承担保证责任； 如果加重债务人债务的，保证人对加重的部分不承担保证责任。选项A、B 当选。"}, {"type": "multi", "year": "", "title": "2025 年1 月15 日，赵某向钱某借款，双方签订了借款合同。赵某请李某和孙某为该笔债务提供担保。1 月18 日，钱某与李某签订抵押合同，以李某所有的一套房屋为抵押物，双方办理了抵押登记。1 月20 日，孙某为该笔借款提供连带责任保证。因赵某拒绝还款，钱某向李某提出行使抵押权，并请求孙某承担保证责任。下列关于当事人权利义务的表述中，正确的有（）。", "options": ["孙某承担保证责任后，有权向赵某进行追偿", "钱某应当先行使抵押权，再要求孙某承担保证责任", "孙某享有先诉抗辩权", "李某承担担保责任后，有权向赵某进行追偿1."], "answer": [0, 3], "explain": "（1）被担保的债权既有物的担保又有人的担保的，债务人不履行到期债务或者发 生当事人约定的实现担保物权的情形：①债权人应当按照约定实现债权。②没有约定或者约定 不明确，债务人自己提供物的担保的，债权人应当先就该物的担保实现债权；第三人提供物的 担保的，债权人可以就物的担保实现债权，也可以请求保证人承担保证责任。选项B 不当选； ③提供担保的第三人承担担保责任后，有权向债务人追偿。选项A、D 当选。（2）一般保证人 享有先诉抗辩权，连带责任保证人不享有先诉抗辩权。选项C 不当选。"}]}, "ch6": {"name": "金融法律制度", "questions": [{"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于票据的表述中，不正确的是（）。", "options": ["银行承兑汇票的出票人为银行", "汇票均属于委付票据", "付款人无需在票据上签章", "《票据法》中规定的票据，包括：汇票、本票和支票"], "answer": [0], "explain": "选项A，银行承兑汇票属于商业汇票，其出票人为“非银行单位”。"}, {"type": "multi", "year": "", "title": "甲公司签发一张商业汇票给乙公司，戊公司为保证人。乙公司将票据背书给丙公司，丙公司又将票据背书给丁公司。下列选项中，应当对丁公司承担票据责任的有（）。", "options": ["甲公司", "乙公司", "戊公司", "丙公司"], "answer": [0, 1, 2, 3], "explain": "商业汇票的出票人（甲公司）、背书人（乙公司、丙公司）和保证人（戊公司）， 在票据不获承兑或不获付款时承担付款清偿义务。"}, {"type": "single", "year": "", "title": "甲企业、乙企业签订了买卖合同，甲企业以乙企业为收款人开出一张票面金额为5 万元的银行承兑汇票，作为预付款交付于乙企业，乙企业接受汇票后将其背书转让给丙企业。后当事人因不可抗力解除该合同。下列关于甲企业的权利主张的表述中，符合票据法规定的是（）。", "options": ["甲企业有权要求乙企业返还汇票", "甲企业有权要求丙企业返还汇票", "甲企业有权请求付款银行停止支付", "甲企业有权要求乙企业返还5 万元预付款"], "answer": [3], "explain": "票据关系一经形成，就与基础关系相分离，基础关系是否存在、是否有效，对票 据关系都不起影响作用。甲企业是不能对抗丙企业的，但是可以要求乙企业返还与票据金额相 当的预付款。"}, {"type": "multi", "year": "", "title": "根据支付结算法律制度的规定，下列关于票据提示付款期限的说法中，正确的有（）。（2024 年）", "options": ["银行本票的提示付款期限自出票日起最长不超过6 个月", "支票的提示付款期限自出票日起10 日", "银行汇票的提示付款期限自出票日起1 个月", "商业汇票的提示付款期限自汇票到期日起10 日"], "answer": [1, 2, 3], "explain": "选项A，银行本票的提示付款期限自出票日起最长不得超过2 个月。"}, {"type": "single", "year": "", "title": "郑某持有一张出票日期为2023 年12 月14 日的现金支票。下列日期中，郑某提示付款时，银行有权拒绝付款的是（）。", "options": ["2023 年12 月14 日", "2023 年12 月18 日", "2023 年12 月23 日", "2023 年12 月25 日"], "answer": [3], "explain": "支票的提示付款期限自出票日起10 日内（2023 年12 月14 日起＋10 日＝2023 年 12 月24 日）。"}, {"type": "single", "year": "", "title": "根据支付结算法律制度的规定，下列关于票据权利时效的表述中，正确的是（）。（2019 年）", "options": ["持票人对支票出票人的权利自出票日起1 年", "持票人对银行汇票出票人的权利自出票日起2 年", "持票人对前手的追索权自被拒绝承兑或拒绝付款之日起2 年", "持票人对商业汇票承兑人的权利自到期日起1 年"], "answer": [1], "explain": "选项A，持票人对支票出票人的权利，自出票日起6 个月；选项C，持票人对前手 的追索权，自被拒绝承兑或者被拒绝付款之日起6 个月；选项D，持票人对承兑人的权利自票据 到期日起2 年。"}, {"type": "single", "year": "", "title": "2024 年2 月15 日，A 公司将一张银行承兑汇票背书转让给B 公司，B 公司于汇票到期日2024 年6 月15 日向付款人请求付款时遭到拒绝，B 公司向A 公司行使追索权的最后日期为（）。（2025 年）", "options": ["2024 年9 月15 日", "2024 年7 月15 日", "2024 年12 月15 日", "2024 年11 月15 日"], "answer": [2], "explain": "持票人对一般前手的首次追索权，自被拒绝承兑或者被拒绝付款之日起6 个月， 即从2024 年6 月15 日起算6 个月，则期限应为2024 年12 月15 日前。"}, {"type": "single", "year": "", "title": "张某因采购货物签发一张票据给王某，胡某从王某处窃取该票据，陈某明知胡某系窃取所得但仍受让该票据，并将其赠与不知情的黄某，下列取得票据的当事人中，享有票据权利的是（）。", "options": ["王某", "胡某", "陈某", "黄某"], "answer": [0], "explain": "持票人以欺诈、偷盗或者胁迫等手段取得票据的，或者明知有上述情形，出于恶 意取得票据的，不享有票据权利。胡某和陈某均不享有票据权利；因税收、继承、赠与可以依 法无偿取得票据的，票据权利不得优于其前手。黄某虽然是善意不知情的，但是其未支付合理 对价，其票据权利不优于其前手陈某，故黄某不享有票据权利。"}, {"type": "judge", "year": "", "title": "甲以背书方式将票据赠与乙，乙可以取得优于甲的票据权利。（）", "options": ["对", "错"], "answer": [1], "explain": "题目所述内容错误。票据的取得，应当给付票据双方当事人认可的相对应的代价； 如果是因为税收、继承、赠与行为依法无偿取得票据的，则不受给付对价的限制，但是所享有 的票据权利不得优于其前手的权利。因此乙的票据权利不得优于其前手（甲）。"}, {"type": "single", "year": "", "title": "根据支付结算法律制度的规定，下列票据丧失时不得挂失止付的是（）。", "options": ["已承兑的商业汇票", "未填明“现金”字样的银行本票", "支票", "填明“现金”字样和代理付款人的银行汇票"], "answer": [1], "explain": "只有确定付款人或代理付款人的票据丧失时才可进行挂失止付，具体包括“已承 兑的”商业汇票（选项A）、支票（选项C）、填明“现金”字样和代理付款人的银行汇票（选项 D）以及填明“现金”字样的银行本票四种。选项B，“未”填明“现金”字样的银行本票，不得 挂失止付。"}, {"type": "judge", "year": "", "title": "填明“现金”字样的银行本票丧失后，失票人不能申请公示催告。（）", "options": ["对", "错"], "answer": [0], "explain": "可以背书转让的票据丧失的，失票人可以申请公示催告。填明“现金”字样的银 行本票不得背书转让，因此不能申请公示催告。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于票据权利救济的表述，正确的是（）。（2024 年）", "options": ["失票人向法院提起普通诉讼，法院不得要求当事人提供担保", "挂失止付是票据丧失后票据权利补救的必经程序", "挂失止付后，失票人可以申请仲裁", "填明“现金”字样的银行汇票不能申请公示催告"], "answer": [3], "explain": "选项A：失票人向法院起诉时，人民法院应当根据案件的具体情况决定当事人是否 应当提供担保以及担保的数额。选项B：挂失止付并不是票据丧失后票据权利补救的必经程序。 选项C：票据补救措施包括挂失止付、公示催告、普通诉讼，不包括仲裁。"}, {"type": "judge", "year": "", "title": "甲没有代理权而以代理人名义在票据上签章，应由票面上显示的本人和甲连带承担票据责任。（）", "options": ["对", "错"], "answer": [1], "explain": "根据规定，没有代理权而以代理人名义在票据上签章的，由签章的无权代理人承 担票据责任。"}, {"type": "multi", "year": "", "title": "根据票据法律制度的规定，下列关于票据签章的表述中，正确的有（）。（2024 年）", "options": ["甲公司在商业承兑汇票上承兑时，应当加盖其预留银行的签章", "乙银行签发汇票时，应当加盖乙银行汇票专用章加其法定代表人或其授权的代理人的签名或盖章", "丙银行签发本票时，未加盖规定的本票专用章而加盖丙银行公章的，丙银行应承担票据责任", "丁公司签发支票时，未加盖与其在银行预留签章一致的财务专用章而加盖公司公章的，丁公司不承担票据责任"], "answer": [0, 1, 2], "explain": "选项D：支票的出票人在票据上未加盖与该单位在银行预留签章一致的财务专用章 而加盖该出票人公章的，签章人（丁公司）应当承担票据责任。"}, {"type": "single", "year": "", "title": "下列关于票据的伪造及责任承担的表述中，符合票据法律制度规定的是（）。", "options": ["持票人行使追索权时，在票据上的真实签章人可以票据伪造为由进行抗辩", "票据被伪造人应向持票人承担票据责任", "出票人假冒他人名义签发票据的行为属于票据伪造", "票据伪造人应向持票人承担票据责任"], "answer": [2], "explain": "（1）票据伪造的界定：假冒他人或虚构他人的名义进行出票行为（选项C）、假冒 他人名义进行出票行为之外的其他票据行为均属于票据伪造。（2）票据伪造的法律责任：①持 票人即使是善意取得，对被伪造人也不能行使票据权利（选项B）；②对伪造人而言，由于票据 上没有以自己名义所作的签章，因此也不承担票据责任（选项D）；③票据上有伪造签章的，不 影响票据上其他真实签章的效力（选项A）。"}, {"type": "single", "year": "", "title": "甲公司的财务工作人员吴某伪造甲公司印章，将甲公司持有的一张汇票背书转让给吴某本人担任法定代表人的乙公司。后吴某以乙公司的名义将该汇票背书转让给丙公司以支付工程款，丙公司又将该汇票背书转让给丁公司以支付货款。下列关于吴某伪造行为效力及相关当事人权利义务的表述正确的是（）。（2024 年）", "options": ["丁公司行使追索权时，丙公司可以票据伪造为由进行抗辩", "丁公司可以对吴某行使票据权利", "吴某伪造甲公司印章进行汇票背书转让的行为，不产生票据行为效力", "丁公司可以对甲公司行使票据权利"], "answer": [2], "explain": "选项A：票据上有伪造签章的，不影响票据上其他真实签章的效力；票据债权人在 依法提示承兑、提示付款或者行使追索权时，在票据上真实签章人不能以票据伪造为由进行抗 辩；选项B：伪造人吴某在票据上根本没有以自己名义签章，不承担票据责任；选项D：被伪造 人甲公司在票据上没有真实签章，不承担票据责任。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于票据伪造和变造的表述中，正确的是（）。（2025 年）", "options": ["票据上有伪造签章的，不影响票据上其他真实签章的效力", "不能辨别是在票据被变造之前或者之后签章的，视同变造后签章", "善意持票人可以向被伪造人主张行使票据权利", "持票人变更票据上的金额，不构成票据的变造"], "answer": [0], "explain": "票据上其他记载事项被变造的，在变造之前签章的人，对原记载事项负责；在变 造之后签章的人，对变造之后的记载事项负责；不能辨别是在票据被变造之前或者之后签章的， 视同在变造之前签章。选项B 不当选。被伪造签章者在票据上没有其真实意思表示，故被伪造 人不承担票据责任，即持票人即使是善意取得，对被伪造人也不能行使票据权利，选项C 不当 选。票据的变造是指无权更改票据内容的人，对票据上签章以外的记载事项加以变更的行为， 如变更票据上的到期日、付款日、付款地、金额等，选项D 不当选。"}, {"type": "single", "year": "", "title": "下列关于汇票的出票，说法正确的是（）。（2022 年）", "options": ["汇票的出票日期是相对记载事项", "出票时未记载付款日期的，票据无效", "出票时未记载付款地的，以付款人营业场所、住所地或经常居住地为付款地", "出票时未记载签发汇票原因的，汇票无效"], "answer": [2], "explain": "（1）选项A：汇票的出票日期是绝对记载事项；（2）选项B：汇票上未记载付款日 期的，视为见票即付；（3）选项D：签发票据的原因属于法律规定以外的记载事项，该记载事项 不具有汇票上的效力。"}, {"type": "judge", "year": "", "title": "背书人未记载被背书人名称即将票据交付他人，持票人在票据被背书人栏内记载自己名称，背书有效。（）", "options": ["对", "错"], "answer": [0], "explain": "背书人未记载被背书人名称即将票据交付他人的，持票人在票据被背书人栏内记 载自己的名称，与背书人记载具有同等法律效力。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于汇票背书的表述中，正确的是（）。（2023 年）", "options": ["背书附条件的，所附条件具有汇票上的效力", "出票人在汇票上记载“不得转让”字样，该汇票不得转让", "背书记载“委托收款”字样的，被背书人取得票据权利", "被拒绝承兑的汇票背书转让的，背书人不承担汇票责任"], "answer": [1], "explain": "背书附条件的，所附条件不具有汇票上的效力，背书有效，选项A 不当选；委托 收款背书属于非转让背书，被背书人只是代理人，未取得票据权利，背书人仍是票据权利人， 选项C 不当选；被拒绝承兑的汇票背书转让的，背书人应承担汇票责任，选项D 不当选。"}, {"type": "single", "year": "", "title": "下列关于背书的记载事项说法正确的是（）。（2022 年）", "options": ["背书未记载日期的，视为在汇票到期日前背书", "背书未记载日期的，视为在汇票到期日后背书", "背书附条件的，背书无效", "背书未记载日期的，背书无效"], "answer": [0], "explain": "（1）选项ABD：背书由背书人签章并记载背书日期，背书未记载日期的，视为在汇 票到期日前背书。（2）选项C：背书不得附条件，背书时附有条件的，所附条件不具有汇票上的 效力（背书有效）。"}, {"type": "multi", "year": "", "title": "根据票据法律制度的规定，下列情形中，不构成票据质押的有（）。", "options": ["出质人未在票据上记载“质押”字样，另行书面签订质押合同后，将票据背书交付给被背书人", "出质人在票据上背书记载“质押”字样并签章后，将票据交付给被背书人", "出质人在票据上只记载了“质押”字样，但未签章便将票据背书交付给被背书人", "出质人未在票据上记载“质押”字样，口头约定质押后，将票据背书交付给被背书人"], "answer": [0, 2, 3], "explain": "以票据设定质押时，出质人应当在票据上记载“质押”字样并签章，才构成票据质押。"}, {"type": "judge", "year": "", "title": "承兑附有条件的，不影响付款人对汇票的付款责任。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "付款人承兑汇票，不得附有条件；承兑附有条件的，视同拒绝承兑。本题表述错 误。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于汇票承兑行为的表述中，正确的是（）。（2022 年）", "options": ["出票后定期付款的汇票未按照法定期限提示承兑的，持票人丧失对除出票人以外的前手的追索权", "定日付款的汇票，持票人应当自出票日起一个月内向付款人提示承兑", "未记载付款日期的银行汇票必须提示承兑", "承兑附有条件的，所附条件不具有汇票上的效力"], "answer": [0], "explain": "（1）选项B：定日付款或者出票后定期付款的汇票，到期日前提示承兑。（2）选项 C：汇票上未记载付款日期的，视为见票即付，见票即付的票据无须提示承兑。（3）选项D：承 兑附有条件的，视为拒绝承兑。"}, {"type": "multi", "year": "", "title": "根据票据法律制度的规定，下列票据中，属于即期汇票的有（）。（2025 年）", "options": ["见票即付的汇票", "见票后定期付款的汇票", "未记载到期日的汇票", "到期日与出票日相同的汇票"], "answer": [0, 2, 3], "explain": "即期汇票是指见票即行付款的汇票，包括注明：见票即付的汇票、到期日与出票 日相同的汇票以及未记载到期日的汇票。选项A、C、D 当选。"}, {"type": "single", "year": "", "title": "2025 年6 月1 日，为支付货款，甲公司签发了一张由丙银行承兑的（纸质）汇票给乙公司。2025 年7 月1 日，乙公司为了采购原材料，与丁公司签订买卖合同。为支付货款，同日，乙公司将该汇票背书转让给丁公司。为了提升票据信用，乙公司应丁公司的要求，请戊公司提供票据保证，戊公司以保证人身份在汇票上进行了保证签章但未记载被保证人名称。根据票据法律制度的规定，该票据上的被保证人是（）。（2025 年）", "options": ["甲公司", "乙公司", "丙银行", "丁公司"], "answer": [2], "explain": "（纸质）商业汇票的保证人在汇票或者粘单上未记载被保证人的名称的，已承兑的 汇票，以承兑人为被保证人；未承兑的汇票，以出票人为被保证人。选项C 当选。"}, {"type": "multi", "year": "", "title": "甲公司签发并承兑了一张汇票给乙公司。乙公司将汇票背书转让给丙公司，并在汇票背面记载“不得转让”字样。丙公司又将汇票背书转让给丁公司。丁公司在向甲公司提示付款时遭到拒绝。下列关于该汇票的表述中，正确的有（）。", "options": ["甲公司不承担票据责任", "丁公司可以向丙公司行使追索权", "丁公司享有票据权利", "丁公司可以向乙公司行使追索权"], "answer": [1, 2], "explain": "持票人丁公司行使追索权时并无过错，因此可以追索出票人、背书人、承兑人、 保证人。但乙公司作为背书人在票据上记载了“不得转让”字样，作为其后手被背书人的丁公 司无法对其发起追索。综上丁公司可以追索甲公司和丙公司。选项B、C 当选。"}, {"type": "multi", "year": "", "title": "根据支付结算法律制度的规定，持票人持到期的商业汇票提示付款被拒绝后，下列关于持票人行使追索权的说法中，正确的有（）。", "options": ["持票人行使追索权时，应当提供被拒绝付款的有关证明", "持票人应当自收到被拒绝付款的有关证明之日起3 日内，将被拒绝事由书面通知其前手", "持票人可以向任意前手进行追索", "持票人只能按照票据债务人的先后顺序对前手进行追索"], "answer": [0, 1, 2], "explain": "选项D，持票人行使追索权，可以“不按照”票据债务人的先后顺序，对其中任何 一人、数人或者全体行使追索权。"}, {"type": "multi", "year": "", "title": "根据支付结算法律制度的规定，下列各项中，票据持票人行使首次追索权时，可以请求被追索人支付的金额和费用有（）。", "options": ["因汇票资金到位不及时，给持票人造成的税收滞纳金损失", "取得有关拒绝证明和发出通知书的费用", "票据金额自到期日或者提示付款日起至清偿日止，按规定的利率计算的利息", "被拒绝付款的票据金额"], "answer": [1, 2, 3], "explain": "持票人行使首次追索权时，追索的内容包括：（1）被拒绝付款的票据金额；（2） 票据金额从到期日或者提示付款日起至清偿日止，按照中国人民银行规定的利率计算的利息；（3） 取得有关拒绝证明和发出通知书的费用。选项B、C、D 当选。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列有关本票的表述中，不正确的是（）。", "options": ["本票自出票日起，最长付款期限为3 个月", "无条件支付的承诺是绝对记载事项之一", "本票无须承兑", "我国的本票仅限于银行本票，且为记名本票"], "answer": [0], "explain": "银行本票的付款期限自出票之日起最长不得超过2 个月。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于支票的说法中，正确的是（）。（2025 年）", "options": ["支票的出票人可以记载自己为收款人", "支票出票时无须记载出票日期", "出票时未记载付款人名称的，可以授权补记", "出票时未印有“现金”或“转账”字样的，不得支取现金"], "answer": [0], "explain": "支票的绝对记载事项包括：表明“支票”的字样、无条件支付的委托、确定的金 额、付款人名称、出票日期、出票人签章，选项B 不当选。支票的金额、收款人名称可以由出 票人授权补记，付款人名称不能授权补记，选项C 不当选。支票上未印有“现金”或“转账” 字样的为普通支票，普通支票可用于支取现金，也可用于转账，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据票据法律制度的规定，下列关于支票上记载事项的表述中，可以授权补记的有（）。（2024 年）", "options": ["出票日期", "付款人名称", "支票金额", "收款人名称"], "answer": [2, 3], "explain": "支票上的金额和收款人名称可以授权补记。选项C、D 当选。"}, {"type": "single", "year": "", "title": "根据票据法律制度的规定，下列关于支票记载事项的表述中，正确的是（）。", "options": ["支票上未记载付款日期的，该票据无效", "支票上未记载付款地的，出票人的营业场所为付款地", "支票上未记载出票日期的，该票据无效", "支票的出票人不得记载“不得转让”字样"], "answer": [2], "explain": "（1）选项A：支票限于见票即付，不得另行记载付款日期；另行记载付款日期的， 该记载无效，支票有效；（2）选项B：支票上未记载付款地的，以付款人（而非出票人）的营业 场所为付款地；（3）选项D：支票的出票人可以在票据上记载“不得转让”字样，出票人在票据 上记载“不得转让”字样的，该票据不得转让。"}, {"type": "judge", "year": "", "title": "投保人的告知义务不限于保险人询问的范围和内容。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "投保人的告知义务仅限于保险人询问的范围和内容。本题表述错误。"}, {"type": "single", "year": "", "title": "张某为其妻子李某投保时，隐瞒李某健康状况。李某真实健康状况不符合保险合同约定的投保条件。保险合同生效后60 天，李某因隐瞒的疾病死亡。下列关于投保人违反告知义务后果的表述中，正确的是（）。（2020 年）", "options": ["保险人有权解除合同，且不退还保险费", "保险人有权解除合同，但应退还保险费", "保险人不可以解除合同，但可以要求投保人承担违约责任", "保险人不可以解除合同，且应当给付保险金"], "answer": [0], "explain": "投保人故意不履行如实告知义务的，保险人对于解除合同前发生的保险事故，不 承担赔偿或给付保险金的责任，并不退还保费。"}, {"type": "single", "year": "", "title": "李某的健康状况不符合保险合同约定的投保条件且足以影响承保决定，但李某的父亲为其投保时，故意隐瞒该情况。保险合同生效后3 年，李某因所隐瞒的疾病死亡。有关本案的下列说法中，正确的是（）。（2023 年）", "options": ["保险人有权解除合同，但应退还保险费", "保险人不得解除合同，且应当给付保险金", "保险人有权解除合同，且不退还保险费", "保险人不得解除合同，但可以要求投保人承担违约责任"], "answer": [1], "explain": "保险人解除合同的权利，自保险人知道有解除事由之日起，超过30 日不行使而消 灭；合同成立之日起超过2 年的，保险人不得解除合同。发生保险事故的，保险人应当承担赔 偿或者给付保险金的责任。选项B 当选。"}, {"type": "single", "year": "", "title": "有关投保人申报的被保险人年龄不真实，并且其真实年龄不符合合同约定的年龄限制时，保险人可否解除合同的下列表述中，正确的是（）。", "options": ["可以解除合同，并退还保险费", "可以解除合同，并要求投保人承担违约责任", "可以解除合同，并按照合同约定退还保险单的现金价值", "不可以解除合同，但可要求投保人按照真实年龄调整保险费"], "answer": [2], "explain": "“真实年龄不符合合同约定的年龄限制”即突破承保年龄底限：不赔保险金、不 退保险费，但退保单的现金价值。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，投保人在订立保险合同时故意或因重大过失未履行如实告知义务，足以影响保险人决定是否同意承保或提高保险费率的，保险人有权解除合同，保险人解除合同的权利，自保险人知道有解除事由之日起超过一定期限不行使而消灭，该期限为（）。", "options": ["1 年", "30 日", "2 年", "3 个月"], "answer": [1], "explain": "保险人的合同解除权，自保险人“知道有解除事由”之日起，超过30 日不行使而 消灭。“自合同成立之日起”超过2 年的（一直不知道），保险人不得解除合同，发生保险事故 的，保险人应当承担赔偿或者给付保险金的责任。"}, {"type": "multi", "year": "", "title": "根据《保险法》的规定，人身保险的投保人在订立保险合同时，对某些人员具有保险利益。该人员包括（）。", "options": ["投保人的妻子", "投保人的姐姐", "投保人的员工", "投保人的同学"], "answer": [0, 2], "explain": "选项B，姐姐属于“近亲属”，因此必须具有“三养关系”才属于保险利益人，本 题中并未提及“三养关系”，因此不能成为保险利益人；选项D，同学属于“其他方”，因此必 须“征得其同意”才属于保险利益人，本题中并未提及“同意”，因此不能成为保险利益人。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列关于保险利益的表述中，正确的有（）。", "options": ["财产保险的被保险人在保险事故发生时，对保险标的应当具有保险利益", "人身保险的投保人在保险合同订立时，对被保险人应当具有保险利益", "保险利益必须是确定的、客观存在的利益，包括现有利益和期待利益", "保险利益必须是得到法律认可和保护的合法利益"], "answer": [0, 1, 2, 3], "explain": "上述选项均为正确表述。"}, {"type": "multi", "year": "", "title": "下列以死亡为给付保险金条件的人身保险合同中，无效的有（）。", "options": ["父母未征得2 周岁的儿子的同意并认可保险金额为其购买的保险", "父母未征得28 周岁的女儿的同意并认可保险金额为其购买的保险", "丈夫已征得不能辨认自己行为的妻子的同意并认可保险金额为其购买的保险", "丈夫已征得不能完全辨认自己行为的妻子的同意并认可保险金额为其购买的保险"], "answer": [1, 2], "explain": "选项BD：以死亡为给付保险金条件的合同，未经被保险人同意并认可保险金额的， 保险合同无效，父母为其未成年的子女投保的人身保险，不受此限；选项AC：投保人不得为无 民事行为能力人投保以死亡为给付保险金条件的人身保险，保险人也不得承保，父母为其未成 年的子女投保的人身保险，不受此限。"}, {"type": "single", "year": "", "title": "李某为其母亲赵某投保人寿险，在确定具体受益人时李某与赵某发生了分歧。下列关于如何确定受益人的表述中，符合保险法律制度规定的是（）。", "options": ["受益人只能是李某", "受益人只能是赵某", "受益人可以由李某指定，但必须经赵某同意", "受益人只能由赵某指定"], "answer": [2], "explain": "人身保险合同的受益人由被保险人或者投保人指定，但投保人指定受益人的，应 当经被保险人同意。"}, {"type": "judge", "year": "", "title": "投保人或者被保险人变更受益人未通知保险人，保险人主张变更对其不发生效力的，人民法院应予支持。（）", "options": ["对", "错"], "answer": [0], "explain": "题干表述正确。"}, {"type": "multi", "year": "", "title": "张某与保险公司拟签订一份人身保险合同，合同约定张某为投保人和受益人，张某的妻子王某为被保险人。下列关于相关当事人权利义务的表述中，正确的有（）。（2022 年）", "options": ["若王某同意张某作为受益人，应认定为王某同意张某为其订立保险合同并认可保险金额", "若张某将保险受益人变更为王某的女儿，无须经王某同意", "若保险合同约定以王某死亡为给付保险金的条件，未经王某书面同意，保险单不得质押", "若保险合同约定以王某死亡为给付保险金的条件，王某可以在合同订立时采取口头形式同意并认可保险金额"], "answer": [0, 2, 3], "explain": "（1）有下列情形之一的，应认定为被保险人同意投保人为其订立保险合同并认可 保险金额：①被保险人明知他人代其签名同意而未表示异议的；②被保险人同意投保人指定的 受益人的；③有证据足以认定被保险人同意投保人为其投保的其他情形。选项A 当选；（2）投 保人变更受益人时也须经被保险人同意，选项B 不当选；（3）按照以死亡为给付保险金条件的 合同所签发的保险单，未经被保险人书面同意，不得转让或质押，选项C 当选；（4）当事人订 立以死亡为给付保险金条件的合同，被保险人可以在合同订立时采取书面形式、口头形式或者 其他形式同意并认可保险金额，也可以在合同订立后追认，选项D 当选。"}, {"type": "single", "year": "", "title": "王某为自己的母亲购买人身保险，约定王某的父亲为受益人。保险期间发生车祸导致王母与王父都死亡，无法确定谁死亡在先。下列各项中，关于保险金的处理正确的是（）。（2025 年）", "options": ["该保险金作为王某母亲的遗产处理", "该保险金作为王某父亲的遗产处理", "该保险金由王某一人继承", "该保险金由王某的奶奶、外婆各自继承"], "answer": [0], "explain": "受益人与被保险人在同一事件中死亡，且不能确定死亡先后顺序的，推定受益人 死亡在先。受益人先于被保险人死亡，没有其他受益人的，保险金作为被保险人（王某的母亲） 的遗产，由保险人依照《民法典》的规定履行给付保险金的义务。选项A 当选。"}, {"type": "single", "year": "", "title": "投保人甲与保险公司订立人身保险合同，甲为被保险人，并指定其妻子和儿子为受益人。保险期间内，甲与妻子因交通事故意外身亡，且不能确定死亡时间的先后顺序。根据保险法律制度的规定，关于保险金的处理，下列正确的是（）。", "options": ["不作为遗产，全部由甲的儿子作为受益人享有", "作为遗产，继承人为甲的妻子和儿子", "作为遗产，继承人为甲的妻子", "保险公司无需支付保险金"], "answer": [0], "explain": "（1）受益人与被保险人在同一事件中死亡，且不能确定死亡先后顺序的，推定受 益人死亡在先；在本题中，被保险人甲与受益人之一甲妻在同一事件中死亡，不能确定死亡先 后顺序，应当推定甲妻死亡在先。（2）受益人先于被保险人死亡，没有其他受益人的，保险金 作为被保险人的遗产，由保险人依照《民法典》的规定履行给付保险金的义务；在本题中，虽 然推定甲妻死亡在先，但存在另一受益人甲儿，保险金不作为甲的遗产处理。（3）部分受益人 在保险事故发生前死亡，未约定受益顺序和受益份额的，由其他受益人平均享有；在本题中， 由于受益人只剩下甲儿一人，全部保险金将归甲儿一人享有。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，保险金在一定情形下作为被保险人遗产。下列各项中，属于该情形的有（）。", "options": ["唯一受益人放弃受益权", "受益人指定不明无法确定", "唯一受益人故意造成被保险人死亡", "唯一受益人先于被保险人死亡"], "answer": [0, 1, 2, 3], "explain": "（1）受益人故意造成被保险人死亡、伤残、疾病的，或者故意杀害被保险人未遂 的，该受益人丧失受益权。（2）被保险人死亡后，有下列情形之一的，保险金作为被保险人的 遗产：①没有指定受益人，或者受益人指定不明无法确定的（选项B）；②受益人先于被保险人 死亡，没有其他受益人的（选项D）；③受益人依法丧失受益权或者放弃受益权，没有其他受益 人的（选项AC）。"}, {"type": "multi", "year": "", "title": "下列有关保险合同特征的表述中，正确的有（）。", "options": ["保险合同是实践合同", "保险合同是最大诚信合同", "保险合同是双务有偿合同", "保险合同是射幸合同"], "answer": [1, 2, 3], "explain": "保险合同是：（1）最大诚信合同；（2）诺成合同；（3）双务有偿合同；（4）射幸 合同；（5）格式合同。选项B、C、D 当选。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，以保险标的的保险价值是否先予确定为标准，保险合同可以划分为（）。", "options": ["特定危险保险合同和一切险保险合同", "定值保险合同和不定值保险合同", "足额保险合同、不足额保险合同和超额保险合同", "人身保险合同和财产保险合同"], "answer": [1], "explain": "以保险标的的保险价值是否先予确定为标准，保险合同可以划分为定值保险合同 和不定值保险合同。"}, {"type": "single", "year": "", "title": "根据《保险法》的规定，保险人对保险合同中的免责条款未作提示或者未明确说明的，该免责条款（）。", "options": ["不产生效力", "效力待定", "可撤销", "可变更"], "answer": [0], "explain": "对保险人的免责条款，保险人在订立合同时应以书面或者口头形式向投保人说明， 未作提示或者未明确说明的，该条款不产生效力。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，采用保险人提供的格式条款订立的保险合同，保险人与投保人、被保险人或者受益人对格式条款有争议的，应当适用的解释规则是（）。", "options": ["按照有利于投保人解释", "按照有利于保险人解释", "按照有利于被保险人或者受益人解释", "按照通常理解解释"], "answer": [3], "explain": "采用保险人提供的格式条款订立的保险合同，保险人与投保人、被保险人或者受 益人对合同条款有争议的，应当按照通常理解予以解释。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，保险人与投保人、被保险人或者受益人对保险合同条款有两种以上解释的，人民法院或仲裁机构应当作出有利于（）的解释。", "options": ["保险人", "投保人", "被保险人", "受益人"], "answer": [2, 3], "explain": "采用保险人提供的格式条款订立的保险合同，对合同条款有两种以上解释的，人 民法院或仲裁机构应当作出有利于被保险人和受益人的解释。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，保险合同记载的内容不一致时，下列关于内容认定规则的表述中，正确的是（）。", "options": ["保险凭证记载的时间不同的，以形成时间在前的为准", "保险凭证存在手写和打印两种方式的，以打印部分的内容为准", "投保单与保险单不一致，且不一致的情形未经投保人同意的，以保险单为准", "非格式条款与格式条款不一致的，以非格式条款为准"], "answer": [3], "explain": "保险凭证记载的时间不同的，以形成时间在后的为准，选项A 错误；保险凭证存 在手写和打印两种方式的，以双方签字、盖章的手写部分的内容为准，选项B 错误；投保单与 保险单或者其他保险凭证不一致的，以投保单为准，但不一致的情形系经保险人说明并经投保 人同意的，以投保人签收的保险单或者其他保险凭证载明的内容为准，选项C 错误。"}, {"type": "single", "year": "", "title": "根据《保险法》的规定，下列关于保险合同成立时间的表述中，正确的是（）。", "options": ["投保人支付保险费时，保险合同成立", "保险人签发保险单时，保险合同成立", "保险代理人签发暂保单时，保险合同成立", "投保人提出保险要求，保险人同意承保时，保险合同成立"], "answer": [3], "explain": "投保人提出保险要求，经保险人同意承保，保险合同成立。"}, {"type": "judge", "year": "", "title": "某保险公司的代理人周某向刘某推介一款保险产品，刘某认为不错，于是双方约定了签订合同的时间。订立保险合同时，刘某无法亲自到场签字，就由周某代为签字。后刘某交纳了保险费。此时，应视为刘某对周某代签字行为的追认。（）", "options": ["对", "错"], "answer": [0], "explain": "投保人或者投保人的代理人订立保险合同时没有亲自签字或者盖章，而由保险人 或者保险人的代理人代为签字或者盖章的，对投保人不生效。但投保人已经交纳保险费的，视 为其对代签字或者盖章行为的追认。"}, {"type": "single", "year": "", "title": "甲保险公司的代理人张某向王某推销一款保险产品，王某符合该保险的承保条件。张某向王某出具了一份投保单，王某口头同意投保，张某代替王某在投保单上签字，王某向甲保险公司缴纳了保险费。由于内部工作流程问题，甲保险公司迟迟未向王某签发保险单，后在保险期间发生了保险事故。下列关于保险合同效力及保险责任的表述中，正确的是（）。", "options": ["王某已经缴纳保险费，甲保险公司应当承担保险责任", "保险合同未生效，甲保险公司无须承担责任", "张某代替王某签字，该合同对王某不生效", "张某代替签字有过错，应当承担对王某的保险责任"], "answer": [0], "explain": "投保人或者投保人的代理人订立保险合同时没有亲自签字或者盖章，而由保险人 或者保险人的代理人代为签字或者盖章的，对投保人不生效。但投保人已经交纳保险费的，视 为其对代签字或者盖章行为的追认。王某缴纳保费的行为，视为其对张某代签字的追认，因此 保险合同成立并生效。因此，保险人（保险公司）应承担保险责任。"}, {"type": "multi", "year": "", "title": "有关人寿保险合同宽限期的下列说法中，符合保险法律制度规定的有（）。", "options": ["当事人以被保险人已经代为支付保险费为由，主张投保人对应的交费义务已经履行的，人民法院应予支持", "超过宽限期仍未支付当期保险费的，保险人可以按照合同约定的条件减少保险金额的支付", "投保人在宽限期内未支付保险费的，保险人有权通过诉讼的方式要求投保人支付保费", "被保险人在宽限期内发生保险事故的，保险人有权解除合同，但应退还现金价值"], "answer": [0, 1], "explain": "（1）选项A：当事人以被保险人、受益人或者他人已经代为支付保险费为由，主张 投保人对应的交费义务已经履行的，人民法院应予支持；（2）选项C：对于人寿保险的保险费， 保险人不得用诉讼方式要求投保人支付；（3）选项BD：被保险人在宽限期内发生保险事故的， 保险人应当按照合同约定给付保险金，但可以扣减欠交的保险费。"}, {"type": "multi", "year": "", "title": "王某为自己投保某款人寿保险，保险合同中未单独载明宽限期条款。王某按约定缴纳第一年保险费后，第二年因工作变动导致经济困难，未能按时缴纳当期保险费，保险公司随后向王某发出缴费催告通知。下列关于本案的说法中，符合《保险法》规定的有（）。（2025 年）", "options": ["王某享有自保险公司催告之日起30 日的宽限期，宽限期内保险合同仍有效", "若王某在催告后超过30 日仍未缴纳保险费，该人寿保险合同直接失效", "若王某在宽限期内不幸发生保险事故，保险公司应按保险合同约定赔偿保险金，但有权从中扣除王某欠缴的当期保险费", "若王某明确表示第二年不再缴纳保险费，保险公司应立即退还该人寿保险单的现金价值"], "answer": [0, 2], "explain": "合同约定分期支付保险费，投保人支付首期保险费后，除合同另有约定外，投保 人自保险人催告之日起超过30 日未支付当期保险费，或者超过约定的期限60 日未支付当期保 险费的，合同效力中止，或者由保险人按照合同约定的条件减少保险金额。选项A 当选，选项B 不当选。被保险人在宽限期内发生保险事故的，保险人应当按照合同约定给付保险金，但可以 扣减欠交的保险费。选项C 当选。自合同效力中止之日起满2 年双方未达成协议的，保险人有 权解除合同。保险人解除合同的，应当按照合同约定退还保险单的现金价值。选项D 不当选。"}, {"type": "judge", "year": "", "title": "保险事故发生后，被保险人为防止或者减少保险标的的损失所支付的必要的、合理的费用，由受益人承担。（）（2024 年）", "options": ["对", "错"], "answer": [1], "explain": "保险事故发生后，被保险人为防止或者减少保险标的的损失所支付的必要的、合 理的费用，由保险人承担。本题表述错误。"}, {"type": "single", "year": "", "title": "甲公司购进一台价值120 万元的机器设备，向保险公司投保。保险合同约定保险金额为60 万元，但未约定保险金的计算方法，后保险期间发生了保险事故，造成该设备实际损失80 万元；甲公司为防止损失的扩大，花费了6 万元施救费。根据保险法律制度的规定，保险公司应当支付给甲公司的保险金的数额是（）。", "options": ["46 万元", "60 万元", "80 万元", "86 万元"], "answer": [0], "explain": "根据规定，保险金额低于保险价值的，除合同另有约定外，保险人按照保险金额 与保险价值的比例承担赔偿保险金的责任。本题保险金额与保险价值的比例是1：2，保险公司 应该承担保险赔偿金80×1/2＝40 万元，甲公司为防止损失的扩大，花费了6 万元施救费也由 保险人承担，所以保险公司应当支付给甲公司的保险金的数额是40＋6＝46（万元）。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，商业责任险的被保险人向保险人请求赔偿保险金的诉讼时效期间的起算时间是（）。（2025 年）", "options": ["保险事故发生之日", "被保险人知道或者应当知道保险事故发生之日", "第三者要求被保险人赔偿之日", "被保险人对第三者应负的赔偿责任确定之日"], "answer": [3], "explain": "商业责任险的被保险人请求赔偿保险金的诉讼时效期间，自被保险人对第三者应 负的赔偿责任确定之日起计算。选项D 当选。"}, {"type": "single", "year": "", "title": "人寿保险的被保险人或者受益人向保险人请求给付保险金的诉讼时效期限为（）年。（2024 年）", "options": ["2", "3", "4", "5"], "answer": [3], "explain": "人寿保险的被保险人或者受益人向保险人请求给付保险金的诉讼时效期限为5 年。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列关于被保险人和受益人向保险人索赔的诉讼时效的表述中，正确的有（   ）。（2023 年）", "options": ["人寿保险的被保险人或受益人索赔的诉讼时效期间为5 年", "人寿保险以外的其他保险的被保险人或者受益人索赔的诉讼时效期间为2 年", "人寿保险的被保险人或者受益人，索赔的诉讼时效期间自其知道或者应当知道保险事故发生之日起计算", "商业责任险的被保险人索赔的诉讼时效期间自保险事故发生之日起计算"], "answer": [0, 1, 2], "explain": "商业责任险的被保险人向保险人请求赔偿保险金的诉讼时效期间，自被保险人对 第三者应负的赔偿责任确定之日起计算。选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列关于保险合同变更的表述中，正确的有（）。（2024 年）", "options": ["在财产保险合同中，货物运输保险合同允许保险单随货物所有权的转移而转移，只需投保人背书即可转让", "在人身保险合同中，因投保人未依照约定支付保险费而导致合同效力中止，经投保人与保险人协商达成协议并补交保费后，合同效力恢复", "在人身保险合同中，被保险人在保险事故发生后变更受益人，变更后的受益人无权请求保险人支付保险金", "在人身保险合同中，投保人变更受益人的，无需通知保险人即可对其生效"], "answer": [0, 1, 2], "explain": "选项D：在人身保险合同中，被保险人或者投保人可以变更受益人，但需要书面通 知保险人。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列保险合同中，保险责任开始后，合同当事人均不得解除合同的有（）。（2022 年）", "options": ["汽车保险合同", "货物运输保险合同", "人身保险合同", "运输工具航程保险合同"], "answer": [1, 3], "explain": "货物运输保险合同和运输工具航程保险合同，其保险责任开始后，合同当事人不 得解除合同。"}, {"type": "judge", "year": "", "title": "财产保险合同责任开始前，投保人要求解除合同的，应当按照合同约定向保险人支付手续费，保险人应当退还保险费。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "财产保险合同责任开始前，投保人要求解除合同的，应当按照合同约定向保险人 支付手续费，保险人应当退还保险费。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，下列不属于保险人可以单方解除合同的情形是（）。（2024 年）", "options": ["被保险人未按照合同约定履行其对保险标的的安全应尽责任的", "受益人谎称发生了保险事故，向保险人提出给付保险金请求的", "被保险人故意制造保险事故的，保险人有权解除合同", "自人身保险合同效力中止之日起1 年内保险合同当事人未达成协议恢复合同效力的，保险人有权解除合同"], "answer": [3], "explain": "选项D：自人身保险合同效力中止之日起2 年内保险合同当事人未达成协议恢复合 同效力的，保险人有权解除合同。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列属于保险人可以单方解除合同的情形有（）。", "options": ["投保人故意隐瞒与保险标的有关的重要事实，未履行如实告知义务的", "投保人谎称发生保险事故的", "投保人在保险标的的危险程度显著增加时未按照合同约定及时通知保险人的", "投保人对保险事故的发生有重大过失的"], "answer": [0, 1, 2], "explain": "本题考核保险合同的解除。选项A：投保人故意或者因重大过失未履行前款规定的 如实告知义务，足以影响保险人决定是否同意承保或者提高保险费率的，保险人有权解除合同。 选项B：未发生保险事故，被保险人或者受益人谎称发生了保险事故，向保险人提出赔偿或者给 付保险金请求的，保险人有权解除合同。选项C：在合同有效期内，保险标的的危险程度显著增 加的，被保险人未按照合同约定及时通知保险人，保险人可以解除合同。选项D 不是保险人解 除合同的法定事由。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列关于重复保险的表述中，正确的有（）。（2025 年）", "options": ["投保人无须将重复保险的有关情况通知各保险人", "除合同另有约定外，各保险人按照其保险金额与保险金额总和的比例承担赔偿保险金的责任", "重复保险是否成立的判断时点是保险事故发生时", "投保人就保险金额总和超过保险价值的部分，不得请求返还保费"], "answer": [1, 2], "explain": "重复保险的投保人应当将重复保险的有关情况通知各保险人，选项A 不当选；重 复保险的投保人可以就保险金额总和超过保险价值的部分，请求各保险人按比例返还保险费， 选项D 不当选。"}, {"type": "single", "year": "", "title": "甲为其生产设备购买财产保险。该生产设备价值100 万元，甲为其分别向A、B 两家保险公司投保，保险金额均为120 万元。之后，该生产设备因为当地发生火灾而全部损失。已知当事人之间对于保险责任的分摊和承担顺位并无特别约定。根据保险法律制度的规定，以下说法中正确的是（）。", "options": ["甲可以要求A 保险公司或者B 保险公司向其赔付100 万元", "由于两份保险的保险金额均超过保险价值，两份保险均无效", "甲可以要求A、B 保险公司各赔付50 万元，但A、B 保险公司无须退还保费", "甲可以要求A、B 保险公司各赔付50 万元，A、B 保险公司应退还部分保费"], "answer": [3], "explain": "首先，甲为该生产设备购买的两份保险，其保险金额之和（240 万元）超过保险价 值（100 万元），属于重复保险。重复保险并不是保险合同无效的事由，选项B 所述错误。其次， 重复保险发生时，除合同另有约定外，各保险人按照其保险金额与保险金额总和的比例承担赔 偿保险金的责任。A、B 保险公司各自保险金额与保险金额总和的比例均为1/2。由于各方对于 重复保险中保险责任的分摊和承担顺位并无特别约定，A、B 保险公司均应承担50 万元保险金的 赔偿责任，选项A 所述错误。最后，重复保险的投保人可以就保险金额总和超过保险价值的部 分，请求各保险人按比例返还保险费，选项C 所述错误，选项D 所述正确。"}, {"type": "single", "year": "", "title": "根据保险法律制度的规定，下列关于代位求偿权的表述中，错误的是（）。（2025 年）", "options": ["代位求偿权产生于保险人支付保险金之后", "保险人应以被保险人的名义行使代位求偿权", "代位求偿权的诉讼时效期间自取得代位求偿权之日起算", "保险人应在赔偿金额范围内行使代位求偿权"], "answer": [1], "explain": "保险人应以自己的名义行使保险代位求偿权。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据保险法律制度的规定，下列有关保险代位求偿权的表述中，正确的有（）。", "options": ["保险人未赔偿保险金之前，被保险人放弃对第三人请求赔偿的权利的，保险人不承担赔偿保险金的责任", "保险人向被保险人赔偿保险金后，被保险人未经保险人同意放弃对第三人请求赔偿的权利的，该放弃行为无效", "因被保险人故意致使保险人不能行使代位请求赔偿的权利的，保险人可以扣减或者要求返还相应的保险金", "即使被保险人的家庭成员故意损害保险标的而造成保险事故，保险人也不得对被保险人的家庭成员行使代位求偿权"], "answer": [0, 1, 2], "explain": "选项D：除被保险人的家庭成员或者其组成人员“故意”对保险标的损害而造成保 险事故外，保险人不得对被保险人的家庭成员或者其组成人员行使代位请求赔偿的权利。"}, {"type": "single", "year": "", "title": "陈某向甲保险公司投保，陈某为被保险人，陈某指定何某为唯一受益人，保险期间，陈某和何某乘车出行时，被企图变道的货车撞击导致二人当场死亡，经有关部门调查确认，无法确定陈某、何某二人死亡时间的先后顺序，货车司机梁某对事故的发生承担全部责任。下列表述正确的是（）。（2024 年）", "options": ["保险金全部由陈某的继承人继承", "保险金由何某的继承人继承", "保险金由陈某和何某继承人平均分配", "甲保险公司承担保险责任后对梁某享有代位求偿权"], "answer": [0], "explain": "受益人与被保险人在同一事件中死亡，且不能确定死亡先后顺序的，推定受益人 死亡在先。受益人先于被保险人死亡，没有其他受益人的，保险金作为被保险人的遗产，由保 险人依照继承法的规定履行给付保险金的义务，选项A 当选，选项B、C 不当选；财产保险合同 中，因第三者对保险标的的损害而造成保险事故的，保险人自向被保险人赔偿保险金之日起， 在赔偿金额范围内代位行使被保险人对第三者请求赔偿的权利。题目中是人身保险合同，不适 用代位求偿权，选项D 不当选。"}, {"type": "judge", "year": "", "title": "因被保险人张某抗拒依法采取的刑事强制措施致其自身伤残的，保险人应承担给付保险金的责任。（）", "options": ["对", "错"], "answer": [1], "explain": "因被保险人故意犯罪或者抗拒依法采取的刑事强制措施导致其伤残或者死亡的， 保险人不承担给付保险金的责任。投保人已交足2 年以上保险费的，保险人应当按照合同约定 退还保险单的现金价值。"}, {"type": "single", "year": "", "title": "2023 年刘某为自己投保人寿保险，并指定其妻宋某为受益人。2025 年刘某实施抢劫时被他人捅死。事后，宋某请求保险公司支付保险金遭到拒绝。经查，刘某已缴纳3年保险费。下列关于保险公司是否承担支付保险金责任的表述中，符合保险法律制度规定的是（）。", "options": ["保险公司应承担支付保险金的责任", "保险公司不承担支付保险金的责任，也不退还保险单的现金价值", "保险公司不承担支付保险金的责任，但应退还保险单的现金价值", "保险公司不承担支付保险金的责任，但应退还保险费"], "answer": [2], "explain": "被保险人故意犯罪或者抗拒依法采取的刑事强制措施导致其伤残或者死亡的，保 险人不承担给付保险金的责任。投保人已交足2 年以上保险费的，保险人应当按照合同约定退 还保险单的现金价值。"}, {"type": "multi", "year": "", "title": "2024 年10 月，赵某为其儿子小赵购买了一份以死亡为给付保险金条件的人身保险，2025 年4 月，小赵因失恋自杀身亡，赵某请求保险公司给付保险金。已知：小赵自杀时具有完全民事行为能力。下列关于保险公司承担责任的表述中，正确的有（）。", "options": ["保险公司应按照合同约定退还保险单的现金价值", "保险公司应承担给付保险金的责任", "保险公司应退还已缴纳的保险费", "保险公司不承担给付保险金的责任"], "answer": [0, 3], "explain": "以被保险人死亡为给付保险金条件的合同，自合同成立之日起2 年内，被保险人 自杀的，保险人不承担给付保险金的责任，但被保险人自杀时为无民事行为能力人的除外。保 险人依照规定不承担给付保险金责任的，应当按照合同约定退还保险单的现金价值。本题中， 赵某购买保险的时间为2024 年10 月，被保险人小赵自杀的时间为2025 年4 月，不满2 年，且 小赵自杀时为完全民事行为能力人，因此保险公司不承担给付保险金责任但应退还保险单的现 金价值。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，在我国境内发行下列证券时，应当适用《证券法》的有（）。", "options": ["公司债券", "股票", "政府债券", "存托凭证"], "answer": [0, 1, 3], "explain": "选项C：上市交易应当适用《证券法》，发行不适用。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，下列属于证券公开发行情形的有（）。", "options": ["向不特定对象发行证券的", "向累计不超过200 人的不特定对象发行证券的", "向累计不超过200 人的特定对象发行证券的", "采取电视广告方式发行证券的"], "answer": [0, 1, 3], "explain": "有下列情形之一的，为公开发行：（1）向不特定对象发行证券的；（2）向特定对 象发行证券累计超过200 人的，但依法实施员工持股计划的员工人数不计算在内；（3）法律、 行政法规规定的其他发行行为。非公开发行证券，不得采用广告、公开劝诱和变相公开方式。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，对于申请在科创板公开发行股票并上市的公司，作出同意或者不同意股票公开发行并上市的审核意见的是", "options": ["保荐人", "证券业协会", "证券交易所", "证监会"], "answer": [2], "explain": "股票公开发行已经实施全面注册制，发行人依法由保荐人保荐并向交易所申报， “交 易所”形成审核意见后报中国证监会依法履行发行注册程序。"}, {"type": "single", "year": "", "title": "甲股份有限公司拟首次公开发行股票并在科创板上市，依法经上海证券交易所发行上市审核后报送中国证监会发行注册，中国证监会同意注册并作出决定。该同意注册决定的有效期为（）。", "opti 选项D 不当选。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列关于非公开募集基金的表述中，正确的是（）。（2024 年改编）", "options": ["基金业协会负责非公开募集基金发行的行政审批", "非公开募集基金可以向投资者承诺投资本金不受损失", "可以通过电子邮件等方式向不特定对象进行非公开募集基金的宣传推介", "私募基金管理人均应当向基金业协会申请登记"], "answer": [3], "explain": "选项A：设立私募基金管理机构和发行私募基金不设行政审批，但各类私募基金管 理人均应当向基金业协会申请登记，各类私募基金募集完毕，均应当向基金业协会办理备案手 续；选项B：非公开募集基金不得向投资者承诺投资本金不受损失或者承诺最低收益；选项C： 私募基金不得向合格投资者以外的单位和个人募集，不得向为他人代持的投资者募集，不得通 过报刊、电台、电视台、互联网等大众传播媒介，电话、短信、即时通讯工具、电子邮件、传 单，或者讲座、报告会、分析会等方式向不特定对象宣传推介。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，下列关于非公开募集基金的表述中，正确的有（）。", "options": ["非公开募集基金不得向投资者承诺投资本金不受损失", "私募基金管理人不得采取为单一融资项目设立多只私募基金等方式，突破法律规定的人数限制", "私募基金管理人一般不得委托他人募集资金", "私募基金可以向合格投资者以外的投资者募集，单只私募基金的投资者累计不得超过法律规定的人数"], "answer": [0, 1, 2], "explain": "选项D：私募基金应当向合格投资者募集，单只私募基金的投资者累计不得超过法 律规定的人数。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列关于基金份额的上市交易表述中，正确的是（）。（2025 年）", "options": ["基金合同期限不能超过5 年", "申请基金份额上市交易，基金管理人应当向证券交易所提出申请", "基金份额上市交易规则由中国证监会制定", "基金份额持有人大会决定提前终止上市，应向中国证监会申请"], "answer": [1], "explain": "基金份额上市交易，应当符合下列条件：（1）基金的募集符合《证券投资基金法》 的规定；（2）基金合同期限为5 年以上；（3）基金募集金额不低于2 亿元人民币；（4）基金份 额持有人不少于1000 人；（5）基金份额上市交易规则规定的其他条件。选项A 不当选。申请公 开募集基金的基金份额上市交易，基金管理人应当向证券交易所提出申请，证券交易所依法审 核同意的，双方应当签订上市协议。选项B 当选。基金份额上市交易规则由证券交易所制定， 报国务院证券监督管理机构批准。选项C 不当选。基金份额持有人大会决定提前终止上市交易 的，由证券交易所终止其上市交易，并报国务院证券监督管理机构备案。选项D 不当选。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，当事人对证券交易所作出的终止上市交易决定不服的，可以向特定机构设立的复核机构申请复核，该特定机构是（）。（2023 年）", "options": ["中国证监会", "国务院", "证券交易所", "证券从业协会"], "answer": [2], "explain": "对证券交易所作出的不予上市交易、终止上市交易决定不服的，可以向证券交易 所设立的复核机构申请复核。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，下列关于公开募集基金的基金份额上市交易的表述中，正确的有（）。", "options": ["基金管理人应当与证券交易所签订上市协议", "基金合同期限为1 年以上", "基金募集金额不低于2 亿元人民币", "基金份额持有人不超过200 人"], "answer": [0, 2], "explain": "基金份额上市交易，应当符合下列条件：（1）基金的募集符合《证券投资基金法》 的规定；（2）基金合同期限为5 年以上；（3）基金募集金额不低于2 亿元人民币；（4）基金份 额持有人不少于1000 人；（5）基金份额上市交易规则规定的其他条件。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，关于股东代理权征集制度，下列表述正确的有（）。（2025 年）", "options": ["持有1%以上有表决权股份的股东，可以委托证券公司公开征集股东权利", "征集人可以征集股东会出席权、提案权、表决权", "独立董事可以作为征集人公开征集股东权利", "董事会不得成为征集人公开征集股东权利"], "answer": [0, 1, 2], "explain": "上市公司董事会、独立董事、持有1%以上有表决权股份的股东或者依照法律、行 政法规或者国务院证券监督管理机构的规定设立的投资者保护机构，可以作为征集人，自行或 者委托证券公司、证券服务机构，公开请求上市公司股东委托其代为出席股东会，并代为行使 提案权、表决权等股东权利。选项D 不当选。"}, {"type": "single", "year": "", "title": "发行人因欺诈发行、虚假陈述或者其他重大违法行为给投资者造成损失的，发行人的控股股东、实际控制人、相关的证券公司可以委托特定主体，就赔偿事宜与受到损失的投资者达成协议，予以先行赔付。根据证券法律制度的规定，可以委托的主体是（）。（2023 年）", "options": ["投资者保护机构", "中国证监会", "证券业协会", "证券交易所"], "answer": [0], "explain": "发行人因欺诈发行、虚假陈述或者其他重大违法行为给投资者造成损失的，发行人的 控股股东、实际控制人、相关的证券公司可以委托“投资者保护机构”，就赔偿事宜与受到损失的投 资者达成协议，予以先行赔付。先行赔付后，可以依法向发行人以及其他连带责任人追偿。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，发行人因欺诈发行给投资者造成损失的，特定主体可以委托投资者保护机构，就赔偿事宜与受到损失的投资者达成协议，予以先行赔付。该特定主体有（）。", "options": ["发行人的控股股东", "相关的证券公司", "发行人的实际控制人", "证券交易所"], "answer": [0, 1, 2], "explain": "发行人因欺诈发行、虚假陈述或者其他重大违法行为给投资者造成损失的，“发行人的 控股股东、实际控制人、相关的证券公司”可以委托投资者保护机构，就赔偿事宜与受到损失的投 资者达成协议，予以先行赔付。先行赔付后，可以依法向发行人以及其他连带责任人追偿。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，投资者保护机构受一定数量以上的投资者委托，可以作为代表人参加证券民事赔偿诉讼。该数量为", "options": ["20 名", "30 名", "40 名", "50 名"], "answer": [3], "explain": "投资者保护机构受“50 名以上”投资者委托，可以作为代表人参加诉讼。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列各项中，属于上市公司持续信息披露文件的是（）。", "options": ["招股说明书", "重大事件的临时报告", "债券募集说明书", "上市公告书"], "answer": [1], "explain": "持续信息披露文件主要有定期报告和临时报告。定期报告是上市公司进行持续信 息披露的主要形式之一，包括年度报告、中期报告和季度报告。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，上市公司报送并公告中期报告的法定截止日为每年的（）。（2025 年）", "options": ["6 月30 日", "9 月30 日", "7 月31 日", "8 月31 日"], "answer": [3], "explain": "上市公司应在每一会计年度的上半年结束之日起2 个月内，报送并公告中期报告。 选项D 当选。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，上市公司报送并公告年度报告的法定截止日期是（）。（2024 年）", "options": ["3 月31 日", "4 月30 日", "5 月31 日", "6 月30 日"], "answer": [1], "explain": "上市公司在每一会计年度结束之日起4 个月内，报送并公告年度报告。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，凡发生可能对上市公司股票交易价格产生较大影响的重大事件，投资者尚未得知时，上市公司应当立即报送临时报告，并予公告，下列情形中，属于重大事件的有（）。", "options": ["公司分配股利的计划", "公司一年内购买重大资产达到公司资产总额20%", "公司注册资本减少的决定", "公司涉嫌违法受到刑事处罚"], "answer": [0, 2, 3], "explain": "选项B：公司在一年内购买、出售重大资产超过公司资产总额30%才属于重大事件。"}, {"type": "single", "year": "", "title": "某上市公司监事会有5 名监事，其中监事赵某、张某为职工代表，监事任期届满，该公司职工代表大会在选举监事时，认为赵某、张某未能认真履行职责，故一致决议改选陈某、王某为监事会成员。按照《证券法》的规定，该上市公司应通过一定的方式将该信息予以披露，该信息披露的方式是（）。", "options": ["中期报告", "季度报告", "年度报告", "临时报告"], "answer": [3], "explain": "公司董事、1/3 以上监事（本题中，监事人数为5 人，其中两人发生变动，即变动 比例为40%，已经超过1/3）或者经理发生变动属于重大事件，应提交临时报告。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，凡发生可能对上市公司债券的交易价格产生较大影响的重大事件，投资者尚未得知时，公司应当立即报送临时报告，下列情形中，属于重大事件的有（）。", "options": ["增资的计划", "公司新增借款超过上年末净资产的10%", "公司放弃债权超过上年末净资产的10%", "发生重大损失超过上年末净资产的10%"], "answer": [2, 3], "explain": "（1）选项A：属于股票发行公司发布临时报告的重大事件。（2）选项B：公司新增借款 或者对外提供担保超过上年末净资产的20%，属于公司债券发行公司发布临时报告的重大事件。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列关于证券信息披露的表述中，不正确的是（）。", "options": ["信息披露义务人披露的信息应当通俗易懂", "信息披露义务人自愿披露的信息不得与依法披露的信息相冲突", "信息披露义务人披露的信息应当简明清晰", "信息披露的对象是特定的社会公众"], "answer": [3], "explain": "选项D：信息披露的对象是不特定的社会公众。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，上市公司中负责组织定期报告披露工作的主体是（）。", "options": ["董事长", "监事会", "董事会秘书", "董事会"], "answer": [2], "explain": "上市公司中负责组织定期报告披露工作的主体是“董事会秘书”。"}, {"type": "single", "year": "", "title": "下列人员中，不属于《证券法》规定的证券交易内幕信息的知情人员的是（）。", "options": ["上市公司的财务负责人", "持有上市公司3%股份的股东", "上市公司控股的公司的董事", "上市公司的监事"], "answer": [1], "explain": "根据《证券法》规定，持有公司5%以上股份的股东及其董事、监事、高级管理人 员，公司的实际控制人及其董事、监事、高级管理人员；属于内幕信息的知情人。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列人员不属于禁止利用内幕信息以外的其他未公开信息进行交易的主体的是（）。（2024 年）", "options": ["证券交易场所的从业人员", "证券公司的从业人员", "证券登记结算机构的负责人", "上市公司的实际控制人"], "answer": [3], "explain": "《证券法》第五十四条规定：禁止证券交易场所、证券公司、证券登记结算机构、 证券服务机构和其他金融机构的从业人员、有关监管部门或者行业协会的工作人员，利用因职 务便利获取的内幕信息以外的其他未公开的信息，违反规定，从事与该信息相关的证券交易活 动，或者明示、暗示他人从事相关交易活动。利用未公开信息进行交易给投资者造成损失的， 应当依法承担赔偿责任。选项D 当选。"}, {"type": "multi", "year": "", "title": "下列人员中，若将买入的甲上市公司股票在六个月内卖出，其获得的收益应该归甲上市公司所有的有（）。（2025 年）", "options": ["监事的女儿", "董事的母亲", "高级管理人员的配偶", "某证券公司，因购入包销售后剩余股票而持有甲公司7%的股份"], "answer": [0, 1, 2], "explain": "上市公司、股票在国务院批准的其他全国性证券交易场所交易的公司持有5%以上 股份的股东、董事、监事、高级管理人员，将其持有的该公司的股票或者其他具有股权性质的 证券在买入后6 个月内卖出，或者在卖出后6 个月内又买入，由此所得收益归该公司所有，公 司董事会应当收回其所得收益。但是，证券公司因购入包销售后剩余股票而持有5%以上股份， 以及有国务院证券监督管理机构规定的其他情形的除外。上述董事、监事、高级管理人员、自 然人股东持有的股票或者其他具有股权性质的证券，包括其配偶、父母、子女持有的及利用他 人账户持有的股票或者其他具有股权性质的证券。选项A、B、C 当选。"}, {"type": "multi", "year": "", "title": "某公司的下列行为中，属于操纵证券市场的有（）。（2024 年）", "options": ["未经客户的委托，擅自为客户买卖证券", "与他人串通，以事先约定的时间、价格和方式相互进行证券交易", "利用不确定的重大信息，诱导投资者证券交易", "不以成交为目的，大量申报并撤销申报"], "answer": [1, 2, 3], "explain": "选项A ：属于欺诈客户的行为。"}, {"type": "single", "year": "", "title": "某证券公司实施了下列行为，其中属于合法行为的是（）。", "options": ["甲证券公司得知某上市公司上半年盈利大大超出预期，在信息未公开前，大量买入该上市公司的股票", "乙证券公司为牟取佣金收入，诱使客户进行不必要的证券买卖", "丙证券公司集中资金优势连续买入某上市公司股票，造成该股票价格大幅上涨，在高价位上卖出获利", "丁证券公司将其包销的售后剩余股票全部自行购入"], "answer": [3], "explain": "（1）选项A：属于内幕交易行为；（2）选项B：属于欺诈客户；（3）选项C：属于 操纵证券市场，均为证券法禁止的交易行为。（4）选项D：在“先销后包”的情形下，承销期结 束后证券公司应当将售后剩余的证券全部自行购入。"}, {"type": "single", "year": "", "title": "下列各项中，属于欺诈客户行为的是（）。", "options": ["甲证券公司不在规定时间内向客户提供交易的确认文件", "乙上市公司在上市公告书中夸大净资产额", "丙公司与戊公司串通相互交易以抬高证券价格", "丁公司董事赵某提前泄露公司增资计划以使李某获利"], "answer": [0], "explain": "（1）选项B：属于虚假陈述行为； （2）选项C：属于操纵市场行为； （3）选项D：属于内幕交易行为。"}, {"type": "multi", "year": "", "title": "根据上市公司收购法律制度的规定，下列情形中，属于表明投资者获得或拥有上市公司控制权的有（）。（根据2026 年政策重编答案）", "options": ["投资者为上市公司持股50%以上的控股股东", "投资者可实际支配上市公司股份表决权超过30%", "投资者通过实际支配上市公司股份表决权能够决定公司董事会1/3 成员选任", "投资者依其可实际支配的上市公司股份表决权足以对公司股东会的决议产生重大影响"], "answer": [1, 3], "explain": "表明投资者获得或拥有上市公司控制权的情形，包括： 1.投资者为上市公司持股“超过”50%的控股股东； 2.投资者可以实际支配上市公司股份表决权超过30%（选项B）； 3.投资者通过实际支配上市公司股份表决权能够决定公司董事会“超过”半数成员选任； 4.投资者依其可实际支配的上市公司股份表决权足以对公司股东会的决议产生重大影响 （选项D）； 5.国务院证券监督管理机构认定的其他情形。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，下列各项中，属于不得收购上市公司的情形有（）。", "options": ["收购人负有数额较大债务，到期未清偿，且处于持续状态", "收购人最近3 年涉嫌有重大违法行为", "收购人最近3 年有严重的证券市场失信行为", "收购人为限制民事行为能力人"], "answer": [0, 1, 2, 3], "explain": "收购人存在上述情形时，均不得收购上市公司。"}, {"type": "multi", "year": "", "title": "甲公司收购乙上市公司时，下列投资者同时也在购买乙上市公司的股票。根据证券法律制度的规定，如无相反证据，与甲公司为一致行动人的投资者有（）。", "options": ["甲公司董事杨某", "甲公司董事长张某多年未联系的同学", "甲公司某监事的母亲", "甲公司总经理的配偶"], "answer": [0, 2, 3], "explain": "在投资者任职的董事、监事及高级管理人员，其父母、配偶、子女及其配偶、配 偶的父母、兄弟姐妹及其配偶、配偶的兄弟姐妹及其配偶等亲属，与投资者持有同一上市公司 股份，与投资者属于一致行动人，选项B 不当选。"}, {"type": "judge", "year": "", "title": "甲、乙两公司签署协议共同收购丙上市公司，当甲、乙两公司共同拥有权益的股份达到丙上市公司已发行股份的3%时，应当在该事实发生之日起5 日内编制权益变动报告书，向中国证监会、证券交易所提交书面报告，通知丙上市公司，并予以公告。（）", "options": ["对", "错"], "answer": [1], "explain": "（1）甲、乙两公司签署共同收购协议，属于一致行动人；（2）首次权益披露点为 5%，而非3%；（3）在该事实发生之日起“3 日内”依法履行权益披露义务。"}, {"type": "judge", "year": "", "title": "被收购的上市公司能够运用部分资源，为收购人提供一定的财务资助。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "被收购公司董事会针对收购所作出的决策及采取的措施，应当有利于维护公司及 其股东的利益，不得滥用职权对收购设置不适当的障碍，不得利用公司资源向收购人提供任何 形式的财务资助，不得损害公司及其股东的合法权益。本题表述错误。"}, {"type": "judge", "year": "", "title": "在上市公司收购要约确定的承诺期限内，收购人有权撤销其收购要约。（）（2023 年）", "options": ["对", "错"], "answer": [1], "explain": "在收购要约确定的承诺期限内，收购人不得撤销其收购要约。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，在上市公司收购中，要约收购的收购期限一般为（）。（2023 年）", "options": ["不得少于15 日，并不得超过30 日", "不得少于15 日，并不得超过60 日", "不得少于30 日，并不得超过60 日", "不得少于30 日，并不得超过90 日"], "answer": [2], "explain": "不得少于30 日，并不得超过60 日，但出现竞争要约的除外。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，上市公司收购人拟变更收购要约，下列情形正确的是（）。（2023 年）", "options": ["收购人需要变更收购要约的，应当及时公告", "将收购3 000 万股变更为收购2 000 万股", "将收购价格6 元一股变更为5 元一股", "将收购期限60 日变更为45 日"], "answer": [0], "explain": "收购人如果需要变更收购要约的，必须及时公告，载明具体变更事项，并通知被 收购公司，并且不得存在下列情形：（1）降低收购价格（C 选项）；（2）减少预定收购股份数额 （B 选项）；（3）缩短收购期限（D 选项）。"}, {"type": "multi", "year": "", "title": "甲公司要约收购乙上市公司，收购要约中载明收购期限截至5 月30 日，收购价格6 元一股，拟收购5 000 万股。甲公司拟变更收购要约，下列情形符合规定的有（）。（2024 年）", "options": ["将收购价格改为5 元一股", "将收购数量改为6 000 万股", "将收购期限改为截至6 月10 日", "甲公司变更收购要约的最晚时间是5 月20 日"], "answer": [1, 2], "explain": "（1）选项ABC：收购要约的变更不得存在下列情形：①降低收购价格；②减少预定 收购股份数额；③缩短收购期限；④国务院证券监督管理机构规定的其他情形。（2）选项D：收 购要约期限届满前15 日内，收购人不得变更收购要约；但是出现竞争要约的除外。"}, {"type": "single", "year": "", "title": "根据证券法律制度的规定，下列关于要约收购的说法正确的是（）。（2022年）", "options": ["要约确定的承诺期限内，收购人可以撤销其收购要约", "收购人持有被收购的上市公司股票，收购行为完成后15 个月内不得转让", "收购人不得采取要约规定以外的形式和超出要约的条件购入被收购公司的股票", "收购要约公告后，收购人对部分上市公司的股东提高价格收购"], "answer": [2], "explain": "（1）选项A：在收购要约约定的承诺期限内，收购人不得撤销其收购要约。（2）选项B： 收购人持有的被收购的上市公司的股票，在收购行为完成后的18 个月内不得转让。（3）选项D：收 购人应当公平对待被收购公司的所有股东，持有同一种类股份的股东应当得到同等对待。"}, {"type": "single", "year": "", "title": "甲公司发出全面要约收购乙上市公司的股份，其收购目的是终止乙上市公司的上市资格，则下列表述中，正确的是（）。（2024 年）", "options": ["甲公司可以仅用证券支付收购价款", "在收购要约确定的承诺期限内，甲公司不得撤销其收购要约", "甲公司在要约收购期限内，可以协议方式受让乙上市公司及股东的股票", "甲公司在要约收购期限内，可以卖出乙上市公司股票"], "answer": [1], "explain": "选项A：收购人为终止上市公司的上市地位而发出全面要约的，或者不符合免除发 出要约规定而发出全面要约的，应当以现金支付收购价款；以依法可以转让的证券支付收购价 款的，应当同时提供现金方式供被收购公司股东选择；选项C、D：收购人在要约收购期内，不 得卖出被收购公司的股票，也不得采取要约规定以外的形式和超出要约的条件买入被收购公司 的股票。"}, {"type": "multi", "year": "", "title": "根据证券法律制度的规定，下列关于上市公司收购的法律责任的表述中，正确的有（）。（2023 年）", "options": ["收购行为完成后，收购人与被收购公司合并，并将该公司解散的，被解散公司的原有股票由收购人依法更换", "在上市公司收购中，收购人持有的被收购的上市公司的股票，在收购行为完成后的24 个月内不得转让", "收购期届满，被收购公司股权分布不符合上市交易要求的，该上市公司的股票应当依法终止上市交易", "收购行为完成后，被收购公司不再具备股份有限公司条件的，应当依法变更企业形式1."], "answer": [0, 2, 3], "explain": "选项B：收购人持有的被收购的上市公司的股票，一般在收购行为完成后的18 个 月内不得转让。"}]}, "ch7": {"name": "财政法律制度", "questions": [{"type": "single", "year": "", "title": "根据预算法律制度的规定，下列关于预算支出表述错误的是（）。（2023 年）", "options": ["为全面反映政府各项收支情况，一般公共预算支出按支出功能和支出经济性质两套体系分类编制", "各级一般公共预算支出的编制，应当统筹兼顾，在保证基本公共服务合理需要的前提下，优先安排国家确定的重点支出", "各级预算支出的编制，应当贯彻勤俭节约的原则", "地方各级预算按照量出为入、收支平衡的原则编制"], "answer": [3], "explain": "地方各级预算按照量入为出、收支平衡的原则编制，选项D 当选。"}, {"type": "judge", "year": "", "title": "县级以上地方政府的派出机关根据本级政府授权进行预算管理活动，不作为一级预算，其收支纳入本级预算。（）（2023 年）", "options": ["对", "错"], "answer": [0], "explain": "县级以上地方政府的派出机关根据本级政府授权进行预算管理活动，不作为一级 预算，其收支纳入本级预算。本题表述正确。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，下列关于财政转移支付的表述中，不正确的是（）。（2022 年）", "options": ["财政转移支付包括中央对地方的转移支付和地方上级政府对下级政府的转移支付", "均衡性转移支付属于一般性转移支付", "对革命老区、民族地区、边疆地区、贫困地区的财力补助属于专项转移支付", "市场竞争机制能够有效调节的事项不得设立专项转移支付"], "answer": [2], "explain": "（1）财政转移支付包括中央对地方的转移支付和地方上级政府对下级政府的转移 支付。选项A 正确，不当选；（2）一般性转移支付包括：①均衡性转移支付（选项B 正确，不 当选）；②对革命老区、民族地区、边疆地区、贫困地区的财力补助（选项C 错误，当选）；③ 其他一般性转移支付。（3）市场竞争机制能够有效调节的事项不得设立专项转移支付。选项D 正确，不当选。"}, {"type": "single", "year": "", "title": "下列税种中，由海关负责征收的是（）。（2024 年）", "options": ["个人所得税", "资源税", "车船税", "船舶吨税"], "answer": [3], "explain": "关税和船舶吨税由海关负责征收，选项D 当选。选项A、B、C 由税务部门负责征收。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，下列属于一般公共预算收入的有（）。（2025 年）", "options": ["税收收入", "行政事业性收费收入", "国有资产有偿使用收入", "国有土地使用权出让金"], "answer": [0, 1, 2], "explain": "一般公共预算收入包括税收收入、行政事业性收费收入、国有资源（资产）有偿 使用收入、转移性收入、其他收入，选项A、B、C 当选；国有土地使用权出让金属于政府性基 金预算收入，选项D 不当选。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，下列收入中，不属于转移性收入的是（）。（2020 年）", "options": ["下级上解收入", "上级补助收入", "上年结余收入", "罚没收入"], "answer": [3], "explain": "转移性收入包括：上级补助收入（主要是返还性收入、财政转移支付收入）、下级 上解收入、上年结余收入；罚没收入属于其他收入，不属于转移性收入，选项D 当选。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，下列预算收入中，属于政府性基金预算收入的有（）。（2023 年）", "options": ["国家重大水利建设基金收入", "国有资源（资产）有偿使用收入", "国有产权转让收入", "国有土地使用权出让金收入"], "answer": [0, 3], "explain": "政府性基金预算收入来源于向特定对象征收、收取或者以其他方式筹集的资金， 如民航发展基金、国家重大水利建设基金、国有土地使用权出让金等。选项A、D 当选。"}, {"type": "single", "year": "", "title": "根据企业国有资产法律制度的规定，下列关于国有资本经营预算的说法中，正确的是（）。（2025 年）", "options": ["国有资本经营预算报本级人大常委会批准", "履行出资人职责的机构负责编制国有资本经营预算草案", "国有资本经营预算可列赤字", "国有资本经营预算按年度单独编制"], "answer": [3], "explain": "国有资本经营预算按年度单独编制，纳入本级人民政府预算，报本级人民代表大会批 准，选项A 不当选。国务院和有关地方人民政府财政部门负责国有资本经营预算草案的编制工作， 履行出资人职责的机构向财政部门提出由其履行出资人职责的国有资本经营预算建议草案，选项B 不当选。国有资本经营预算支出按照当年预算收入规模安排，不列赤字，选项C 不当选。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，下列收入中属于一般公共预算收入的有（）。（2022 年）", "options": ["行政事业性收费收入", "国有土地使用权出让收入", "国有控股公司股息红利收入", "国有资源（资产）有偿使用收入"], "answer": [0, 3], "explain": "一般公共预算收入包括：（1 ）税收收入；（2 ）行政事业性收费收入；（3 ）国有 资源（资产）有偿使用收入；（4）转移性收入。选项A、D 当选。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，下列主体有权审查和批准M 省预算调整方案的是（）。（2025 年）", "options": ["M 省人民代表大会常务委员会", "全国人民代表大会", "M 省人民代表大会", "全国人大常委会"], "answer": [0], "explain": "县级以上地方各级预算的调整方案应当提请本级人民代表大会常务委员会审查和 批准。选项A 当选。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，乡、民族乡、镇预算调整方案在编制后需经特定机关审查和批准。该特定机关是（）。（2022 年）", "options": ["上级政府", "上级人民代表大会", "本级人民代表大会", "本级人民代表大会常务委员会"], "answer": [2], "explain": "乡、民族乡、镇政府应当及时将经本级人民代表大会批准的本级预算报上一级政 府备案。选项C 当选。"}, {"type": "judge", "year": "", "title": "全国人大常委会向全国人大作关于中央和地方预算草案以及中央和地方预算执行情况的报告。（）（2023 年）", "options": ["对", "错"], "answer": [1], "explain": "国务院在全国人民代表大会举行会议时，向大会作关于中央和地方预算草案以及 中央和地方预算执行情况的报告。本题表述错误。"}, {"type": "single", "year": "", "title": "下列关于预算编制的表述中，错误的是（）。", "options": ["各级预算支出应当按其功能和经济性质分类编制", "预算草案在未经权力机关批准前，也是具有法律效力的国家预算", "预算编制的对象是预算草案", "预算收入和预算支出以人民币元为计算单位"], "answer": [1], "explain": "预算草案，是指各级政府、各部门、各单位编制的未经法定程序审查批准的预算。 预算草案在未经权力机关批准之前，仅仅是一种不具有法律效力的国家预算。选项B 表述不正 确，当选。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，下列关于预算编制的表述中，正确的有（）。（2025 年）", "options": ["预算年度自公历1 月1 日起，至12 月31 日止", "财政部每年3 月15 日前部署下一年度预算草案编制的具体事项", "县级以上地方各级政府财政部门应当于每年6 月30 日前部署本行政区域下一年度预算草案编制的具体事项", "各省级财政部门汇总本级总预算应于下一年度6 月15 日前报财政部"], "answer": [0, 2], "explain": "财政部于每年6 月15 日前部署编制下一年度预算草案的具体事项，规定报表格式、 编报方法、报送期限等。选项B 不当选。省、自治区、直辖市政府财政部门汇总的本级总预算 草案或者本级总预算，应当于下一年度1 月10 日前报财政部。选项D 不当选。"}, {"type": "judge", "year": "", "title": "经国务院批准的省的预算中必需的建设投资的部分资金，可在国务院确定的限额内，通过发行地方政府债券举借债务的方式筹措。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "经国务院批准的省、自治区、直辖市的预算中必需的建设投资的部分资金，可以 在国务院确定的限额内，通过发行地方政府债券举借债务的方式筹措。本题表述正确。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，下列关于预算编制的说法中，错误的是（）。（2025 年）", "options": ["中央一般公共预算资金，不得通过举借国外债务方式筹措", "各级一般公共预算应当设置预备费，用于当年预算执行中的自然灾害等突发事件处理增加的支出及其他难以预见的开支", "财政部应于每年6 月15 日前部署编制下一年度预算草案的具体事项", "中央预算应当安排必要的资金用于扶助民族地区发展"], "answer": [0], "explain": "中央一般公共预算中必需的部分资金，可以通过举借国内和国外债务等方式筹措， 举借债务应当控制适当的规模，保持合理的结构。选项A 当选。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，下列关于预算编制的表述中，不正确的是（）。（2022 年）", "options": ["政府全部收入均应列入预算，不得隐瞒、少列", "地方政府举借的债务可以用于经常性支出", "各级一般公共预算应当设置预备费", "各级一般公共预算可以设置预算周转金"], "answer": [1], "explain": "（1）选项B：地方政府依法发行地方政府债券举借的债务，应当有偿还计划和稳定 的偿还资金来源，只能用于公益性资本支出，不得用于经常性支出。（2）选项C：各级一般公共 预算应当按照本级一般公共预算支出额的1%-3%设置预备费，用于当年预算执行中的自然灾害等 突发事件处理增加的支出及其他难以预见的开支。（3）选项D：经本级政府批准，各级政府财政 部门可以设置预算周转金，额度不得超过本级一般公共预算支出总额的1%，用于本级政府调剂 预算年度内季节性收支差额。"}, {"type": "judge", "year": "", "title": "各级一般公共预算的结余资金，应当补充预算稳定调节基金。（）（2022 年）", "options": ["对", "错"], "answer": [0], "explain": "各级一般公共预算年度执行中有超收收入的，只能用于冲减赤字或者补充预算稳 定调节基金。各级一般公共预算的结余资金，应当补充预算稳定调节基金。本题表述正确。"}, {"type": "judge", "year": "", "title": "省级政府财政部门应当将本级预算草案的初步方案，提交国务院财政部门进行初步审查。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "省、自治区、直辖市政府财政部门应当在本级人民代表大会会议举行的30 日前将 本级预算草案的初步方案提交本级人民代表大会有关专门委员会进行初步审查。本题表述错误。"}, {"type": "single", "year": "", "title": "根据预算法律制度的规定，国务院和县级以上地方各级人民政府对下一级人民政府依《预算法》规定报送备案的预算认为同法律相抵触，需要撤销批准该预算的决议时，应当提请特定机关审议决定，该特定机关为（）。（2023 年）", "options": ["上一级人民代表大会", "本级人民代表大会常务委员会", "本级人民代表大会", "上一级人民政府"], "answer": [1], "explain": "国务院和县级以上地方各级政府对下一级政府依照《预算法》规定报送备案的预 算，认为有同法律、行政法规相抵触或者有其他不适当之处，需要撤销批准预算的决议的，应 当提请本级人民代表大会常务委员会审议决定。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，预算年度开始后，各级预算草案在本级人民代表大会批准前，可以安排的支出有（）。", "options": ["用于自然灾害等突发事件处理的支出", "法律规定必须履行支付义务的支出", "参照上一年同期的预算支出数额安排必须支付的本年度部门基本支出", "上一年度结转的支出"], "answer": [0, 1, 2, 3], "explain": "预算年度开始后，各级预算草案在本级人民代表大会批准前，可以安排下列支出： （1）上一年度结转的支出（选项D）；（2）参照上一年同期的预算支出数额安排必须支付的本年 度部门基本支出、项目支出，以及对下级政府的转移性支出（选项C）；（3）法律规定必须履行 支付义务的支出，以及用于自然灾害等突发事件处理的支出（选项A、B）。"}, {"type": "multi", "year": "", "title": "下列关于国库集中收付制度的说法中，正确的有（）。（2022 年）", "options": ["国库集中收缴、集中支付", "县级以上各级预算必须设国库", "国库库款的支配权属于本级政府财政部门", "中央国库业务由财政部门经理"], "answer": [0, 1, 2], "explain": "选项D：中央国库业务由中国人民银行经理。未设中国人民银行分支机构的地区， 由中国人民银行商财政部后，委托有关银行业金融机构办理。"}, {"type": "multi", "year": "", "title": "下列关于预算的说法中，正确的有（）。（2024 年）", "options": ["各级国有资本经营预算年度执行中有超收收入的，可以冲减赤字", "各级一般公共预算年度执行中有超收收入的，可以用于冲减赤字", "各级一般公共预算的结余资金，应当补充预算稳定调节基金", "各级政府性基金预算年度执行中有超收收入的，可以补充预算稳定调节基金"], "answer": [1, 2], "explain": "各级国有资本经营预算年度执行中有超收收入的，应当在下一年度安排使用；出 现短收的，应当通过减少支出实现收支平衡。选项A 不当选。各级政府性基金预算年度执行中 有超收收入的，应当在下一年度安排使用并优先用于偿还相应的专项债务；出现短收的，应当 通过减少支出实现收支平衡，国务院另有规定的除外。选项D 不当选。选项B、C 当选。"}, {"type": "multi", "year": "", "title": "根据预算法律制度的规定，经批准的中央预算在执行中出现下列情形时，应当进行预算调整的有（）。（2021 年）", "options": ["需要增加预算总支出的", "需要减少举借债务数额的", "需要调入预算稳定调节基金的", "需要调减预算安排的重点支出数额的"], "answer": [0, 2, 3], "explain": "需要增加举借债务数额的，应当进行预算调整，选项B 不当选。"}, {"type": "judge", "year": "", "title": "各级一般公共预算年度执行中厉行节约、节约开支，造成本级预算支出实际执行数小于预算总支出的，应编制预算调整方案，作出安排。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "各级一般公共预算年度执行中厉行节约、节约开支，造成本级预算支出实际执行 数小于预算总支出的，不属于预算调整的情形。本题表述错误。"}, {"type": "single", "year": "", "title": "根据企业国有资产管理法律制度的规定，下列主体中，代表国家行使国有资产所有权的机构是（）。（2025 年）", "options": ["国务院", "全国人民代表大会", "财政部", "国有资产监督管理机构"], "answer": [0], "explain": "国务院代表国家行使国有资产所有权。选项A 当选。"}, {"type": "multi", "year": "", "title": "根据企业国有资产法律制度的规定，下列各项中，代表国家对国家出资企业履行出资人职责的有（）。", "options": ["全国人民代表大会", "全国人民代表大会常务委员会", "国务院", "地方人民政府"], "answer": [2, 3], "explain": "国务院和地方人民政府依照法律、行政法规的规定，分别代表国家对国家出资企 业履行出资人职责，享有出资人权益。选项C、D 当选。"}, {"type": "multi", "year": "", "title": "根据企业国有资产管理法律制度的规定，下列各项中，属于国家出资企业的有（）。", "options": ["国有独资企业", "国有资本参股公司", "国有资本控股公司", "国有独资公司"], "answer": [0, 1, 2, 3], "explain": "国家出资企业包括国有独资企业、国有独资公司、国有资本控股公司和国有资本 参股公司。选项A、B、C、D 均当选。"}, {"type": "multi", "year": "", "title": "根据企业国有资产法律制度的规定，下列各项中，属于国务院和地方人民政府依法履行出资人职责时应遵循的原则有（）。", "options": ["保护消费者合法权益", "政企分开", "社会公共管理职能与企业国有资产出资人职能分开", "不干预企业依法自主经营"], "answer": [1, 2, 3], "explain": "国务院和地方人民政府应当按照政企分开（选项B）、社会公共管理职能与企业国 有资产出资人职能分开（选项C）、不干预企业依法自主经营（选项D）的原则，依法履行出资 人职责。"}, {"type": "multi", "year": "", "title": "根据企业国有资产管理法律制度的规定，由履行出资人职责的机构任免的有（）。（2023 年）", "options": ["国有独资企业的总经理", "国有独资公司的董事", "国有资本控股公司的董事", "国有资本参股公司的监事"], "answer": [0, 1], "explain": "履行出资人职责的机构依照法律、行政法规以及企业章程的规定任免或者建议任 免国家出资企业的下列人员：（1）任免国有独资企业的经理、副经理、财务负责人和其他高级 经理人员；（2）任免国有独资公司的董事长、副董事长、董事、监事会主席和监事；（3）向国 有资本控股公司、国有资本参股公司的股东会提出董事、监事人选。选项A、B 当选。"}, {"type": "multi", "year": "", "title": "根据《企业国有资产法》的规定，国家出资企业的下列人员中，履行出资人职责的机构可以（）。（2024 年）", "options": ["任免国有独资公司的董事", "任免国有独资企业的经理", "提名国有资本控股公司的董事", "提名国有资本控股公司的经理"], "answer": [0, 1, 2], "explain": "国有资本控股公司的经理（高级管理人员），由其董事会任免。选项D 不当选。"}, {"type": "single", "year": "", "title": "根据企业国有资产法律制度的规定，下列关于国家出资企业管理者的说法中，正确的是（）。（2025 年）", "options": ["国有独资企业的财务负责人由该企业董事会任免", "国有资本控股公司的董事由履行出资人职责的机构决定任免", "国家出资企业职工代表出任的监事由职工民主选举", "未经董事会同意国有资本控股公司的董事，不得在经营同类业务的其他企业兼职"], "answer": [2], "explain": "履行出资人职责的机构依照法律、行政法规以及企业章程的规定，任免或者建议 任免国家出资企业的下列人员：（1）任免国有独资企业的经理、副经理、财务负责人和其他高 级经理人员，选项A 不当选；（2）任免国有独资公司的董事长、副董事长、董事、监事会主席 和监事；（3）向国有资本控股公司、国有资本参股公司的股东会提出董事、监事人选，选项B 不当选。国家出资企业中应当由职工代表出任的董事、监事，依照有关法律、行政法规的规定 由职工民主选举产生，选项C 当选。未经股东会同意，国有资本控股公司、国有资本参股公司 的董事、高级管理人员不得在经营同类业务的其他企业兼职，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据国有资产管理法律制度的规定，下列主体中，其主要负责人应当接受任期经济责任审计的有（）。（2022 年）", "options": ["国有独资企业", "国有资本参股公司", "国有独资公司", "国有资本控股公司"], "answer": [0, 2, 3], "explain": "国有独资企业、国有独资公司和国有资本控股公司的主要负责人，应当接受依法 进行的任期经济责任审计。选项A、C、D 当选。"}, {"type": "single", "year": "", "title": "甲公司为国有独资公司，根据企业国有资产法律制度的规定，下列不属于甲公司关联方的是（）。（2023 年）", "options": ["甲公司的经理", "甲公司的财务负责人", "甲公司副经理的朋友李某", "甲公司监事实际控制的乙公司"], "answer": [2], "explain": "关联方是指本企业的董事、监事、高级管理人员及其近亲属以及这些人员所有或 者实际控制的企业。选项C 当选。"}, {"type": "single", "year": "", "title": "根据企业国有资产法律制度规定，下列关于与关联方交易的说法中，不正确的是（）。（2025 年）", "options": ["未经履行出资人职责的机构同意，国有独资公司不得向关联方投资", "未经履行出资人职责的机构同意，国有独资公司不得为关联方提供担保", "未经履行出资人职责的机构同意，国有独资企业不得无偿向关联方提供商品", "国有资本控股公司可以向关联方提供借款"], "answer": [2], "explain": "国有独资企业不得无偿向关联方提供商品，属于绝对禁止，不存在“未经履行出 资人职责的机构同意”这个前提条件。选项C 当选。"}, {"type": "single", "year": "", "title": "根据国有资产管理法律制度的规定，国有独资企业、国有独资公司的重大资产处置，按照有关规定，应由（）批准。（2022 年）", "options": ["本级国有资产监督管理机构", "同级地方人民政府", "本级财政部门", "审计部门"], "answer": [0], "explain": "所出资企业中的国有独资企业、国有独资公司的重大资产处置，需由国有资产监 督管理机构批准的，依照有关规定执行。选项A 当选。"}, {"type": "multi", "year": "", "title": "下列属于行政事业性国有资产的有（）。（2025 年）", "options": ["接受捐赠并确认为国有的资产", "使用财政资金形成的资产", "接受调拨形成的资产", "对外投资的资产"], "answer": [0, 1, 2], "explain": "行政事业性国有资产，是指行政单位、事业单位通过以下方式取得或者形成的资 产：（1）使用财政资金形成的资产；（2）接受调拨或者划转、置换形成的资产；（3）接受捐赠 并确认为国有的资产；（4）其他国有资产。选项A、B、C 当选。"}, {"type": "judge", "year": "", "title": "政府储备物资属于行政事业性国有资产。（）（2022 年）", "options": ["对", "错"], "answer": [0], "explain": "行政事业性国有资产管理适用范围：（1）除国家另有规定外，社会组织直接支配 的行政事业性国有资产管理，依照《行政事业性国有资产管理条例》执行；（2）货币形式的行 政事业性国有资产管理，按照预算管理有关规定执行；（3）执行企业财务、会计制度的事业单 位以及事业单位对外投资的全资企业或者控股企业的资产管理，不适用《行政事业性国有资产 管理条例》；（4）公共基础设施、政府储备物资、国有文物文化等行政事业性国有资产管理的具 体办法，由国务院财政部门会同有关部门制定；（5 ）中国人民解放军中国人民武装警察部队直 接支配的行政事业性国有资产管理，依照中央军事委员会有关规定执行。本题表述正确。"}, {"type": "single", "year": "", "title": "下列关于行政事业性国有资产使用的表述中，不正确的是（）。（2024 年）", "options": ["各部门及其所属单位应当在确保等价有偿的前提下，推进本单位大型设备等国有资产共享共用工作", "行政单位国有资产应当用于本单位履行职能的需要", "除法律另有规定外，行政单位不得以任何形式将国有资产用于对外投资或者设立营利组织", "事业单位利用国有资产对外投资应当有利于事业发展和实现国有资产保值增值"], "answer": [0], "explain": "各部门及其所属单位应当在确保安全使用的前提下推进本单位大型设备等国有资 产共享共用工作，可以对提供方给予合理补偿。选项A 当选。"}, {"type": "single", "year": "", "title": "根据国有资产管理法律制度的规定，行政事业性国有资产的下列配置方式中，各部门及其所属单位应当优先采用的是（）。（2025 年）", "options": ["购置", "租用", "调剂", "接受捐赠"], "answer": [2], "explain": "行政事业性国有资产的资产配置包括调剂、购置、建设、租用、接受捐赠等方式， 各部门及其所属单位应当优先通过调剂方式配置资产；不能调剂的，可以采用购置、建设、租 用等方式。选项C 当选。"}, {"type": "multi", "year": "", "title": "根据行政事业性国有资产管理的规定，各部门应对行政事业性国有资产进行清查的有（）。（2024 年）", "options": ["因不可抗力造成资产灭失", "单位合并", "单位财务负责人发生变动", "会计信息严重失真"], "answer": [0, 1, 3], "explain": "有下列情形之一的，各部门及其所属单位应当对行政事业性国有资产进行清算： （1） 根据本级政府部署要求；（2）发生重大资产调拨、划转以及单位分立、合并、改制、撤销、隶 属关系改变等情形；（3）因自然灾害等不可抗力造成资产毁损、灭失；（4）会计信息严重失真； （5）国家统一的会计制度发生重大变更，涉及资产核算方法发生重要变化；（6）其他应当进行 资产清查的情形。选项A、B、D 当选。"}, {"type": "multi", "year": "", "title": "下列各项中，国有资产应当及时报废、报损的有（）。（2024 年）", "options": ["公立小学因地震受损的空调", "公立医院已超过使用期限但仍可以满足诊疗需要的诊疗设备", "财政局无维修价值的打印机", "民政局失窃未找回的电脑"], "answer": [0, 2, 3], "explain": "各部门及其所在单位应当对下列资产予以报废、报损：（1）因技术原因确需淘汰 或者无法维修、无维修价值的资产；（2）涉及盘亏、坏账以及非正常损失的资产；（3）已超过 使用年限且无法满足现有工作需要的资产；（4）因自然灾害等不可抗力造成毁损、灭失的资产。 选项A、C、D 当选。"}, {"type": "single", "year": "", "title": "根据国有资产管理法律制度的规定，下列关于行政事业性国有资产报告的表述中，不正确的是（）。（2024 年）", "options": ["行政事业性国有资产管理情况按照国家有关规定向社会公开", "国务院向全国人民代表大会报告全国行政事业性国有资产管理情况", "县级以上地方人民政府财政部门应当每年汇总本级和下级行政事业性国有资产管理情况，报送本级政府和上一级政府财政部门", "县级以上地方人民政府向本级人民代表大会常务委员会报告行政事业性国有资产管理情况"], "answer": [1], "explain": "国务院向“全国人民代表大会常务委员会”报告全国行政事业性国有资产管理情 况。选项B 错误，当选。"}, {"type": "single", "year": "", "title": "根据行政事业性国有资产法律制度的规定，本部门应当汇总编制本部门行政事业性国有资产管理情况报告，报送特定部门。下列各项中，属于该特定部门的是（）。（2025 年）", "options": ["本级政府", "本级政府财政部门", "上一级政府财政部门", "国务院"], "answer": [1], "explain": "本部门应当汇总编制本部门行政事业性国有资产管理情况报告，报送本级政府财 政部门。选项B 当选。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，下列主体中，可以作为采购人的是（）。（2022 年）", "options": ["普通合伙企业", "国有参股公司", "国有独资企业", "事业单位"], "answer": [3], "explain": "采购人是指依法进行政府采购的国家机关、事业单位、团体组织，不包括“各种 企业”。选项D 当选。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，下列关于“公开透明原则”的表述中，不正确的是（）。（2023 年）", "options": ["所有的政府采购的信息均应当在政府采购监督管理部门指定的媒体上及时向社会公开发布", "政府采购目录和限额标准应当向社会公布", "政府采购项目的采购标准应当公开", "采购人在采购活动完成后，应当将采购结果予以公布"], "answer": [0], "explain": "选项A：政府采购的信息应当在政府采购监督管理部门指定的媒体上及时向社会公 开发布，但“涉及商业秘密的除外”。选项A 表述过于绝对，不正确。"}, {"type": "multi", "year": "", "title": "根据政府采购法律制度规定，下列属于以不合理的条件对供应商实行差别待遇或歧视的有（）。（2023 年）", "options": ["指定特定的专利、商标、品牌或供应商", "设定与合同履行有关的资格、技术和商务条件", "就同一采购项目向供应商提供有差别的项目信息", "对供应商采取不同的资格审查或评审标准"], "answer": [0, 2, 3], "explain": "有下列情形之一的，属于以不合理的条件对供应商实行差别待遇或者歧视待遇： （1） 就同一采购项目向供应商提供有差别的项目信息；（2）设定的资格、技术、商务条件与采购项 目的具体特点和实际需要不相适应或者与合同履行无关；（3）采购需求中的技术、服务等要求 指向特定供应商、特定产品；（4）以特定行政区域或者特定行业的业绩、奖项作为加分条件或 者中标、成交条件；（5）对供应商采取不同的资格审查或者评审标准；（6）限定或者指定特定 的专利、商标、品牌或者供应商；（7）非法限定供应商的所有制形式、组织形式或者所在地；（8） 以其他不合理条件限制或者排斥潜在供应商。选项A、C、D 当选。"}, {"type": "judge", "year": "", "title": "采购人采购未纳入集中采购目录的政府采购项目，不得委托集中采购机构代理采购。（）（2022 年）", "options": ["对", "错"], "answer": [1], "explain": "采购未纳入集中采购目录的政府采购项目，可以自行采购，也可以委托集中采购 机构在委托的范围内代理采购。本题表述错误。"}, {"type": "judge", "year": "", "title": "集中采购机构是设区的市级以上人民政府依法设立的企业法人。（  ）（2024年）", "options": ["对", "错"], "answer": [1], "explain": "集中采购机构，是设区的市级以上人民政府依法设立的非营利事业法人。本题表 述错误。"}, {"type": "judge", "year": "", "title": "纳入集中采购目录的项目，只能适用集中采购程序。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "纳入集中采购目录属于通用的政府采购项目的，应当委托集中采购机构代理采购； 属于本部门、本系统有特殊要求的项目，应当实行部门集中采购；属于本单位有特殊要求的项 目，经省级以上人民政府批准，可以自行采购。因此本题表述不正确。"}, {"type": "multi", "year": "", "title": "根据政府采购法律制度的规定，下列关于政府采购供应商应当具备条件的表述中，不正确的有（）。", "options": ["参与政府采购活动前2 年内没有违法记录", "必须是企业法人", "具有良好的商业信用和健全的财务会计制度", "具有履行合同所必需的设备和专业技术能力"], "answer": [0, 1], "explain": "（1）作为政府采购活动重要主体的供应商，应当具备下列法定条件：具有独立承 担民事责任的能力；具有良好的商业信用和健全的财务会计制度（选项C）；具有履行合同所必 需的设备和专业技术能力（选项D）；有依法缴纳税收和社会保障资金的良好记录；参与政府采 购活动前3 年内，在经营活动中没有重大违法记录；法律、行政法规规定的其他条件。（2）供 应商是指向采购人提供货物、工程或者服务的法人、其他组织或者自然人。"}, {"type": "single", "year": "", "title": "甲、乙、丙组成联合体参加政府采购活动，下列关于该联合体的说法正确的是（）。（2025 年）", "options": ["甲、乙、丙应当分别与采购人签订合同", "若丙不具有履行合同所必需的专业能力，不影响该联合体的资格", "甲、乙、丙就合同约定事项应对采购人各自单独承担责任", "该联合体应作为一个供应商参与采购活动"], "answer": [3], "explain": "联合体各方应当共同与采购人签订采购合同，就采购合同约定的事项对采购人承 担连带责任，选项A、C 不当选；以联合体形式进行政府采购的，参加联合体的供应商均应当具 备法定条件，并应当向采购人提交联合协议，载明联合体各方承担的工作和义务，选项B 不当 选；两个以上的自然人、法人或者其他组织可以组成一个联合体，以一个供应商的身份共同参 加政府采购，选项D 当选。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，甲、乙两公司组成联合体共同参加A 机关招标，下列说法正确的是（）。（2022 年）", "options": ["如果中标，甲、乙公司应当对A 机关承担连带责任", "如果中标，甲、乙公司应当分别与A 机关签订采购合同", "如果甲公司取得的同类资质比乙公司高，应当以甲公司资质确定该联合体的资质等级", "甲、乙公司组成联合体参加招标投标后，还可以同时以其名义单独参加该项目招投标"], "answer": [0], "explain": "（1）两个以上的自然人、法人或者其他组织可以组成一个联合体，以一个供应商 的身份共同参加政府采购。联合体各方应当“共同”与采购人签订采购合同（选项B 不正确）， 就采购合同约定的事项对采购人承担连带责任（选项A 正确）。（2）联合体中有同类资质的供应 商按照联合体分工承担相同工作的，应当按照资质等级“较低”的供应商确定资质等级（选项C 不正确）。（3）以联合体形式参加政府采购活动的，联合体各方“不得”再单独参加或者与其他 供应商另外组成联合体参加同一合同项下的政府采购活动（选项D 不正确）。"}, {"type": "multi", "year": "", "title": "根据政府采购法律制度的规定，下列情形中，应当采用邀请招标的有（）。（2024 年）", "options": ["具有特殊性，只能从特定的供应商处采购", "采用招标所需时间不能满足用户紧急需要", "采用公开招标方式的费用占政府采购项目总价值比例过大", "发生了不可预见的紧急情况不能从其他供应商处采购的"], "answer": [0, 2], "explain": "符合下列情形之一的货物或者服务，可以采用邀请招标的方式采购：（1）具有特 殊性，只能从有限范围的供应商处采购的，选项A 当选。（2）采用公开招标方式的费用占政府 采购项目总价值比例过大的，选项C 当选。选项B 应采用竞争性谈判方式采购，不当选。选项D 应采用单一来源方式采购，不当选。"}, {"type": "single", "year": "", "title": "某事业单位拟采购一种特定的技术服务，经向社会公开招标没有合格标的，在此情形下，根据政府采购法律制度的规定，该事业单位可以采用的采购方式是（）。", "options": ["询价", "邀请招标", "竞争性谈判", "单一来源采购"], "answer": [2], "explain": "有下列情形之一的，可以采用竞争性谈判方式采购：（1）招标后没有供应商投标 或者没有合格标的或者重新招标未能成立的；（2）技术复杂或者性质特殊，不能确定详细规格 或者具体要求的；（3）采用招标所需时间不能满足用户紧急需要的；（4）不能事先计算出价格 总额的。"}, {"type": "single", "year": "", "title": "下列各项中，可以采用单一来源方式采购的是（）。（2025 年）", "options": ["发生了不可预见的紧急情况不能从其他供应商处采购的", "具有特殊性，只能从有限范围的供应商处采购的", "招标后没有供应商投标的", "采用招标所需时间不能满足用户紧急需要的"], "answer": [0], "explain": "选项B，可以采用邀请招标方式采购；选项C、D，可以采用竞争性谈判方式采购。 选项A 当选。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，招标文件要求投标人提交投标保证金的，投标保证金不得超过采购项目预算金额的一定比例，该比例为（）。（2022 年）", "options": ["4%", "2%", "3%", "5%"], "answer": [1], "explain": "招标文件要求投标人提交投标保证金的，投标保证金不得超过采购项目预算金额 的2%。选项B 当选。"}, {"type": "judge", "year": "", "title": "投标人可采用现金形式提交投标保证金。（）（2025 年）", "options": ["对", "错"], "answer": [1], "explain": "投标保证金应当以支票、汇票、本票或者金融机构、担保机构出具的保函等非现 金形式提交。本题表述错误。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，采用招标方式进行政府采购的，自招标文件开始发出之日起至投标人提交投标文件截止之日止，不得少于一定期间，该期间为（）。", "options": ["20 日", "15 日", "10 日", "7 日"], "answer": [0], "explain": "货物和服务项目实行招标方式采购的，自招标文件开始发出之日起至投标人提交 投标文件截止之日止，不得少于20 日。选项A 正确。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，在招标采购中出现投标人的报价均超过了采购预算，采购人不能支付的情形时，采取的做法是（）。（2025 年）", "options": ["要求投标人重新报价", "变更采购方式", "废标", "修改采购预算"], "answer": [2], "explain": "在招标采购中，出现下列情形之一的，应予废标：（1）符合专业条件的供应商或 者对招标文件作实质响应的供应商不足3 家的；（2）出现影响采购公正的违法、违规行为的；（3） 投标人的报价均超过了采购预算，采购人不能支付的；（4）因重大事故，采购任务取消的。选 项C 当选。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，下列关于公开招标的表述中，正确的是（）。", "options": ["地方招标项目招标文件规定的各项技术标准符合地方标准即可", "进行公开招标的地方项目，应当明确只能由当地法人参加投标", "应当采用公开招标方式的项目的具体数额标准，一律由国务院规定", "采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购"], "answer": [3], "explain": "（1）招标文件规定的各项技术标准应当符合“国家强制性标准”。选项A 不正确。 （2）任何单位和个人“不得违法限制或者排斥本地区、本系统以外的法人或其他组织参加投标， 不得以任何方式非法干涉招标投标活动”。选项B 不正确。（3）应当采用公开招标方式的项目的 具体数额标准，属于中央预算的政府采购项目，由国务院规定；属于地方预算的政府采购项目， 由省、自治区、直辖市人民政府规定。选项C 不正确。"}, {"type": "single", "year": "", "title": "根据政府采购法律制度的规定，下列关于邀请招标的表述中，正确的是（）。", "options": ["投标人应在资格预审公告期结束之日起3 个工作日后，按公告要求提交资格证明文件", "采用公开招标方式的费用占政府采购项目总价值比例过大的，可以采用邀请招标方式", "采用邀请招标方式采购，资格预审公告的期限为5 个工作日", "招标采购单位应从评审合格投标人中通过随机方式选择2 家以上的投标人，并向其发出投标邀请书"], "answer": [1], "explain": "（ function dayKeyOf(ts){ const d=new Date(ts); const p=n=>(''+n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function dailyKey(){ return 'law_daily_'+(curUser||'guest')+'_v1'; }

function recordDaily(correct){
  const k=dayKeyOf(Date.now()); const all=loadDaily();
  const e=all[k]||{answered:0,correct:0,wrong:0,lastTs:Date.now()};
  e.answered++; if(correct) e.correct++; else e.wrong++; e.lastTs=Date.now(); all[k]=e; saveDaily(all);
}
function calcStreak(daily){
  let s=0; const d=new Date(); d.setHours(0,0,0,0);
  for(;;){ const k=dayKeyOf(d.getTime());
    if(daily[k]&&daily[k].answered>0) s++; else break;
    d.setDate(d.getDate()-1); if(s>3650) break; }
  return s;
}
function heatHtml(daily){
  const today=new Date(); today.setHours(0,0,0,0);
  const wkStart=new Date(today); wkStart.setDate(wkStart.getDate()-wkStart.getDay());
  const endTarget=new Date(2026,8,5); // 2026-09-05
  const end=new Date(endTarget); end.setDate(end.getDate()+(6-end.getDay())); // 该周周六
  let cells=''; const cur=new Date(wkStart);
  while(cur<=end){
    const k=dayKeyOf(cur.getTime()); const e=daily[k]; const n=e?e.answered:0;
    let l=0; if(n>=1)l=1; if(n>=3)l=2; if(n>=6)l=3; if(n>=10)l=4;
    cells+='<div class="hc l'+l+'" title="'+k+': '+(n||0)+' 题"></div>';
    cur.setDate(cur.getDate()+1);
  }
  return '<div class="heat">'+cells+'</div>';
}

function fmtSync(ts){
  if(!ts) return '—';
  const d=new Date(ts), now=Date.now(), diff=now-ts;
  const p=n=>(''+n).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  const today=new Date(); today.setHours(0,0,0,0);
  const that=new Date(ts); that.setHours(0,0,0,0);
  const dayDiff=Math.round((today-that)/86400000);
  if(dayDiff===0) return '今天 '+hm;
  if(dayDiff===1) return '昨天 '+hm;
  return (d.getMonth()+1)+'-'+p(d.getDate())+' '+hm;
}

function recoverAccountFromGist(cb){
  fetch("https://api.github.com/gists/"+GIST_ID,{headers:syncHeaders(),cache:'no-store'})
    .then(r=>r.ok?r.json():null).then(j=>{
      if(!j||!j.files){ cb(null); return; }
      let best=null, bestTs=0;
      BUILTIN_USERS.forEach(u=>{
        const f=j.files['progress_'+u+'.json'];
        if(f&&f.content){ try{ const o=JSON.parse(f.content); const acc=o.account, ts=o.ts||0;
          if(acc && BUILTIN_USERS.indexOf(acc)>=0 && ts>bestTs){ best=acc; bestTs=ts; } }catch(e){} }
      });
      cb(best);
    }).catch(()=>cb(null));
}
function syncPull(){
  fetch("https://api.github.com/gists/"+GIST_ID,{headers:syncHeaders(),cache:'no-store'})
    .then(r=>r.ok?r.json():null).then(j=>{
      if(j&&j.files){
        const f=j.files[gistFileName()];
        const txt=f?f.content:null;
        if(txt&&restoreLocal(txt)){
          wrongSet=loadWrongSet(); wrongStreak=loadWrongStreak(); favSet=loadFavSet();
          if(curKey && !isRandomMode) loadProgress(curKey);

function syncPush(showHint){
  if(syncBusy) return;
  if(!gistToken()){ if(showHint) syncStatus('请先点 ⚙ 设置 token'); return; }
  syncBusy=true; syncStatus('上云中…');
  const body={files:{}}; body.files[gistFileName()]={content:snapshotLocal()};
  fetch("https://api.github.com/gists/"+GIST_ID,{method:'PATCH',headers:Object.assign(syncHeaders(),{'Content-Type':'application/json'}),body:JSON.stringify(body)})
    .then(r=>{
      if(r.ok){ syncStatus('已上云'); markSynced(); }
      else { return r.text().then(t=>{ console.warn('gist push fail',r.status,t); syncStatus('上云失败'); }); }
    })
    .catch(()=>{ syncStatus('上云失败'); })
    .finally(()=>{ syncBusy=false; });
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function generateRandomSession(){
  const buckets={single:[],multi:[],judge:[]};
  CH_ORDER.forEach(key=>{
    ALL[key].questions.forEach((item,i)=>{
      const t=item.type;
      if(buckets[t]){ const c=Object.assign({},item); c._key=key; c._idx=i; buckets[t].push(c); }
    });
  });
  const take=(arr,n)=>{ shuffle(arr); return arr.slice(0,n); };   // slice 前 N → 桶内天然不重复
  const questions=take(buckets.single,20).concat(take(buckets.multi,10),take(buckets.judge,10));
  return {questions:questions, status:new Array(questions.length).fill(0),
          sel:new Array(questions.length).fill(null),
          revealed:new Array(questions.length).fill(false), idx:0, done:false};
}

    const ok=status[idx]===1;
    if(item.type==='fill'){
      const ans=Array.isArray(item.answer)?item.answer.join('、'):item.answer;
      h+='<div class="result '+(ok?'r-ok':'r-bad')+'">'+(ok?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+esc(ans)+'</div>';
    } else {
      const ans=item.answer.map(i=>String.fromCharCode(65+i)).join('、');
      h+='<div class="result '+(ok?'r-ok':'r-bad')+'">'+(ok?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+ans+'</div>';
    }
    h+='<div class="explain"><b>解析：</b>'+esc(item.explain)+'</div>';
    h+='<button class="retry" onclick="retry()">重做本题</button>';
  }
  if(isRandomMode && status.length===40 && status.every(x=>x===1||x===2)){
    const _ok=status.filter(x=>x===1).length;
    h+='<div class="rand-done">随机练习已完成 40 题 · 答对 '+_ok+' 题</div>';
    h+='<button class="confirm" onclick="regenerateRandom()">重新出题</button>';
  }
  card.innerHTML=h;
  document.getElementById('pos').textContent=(idx+1)+'/'+q.length;
  updateStat();
}
function pick(oi){
  if(revealed[idx]) return;
  const item=q[idx];
  if(item.type==='single'||item.type==='judge'){ sel[idx]=[oi]; check(); }
  else { if(!sel[idx]) sel[idx]=[]; const p=sel[idx].indexOf(oi); if(p>=0) sel[idx].splice(p,1); else sel[idx].push(oi); render(); }
}
function confirmMulti(){ if(revealed[idx]) return; if(!sel[idx]||sel[idx].length===0){ toast('请至少选择一个选项'); return; } check(); }
function numMatch(a,b){
  a=String(a).replace(/[, ]/g,''); b=String(b).replace(/[, ]/g,'');
  if(a===b) return true;
  const na=parseFloat(a.replace(/[^\d.\-]/g,'')), nb=parseFloat(b.replace(/[^\d.\-]/g,''));
  if(!isNaN(na)&&!isNaN(nb)){ if(nb===0) return na===0; return Math.abs(na-nb)/Math.abs(nb) < 0.01; }
  return a.indexOf(b)>=0||b.indexOf(a)>=0;
}
function isFillCorrect(){
  const item=q[idx]; const truth=(item.answer||[]).map(s=>String(s).trim());
  let u=(sel[idx]||'').trim();
  if(!u) return false;
  const parts=u.split(/[、|]/).map(s=>s.trim()).filter(Boolean);
  return parts.length>0 && parts.every(p=> truth.some(t=> numMatch(p,t)));
}
function onFillInput(el){ sel[idx]=el.value; }
function confirmFill(){ if(revealed[idx]) return; const v=(sel[idx]||'').trim(); if(!v){ toast('请输入答案'); return; } check(); }
function check(){
  let correct;
  if(q[idx].type==='fill'){ correct=isFillCorrect(); }
  else {
    const a=q[idx].answer.slice().sort().join(','), u=(sel[idx]||[]).slice().sort().join(',');
    correct=(a===u);
  }
  revealed[idx]=true; status[idx]=correct?1:2;
  recordDaily(correct);
  const id=curId();
  if(wrongSet===null) wrongSet=loadWrongSet();
  if(!correct){ wrongSet.add(id); }   // 仅答错时收录，不再自动移除
  if(isWrongMode) writeBack(q[idx]._key, q[idx]._idx, status[idx], sel[idx]);
  else saveProgress();
  saveWrongSet(wrongSet);
  render(); updateStat();
}
function retry(){ if(!revealed[idx]) return; revealed[idx]=false; status[idx]=0; sel[idx]=null; render(); }
function curId(){ return (isWrongMode||isFavMode||isRandomMode)? (q[idx]._key+'#'+q[idx]._idx) : (curKey+'#'+idx); }
function toggleFav(){
  if(favSet===null) favSet=loadFavSet();
  const id=curId();
  if(favSet.has(id)) favSet.delete(id); else favSet.add(id);
  saveFavSet(favSet); render();
}
function removeWrong(){
  const id=q[idx]._key+'#'+q[idx]._idx;
  if(wrongSet===null) wrongSet=loadWrongSet();
  wrongSet.delete(id); saveWrongSet(wrongSet);
  q.splice(idx,1); status.splice(idx,1); sel.splice(idx,1); revealed.splice(idx,1);
  if(!q.length){ toast('错题库已清空'); showMenu(); return; }
  if(idx>=q.length) idx=q.length-1;
  render(); updateStat();
}
function updateStat(){
  let ok=0,bad=0; status.forEach(x=>{ if(x===1)ok++; else if(x===2)bad++; });
  const left=q.length-ok-bad;
  document.getElementById('cOk').textContent=ok;
  document.getElementById('cBad').textContent=bad;
  document.getElementById('cLeft').textContent=left;
}
function next(){ if(idx<q.length-1){ idx++; render(); saveProgress(); } else toast('已经是最后一题'); }
function prev(){ if(idx>0){ idx--; render(); saveProgress(); } else toast('已经是第一题'); }

function openGrid(){
  if(!q.length) return;
  document.getElementById('gridTitle').textContent=((curKey==='__wrong__'?'错题库':(curKey==='__fav__'?'收藏夹':(curKey==='__random__'?'随机练习':ALL[curKey].name))))+' · 点击跳题';
  const cells=document.getElementById('gridCells'); cells.innerHTML='';
  q.forEach((item,i)=>{
    let cls='cell '+(i===idx?'cur':status[i]===1?'ok':status[i]===2?'bad':'un');
    const d=document.createElement('div'); d.className=cls; d.textContent=i+1;
    d.onclick=()=>{ idx=i; closeGrid(); render(); saveProgress(); };
    cells.appendChild(d);
  });
  document.getElementById('grid').classList.remove('hidden');
}
function closeGrid(){ document.getElementById('grid').classList.add('hidden'); }

let toastTimer=null;
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1400); }

let sx=0,sy=0;
const cw=document.getElementById('cardWrap');
cw.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
cw.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ if(dx<0) next(); else prev(); } },{passive:true});

const BUILTIN_USERS=['jiaqu','syy'];
let curUser=null;
function getUser(){ const u=localStorage.getItem('law_user'); return u?u:''; }
function setUser(u){ localStorage.setItem('law_user',u); curUser=u; updateUserChip(); }
function updateUserChip(){ const c=document.getElementById('userChip'); if(c) c.textContent=curUser||''; }
function showLogin(allowClose){ const b=document.getElementById('login'); if(b){ const x=document.getElementById('loginClose'); if(x) x.style.display=(allowClose||curUser)?'':'none'; b.classList.remove('hidden'); } }
function hideLogin(){ const b=document.getElementById('login'); if(b){ b.classList.add('hidden'); const i=document.getElementById('loginInput'); if(i) i.value=''; } }
function pickUser(u){ if(!u) return; setUser(u); setHashAccount(u); hideLogin(); startSession(); scheduleSync(); }
function confirmInput(){ const i=document.getElementById('loginInput'); const v=(i&&i.value||'').trim(); if(v) pickUser(v); }
function switchUser(){ showLogin(true); }
function startSession(){
  wrongSet=loadWrongSet(); wrongStreak=loadWrongStreak(); favSet=loadFavSet();
  loadLastSync(); renderLastSync();
  updateUserChip();
  renderMenu();
  syncPull();
}
function accountFromHash(){ return (location.hash||'').replace(/^#/,'').trim(); }
function setHashAccount(u){ try{ history.replaceState(null,'','#'+u); }catch(e){ try{ location.hash=u; }catch(_){} } }
function boot(){
  hideLogin();
  curUser=getUser();
  if(!curUser){ const h=accountFromHash(); if(h){ curUser=h; setUser(curUser); } }
  if(!gistToken()){ showTokenPanel(false); }
  else if(!curUser){
    recoverAccountFromGist(function(acc){
      if(acc){ setUser(acc); setHashAccount(acc); startSession(); } else { showLogin(); }
    });
  }
  else { startSession(); }
}
boot();
</script>
