ns": ["乙公司需要经股东会决议", "乙公司需要经董事会决议，不需要股东会决议", "甲公司应当经董事会决议，不需要股东会决议", "甲公司与乙公司都不需要股东会决议"], "answer": [0], "explain": "公司与其持股90%以上的公司合并，被合并的公司不需经股东会决议，但应当通知 其他股东，其他股东有权请求公司按照合理的价格收购其股权或者股份。公司合并支付的价款 不超过本公司净资产10%的，可以不经股东会决议：但是，公司章程另有规定的除外。公司依照 前述规定合并不经股东会决议的，应当经董事会作出决议。本题中，甲公司持有乙公司65%的股 份，未到90%，甲公司合并支付的价款超过净资产10%，故甲、乙公司各自的合并决议均需要由 股东会作出，选项B、C、D 不当选。"}, {"type": "single", "year": "", "title": "甲公司分立成乙、丙两公司。根据分立协议，乙公司承继甲公司20%净资产，丙公司承继甲公司80%净资产以及所有负债。甲公司的到期债权人丁公司接到分立通知后，要求上述相关公司立即清偿债务。下列关于丁公司债务清偿请求的表述中，符合公司法律制度规定的是（）。", "options": ["丁公司仅能请求乙公司对该债务承担20%的责任", "丁公司仅能请求丙公司对该债务承担责任，不能请求乙公司对该债务承担责任", "丁公司可请求乙、丙公司对该债务承担连带责任", "丁公司仅能请求丙公司对该债务承担80%的责任"], "answer": [2], "explain": "公司分立前的债务由分立后的公司承担连带责任。但是，公司在分立前与债权人 就债务清偿达成的书面协议另有约定的除外。"}, {"type": "single", "year": "", "title": "甲公司于2024 年7 月21 日作出了减少注册资本的决议，下列相关说法中，不正确的是（）。（2024 年）", "options": ["甲公司应当编制资产负债表及财产清单", "甲公司应当于8 月20 日前通知债权人", "甲公司应当按照股东的出资比例相应减少出资额", "甲公司应当依法向公司登记机关办理变更登记"], "answer": [1], "explain": "选项B：应为“7 月31 日前”通知债权人，8 月20 日前在报纸或者国家企业信用 信息公示系统公告。"}, {"type": "multi", "year": "", "title": "关于公司减资补亏，下列说法正确的有（）。（2024 年）", "options": ["应当通知债权人", "减资后，在盈余公积金累计额达到公司注册资本50%前，不得分配利润", "减资时公司不得向股东分配", "减资时不得免除股东缴纳出资的义务"], "answer": [1, 2, 3], "explain": "公司依照《公司法》的规定弥补亏损后，仍有亏损的，可以减少注册资本弥补亏 损。减少注册资本弥补亏损的，公司不得向股东分配，也不得免除股东缴纳出资或者股款的义 务，选项C、D 当选。依照前述规定减少注册资本的，不需要通知债权人，但应当自股东会作出 减少注册资本决议之日起30日内在报纸上或者国家企业信用信息公示系统公告，选项A 不当选。 公司依照前述规定减少注册资本后，在法定公积金和任意公积金（盈余公积金分为法定公积金 和任意公积金）累计额达到公司注册资本50%前，不得分配利润，选项B 当选。"}, {"type": "single", "year": "", "title": "根据公司法律制度的规定，有限责任公司单独或者合计持有公司全部股东表决权10%以上的股东，以特定事由提出解散公司诉讼，并符合公司法律制度有关规定的，人民法院应予以受理。下列表述中，属于该类事由的是（）。（根据2024 年考生回忆编写）", "options": ["股东知情权受到严重损害的", "股东利润分配请求权受到严重损害的", "公司依法被吊销企业法人营业执照未进行清算的", "公司持续2 年以上无法召开股东会，公司经营管理发生严重困难的"], "answer": [3], "explain": "选项A、B：股东可以选择提起“直接诉讼”而非“解散公司诉讼”；选项C：公 司已经解散，无需再次提起“解散公司诉讼”。"}, {"type": "single", "year": "", "title": "甲公司吸收合并乙公司，乙公司解散。有关乙公司解散应当办理的手续，下列说法中，符合公司法律制度规定的是（）。（2023 年）", "options": ["乙公司不必进行清算，不必办理注销登记", "乙公司必须进行清算，但不必办理注销登记", "乙公司必须进行清算，必须办理注销登记", "乙公司不必进行清算，但必须办理注销登记"], "answer": [3], "explain": "（1）公司除因“合并、分立”而解散外，其余原因引起的解散，都应当经过清算； （2）公司清算结束后，清算组应当制作清算报告，报股东会或者人民法院确认，并报送公司登 记机关，申请注销公司登记。"}, {"type": "judge", "year": "", "title": "公司已经清偿全部债务的，经全体股东承诺，可以通过简易程序注销公司登记。（）（2024 年）1.", "options": ["对", "错"], "answer": [0], "explain": "题干表述正确。"}]}, "ch3": {"name": "合伙企业法律制度", "questions": [{"type": "single", "year": "", "title": "甲、乙、丙共同设立一家普通合伙企业，合伙协议明确约定：合伙人按照实缴出资比例分配利润和承担亏损。甲实缴出资50 万元，乙、丙分别实缴出资30 万元。为扩大经营规模，该合伙企业向债权人丁借款80 万元用于采购设备。借款到期后，合伙企业因经营不善暂时无力清偿该笔债务。下列关于该笔合伙企业债务清偿的说法中，正确的是（）。（2025 年）", "options": ["若合伙企业财产不足以清偿80 万元债务，甲先行以个人财产全额清偿后，可向乙、丙分别追偿", "债权人丁有权直接要求甲以个人财产全额清偿80 万元债务", "债权人丁应该先找甲、乙、丙，甲、乙、丙不能承担了再找该合伙企业", "甲、乙、丙仅需以各自实缴出资额为限对80 万元债务承担责任"], "answer": [0], "explain": "合伙企业对其债务，应先以其全部财产进行清偿。合伙企业的债权人应首先从合伙 企业的全部财产中求偿，而不应当向合伙人个人直接请求债权。选项B、C 不当选。普通合伙企 业不能清偿到期债务的，合伙人承担无限连带责任。所谓合伙人的连带责任，是指当合伙企业的 全部财产不足以偿付到期债务时合伙企业的债权人对合伙企业所负债务，可以向任何一个合伙 人主张，该合伙人不得以其出资的份额大小、合伙协议有特别约定、合伙企业债务另有担保人或 者自己已经偿付所承担的份额等理由来拒绝。选项D 不当选。"}, {"type": "multi", "year": "", "title": "某会计师事务所是特殊的普通合伙企业，李某为合伙人。根据合伙企业法律制度的规定，关于李某在执业过程中造成的合伙企业债务承担的下列表述中，正确的是（）。（2018 年）", "options": ["李某造假引起合伙企业债务，由李某本人承担无限责任", "李某造假引起合伙企业债务，合伙企业对外承担责任后，李某应当按照合伙协议的约定，赔偿合伙企业的损失", "李某造假引起合伙企业债务，其他合伙人以其在合伙企业中的财产份额为限承担责任", "李某非故意或者重大过失造成的企业债务，全体合伙人承担无限连带责任"], "answer": [0, 1, 2, 3], "explain": "特殊的普通合伙企业：（1）一个合伙人或者数个合伙人在执业活动中因故意或者重 大过失造成合伙企业债务的，应当承担无限责任或者无限连带责任，其他合伙人以其在合伙企业 中的财产份额为限承担责任；（2）合伙人在执业活动中非因故意或者重大过失造成的合伙企业 债务以及合伙企业的其他债务，由全体合伙人承担无限连带责任。"}, {"type": "multi", "year": "", "title": "A、B、C、D 各自认缴并实际缴付出资10 万元设立甲有限合伙企业（以下简称“甲企业”），A 为有限合伙人，其他3 人为普通合伙人。现甲企业以其全部财产对债权人乙进行清偿后仍欠乙80 万元到期债务不能清偿。下列关于乙的权利的表述中，正确的有（）。（2023年）", "options": ["乙有权要求B 清偿80 万元", "乙有权要求A、B、C、D 每人清偿20 万元", "乙有权要求B、C 每人清偿40 万元", "乙有权要求A、B 每人清偿40 万元"], "answer": [0, 2], "explain": "有限合伙企业由普通合伙人和有限合伙人组成，普通合伙人对合伙企业债务承担无 限连带责任，有限合伙人以其认缴的出资额为限对合伙企业债务承担责任。选项A、C 当选。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，在第三人有理由相信有限合伙人为普通合伙人并与其交易的情况下，下列表述中，正确的是（）。", "options": ["合伙企业可以主张该笔交易无效", "该有限合伙人对该笔交易不承担责任", "该有限合伙人以其财产份额为限对该笔交易承担责任", "该有限合伙人对该笔交易承担与普通合伙人相同的责任"], "answer": [3], "explain": "第三人有理由相信有限合伙人为普通合伙人并与其交易的，该有限合伙人对该笔交 易承担与普通合伙人同样的责任。"}, {"type": "single", "year": "", "title": "2024 年6 月，自然人甲、乙、丙设立某合伙企业。合伙协议约定：甲、乙各出资30 万元，丙出资90 万元，均应于合伙企业成立之日起2 年内缴清。合伙协议未约定利润分配事项。2025 年6 月，合伙企业拟分配利润，此时甲、乙已完全履行出资义务，丙已向合伙企业出资60 万元。在甲、乙、丙未能就利润分配方案达成一致意见的情形下，下列关于此次利润应如何分配的表述中，正确的是（）。", "options": ["甲、乙、丙应按1∶1∶1 的比例分配", "甲、乙、丙应按1∶1∶2 的比例分配", "甲、乙、丙应按1∶1∶3 的比例分配", "甲、乙、丙应按各自从合伙企业中取得的报酬比例分配"], "answer": [1], "explain": "合伙企业的利润分配、亏损分担规则依次为：按照合伙协议的约定办理；合伙协议 未约定或者约定不明确的，由合伙人协商决定；协商不成的，由合伙人按照实缴出资比例分配、 分担；无法确定出资比例的，由合伙人平均分配、分担。本题中，合伙协议未有约定且合伙人协 商不成，因此合伙人应当按“实缴出资比例”分配利润。甲、乙实际缴纳出资30 万元，丙实际 缴纳出资60 万元（实缴出资比例为1∶1∶2），选项B 当选。"}, {"type": "multi", "year": "", "title": "某普通合伙企业有甲、乙两个合伙人，合伙协议约定合伙人之间利润分配和亏损分担的比例是1∶1。该合伙企业欠丙货款20 万元，合伙企业财产价值为10 万元。丙在获得合伙企业财产10 万元之后，其余10 万元可以要求（）。", "options": ["甲全部偿还", "乙全部偿还", "甲偿还5 万元，乙偿还5 万元", "甲偿还1 万元，乙偿还9 万元"], "answer": [0, 1, 2, 3], "explain": "普通合伙企业不能清偿到期债务的，普通合伙人需承担无限连带责任。合伙企业内 部利润分配、亏损分担规则对债权人没有约束力。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，下列合伙企业内部利润分配、亏损分担规则的表述中，正确的是（）。", "options": ["普通合伙企业的合伙协议中约定将全部利润分配给部分合伙人", "有限合伙企业的合伙协议中约定将全部利润分配给部分合伙人", "普通合伙企业的合伙协议中约定由部分合伙人承担全部亏损", "有限合伙企业的合伙协议中约定由部分合伙人承担全部亏损"], "answer": [1], "explain": "（1）普通合伙企业的合伙协议中不得约定将全部利润分配给部分合伙人或者由部分 合伙人承担全部亏损。选项A、C 不当选。有限合伙企业的合伙协议中不得约定由部分合伙人承 担全部亏损，但是可以约定将全部利润分配给部分合伙人。选项D 不当选、选项B 当选。"}, {"type": "single", "year": "", "title": "某普通合伙企业有甲、乙、丙、丁四位合伙人，合伙协议约定，合伙企业债务由各合伙人平均承担。现该合伙企业无力清偿到期债务12 万元，甲向债权人清偿了9 万元，乙向债权人清偿了3 万元。根据合伙企业法律制度的规定，下列关于合伙企业债务内部追偿的表述中，正确的是（）。", "options": ["甲无权向丙或丁追偿", "甲可以向丁追偿3 万元", "甲可以向乙追偿3 万元", "甲可以向丙追偿6 万元"], "answer": [1], "explain": "普通合伙人由于承担无限连带责任，清偿数额超过规定的亏损分担比例的，有权按 照合伙企业内部亏损分担规则向其他普通合伙人追偿。本题中，合伙协议约定合伙企业债务由各 合伙人平均承担，即每人承担3 万元。甲清偿了9 万元后，多清偿的6 万元实际上是帮丙、丁 垫付的款项，甲可以向丙、丁各追偿3 万元，但是不得向乙追偿，选项B 当选。"}, {"type": "multi", "year": "", "title": "甲普通合伙企业（以下简称“甲企业”）的合伙人赵某由于个人原因对李某负有到期债务20 万元，其自有财产不足以清偿该债务。同时李某对甲企业负有到期债务50 万元。下列关于李某债权实现方式的表述中，正确的有（）。（2020 年）", "options": ["李某可以其对赵某的债权抵销其对甲企业的债务", "赵某可以其从甲企业分取的收益清偿对李某所负的债务", "李某可代位行使赵某在甲企业中的权利", "李某可请求人民法院强制执行赵某在甲企业中的财产份额用以清偿债务"], "answer": [1, 3], "explain": "（1）合伙人发生与合伙企业无关的债务，相关债权人不得以其债权抵销其对合伙企 业的债务；也不得代位行使合伙人在合伙企业中的权利。选项A、C 不当选；（2）合伙人的自有 财产不足清偿其与合伙企业无关的债务的，该合伙人可以以其从合伙企业中分取的收益用于清 偿；债权人也可以依法请求人民法院强制执行该合伙人在合伙企业中的财产份额用于清偿。选项 B、D 当选。"}, {"type": "single", "year": "", "title": "甲为某普通合伙企业的合伙人，该合伙企业经营动感单车销售业务。甲拟再设立一家经营动感单车销售业务的个人独资企业。下列关于甲能否设立该个人独资企业的表述中，符合合伙企业法律制度规定的是（）。", "options": ["甲经其他合伙人一致同意，可以设立该个人独资企业", "甲可以设立该个人独资企业，除非合伙协议另有约定", "甲如不执行合伙企业事务，就可以设立该个人独资企业", "甲只要具有该合伙企业合伙人的身份，就不可以设立该个人独资企业"], "answer": [3], "explain": "选项D：普通合伙人不得自营或者同他人合作经营与本合伙企业相竞争的业务。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，普通合伙企业的下列事务中，应当经全体合伙人一致同意的有（）。", "options": ["将合伙人除名", "普通合伙人以其财产份额出质", "订立书面合伙协议", "合伙企业解散时如指定一个或数个合伙人，或委托第三人担任清算人"], "answer": [0, 1, 2], "explain": "选项D：合伙企业解散时如指定一个或数个合伙人，或委托第三人担任清算人，应 经全体合伙人过半数同意。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，有限合伙企业的下列事务中，应当通知其他（或全体）合伙人方可从事的有（）。", "options": ["普通合伙人向合伙人以外的人转让其财产份额的", "普通合伙人之间转让财产份额的", "有限合伙人向合伙人以外的人转让其财产份额的", "普通合伙人在合伙企业中的财产份额被人民法院强制执行的"], "answer": [1, 2, 3], "explain": "选项A：普通合伙人向合伙人以外的人转让其财产份额的，除合伙协议另有约定外， 应当经其他合伙人一致同意。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，普通合伙企业的下列事务中，除合伙协议另有约定外，应该经合伙人一致同意的事项有（）。", "options": ["合伙人为企业提供担保", "合伙人处分一辆货车", "转让甲企业的知识产权", "改变甲企业的经营范围"], "answer": [2, 3], "explain": "除合伙协议另有约定外，合伙企业的下列事项应当经全体合伙人一致同意：（1）改 变合伙企业的名称；（2）改变合伙企业的经营范围、主要经营场所的地点（选项D）；（3）处分 合伙企业的不动产（而非处分“动产”），选项B 不当选；（4）转让或者处分合伙企业的知识产权 和其他财产权利（选项C）；（5）以“合伙企业名义”为他人提供担保（而非“以合伙人名义为 合伙企业提供担保”），选项A 不当选；（6）聘任合伙人以外的人担任合伙企业的经营管理人员等。"}, {"type": "single", "year": "", "title": "某普通合伙企业举行合伙人会议表决对外投资事项，但合伙协议对该事项的表决办法未作约定。根据合伙企业法律制度的规定，下列关于该事项表决办法的表述中，正确的是（）。", "options": ["须全体合伙人一致同意", "须持有过半数财产份额的合伙人同意", "须过半数合伙人同意", "须2/3 以上合伙人同意"], "answer": [2], "explain": "“对外投资”事项，既不是法定事项，也不是“有约定，按约定办理，无约定，需 合伙人一致同意”的事项，因此适用“有约定，按约定办理，无约定，由合伙人一人一票过半数 通过”的决议办法。本题合伙协议无约定，因此应当执行合伙人一人一票过半数通过。"}, {"type": "single", "year": "", "title": "甲、乙、丙、丁出资设立某普通合伙企业，各自出资25%。在合伙协议没有约定的情况下，下列合伙人提出的事项中，可以通过的是（  ）。（2023 年）", "options": ["甲提出将自己的设备卖给合伙企业，乙、丙同意，丁不同意", "乙提出自己转为有限合伙人，甲、丙同意，丁不同意", "丙提出修改企业的经营范围，甲、乙同意，丁不同意", "丁提出装修企业店面，甲、乙同意，丙不同意"], "answer": [3], "explain": "普通合伙人与本企业进行交易、普通合伙人转为有限合伙人、合伙企业改变经营范 围，除了合伙协议另有约定外，必须经全体合伙人一致同意。选项A、B、C 不当选。选项D，既 不是法定事项，也不是“有约定，按约定办理，无约定，需合伙人一致同意”的事项，因此适用 “有约定，按约定办理，无约定，由合伙人一人一票过半数通过”的规则。本题合伙协议无约定， 因此应当执行合伙人一人一票过半数通过。选项D 当选。"}, {"type": "single", "year": "", "title": "普通合伙人甲、乙、丙、丁分别持有某合伙企业18%、20%、27%和35%的财产份额。合伙协议约定：合伙人对外转让财产份额应当经持有3/5 以上合伙财产份额的合伙人同意。现甲欲将其持有的10%财产份额转让给非合伙人戊，并将剩余8%的财产份额转让给合伙人丙。根据合伙企业法律制度的规定，下列表述中，正确的是（）。", "options": ["未经乙、丙、丁一致同意，甲不得将其财产份额转让给戊", "未经丁同意，甲不得将其财产份额转让给丙", "经丙、丁同意，甲即可将其财产份额转让给戊", "未经乙同意，甲不得将其财产份额转让给丙"], "answer": [2], "explain": "除合伙协议另有约定外，普通合伙人向合伙人以外的人转让其在合伙企业中的全部 或者部分财产份额时，须经其他合伙人一致同意。本题中由于合伙协议约定合伙人对外转让财产 份额需经持有3/5 以上合伙财产份额的合伙人同意即可，因此，经丙、丁（合计持有财产份额≥ 62%）同意，甲即可对外转让财产份额。选项A 不当选、选项C 当选。普通合伙人之间转让在合 伙企业中的全部或者部分财产份额时，应当通知其他合伙人。选项B、D 不当选。"}, {"type": "single", "year": "", "title": "下列主体可以成为普通合伙人的是（）。（2025 年）", "options": ["丙慈善组织", "甲上市公司", "15 周岁的少年大学生李某", "乙合伙企业"], "answer": [3], "explain": "国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普 通合伙人，选项A、B 不当选；合伙人为自然人的，应当具有完全民事行为能力，无民事行为能 力人和限制民事行为能力人不得成为普通合伙企业的合伙人，选项C 不当选。选项D 当选。"}, {"type": "multi", "year": "", "title": "赵某、钱某、孙某、李某拟成立甲有限合伙企业，其中孙某为有限合伙人，其他为普通合伙人。下列拟采取的出资方式中，符合法律规定的有（）。（2024 年）", "options": ["钱某以自有的一项专利权出资", "赵某以自有的一辆货车出资", "李某以自有的一套房屋出资", "孙某以其劳务出资"], "answer": [0, 1, 2], "explain": "有限合伙人可以用货币、实物、知识产权、土地使用权或者其他财产权利出资，不 得以劳务出资。普通合伙人可以用劳务出资。选项A、B、C 当选。"}, {"type": "single", "year": "", "title": "下列关于普通合伙企业设立的说法中，正确的是（）。（2024 年）", "options": ["合伙人以著作权出资，只能由全体合伙人委托评估", "合伙人以劳务出资，评估办法由全体合伙人协商，无须协议载明", "合伙人以商品房出资，应当办理权属转移登记手续", "合伙协议应当载明合伙企业的经营期限"], "answer": [2], "explain": "合伙人以实物、知识产权、土地使用权或者其他财产权利出资，需要评估作价的， 可以由全体合伙人协商确定，也可以由全体合伙人委托法定评估机构评估，选项A 不当选。合伙 人以劳务出资的，其评估办法由全体合伙人协商确定，并在合伙协议中载明，选项B 不当选。合 伙协议应当载明下列事项：合伙企业的名称和主要经营场所的地点；合伙目的和合伙经营范围； 合伙人的姓名或者名称、住所；合伙人的出资方式、数额和缴付期限；利润分配、亏损分担方式； 合伙事务的执行；入伙与退伙；争议解决办法；合伙企业的解散与清算；违约责任等，选项D 不 当选。选项C 当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于普通合伙企业设立的表述中，正确的有（）", "options": ["合伙协议经过全体合伙人签名、盖章后，还需要向登记机关备案方可生效", "普通合伙企业设立分支机构，应当向合伙企业所在地的企业登记机关申请登记", "合伙企业必须有书面合伙协议", "合伙企业在领取营业执照之前，合伙人不得以合伙企业名义从事合伙业务"], "answer": [2, 3], "explain": "合伙协议经全体合伙人签名、盖章后生效。选项A 不当选。合伙企业设立分支机 构，应当向“分支机构所在地”的企业登记机关申请登记，领取营业执照。选项B 不当选。合伙 企业应当有合伙协议，合伙协议依法由全体合伙人协商一致，以书面形式订立。选项C 当选。合 伙企业领取营业执照前，合伙人不得以合伙企业名义从事合伙业务。选项D 当选"}, {"type": "single", "year": "", "title": "甲、乙、丙、丁四人拟共同出资成立一家普通合伙企业，合伙协议约定，甲以货币出资，乙以国有土地使用权出资，丙以专利技术出资，丁以劳务出资。合伙协议对出资的评估和缴纳方法未作约定。根据合伙企业法律制度的规定，下列关于各合伙人出资的表述中，正确的是（）。", "options": ["甲的货币出资不得分期缴纳", "乙可以自行委托评估机构评估土地使用权价值", "丙的专利技术出资可以由全体合伙人协商确定价值，也可以由丙自行委托法定评估机构评估", "丁的劳务出资价值评估办法应由全体合伙人协商确定，并在合伙协议中载明"], "answer": [3], "explain": "合伙人是否允许分期出资由合伙协议约定，而非绝对禁止。选项A 不当选。合伙人 以非货币财产出资，需要评估作价的，可以由“全体”合伙人协商确定，也可以由“全体”合伙 人委托法定评估机构评估。选项B、C 不当选。普通合伙人以劳务出资的，其评估办法由全体合 伙人协商确定，并在合伙协议中载明。选项D 当选。"}, {"type": "single", "year": "", "title": "陈某、刘某和甲公司共同出资设立乙普通合伙企业（以下简称“乙企业”）。下列财产中不属于乙企业财产的是（）。（2025 年）", "options": ["甲公司出资到乙企业的商标使用权", "乙企业对丙公司的应收账款债权", "刘某出资到乙企业的房屋", "陈某对甲公司的货款债权"], "answer": [3], "explain": "合伙人的出资、以合伙企业名义取得的收益和依法取得的其他财产，均为合伙企业 的财产。选项A、B、C 不当选。选项D 是合伙人个人的债权，不属于合伙企业的财产，当选。"}, {"type": "single", "year": "", "title": "甲、乙、丙三人共同设立某普通合伙企业，甲以一辆小汽车出资，乙和丙以货币出资。合伙企业设立后，甲私自将出资的小汽车售予不知情的丁，双方订立了书面的买卖合同并交付。根据合伙企业法律制度规定，下列说法中正确的是（）。（2023 年）", "options": ["买卖合同无效", "买卖合同效力待定", "买卖合同有效，丁是否取得汽车的所有权取决于合伙企业对甲处分行为的追认与否", "买卖合同有效，丁取得该汽车的所有权"], "answer": [3], "explain": "甲的无权处分行为不影响买卖合同的效力。选项A、B 不当选。合伙人在合伙企业 清算前私自转移或者处分合伙企业财产的，合伙企业不得以此对抗善意第三人。选项C 不当选、 选项D 当选。"}, {"type": "single", "year": "", "title": "甲普通合伙企业的合伙人孙某将其在合伙企业中的财产份额转让给非合伙人赵某。下列关于赵某取得合伙人资格的时间的表述中，正确的是（）。", "options": ["与合伙人孙某签订财产份额转让合同且支付相应价款之日", "修改合伙协议，将赵某列为合伙人之日", "企业登记机关变更登记之日", "与合伙人孙某签订财产份额转让合同之日"], "answer": [1], "explain": "合伙人以外的人依法受让合伙人在合伙企业中的财产份额的，经修改合伙协议即成 为合伙企业的合伙人。选项B 当选。"}, {"type": "single", "year": "", "title": "2019 年7 月1 日，郑某、丁某、马某分别出资20000 元设立了普通合伙企业。11 月1 日，郑某拟将自己在合伙企业的财产份额的50%按10000 元转让。郑某通知丁某、马某后，丁某表示愿意以8000 元买下，马某未表态。11 月3 日，郑某的好友齐某知道后，愿意以10000 元购买该份额；马某得知后，随即表示愿以10000 元购买该份额。该合伙企业的合伙协议对合伙人转让财产份额未作特别约定。下列关于郑某财产份额转让的表述中，正确的是（）。（2020 年）", "options": ["郑某应将其财产份额转让给齐某", "郑某应将其财产份额转让给马某", "郑某应将其财产份额转让给丁某", "郑某的财产份额不可以转让"], "answer": [1], "explain": "由于本题所涉普通合伙企业，其合伙协议中关于合伙人转让财产份额未作特别约 定，因此在普通合伙人对外转让财产份额时，须经其他合伙人一致同意，且在同等条件下，其他 合伙人有优先购买权。本题中，郑某与丁某：属于内部转让，只需通知马某，不需要马某同意， 可惜丁某出价过低，郑某不愿转让；郑某与齐某：属于对外转让，由于马某出价相同且合伙协议 没有特殊约定，马某享有优先购买权，齐某无法购买，选项B 当选。"}, {"type": "single", "year": "", "title": "甲系某普通合伙企业的合伙人，因资金紧张拟向乙借款100 万元。甲以其在该合伙企业的财产份额向乙出质，该出质事宜甲未通知该合伙企业和其他合伙人，乙对甲擅自出质财产份额一事不知情。根据合伙企业法律制度规定，甲以其在合伙企业中的财产份额出质的行为效力属于（）。（2023 年）", "options": ["有效", "无效", "可撤销", "效力待定"], "answer": [1], "explain": "普通合伙人以其在合伙企业中的财产份额出质的，须经其他合伙人一致同意；未经 其他合伙人一致同意，其行为“无效”，由此给善意第三人造成损失的，由行为人依法承担赔偿 责任。选项B 当选。"}, {"type": "single", "year": "", "title": "张某、李某和王某三人共同成立了甲普通合伙企业（以下简称“甲企业”）。合伙协议约定：由张某对外代表合伙企业，执行合伙事务；张某代表合伙企业签订标的额超过50万元的合同时，应当经过李某和王某的同意。某日，张某在未经李某、王某同意的情况下代表甲企业与乙公司订立了一份金额100 万元的买卖合同，乙公司对于张某越权代表不知情。根据合伙企业法律制度规定，下列关于甲企业与乙公司订立的买卖合同的效力的说法中，正确的是（）。（2023 年）", "options": ["有效", "无效", "可撤销", "效力待定"], "answer": [0], "explain": "合伙企业对合伙人执行合伙事务以及对外代表合伙企业权利的限制，不得对抗善意 第三人。本题中，乙公司对于张某越权代表一事并不知情，属于善意第三人，因此张某与之订立 的买卖合同有效。选项A 当选。"}, {"type": "single", "year": "", "title": "张某、李某、王某和赵某共同设立甲普通合伙企业（以下简称“甲企业”），下列关于甲企业事务执行的表述中，正确的是（）。（2022 年）", "options": ["若合伙协议约定由张某和李某执行合伙企业事务，张某对李某执行的事务提出异议时，不停止该项事务的执行", "若合伙协议约定由张某和李某执行合伙企业事务，王某和赵某不再执行合伙事务", "若合伙协议未约定合伙事务执行人，则出资最少的张某无权对外代表合伙企业", "若合伙协议约定由张某执行合伙企业事务，张某不按合伙协议执行事务，其他合伙人不得撤销对张某的委托"], "answer": [1], "explain": "选项A 不当选：合伙协议约定或者经全体合伙人决定，合伙人分别执行合伙企业事 务时，合伙人可以对其他合伙人执行的事务提出异议；提出异议时，应当暂停该项事务的执行； 如果发生争议，可由全体合伙人共同决定。选项B 当选：如果委托一名或者数名合伙人执行合伙 企业事务的，其他人不再执行合伙企业事务；不参加执行事务的合伙人有权监督执行事务的合伙 人，检查其执行合伙企业事务的情况；执行合伙企业事务的合伙人应当依照约定向其他合伙人报 告事务执行情况及合伙企业经营状况、财务状况。选项C 不当选：未明确说明执行事务的合伙 人，则由全体合伙人共同执行合伙事务，对外代表合伙企业。选项D 不当选：被委托执行合伙企 业事务的合伙人不按照合伙协议或者全体合伙人的决定执行事务的，其他合伙人可决定撤销该 委托。"}, {"type": "multi", "year": "", "title": "赵某、钱某、乙公司为甲普通合伙企业的合伙人，其中赵某、乙公司为合伙事务执行人，乙公司委派王某代表其执行合伙事务。下列关于合伙人权利和义务表述正确的有（）。（2025 年）", "options": ["钱某有权对外代表甲合伙企业", "赵某和乙公司应定期向钱某报告甲企业财务状况", "钱某有权监督赵某和王某执行合伙事务的情况", "钱某有权查阅甲合伙企业会计账簿"], "answer": [1, 2, 3], "explain": "委托一个或者数个合伙人执行合伙事务的，其他合伙人不再执行合伙事务，执行合 伙事务的合伙人对外代表企业，选项A 不当选。由一个或者数个合伙人执行合伙事务的，执行事 务合伙人应当定期向其他合伙人报告事务执行情况以及合伙企业的经营和财务状况，选项B 当 选。不执行合伙事务的合伙人有权监督执行事务合伙人执行合伙事务的情况，选项C 当选。合伙 人有查阅合伙企业会计账簿等财务资料的权利，选项D 当选。"}, {"type": "single", "year": "", "title": "甲普通合伙企业（以下简称“甲企业”）拟聘任非合伙人张某担任经营管理人员，合伙协议对聘请经营管理人员事项未作特别约定。下列关于张某的聘任程序和职责的表述中，正确的是（）。（2022 年）", "options": ["张某在履行职务过程中因重大过失给甲企业造成损失的，应当承担赔偿责任", "张某被聘为经营管理人员后，当然取得甲企业普通合伙人资格", "张某被聘为经营管理人员后，当然取得甲企业有限合伙人资格", "经三分之二的合伙人同意，甲企业可以聘任张某担任经营管理人员"], "answer": [0], "explain": "被聘任的经营管理人员，仅是合伙企业的经营管理人员，不是合伙企业的合伙人， 因而不具有合伙人的资格，选项B、C 不当选；除合伙协议另有约定外，聘任合伙人以外的人担 任合伙企业的经营管理人员应当经全体合伙人一致同意。选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于普通合伙企业新合伙人入伙的表述中，正确的有（）。", "options": ["合伙人以外的人依法受让合伙人在合伙企业中的财产份额的，即自动成为合伙人", "新合伙人入伙，除合伙协议另有约定外，应当经全体合伙人一致同意", "原合伙人不得以更优越的条件吸引新合伙人入伙", "新合伙人对入伙前合伙企业的债务承担无限连带责任"], "answer": [1, 3], "explain": "合伙人以外的人受让合伙人在合伙企业中的财产份额，经修改合伙协议方成为合 伙企业的合伙人。选项A 不当选。新入伙的普通合伙人与原合伙人享有同等权利，承担同等责 任。如果原合伙人愿意以更优越的条件吸引新合伙人入伙，或者新合伙人愿意以较为不利的条 件入伙，也可以在入伙协议中另行约定。选项C 不当选。"}, {"type": "multi", "year": "", "title": "合伙协议约定合伙期限的，在合伙企业存续期间内出现特定情形时，合伙人可以退伙。这些情形有（）。", "options": ["发生合伙协议约定的退伙事由", "其他合伙人严重违反合伙协议约定的义务", "全体合伙人一致同意退伙", "发生合伙人难以继续参加合伙的事由"], "answer": [0, 1, 2, 3], "explain": "合伙协议约定合伙期限的，在合伙企业存续期间，有下列情形之一的，合伙人可以 退伙：（1）合伙协议约定的退伙事由出现（选项A）；（2）经全体合伙人一致同意（选项C）；（3） 发生合伙人难以继续参加合伙的事由（选项D）；（4）其他合伙人严重违反合伙协议约定的义务 （选项B）。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列各项中，属于合伙人通知退伙应当满足的条件的有（）。", "options": ["退伙不给合伙企业事务执行造成不利影响", "合伙协议未约定合伙企业的经营期限", "提前30 日通知其他合伙人", "其他合伙人一致同意"], "answer": [0, 1, 2], "explain": "选项D：属于协议退伙的特定情形之一，不当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，普通合伙企业的合伙人发生下列情形中，导致其当然退伙的有（   ）。（2023 年）", "options": ["作为合伙人的自然人死亡", "作为合伙人的自然人丧失民事行为能力", "作为合伙人的自然人丧失偿债能力", "作为合伙人的法人资不抵债"], "answer": [0, 2], "explain": "合伙人有下列情形之一的，当然退伙：（1）作为合伙人的自然人死亡（选项A）或 者被依法宣告死亡；（2）个人丧失偿债能力（选项C）；（3）作为合伙人的法人或者其他组织依 法被吊销营业执照、责令关闭、撤销，或者被宣告破产；（4）法律规定或者合伙协议约定合伙人 必须具有相关资格而丧失该资格；（5）合伙人在合伙企业中的全部财产份额被人民法院强制执行。"}, {"type": "multi", "year": "", "title": "某普通合伙企业的合伙人包括有限责任公司甲、乙，自然人丙、丁。根据合伙企业法律制度的规定，下列情形中，属于当然退伙事由的有（）。", "options": ["甲被债权人申请破产", "乙被吊销营业执照", "丙被依法宣告失踪", "丁被宣告死亡"], "answer": [1, 3], "explain": "合伙人有下列情形之一的，当然退伙：（1）作为合伙人的自然人死亡或者被依法宣 告死亡（选项D）；（2）个人丧失偿债能力；（3）作为合伙人的法人或者其他组织依法被吊销营 业执照（选项B）、责令关闭、撤销，或者被宣告破产；（4）法律规定或者合伙协议约定合伙人 必须具有相关资格而丧失该资格；（5）合伙人在合伙企业中的全部财产份额被人民法院强制执行。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列情形中，经普通合伙企业其他合伙人一致同意，可以决议将合伙人除名的有（）。", "options": ["合伙人未履行出资义务", "合伙人因重大过失给合伙企业造成损失", "合伙人必须具有的相关资格已经丧失", "合伙人在执行合伙事务时有不正当行为"], "answer": [0, 1, 3], "explain": "选项C：属于普通合伙人当然退伙的事由，不当选。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，下列关于合伙人除名的表述中，正确的是（）。（2022 年）", "options": ["被除名人对除名决议有异议的，应当自除名决议作出之日起15 日内向人民法院起诉", "被除名人接到除名通知后提出异议的，除名决议不生效", "对合伙人的除名决议应当书面通知被除名人", "发生合伙协议约定事由的自动除名，无需经其他合伙人同意"], "answer": [2], "explain": "被除名人对除名决议有异议的，可以自接到除名通知之日起30 日内，向人民法院 起诉。选项A 不当选；被除名人接到除名通知之日，除名生效，被除名人退伙。选项B 不当选； 对合伙人的除名决议应当书面通知被除名人。选项C 当选；经“其他合伙人一致同意”，可以决 议将合伙人除名。选项D 不当选。"}, {"type": "single", "year": "", "title": "普通合伙企业中的合伙人死亡，合伙协议对合伙人的资格取得或者丧失无特殊约定。关于该合伙人财产份额继承的表述中，不正确的是（）。（2018 年）", "options": ["继承人当然取得合伙人资格", "经其他合伙人一致同意，自继承开始之日起取得合伙人资格", "继承人为无民事行为能力人的，经其他合伙人一致同意，可以转为有限合伙人，普通合伙企业依法转为有限合伙企业", "继承人不愿意成为合伙人的，合伙企业应当向合伙人的继承人退还被继承合伙人的财产份额"], "answer": [0], "explain": "普通合伙人死亡或者被依法宣告死亡的，对该合伙人在合伙企业中的财产份额享有 合法继承权的继承人，按照合伙协议约定或者经全体合伙人一致同意，从继承开始之日起，取得 合伙企业的合伙人资格。合伙人的继承人为无民事行为能力人或者限制民事行为能力人的，经全 体合伙人一致同意，可以依法成为有限合伙人，普通合伙企业依法转为有限合伙企业。继承人不 愿意成为合伙人的，合伙企业应当向合伙人的继承人退还被继承合伙人的财产份额。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，下列关于普通合伙企业合伙人退伙结算及其效果的表述中，正确的是（）。", "options": ["退伙人在合伙企业中财产份额的退还办法，由合伙协议约定或者全体合伙人决定", "合伙人退伙，其他合伙人应当与该退伙人按照入伙时的合伙企业财产状况进行结算", "合伙人退伙时，合伙企业财产少于合伙企业债务的，退伙人不承担亏损责任", "退伙人对基于其退伙前的原因发生的合伙企业债务，不承担连带责任"], "answer": [0], "explain": "合伙人退伙，其他合伙人应当与该退伙人按照“退伙时”的合伙企业财产状况进行 结算，退还退伙人的财产份额。选项B 不当选；合伙人退伙时，合伙企业财产少于合伙企业债务 的，退伙人“应当依照规定分担亏损”。选项C 不当选；退伙人对基于其退伙前的原因发生的合 伙企业债务，“承担无限连带责任”。选项D 不当选。"}, {"type": "single", "year": "", "title": "杨某入伙时甲普通合伙企业（下称“甲企业”）负债30 万元，杨某退伙时甲企业已负债80 万元。后甲企业解散，尚欠100 万元不能清偿。关于杨某对甲企业债务承担责任的下列表述中，正确的是（）。（2019 年）", "options": ["杨某对其退伙前的80 万元债务承担无限连带责任", "杨某对其入伙前的30 万元债务不承担无限连带责任", "杨某已退伙，不再对甲企业债务承担责任", "杨某对甲企业解散时的100 万元债务承担无限连带责任"], "answer": [0], "explain": "普通合伙企业中，普通合伙人对入伙前合伙企业的债务承担无限连带责任；退伙后 的普通合伙人对基于其退伙前的原因发生的合伙企业债务，应当承担无限连带责任。选项A 当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于特殊的普通合伙企业执业风险防范措施的表述中，正确的有（）。", "options": ["企业可以选择建立执业风险基金或者办理职业保险", "执业风险基金用于偿付合伙人执业活动造成的债务", "执业风险基金应当单独立户管理", "企业应当从其经营收益中提取相应比例资金作为执业风险基金"], "answer": [1, 2, 3], "explain": "选项A：特殊的普通合伙企业“应当”建立执业风险基金、办理职业保险。"}, {"type": "single", "year": "", "title": "下列有关有限合伙企业设立条件的表述中，不符合《合伙企业法》规定的是（）。（2025 年）", "options": ["有限合伙企业至少应当有一个普通合伙人", "有限合伙企业中的合伙人一律不得以劳务作为出资", "有限合伙人可以用知识产权作价出资", "有限合伙企业登记事项中应载明有限合伙人的姓名或名称"], "answer": [1], "explain": "有限合伙企业至少应当有1 个普通合伙人，其中普通合伙人可以劳务作为出资，但 有限合伙人不得以劳务作为出资，有限合伙人可以用货物、实物、知识产权、土地使用权或者其 他财产权利作价出资。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，有限合伙企业合伙协议除符合普通合伙企业合伙协议的规定外，还应当载明有限合伙企业的特别事项。下列各项中，属于该特别事项的是（）。", "options": ["合伙目的和合伙经营范围", "利润分配、亏损分担方式", "执行事务合伙人应具备的条件", "有限合伙人和普通合伙人相互转变程序"], "answer": [2, 3], "explain": "有限合伙企业合伙协议除符合普通合伙企业合伙协议的规定外，还应载明下列事 项：（1）普通合伙人和有限合伙人的姓名或者名称、住所；（2）有限合伙人入伙、退伙的条件、 程序以及相关责任；（3）有限合伙人和普通合伙人相互转变程序；（4）执行事务合伙人应具备的 条件和选择程序；（5）执行事务合伙人权限与违约处理办法；（6）执行事务合伙人的除名条件和 更换程序。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于有限合伙企业的表述中，正确的有（）。", "options": ["有限合伙企业至少应当有2 个普通合伙人", "公益性的事业单位不能成为有限合伙企业的普通合伙人", "有限合伙企业仅剩有限合伙人的，应当解散", "有限合伙企业名称中应当标明“有限责任”字样"], "answer": [1, 2], "explain": "有限合伙企业至少应当有1 个普通合伙人和1 个有限合伙人。选项A 不当选；有 限合伙企业名称中应当标明“有限合伙”字样。选项D 不当选。"}, {"type": "multi", "year": "", "title": "甲公益性社会团体与王某共同出资设立一个合伙企业，经营文具用品。两年后，因经营亏损，该合伙企业财产不足以清偿全部债务。下列有关各合伙人承担责任的表述中，正确的有（）。", "options": ["甲公益性社会团体以其认缴的出资额为限对合伙企业债务承担责任", "王某以其认缴的出资额为限对合伙企业债务承担责任", "甲公益性社会团体对合伙企业债务承担无限责任", "王某对合伙企业债务承担无限责任"], "answer": [0, 3], "explain": "“公益性社会团体”在合伙企业中只能成为有限合伙人，因此该合伙企业只能为有 限合伙企业。有限合伙人以其认缴的出资额为限对合伙企业债务承担责任。选项A 正确、选项C 错误；有限合伙企业应当至少有1 个普通合伙人，因此王某在该合伙企业中只能成为普通合伙 人，应当对该有限合伙企业的债务承担无限责任。选项B 错误，选项D 正确。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于有限合伙企业事务执行的表述中，正确的有（）。（2025 年）", "options": ["有限合伙人可参与选择承办本企业审计业务的会计师事务所", "有限合伙人可参与决定普通合伙人的入伙", "有限合伙人不得为本合伙企业提供担保", "执行事务合伙人可以要求在合伙协议中确定执行事务的报酬及报酬提取方式"], "answer": [0, 1, 3], "explain": "有限合伙人的下列行为，不视为执行合伙事务：（1）参与决定普通合伙人入伙、退 伙；（2）对企业的经营管理提出建议；（3）参与选择承办有限合伙企业审计业务的会计师事务所； （4）获取经审计的有限合伙企业财务会计报告；（5）对涉及自身利益的情况，查阅有限合伙企 业财务会计账簿等财务资料；（6）在有限合伙企业中的利益受到侵害时，向有责任的合伙人主张 权利或者提起诉讼；（7）执行事务合伙人怠于行使权利时，督促其行使权利或者为了本企业的利 益以自己的名义提起诉讼；（8）依法为本企业提供担保。选项A、B 当选，选项C 不当选。有限 合伙企业由普通合伙人执行合伙事务，执行事务合伙人可以要求在合伙协议中确定执行事务的 报酬及报酬提取方式。选项D 当选。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，下列关于有限合伙企业合伙事务执行人的表述中，正确的是（）。", "options": ["有限合伙人对企业的经营管理提出建议，视为执行合伙事务", "合伙协议不得约定由有限合伙人担任合伙事务执行人", "合伙事务执行人执行合伙事务造成合伙财产损失的，应向合伙企业或其他合伙人承担赔偿责任", "合伙事务执行人不得要求合伙企业就执行事务的劳动付出支付报酬"], "answer": [1], "explain": "有限合伙人对企业的经营管理提出建议，不视为执行合伙事务。选项A 不当选；合 伙事务执行人若因为自己的过错而造成合伙企业财产损失的，应向合伙企业或者其他合伙人负 赔偿责任。选项C 不当选；执行事务合伙人可以要求在合伙协议中确定执行事务的报酬以及报 酬提取方式。选项D 不当选。"}, {"type": "multi", "year": "", "title": "有限合伙企业合伙协议所作的下列约定中，符合规定的有（）。", "options": ["一个有限合伙人不承担亏损", "有限合伙人不得自营与本企业相竞争的业务", "有限合伙人不得出质", "一个普通合伙人不享有利润分配"], "answer": [1, 2, 3], "explain": "合伙企业不得在合伙协议中约定由部分合伙人承担全部亏损（即部分合伙人不承担 亏损）。选项A 不当选；有限合伙人可以自营或者同他人合作经营与本有限合伙企业相竞争的业 务，但是，合伙协议另有约定的除外。选项B 当选；有限合伙人可以将其在有限合伙企业中的财 产份额出质，但是，合伙协议另有约定的除外。选项C 当选；有限合伙企业不得将全部利润分配 给部分合伙人，但是，合伙协议另有约定的除外。选项D 当选。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，关于有限合伙人是否可以与本有限合伙企业交易的下列表述中，正确的是（）。", "options": ["有限合伙人不得同本有限合伙企业进行交易，合伙协议另有约定的除外", "有限合伙人可以同本有限合伙企业进行交易，合伙协议另有约定的除外", "有限合伙人不得同本有限合伙企业进行交易，法律另有规定的除外", "合伙协议不得禁止有限合伙人同本有限合伙企业进行交易"], "answer": [1], "explain": "有限合伙人可以同本有限合伙企业进行交易，但是，合伙协议另有约定的除外。选 项B 当选。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，有限合伙人出现一定情形时当然退伙，下列属于有限合伙人当然退伙情形的有（）。", "options": ["有限合伙人丧失民事行为能力", "有限合伙人死亡", "作为有限合伙人的自然人被宣告失踪", "有限合伙人在合伙企业中的部分财产份额被人民法院强制执行"], "answer": [1], "explain": "有限合伙人有下列情形之一的，当然退伙：（1）作为合伙人的自然人死亡（选项B） 或者被依法宣告死亡（而非宣告“失踪”，选项C 不当选）；（2）作为合伙人的法人或者其他组织 依法被吊销营业执照、责令关闭、撤销，或者被宣告破产；（3）法律规定或者合伙协议约定合伙 人必须具有相关资格而丧失该资格；（4）合伙人在合伙企业中的全部财产份额被人民法院强制 执行（而非“部分”财产份额被人民法院强制执行，选项D 不当选）。作为有限合伙人的自然人 在有限合伙企业存续期间丧失民事行为能力的，其他合伙人不得因此要求其退伙。选项A 不当选。"}, {"type": "single", "year": "", "title": "有限合伙人新加入某合伙企业，该有限合伙人认缴出资30 万元，实际缴付20万元。入伙前合伙企业欠债40 万元，有限合伙人入伙后，合伙企业无力偿还。有限合伙人需要承担的责任是（）。（2024 年）", "options": ["0 万元", "20 万元", "30 万元", "40 万元"], "answer": [2], "explain": "新入伙的有限合伙人对入伙前有限合伙企业的债务，以其认缴的出资额为限承担责 任。选项C 当选。"}, {"type": "single", "year": "", "title": "某有限合伙人认缴出资100 万元，实际缴付出资80 万元。其退伙时取回财产70 万元。退伙时合伙企业债务120 万元。则该合伙人对退伙前合伙企业债务应当承担的责任是（  ）。（2023 年）", "options": ["100 万元", "80 万元", "70 万元", "120 万元"], "answer": [2], "explain": "有限合伙人退伙后，对基于其退伙前的原因发生的有限合伙企业债务，以其退伙时 从有限合伙企业中取回的财产承担责任。选项C 当选。"}, {"type": "single", "year": "", "title": "赵某、钱某、孙某、李某共同出资设立甲有限合伙企业（下称“甲企业”）。赵某、钱某为有限合伙人，孙某、李某为普通合伙人。下列说法中正确的是（）。（2022 年）", "options": ["若赵某死亡，其继承人可以合法取得合伙人身份", "若钱某全部财产份额被人民法院强制执行，该合伙企业应当转为普通合伙企业", "若赵某丧失民事行为能力，则其当然退伙", "若钱某退出合伙企业，对合伙企业债务不承担责任"], "answer": [0], "explain": "（1）作为有限合伙人的自然人在有限合伙企业存续期间丧失民事行为能力的，其他 合伙人不得因此要求其退伙。选项C 不当选；（2）作为有限合伙人的自然人死亡、被依法宣告死 亡或者作为有限合伙人的法人及其他组织终止时，其继承人或者权利承受人可以依法取得该有 限合伙人在有限合伙企业中的资格。选项A 当选；（3）有限合伙人退伙后，对基于其退伙前的原 因发生的有限合伙企业债务，以其退伙时从有限合伙企业中取回的财产承担责任。选项D 不当 选；（4）有限合伙企业仅剩普通合伙人的，应当转为普通合伙企业。选项B 不当选。"}, {"type": "single", "year": "", "title": "2019 年10 月，李某、王某共同投资设立了甲有限合伙企业（以下简称“甲企业”），李某为普通合伙人，出资10 万元；王某为有限合伙人，认缴出资15 万元。2020 年6 月，张某、孟某加入甲企业，其中张某为普通合伙人，孟某为有限合伙人，二人各认缴出资30 万元。同年12 月，甲企业无力清偿欠乙银行的60 万元债务。下列关于该债务承担的表述中，正确的是（）。（2020 年）", "options": ["李某以出资额10 万元为限对该债务承担责任", "乙银行可以要求孟某承担全部60 万元债务", "乙银行可以要求王某承担全部60 万元债务", "乙银行可以要求张某承担全部60 万元债务"], "answer": [3], "explain": "（1）李某作为普通合伙人，对合伙企业债务承担无限连带责任。选项A 不当选； （2）孟某作为有限合伙人，无论对入伙前还是入伙后有限合伙企业的债务，以其认缴的出资额 （30 万元）为限承担责任。选项B 不当选；（3）王某作为有限合伙人，以其认缴的出资额（15 万元）为限对合伙企业债务承担责任。选项C 不当选；（4）张某作为新入伙的普通合伙人，对合 伙企业的债务承担无限连带责任，因此乙银行可以要求张某就甲企业无力清偿欠乙银行的60 万 元债务承担责任。选项D 当选。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列关于合伙人性质转变的表述中，正确的有（）。", "options": ["普通合伙人不能全部转为有限合伙人", "普通合伙人转为有限合伙人，其对普通合伙期间企业债务承担连带责任", "有限合伙人转为普通合伙人，其对有限合伙期间企业债务承担连带责任", "除合伙协议另有约定外，经有限合伙人一致同意，普通合伙人可转为有限合伙人"], "answer": [0, 1, 2], "explain": "（1）有限合伙企业仅剩有限合伙人的，应当解散，因此普通合伙人不能全部转为有 限合伙人。选项A 当选；（2）普通合伙人转变为有限合伙人的，对其作为普通合伙人期间合伙企 业发生的债务承担无限连带责任。选项B 当选；（3）有限合伙人转变为普通合伙人的，对其作为 有限合伙人期间有限合伙企业发生的债务承担无限连带责任。选项C 当选；（4）除合伙协议另 有约定外，普通合伙人转变为有限合伙人，或者有限合伙人转变为普通合伙人，应当经全体合伙 人一致同意。选项D 不当选。"}, {"type": "multi", "year": "", "title": "2022 年5 月，赵某、钱某、孙某共同出资设立甲有限合伙企业（下称“甲企业”），赵某为普通合伙人，出资20 万元，钱某、孙某为有限合伙人，各出资15 万元。2023 年，甲企业向银行借款50 万元，该借款于2025 年到期。2024 年，经全体合伙人同意赵某转变为有限合伙人，孙某转变为普通合伙人。2025 年，甲企业无力偿还50 万元到期借款，合伙人就如何偿还该借款发生争议。下列关于赵某、钱某、孙某承担偿还50 万元借款责任的表述中，符合合伙企业法律制度规定的有（）。", "options": ["赵某、孙某应承担无限连带责任", "孙某应承担有限责任", "赵某应承担有限责任", "钱某应承担有限责任"], "answer": [0, 3], "explain": "有限合伙人转变为普通合伙人的（孙某），对其作为有限合伙人期间有限合伙企业 发生的债务承担无限连带责任。普通合伙人转变为有限合伙人的（赵某），对其作为普通合伙人 期间合伙企业发生的债务承担无限连带责任。没有转变身份的有限合伙人（钱某），以其认缴的 出资额为限对合伙企业债务承担责任。选项A、D 当选。"}, {"type": "multi", "year": "", "title": "甲、乙、丙三人设立一家普通合伙企业，下列情形中，合伙企业应当解散的有（）。", "options": ["甲、乙退出合伙企业，30 天没有其他人入伙", "甲、乙同意解散合伙企业，丙不同意", "丙因意外事故死亡", "合伙协议约定的合伙目的已经实现"], "answer": [0, 3], "explain": "根据《合伙企业法》的规定，合伙企业有下列情形之一的，应当解散：（1）合 伙期限届满，合伙人决定不再经营；（2）合伙协议约定的解散事由出现；（3）全体合伙人决定解 散，选项B 不当选；（4）合伙人已不具备法定人数满30 天，选项A 当选；（5）合伙协议约定的 合伙目的已经实现或者无法实现，选项D 当选；（6）依法被吊销营业执照、责令关闭或者被撤 销；（7）法律、行政法规规定的其他原因。"}, {"type": "single", "year": "", "title": "根据合伙企业法律制度的规定，下列关于合伙企业财产的说法，正确的是（）。（2021 年）", "options": ["合伙企业的原始财产是指全体合伙人实际缴纳的财产", "合伙人以土地使用权出资，需要评估作价的，不可以由合伙人自行协商", "合伙人在合伙清算前擅自转让合伙财产的，合伙企业不得以此对抗善意第三人", "合伙企业清算的合伙财产应先用于缴纳税款"], "answer": [2], "explain": "选项A 不当选：合伙企业的原始财产是全体合伙人“认缴”的出资，而非各合伙人 “实际缴纳”的财产。选项B 不当选：合伙人以实物、知识产权、土地使用权或者其他财产权利 出资，需要评估作价的，可以由全体合伙人协商确定，也可以由全体合伙人委托法定评估机构评 估。选项D 不当选：合伙企业财产清算顺序为：支付清算费用和职工工资、社会保险费用、法 定补偿金以及缴纳所欠税款、清偿债务。"}, {"type": "multi", "year": "", "title": "根据合伙企业法律制度的规定，下列各项中，属于合伙企业清算费用的有（）。", "options": ["管理合伙企业财产的费用", "清算过程中聘任工作人员的费用", "清算过程中的咨询费用", "缴纳合伙企业职工社会保险费用"], "answer": [0, 1, 2], "explain": "清算费用包括：（1）管理合伙企业财产的费用，如仓储费、保管费、保险费等（选 项A）；（2）处分合伙企业财产的费用，如聘任工作人员的费用等（选项B）；（3）清算过程中的 其他费用，如通告债权人的费用、调查债权的费用、咨询费用、诉讼费用等（选项C）。"}, {"type": "single", "year": "", "title": "甲合伙企业解散进行清算，下列说法正确的是（）。（2024 年）", "options": ["清算人在清算期间应当清理债权债务", "甲企业申请办理企业注销登记，无须向企业登记机关报送清算报告", "清算人员只能由全体合伙人共同担任", "甲企业的财产应当首先用于缴纳所欠税款"], "answer": [0], "explain": "清算结束，清算人应当编制清算报告，经全体合伙人签名、盖章后，在15 日内向 企业登记机关报送清算报告，申请办理合伙企业注销登记，选项B 不当选。清算人由全体合伙人 担任；经全体合伙人过半数同意，可以自合伙企业解散事由出现后15 日内指定一个或者数个合 伙人，或者委托第三人担任清算人；自合伙企业解散事由出现之日起15 日内未确定清算人的， 合伙人或者其他利害关系人可以申请人民法院指定清算人，选项C 不当选。合伙企业财产在支 付清算费用和职工工资、社会保险费用、法定补偿金以及缴纳所欠税款、清偿债务后的剩余财产 依照《合伙企业法》关于利润分配和亏损分担的规定进行分配，选项D 不当选。选项A 当选。"}, {"type": "judge", "year": "", "title": "合伙企业依法被宣告破产的，普通合伙人对合伙企业债务不再承担清偿责任。（）（2022 年）", "options": ["对", "错"], "answer": [1], "explain": "合伙企业依法被宣告破产的，普通合伙人对合伙企业债务仍应承担无限连带责任。"}]}, "ch4": {"name": "物权法律制度", "questions": [{"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于物的表述中，正确的有（）。", "options": ["太阳属于物", "电力属于物", "活人的身体属于物", "法定的权利可以作为物权的客体"], "answer": [1, 3], "explain": "选项A，不具有可支配性，不属于物权法律制度上的物。 选项C，基于人性尊严的考量，活人的身体不属于物权法律制度上的物。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列关于物的分类的表述中，不正确的是（）。（2023 年）", "options": ["海域属于不动产", "船舶属于动产", "汽车和轮胎属于主物和从物", "存款利息属于法定孳息"], "answer": [2], "explain": "主从关系是基于两个独立存在的物。轮胎属于汽车的一部分，不是主从物关系。 选项C 当选。"}, {"type": "judge", "year": "", "title": "对于既有用益物权又有所有权的标的物，对天然孳息的归属没有约定的，归所有权人所有。（）（2023 年）", "options": ["对", "错"], "answer": [1], "explain": "天然孳息，由所有权人取得；既有所有权人又有用益物权人的，由用益物权人取 得。当事人另有约定的，按照其约定。法定孳息，当事人有约定的，按照约定取得；没有约定 或者约定不明确的按照交易习惯取得。本题表述错误。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列权利中，属于担保物权的是（）。（2022 年）", "options": ["居住权", "地役权", "留置权", "土地承包经营权"], "answer": [2], "explain": "选项A、B、D 属于用益物权，不当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列权利客体只能是动产的是（）。（2023年）", "options": ["所有权", "质权", "留置权", "抵押权"], "answer": [2], "explain": "留置权是指债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动 产，并有权就该动产优先受偿的担保权利。"}, {"type": "single", "year": "", "title": "张某与李某是邻居，张某在自家院内挖地窖，导致李某家房屋有受到损害的危险。李某可以行使（）。（2025 年）", "options": ["消除危险请求权", "妨害排除请求权", "标的物返还请求权", "赔偿损失请求权"], "answer": [0], "explain": "消除危险请求权，又称为妨害防止请求权，是指物权人对于有妨害其物权的危险 情形，可以请求予以消除的权利。消除危险请求权，旨在阻却将来可能发生的对物的危险。所 以，消除危险请求权以危险的客观存在为前提。选项A 当选。"}, {"type": "multi", "year": "", "title": "下列情形中，当事人可以主张标的物返还请求权的有（）。", "options": ["张某侵占了李某的假发，因其住所失火，假发被烧毁，李某请求张某返还假发", "蔡某偷了王某的游戏机，王某请求蔡某返还游戏机", "郑某借给孙某一双拖鞋，借期过后，孙某谎称丢失，郑某请求孙某返还拖鞋", "赵某向刘某购买动感单车一辆，赵某取得动感单车后即将该动感单车转卖给徐某，并已交付，但赵某一直未向刘某交付价款，刘某请求赵某返还动感单车"], "answer": [1, 2], "explain": "选项A，虽张某对于假发属于无权占有，但因假发已经烧毁，李某无法再主张标的 物返还请求权。选项B、C，蔡某与孙某均构成无权占有，且被占有物都还存在，所以所有权人 可以请求无权占有人返还标的物。选项D：刘某基于买卖合同把动感单车交付给赵某，赵某即取 得动感单车的所有权，其后，赵某又将动感单车所有权转移给徐某，所以，刘某已经丧失动感 单车的所有权，无法主张标的物返还请求权。"}, {"type": "single", "year": "", "title": "甲公司于2025 年10 月10 日通过拍卖方式拍得位于北京郊区的一块工业建设用地；同年10 月15 日，甲公司与北京市土地管理部门签订《建设用地使用权出让合同》；同年10 月21 日，甲公司缴纳全部土地出让金；同年11 月5 日，甲公司办理完毕建设用地使用权登记，并获得建设用地使用权证。甲公司取得建设用地使用权的时间为（）。", "options": ["2025 年10 月10 日", "2025 年10 月15 日", "2025 年10 月21 日", "2025 年11 月5 日"], "answer": [3], "explain": "甲公司于2025 年11 月5 日取得建设用地使用权。根据规定，设立建设用地使用 权的，应当向登记机构申请建设用地使用权登记。建设用地使用权自登记时设立。"}, {"type": "multi", "year": "", "title": "下列关于不动产物权的表述中，正确的有（）。（2025 年）", "options": ["赵某合法购买商品房，登记产权后，获得商品房所有权", "钱某合法自建房产，登记产权后，获得自建房所有权", "孙某合法拆除房屋，拆除完毕后，所有权消灭", "李某继承取得房屋，登记产权后，获得所有权"], "answer": [0, 2], "explain": "（1）选项BC:因合法建造、拆除房屋等事实行为设立或者消灭物权的，自事实行 为成就时发生效力。（2）选项D：因继承取得物权的，自继承开始时发生效力。（3）选项A： 不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但 法律另有规定的除外。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列关于不动产物权变动，表述正确的是（）。（2025 年）", "options": ["土地承包经营权自登记时设立", "依法属于国家所有的自然资源，所有权应当登记", "因继承取得不动产物权的，不以登记为生效要件", "地役权自登记时设立"], "answer": [2], "explain": "土地承包经营权、地役权，自合同生效时设立，选项A、D 不当选；依法属于国家 所有的自然资源，所有权可以不登记，选项B 不当选；因继承取得物权的，自继承开始时发生 效力，不以登记为生效要件，选项C 当选。"}, {"type": "single", "year": "", "title": "甲、乙夫妻共有一房屋，登记在甲的名下，2025 年7 月15 日乙向人民法院起诉要求与甲离婚，人民法院最终判决甲、乙离婚，并将该房屋判归乙一人所有，判决于9 月15 日生效，甲、乙二人于9 月16 日领取了判决书，乙于9 月20 日凭判决书向登记机关办理了产权转移登记手续。根据物权法律制度的规定，该房屋的所有权归乙一人所有的时间是（）。", "options": ["2025 年7 月15 日", "2025 年9 月15 日", "2025 年9 月16 日", "2025 年9 月20 日"], "answer": [1], "explain": "因人民法院的法律文书导致物权设立、变更、转让或者消灭的，自法律文书生效 时发生效力。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于异议登记的表述中，错误的有（）。（2024 年）", "options": ["申请人自异议登记之日起15 日内不提起诉讼的，异议登记失效", "异议登记不当，造成权利人损害的，权利人可以向申请人请求损害赔偿", "异议登记后15 日内起诉的，异议登记自法院开庭后失效", "提起更正登记之前，须先提起异议登记"], "answer": [2, 3], "explain": "异议登记之日起15 日内申请人不起诉的，异议登记失效，选项C 错误。利害关系 人申请更正登记，如果不动产登记簿记载的权利人书面同意更正，登记机构直接予以更正；如 果权利人不同意更正，则利害关系人可以先申请异议登记，然后获取证据证明登记确有错误， 从而最终获得更正登记。选项D 错误。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，关于预告登记，下列表述不正确的有（）。", "options": ["预告登记后，未经预告登记的权利人同意，转让不动产的，不发生物权效力", "预告登记的权利人放弃债权的，不影响预告登记的效力", "预告登记期间，与他人就已办理预告登记的不动产所签订的买卖合同无效", "预告登记后，买卖不动产物权的协议被认定无效、被撤销的，预告登记失效"], "answer": [1, 2], "explain": "选项B：预告登记后，债权消灭（买卖不动产物权的协议被认定无效、被撤销、预 告登记的权利人放弃债权）或者自能够进行不动产登记之日起90 日内未申请登记的，预告登记 失效；选项C：预告登记期间，与他人就已办理预告登记的不动产所签订的买卖合同的效力不受 影响。"}, {"type": "single", "year": "", "title": "赵某于2025 年2 月5 日与甲公司签订买卖合同，购买甲公司预售的商品房，并且于2025 年2 月20 日办理了预告登记。之后甲公司于2025 年6 月1 日将房屋交付给赵某，该房屋可以在2025 年6 月20 日办理过户登记。则预告登记失效的日期是（）。（2025 年）", "options": ["2025 年6 月30 日", "2025 年7 月30 日", "2025 年8 月31 日", "2025 年9 月18 日"], "answer": [3], "explain": "预告登记后，债权消灭或者自能够进行不动产登记之日起90 日内未申请登记的， 预告登记失效。选项D 当选。"}, {"type": "single", "year": "", "title": "李某将一套旧房卖给王某，双方签订了买卖合同，王某支付了全部价款，但未办理移转登记。因搬迁不易，李某提出将旧房内家具低价卖给王某，王某称自己只能在1 个月内付清价款，李某同意。3 天后，王某搬进李某的旧房居住。下列关于房屋与家具所有权的表述中，正确的是（）", "options": ["王某已经取得房屋和家具的所有权", "王某已经取得房屋的所有权，但尚未取得家具的所有权", "王某已经取得家具的所有权，但尚未取得房屋的所有权", "王某尚未取得房屋和家具的所有权"], "answer": [2], "explain": "本题中，买卖合同的标的物分别为房屋和家具。房屋属于不动产，其所有权的转 移以登记为公示方式，王某与李某尚未办理房屋产权移转登记，所以，王某尚未取得房屋的所 有权。家具属于动产，其所有权的转移以交付为公示方式，王某搬进房屋居住，视为已经接受 李某交付的家具并对其占有，因此，家具所有权已经归属王某。"}, {"type": "single", "year": "", "title": "2023 年4 月10 日，王某到甲汽车销售公司购买一辆小汽车，当日签订合同并支付定金，5 月10 日交付剩余款项后甲公司向其交付车辆。王某将车停在停车场内，5 月20 日，王某将车开走，5 月22 日办理机动车登记。王某取得该车辆所有权的日期是（）。（2023 年）", "options": ["2023 年4 月10 日", "2023 年5 月22 日", "2023 年5 月10 日", "2023 年5 月20 日"], "answer": [2], "explain": "动产物权的设立和转让，自交付时生效，但法律另有规定的除外。5 月10 日，甲 公司向其交付车辆。选项C 当选。"}, {"type": "single", "year": "", "title": "2025 年5 月20 日，赵某出售一台电脑给钱某，约定钱某付款时交付。5 月23 日钱某付款，钱某与赵某签订电脑租赁合同，约定赵某继续使用一个月，于离校时交付电脑。此电脑交付方式为（）。（2025 年）", "options": ["简易交付", "占有改定", "现实交付", "指示交付"], "answer": [1], "explain": "动产物权转让时，当事人又约定由出让人继续占有该动产的，物权自该约定生效 时发生效力。这是“占有改定”的交付方式。选项B 当选。"}, {"type": "single", "year": "", "title": "赵某将其所有的一辆自行车借给钱某，借用期间双方于2022 年1 月10 日达成转让协议，约定钱某以1000 元的价格购买该自行车并于1 月25 日支付价款。1 月11 日，钱某将该自行车以1100 元的价格转让给孙某，双方约定钱某以借用人身份继续使用至2 月25 日再交还孙某，1 月13 日，钱某向赵某支付价款，下列关于该自行车权属的表述正确的是（）。（2022 年）", "options": ["孙某于2022 年1 月11 日取得自行车所有权", "钱某于2022 年1 月25 日取得自行车所有权", "钱某于2022 年1 月13 日取得自行车所有权", "孙某于2022 年2 月25 日取得自行车所有权"], "answer": [0], "explain": "（1）简易交付指动产物权设立和转让前，权利人已经占有该动产的，物权自民事 法律行为生效时发生效力。所以钱某通过简易交付，于1 月10 日取得自行车所有权，选项B、C 不当选；（2）占有改定指出让人在转让物权后仍须继续占有转让动产的，出让人与受让人订立 合同，使出让人由原来的所有人的占有改变为非所有人的占有，而受让人已取得物权，但将占 有权交由出让人行使一段时间，在约定的期限届满时，出让人再按约定将该动产交还受让人直 接占有。所以孙某是以占有改定的交付方式取得自行车所有权，1 月11 日双方约定生效时即取 得所有权，选项A 当选，选项D 不当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于拾得遗失物法律效果的表述中，正确的有（）。（2022 年）", "options": ["权利人领取遗失物时，应当向拾得人或者有关部门支付保管遗失物等支出", "拾得人侵占遗失物的，无权请求保管遗失物等支出的费用", "遗失物自有关部门发布招领公告之日起6 个月内无人认领的，归国家所有", "拾得人因重大过失致使遗失物毁损、灭失的，应当承担民事责任"], "answer": [0, 1, 3], "explain": "拾得遗失物自发布招领公告之日起1 年内无人认领的，归国家所有。选项C 不当选。"}, {"type": "multi", "year": "", "title": "2023 年3 月1 日，张某拾得吴某丢失的一幅名贵字画。3 月10 日，张某将该字画转让给袁某。4 月11 日，袁某将该字画交给拍卖行拍卖。4 月15 日，李某通过拍卖取得了该字画。下列表述正确的有（）。（2023 年）", "options": ["吴某有权自知道或者应当知道受让人李某之日起2 年内向李某请求返还字画", "张某无权将字画转让给袁某", "吴某有权向张某请求双倍赔偿字画损失", "吴某请求李某返还字画时，李某有权请求吴某支付其购买字画的费用"], "answer": [0, 1, 3], "explain": "拾得遗失物，应当返还权利人。拾得人应当及时通知权利人领取，或者送交公安 等有关部门，选项B 当选。所有权人或者其他权利人有权追回遗失物。该遗失物通过转让被他 人占有的，权利人有权向无处分权人请求损害赔偿，或者自知道或者应当知道受让人之日起二 年内向受让人请求返还原物，选项A 当选；但是，受让人通过拍卖或者向具有经营资格的经营 者购得该遗失物的，权利人请求返还原物时应当支付受让人所付的费用，选项D 当选。权利人 向受让人支付所付费用后，有权向无处分权人追偿。"}, {"type": "single", "year": "", "title": "张某利用宿舍里的一桶油漆粉刷了自己的桌子，张某以为该油漆是室友李某为其购买的，后发现是室友王某的油漆，张某用油漆粉刷桌子的法律事实为（）。（2025 年）", "options": ["借用", "附合", "混合", "加工"], "answer": [1], "explain": "附合，是指不同所有权人的物因密切结合而形成难以分割的新物，若分割会毁损 该物或花费较大。附合的认定，关键在于形成的新物难以分割，如错用他人油漆粉刷桌子，属 于附合。选项B 当选。"}, {"type": "single", "year": "", "title": "孙某将其所有的一辆小汽车出质给钱某。钱某经孙某同意，驾驶该辆小汽车与林某、赵某一起出游。林某驾驶的小汽车是其从甲公司租借而来。赵某驾驶的小汽车为其同宿舍好友陈某所有，赵某未经陈某同意私自开走，赵某准备在陈某考试结束以后电话告知陈某。下列关于各主体占有类型的表述中，不正确的是（）。（2022 年）", "options": ["赵某对小汽车的占有属于恶意占有", "孙某对小汽车的占有属于间接占有", "林某对小汽车的占有属于自主占有", "钱某对小汽车的占有属于有权占有"], "answer": [2], "explain": "他主占有，是指不以所有的意思而为占有, 如承租人、借用人、保管人、质权人 等对标的物的占有，林某对小汽车属于租借而来，因此属于他主占有，而非自主占有。选项C 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于动产占有的表述，正确的有（）。（2024 年）", "options": ["占有的动产被侵占的，占有人有权请求返还原物", "动产被占有人占有的，权利人可请求返还原物和孳息", "恶意占有人使用动产导致该动产受到损害，应承担赔偿责任", "占有的动产因毁损获得的保险金，动产的权利人请求赔偿的，占有人可以不返还给权利人"], "answer": [0, 1, 2], "explain": "占有的不动产或者动产被侵占的，占有人有权请求返还原物，选项A 当选。不动 产或者动产被占有人占有的，权利人可以请求返还原物及其孳息；但是，应当支付善意占有人 因维护该不动产或者动产支出的必要费用，选项B 当选。占有人因使用占有的不动产或者动产， 致使该不动产或者动产受到损害的，恶意占有人应当承担赔偿责任，选项C 当选。占有的不动 产或者动产毁损、灭失，该不动产或者动产的权利人请求赔偿的，占有人应当将因毁损、灭失 取得的保险金、赔偿金或者补偿金等返还给权利人；权利人的损害未得到足够弥补的，恶意占 有人还应当赔偿损失。选项D 不当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，占有人返还原物的请求权，自侵占发生之日起一定期限内行使，未行使的，该请求权消灭。该期限为（）。（2025 年）", "options": ["2 年", "6 个月", "3 年", "1 年"], "answer": [3], "explain": "占有人返还原物的请求权，自侵占发生之日起1 年内未行使的，该请求权消灭。 选项D 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于善意取得制度的表述中，正确的有（）。（2025 年）", "options": ["受让人应承担善意的举证责任", "须受让人以合理的价格受让", "受让不动产时不知道转让人无处分权且无重大过失，应认定受让人善意", "受让人善意取得所有权的，原所有权人有权向无处分权人请求损害赔偿"], "answer": [1, 2, 3], "explain": "真实权利人主张受让人不构成善意的，应当承担举证证明责任。选项A 不当选。"}, {"type": "judge", "year": "", "title": "赠与人将无权处分的财产赠与受赠人，受赠人可以主张善意取得。（）（2024 年）", "options": ["对", "错"], "answer": [1], "explain": "无处分权人将不动产或者动产转让给受让人的，所有权人有权追回；除法律另有 规定外，符合下列情形的，受让人取得该不动产或者动产的所有权：（1）受让人受让该不动产 或者动产时是善意；（2）以合理的价格转让；（3）转让的不动产或者动产依照法律规定应当 登记的已经登记，不需要登记的已经交付给受让人。因此赠与人将无权处分的动产赠与给善意 受赠人，受赠人不构成善意取得制度。本题表述错误。"}, {"type": "single", "year": "", "title": "甲、乙、丙三兄弟共同继承一幅古董字画，由甲保管。甲擅自将该画以市场价出卖于丁并已交付，丁对该画的共有权属关系并不知情。根据物权法律制度的规定，下列表述中，正确的是（）。", "options": ["经乙和丙中一人追认，丁即可取得该画所有权", "无论乙和丙追认与否，丁均可取得该画的所有权", "丁取得该画的所有权，但须以乙和丙均追认为前提", "无论乙和丙追认与否，丁均不能取得该画的所有权"], "answer": [1], "explain": "（1）由于甲、乙、丙三人为兄弟关系，三人对该画的共有应推定为共同共有。（2） 如果乙、丙不追认，则甲的行为构成无权处分，但丁可以基于善意取得制度依法取得该画的所 有权。（3）如果乙、丙追认，则甲的行为转为有权处分，丁基于交付取得该画的所有权。因此， 无论乙和丙追认与否，丁均可取得该画的所有权，选项B 当选。"}, {"type": "judge", "year": "", "title": "共有人对共有的不动产或者动产没有约定按份共有或共同共有，或者约定不明确的，一律视为按份共有。（）", "options": ["对", "错"], "answer": [1], "explain": "共有人具有家庭关系的，不视为按份共有，因此本题表述错误。"}, {"type": "multi", "year": "", "title": "甲乙以7：3 的比例按份共有一套房屋，双方约定二人平均承担亏损。甲居住期间，房屋外墙由于失修，掉落墙皮砸伤罗某，需要赔偿5000 元。对此下列表述正确的有（）。（2023 年）", "options": ["罗某只能找甲乙其中一人赔偿", "如果甲承担了5000 元，可以向乙追偿2500 元", "罗某可以找甲乙承担连带责任", "乙主张自己仅有30%的比例，不承担责任"], "answer": [1, 2], "explain": "（1）选项ACD：因共有的不动产或者动产（不论按份共有，还是共同共有）产生 的债权债务，在对外关系上，共有人享有连带债权、承担连带债务，但是法律另有规定或者第 三人知道共有人不具有连带债权债务关系的除外。（2）选项B：在共有人内部关系上，除共有 人另有约定外，按份共有人按照份额享有债权、承担债务。偿还债务超过自己应当承担份额的 按份共有人，有权向其他共有人追偿。"}, {"type": "single", "year": "", "title": "梅雨季节将至，按份共有人欲对共有房屋作重大修缮。共有人之间未对如何作出修缮决定进行约定。根据物权法律制度的规定，下列表述中，正确的是（）。", "options": ["应经占份额超过2/3 的按份共有人同意", "应经占份额2/3 以上的按份共有人同意", "应经超过2/3 的按份共有人同意", "应经2/3 以上的按份共有人同意"], "answer": [1], "explain": "共有人处分共有物以及对共有物作重大修缮、变更性质或者用途的：有约定的， 按照其约定；没有约定或者约定不明确的，应当经占份额2/3 以上的按份共有人同意方可实施。"}, {"type": "single", "year": "", "title": "朋友6 人共同出资购买一辆小汽车，未约定共有形式，且每人的出资额也不能确定。部分共有人欲对外转让该车。为避免该转让成为无权处分，在没有其他约定的情况下，根据物权法律制度的规定，同意转让的共有人至少应当达到的人数是（）。", "options": ["4 人", "3 人", "6 人", "5 人"], "answer": [0], "explain": "（1）由于6 人未约定共有形式且6 人为朋友关系（不具备家庭关系），故应认定 为按份共有；由于6 人未约定各自份额比例且每人的出资额也不能确定，因此每个人的份额均 等（1/6）；（2）处分共有的不动产或者动产的，应当经占份额2/3 以上的按份共有人同意， 但是共有人之间另有约定的除外，本案例中，6 人的份额是一致的，因此6 个份额达到2/3 就可 以处分该共有物：6×2/3＝4 个份额，从人数上体现为4 个人，因此选项A 正确。"}, {"type": "single", "year": "", "title": "张某和陈某分别出资50%，共同购买了一套商业用房。双方约定按照出资额按份共有，但对其他事项未作约定。下列关于相关当事人权利义务的表述中，正确的是（）。（2022 年）", "options": ["未经张某同意，陈某有权将该整套商业用房抵押给银行", "未经张某同意，陈某有权将该整套商业用房出售给第三人", "若陈某放弃优先购买权，张某可以向第三人转让其共有份额", "若张某去世，只有陈某放弃优先购买权，张某的法定继承人才可以继承其份额"], "answer": [2], "explain": "按份共有人可以对外转让其享有的共有的不动产或者动产份额。其他共有人在同 等条件下享有优先购买的权利。共有份额的权利主体因继承、遗赠等原因发生变化时，其他按 份共有人不得主张优先购买，但按份共有人之间另有约定的除外。选项C 当选。"}, {"type": "multi", "year": "", "title": "赵某、钱某、孙某、李某和周某共有一处不动产，各占五分之一的份额。周某拟将其共有份额转让给吴某，周某将转让条件书面通知赵某和钱某，给赵某的通知中载明的优先购买权行使期间为通知送达之日起20 日，给钱某的通知中未载明优先购买权的行使期间。孙某因与钱某在一起与钱某同时得知转让条件，李某一直未得知周某共有份额转让事项。下列关于行使优先购买权的期间，表述正确的有（）。（2024 年）", "options": ["赵某的优先购买权行使期间为通知送达之日起20 日", "钱某的优先购买权行使期间为通知送达之日起15 日", "孙某的优先购买权行使期间为知道转让条件之日起15 日", "李某的优先购买权行使期间为共有份额权属转移之日起3 个月"], "answer": [0, 1, 2], "explain": "优先购买权的行使期间，按份共有人之间有（自由）约定的，按照约定处理（选 项A）；没有约定或者约定不明的，按照下列情形确定：（1）转让通知中载明了行使期间且≥ 15 日→≥15 日；（2）转让通知中未载明行使期间/行使期间＜15 日→15 日（选项B）；（3） 未通知且权属未转移→知道同等条件＋15 日（选项C）；（4）未通知且权属已转移→转移之日 起的6 个月内。"}, {"type": "judge", "year": "", "title": "建筑物及其附属设施的费用分摊、收益分配等事项，有约定的，按照约定；没有约定或者约定不明确的，按照业主专有部分面积所占比例确定。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "建筑物及其附属设施的费用分摊、收益分配等事项，有约定的，按照约定；没有 约定或者约定不明确的，按照业主专有部分面积所占比例确定。本题表述正确。"}, {"type": "single", "year": "", "title": "下列关于土地承包经营权的表述中，正确的是（）。（2024 年）", "options": ["土地承包经营权的转让需经发包方同意", "土地承包经营权的期限届满，土地承包经营权人不得继续承包", "土地承包经营权自土地承包经营权合同登记后设立", "土地承包经营权人不得以入股方式向他人流转土地经营权"], "answer": [0], "explain": "承包期限届满，土地承包经营权人可以依照农村土地承包的法律规定继续承包， 选项B 错误；土地承包经营权自土地承包经营权合同生效时设立，选项C 错误；土地承包经营 权人可以自主决定依法采取出租、入股或者其他方式向他人流转土地经营权，选项D 错误。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于土地经营权的流转，表述正确的有（）。（2025 年）", "options": ["可以采取出租、入股等方式流转土地经营权", "流转期不得超过承包期的剩余期限", "不得改变土地所有权性质和农业用途", "限于本集体经济组织内部流转"], "answer": [0, 1, 2], "explain": "土地经营权流转受让方须有农业经营能力，但不限于本集体经济组织成员。选项D 不当选。"}, {"type": "single", "year": "", "title": "陈某与其所属的甲集体经济组织拟就该集体所有的一块林地签订土地承包经营权合同，拟定的下列条款中，符合法律规定的是（）。（2022 年）", "options": ["陈某可以将该林地用于旅游度假村的建设", "陈某可以向甲集体经济组织以外的人员转让土地承包经营权", "该林地的承包期为70 年", "该林地的土地承包经营权自登记时生效"], "answer": [2], "explain": "土地承包经营权，是指以种植、养殖、畜牧等农业目的，选项A 不当选；土地承 包经营权人依照法律规定，有权将土地承包经营权互换、转让。互换、转让的对象只能是本集 体经济组织成员，选项B 不当选；土地承包经营权自土地承包经营权合同生效时设立，选项D 不当 选。"}, {"type": "multi", "year": "", "title": "下列关于建设用地使用权的表述中，不正确的有（）。", "options": ["以无偿划拨方式取得的建设用地使用权一般无使用期限的限制", "住宅建设用地使用权期限届满的，自动续期", "建设用地使用权只能设立在国家所有的土地上", "通过出让方式取得的工业用地，最高使用年限为40 年"], "answer": [2, 3], "explain": "选项C，建设用地使用权是存在于国家或集体所有土地之上的权利。 选项D，通过出让方式取得的工业用地，最高使用年限为50 年。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于居住权的说法中，正确的有（）。（2025 年）", "options": ["居住权可以约定对外出租", "居住权可以口头形式设立", "居住权自登记时设立", "居住权不得转让"], "answer": [0, 2, 3], "explain": "设立居住权的住宅不得出租，但是当事人另有约定的除外，选项A 当选。当事人 设立居住权，应当采用书面形式订立居住权合同，也可以以遗嘱方式设立居住权，选项B 不当 选。居住权自登记时设立，选项C 当选。居住权不得转让、继承，选项D 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列有关地役权的表述中，正确的有（）。", "options": ["设定地役权应当签订书面合同", "地役权自地役权合同生效时设立", "地役权属于用益物权", "地役权是供役地所有人或者使用人享有的权利"], "answer": [0, 1, 2], "explain": "选项D，地役权是需役地所有人或使用人享有的权利。"}, {"type": "multi", "year": "", "title": "下列属于约定产生的物权担保方式的有（）。", "options": ["保证", "抵押", "质押", "留置"], "answer": [1, 2], "explain": "选项A：不属于物权担保方式； 选项D：属于法定产生的物权担保方式。"}, {"type": "multi", "year": "", "title": "反担保人可以是债务人，也可以是债务人以外的第三人，下列属于债务人和第三人均可以采用的反担保方式有（）。", "options": ["保证", "抵押", "质押", "留置"], "answer": [1, 2], "explain": "债务人提供反担保的方式包括抵押、质押，不包括保证、留置。"}, {"type": "multi", "year": "", "title": "陈某用自己的轿车作抵押向银行借款40 万元，并办理了抵押登记手续。陈某驾驶该车出行时，不慎发生交通事故。经鉴定，该车的价值损失了30%，保险公司赔偿了该车损失，根据物权法律制度的规定，下列关于该抵押担保的说法正确的有（）。", "options": ["该轿车不再担保银行债权", "该轿车应担保银行债权", "保险赔偿不应担保银行债权", "保险赔款应担保银行债权"], "answer": [1, 3], "explain": "担保期间，担保财产毁损、灭失或者被征收等，担保物权人可以就获得的保险金、 赔偿金或者补偿金等优先受偿。被担保债权的履行期限未届满的，也可以提存该保险金、赔偿 金或者补偿金等。"}, {"type": "judge", "year": "", "title": "登记为营利法人的学校提供担保，当事人不得以其不具有担保资格为由主张担保合同无效。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "登记为营利法人的学校、幼儿园、医疗机构、养老机构等提供担保，当事人以其 不具有担保资格为由主张担保合同无效的，人民法院不予支持。本题表述正确。"}, {"type": "judge", "year": "", "title": "居民委员会为他人提供担保，该担保合同无效。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "居民委员会为他人提供担保，该担保合同无效。本题表述正确。"}, {"type": "single", "year": "", "title": "甲向乙借款100 万元，由丙提供担保。债务到期后债务人无力清偿60 万元借款。甲乙的借款合同有效，丙的担保合同无效，乙与丙都有过错。担保人承担的最高赔偿金额是（）。（2024 年）", "options": ["0 万元", "20 万元", "30 万元", "60 万元"], "answer": [2], "explain": "主合同有效而第三人提供的担保合同无效，人民法院应当区分不同情形确定担保 人的赔偿责任：（1）债权人与担保人均有过错的，担保人承担的赔偿责任不应超过债务人不能 清偿部分的1/2；（2）担保人有过错而债权人无过错的，担保人对债务人不能清偿的部分承担 赔偿责任；（3）债权人有过错而担保人无过错的担保人不承担赔偿责任。选项C 当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列财产中，不得设立抵押权的是（）。（2025 年）", "options": ["土地所有权", "海域使用权", "正在建造的船舶", "生产设备"], "answer": [0], "explain": "下列财产不得设立抵押权：（1）土地所有权；（2）宅基地、自留地、自留山等 集体所有的土地所有权，但法律规定可以抵押的除外；（3）学校、幼儿园、医疗机构等为公益 目的成立的非营利法人的教育设施、医疗卫生设施和其他公益设施；（4）所有权、使用权不明 或者有争议的财产；（5）依法被查封、扣押、监管的财产；（6）法律、行政法规规定不得抵 押的其他财产。选项A 当选。"}, {"type": "multi", "year": "", "title": "甲公司向乙银行申请贷款，拟采用下列财产提供抵押，其中不需要登记即可设立抵押权的有（）。（2024 年）", "options": ["一艘正在建造的船舶", "一栋正在建造的大楼", "一架飞机", "一辆汽车"], "answer": [0, 2, 3], "explain": "不动产抵押应当办理抵押登记，抵押权自登记时设立，选项B 不当选；以动产抵 押的，抵押权自抵押合同生效时设立，未经登记，不得对抗善意第三人。选项A、C、D 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度规定，下列物权中，自登记时设立的有（）。（2023 年）", "options": ["土地承包经营权", "建设用地使用权", "地役权", "不动产抵押权"], "answer": [1, 3], "explain": "（1）土地承包经营权自土地承包经营权合同生效时设立，选项A 不当选；（2） 地役权自地役权合同生效时设立，选项C 不当选。"}, {"type": "single", "year": "", "title": "甲向乙借款50 万元，约定以甲的A 幢房屋抵押给乙，双方为此签订了抵押合同，但在抵押登记时，登记为以甲的B 幢房屋抵押给乙。后甲未能按约还款，乙欲行使抵押权。根据物权法律制度的规定，下列关于乙行使抵押权的表述中，正确的是（）。", "options": ["乙只能对甲的A 幢房屋行使抵押权", "乙只能对甲的B 幢房屋行使抵押权", "乙可选择对甲的A 幢房屋或者B 幢房屋行使抵押权", "乙不能行使抵押权，因为登记机关记载的抵押物与抵押合同约定的抵押物不一致，抵押无效"], "answer": [1], "explain": "抵押登记记载的抵押物与抵押合同约定的抵押物不一致的，以登记记载的抵押物为准。"}, {"type": "multi", "year": "", "title": "甲公司向乙公司借款，以自有货车设定抵押，签订了抵押合同但未办理抵押登记。抵押期间，该货车在经营使用过程中遭遇事故全部毁损，甲公司获得责任人赔款20 万元。有关乙公司的抵押权，下列说法不正确的有（）。", "options": ["由于未办理抵押登记，乙公司不享有抵押权", "由于抵押物已经全部毁损，乙公司的抵押权消灭", "20 万元的责任人赔款继续担保乙公司的抵押债权", "实现抵押权时，如果因乙公司未提前通知责任人向自己给付赔偿金，而导致责任人直接向甲公司完成支付，则乙公司无权要求责任人向自己重复支付赔偿金"], "answer": [0, 1], "explain": "（1）选项A：货车属于动产，乙公司的动产抵押权自抵押合同生效时设立；（2） 选项BC：虽然抵押物已经全部毁损，但赔款20 万元继续担保乙公司债权的实现，乙公司可以就 该赔款优先受偿；（3）选项D：给付义务人已经向抵押人给付了保险金、赔偿金或者补偿金， 抵押权人不得请求给付义务人向其给付保险金、赔偿金或者补偿金，但是给付义务人接到抵押 权人要求向其给付的通知后仍然向抵押人给付的除外。"}, {"type": "multi", "year": "", "title": "2025 年7 月10 日，甲公司与A 银行签订借款合同，同时甲公司将其一宗土地的建设用地使用权抵押给A 银行。此时，该建设用地使用权上已经完工了一幢建筑物M，双方签订书面抵押合同，并于7 月11 日办理了抵押登记。2025 年8 月，甲公司在已设立抵押权的建设用地上续建建筑物N。债务到期时，因甲公司无法归还到期借款的本息，A 银行依法实现抵押权。经评估，抵押的建设用地使用权连同建筑物M、N 价值为5000 万元，其中建筑物M 的价值为300 万元、建筑物N 价值400 万元。不考虑其他因素，则下列说法正确的有（）。", "options": ["建筑物M 属于抵押财产", "建筑物N 不属于抵押财产", "A 银行就拍卖所得优先受偿的数额应为4 600 万元", "A 银行就拍卖所得优先受偿的数额应为5 000 万元"], "answer": [0, 1, 2], "explain": "建筑物M 是建设用地使用权抵押时已有的建筑物，属于抵押财产，选项A 正确； 建筑物N 是建设用地使用权抵押后新增的建筑物，不属于抵押财产，选项B 正确；A 银行实现抵 押权时，可将建筑物M、N 和建设用地使用权一并拍卖，但A 银行就建筑物N 拍卖所得价款400 万元无权优先受偿，A 银行就拍卖所得优先受偿的数额应为4600 万元（5000 万元－400 万元）， 选项C 正确。"}, {"type": "multi", "year": "", "title": "2020 年初，甲将一套房屋出租给乙，双方签订租赁合同（租期为20 年）。2021 年初，甲将该房屋用于向A 银行抵押贷款（贷款期为一年），双方签订了书面抵押合同并依法办理了抵押登记。一年后，甲无力清偿该笔贷款，A 银行欲实现抵押权。不考虑其他因素，则下列说法正确的有（）。", "options": ["因该房屋存在租赁关系，该抵押权不能设立", "即使该房屋存在租赁关系，也不影响抵押权的设立", "银行可以实现抵押权，并可要求租客乙腾退房屋", "银行可以实现抵押权，但不得要求租客乙腾退房屋"], "answer": [1, 3], "explain": "抵押权设立前，抵押财产已经出租并转移占有的，原租赁关系不受该抵押权的影 响。"}, {"type": "single", "year": "", "title": "甲将房屋抵押给乙，并办理抵押登记，但是未约定不得转让。后甲又将房屋抵押给丙，未办理抵押登记。后甲将房屋转让给丁，并办理转让手续，则下列说法中正确的是（）。（2024 年）", "options": ["甲可以不通知乙直接转让", "因丁取得该房屋所有权，导致抵押权消灭", "因甲未经过乙同意转让抵押物，该转让无效", "丙抵押权未设立"], "answer": [3], "explain": "选项A：抵押财产转让的，抵押人应当及时通知抵押权人；选项B：抵押财产转让 的，抵押权不受影响；选项C：未约定抵押财产不得转让的，抵押人可以转让抵押财产；选项D： 不动产抵押权的设立看“抵押登记”，甲和丙并没有办理抵押登记，因此丙的抵押权未设立。"}, {"type": "single", "year": "", "title": "张某于2025 年2 月10 日向甲银行借款30 万元，以自己的一套房屋提供抵押但未办理抵押登记。张某又于2025 年3 月1 日向乙银行借款50 万元，同样以该房屋提供抵押并于3 月5 日办理抵押登记。张某又于2025 年5 月1 日向丙银行借款80 万元，同样以该房屋提供抵押并于5 月5 日办理抵押登记。三笔借款均到期后张某无力清偿，该房屋拍卖所得100万元，则三家银行可以就房屋价款受偿的数额是（）。（2025 年）", "options": ["甲银行30 万元、乙银行50 万元、丙银行20 万元", "甲银行0 元、乙银行20 万元、丙银行80 万元", "甲银行0 元、乙银行50 万元、丙银行50 万元", "甲银行30 万元、乙银行与丙银行各35 万元"], "answer": [2], "explain": "以不动产设定抵押的，应当办理抵押登记，抵押权自登记时起设立。不动产抵押 未登记的，抵押权不设立。抵押权已经登记的，按照登记的时间先后确定清偿顺序。因此甲银 行不享有抵押权，而登记在先的乙银行优先于丙银行受偿。即乙银行优先受偿50 万元，丙银行 受偿房屋拍卖价款所得剩余的50 万元，甲银行不能就房屋价款得到清偿。选项C 当选。"}, {"type": "single", "year": "", "title": "甲向乙、丙、丁三家银行借款，均以自己的一套房屋抵押。乙的债权为100万元，丙的债权为300 万元，丁的债权为500 万元，登记的顺为乙、丙、丁。后未经丙的同意，乙和丁协议变更抵押权顺位。甲到期不能偿还债务，房屋拍卖所得价款400 万元，下列关于乙、丙、丁三家银行的抵押权顺位表述正确的是（）。（2022 年）", "options": ["丁400 万元，丙0，乙0", "丁100 万元，丙300 万元，乙0", "乙100 万元，丙300 万元，丁0", "乙100 万元，丁300 万元，丙0"], "answer": [1], "explain": "根据《民法典》第四百零九条的规定，“ 抵押权人与抵押人可以协议变更抵押权 顺位以及被担保的债权数额等内容。但是，抵押权的变更未经其他抵押权人书面同意的，不得 对其他抵押权人产生不利影响”。本题中，乙丁抵押权的变更未经丙同意，不得对丙的300 万 元债权产生不利影响，选项B 当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，抵押物折价或者拍卖、变卖所得的价款，当事人没有约定的，按（）顺序清偿。（2023 年）", "options": ["实现抵押权的费用→主债权的利息→主债权", "实现抵押权的费用→主债权→主债权的利息", "主债权→主债权的利息→实现抵押权的费用", "主债权的利息→实现抵押权的费用→主债权"], "answer": [0], "explain": "抵押物折价或者拍卖、变卖所得的价款，当事人没有约定的，按下列顺序清偿： （1）实现抵押权的费用；（2）主债权的利息；（3）主债权。抵押财产折价或者拍卖、变卖后， 其价款超过债权数额的部分归抵押人所有，不足部分由债务人清偿。选项A 当选。"}, {"type": "single", "year": "", "title": "甲向乙借款的本金为100 万元，产生的借款利息为10 万元。因甲无力清偿到期债务，乙通过拍卖方式实现抵押权，抵押财产拍得的价款为60 万元，因拍卖产生的相关费用5 万元。该抵押担保未约定清偿顺序，则本金可以获得清偿的金额是（）。（2024 年）", "options": ["45", "60", "0", "55"], "answer": [0], "explain": "抵押物折价或者拍卖、变卖所得的价款，当事人没有约定的，按下列顺序清偿： （1）实现抵押权的费用；（2）主债权的利息；（3）主债权。因此拍得价款首先清偿实现抵押权 的费用5 万元，再清偿借款利息10 万元，最后清偿借款本金，清偿本金的金额＝60－5－10＝45（万 元）。"}, {"type": "single", "year": "", "title": "甲公司与乙银行借款100 万元，将其现有的以及将有的生产设备、原材料、半成品、产品一并抵押给乙银行，但未办理抵押登记，抵押期间，未经乙银行同意，甲公司以市场价格将一台生产设备转让给善意第三人丙公司，并已交付，后甲公司不能向乙银行清偿到期债务，下列关于该抵押权的表述中，正确的是（）。（2022 年）", "options": ["该抵押权虽已设立但不能对抗丙公司", "乙银行有权对丙公司从甲公司处购买的生产设备行使抵押权", "该抵押权因抵押物不特定而不能设立", "该抵押权因未办理抵押登记而不能设立"], "answer": [0], "explain": "当事人以生产设备、原材料、半成品、产品、交通运输工具和正在建造的船舶、 航空器抵押或其他动产设定抵押，抵押权自抵押合同生效时设立，抵押权未经登记，不得对抗 善意第三人。选项A 当选。"}, {"type": "single", "year": "", "title": "甲企业将其现有的以及将有的生产设备、原材料、半成品、产品一并抵押给乙银行，但未办理抵押登记。抵押期间，甲企业未经乙银行同意以合理价格将一批产成品出售给知情的丙公司，已交付。后甲企业不能向乙银行履行到期债务，乙银行拟行使抵押权。下列关于该抵押权效力的表述中，正确的是（）。", "options": ["该抵押权已成立且可以对抗知情的丙公司", "该抵押权因未办理抵押登记而不能成立", "该抵押权因抵押物不特定而不能成立", "该抵押权已成立但不得对抗丙公司"], "answer": [3], "explain": "以动产抵押的，不得对抗正常经营活动中已经支付合理价款并取得抵押财产的买受人。"}, {"type": "single", "year": "", "title": "2025 年6 月5 日，甲公司向乙银行借款500 万元，以其现有的以及将有的生产设备设立浮动抵押权，并办理了抵押登记。2025 年7 月6 日，甲公司从丙公司购入一台价值300 万元的M 设备。为担保支付货款，设备交付后，甲公司于2025 年7 月10 日以M 设备为丙公司设立抵押并办理了登记。7 月20 日，甲公司向丁公司借款50 万元，又以M 设备设立抵押，但未对抵押权进行登记。上述债务均已到期，且甲公司无力清偿，M 设备被拍卖，各债权人均主张就M 设备拍卖价款优先受偿。下列关于受偿顺序，说法正确的是（）。（2025 年）", "options": ["乙银行最先、丙公司次之、丁公司最后", "丙公司最先、乙银行次之、丁公司最后", "丙公司最先、丁公司次之、乙银行最后", "乙银行最先、丁公司次之、丙公司最后"], "answer": [1], "explain": "动产抵押担保的主债权是抵押物的价款，标的物交付后10 日内办理抵押登记的， 该抵押权人优先于抵押物买受人的其他担保物权人受偿，但是留置权人除外，此种抵押权被称 为“价款债权抵押权”，所以丙公司最先；抵押权已登记的优先于未登记的受偿，所以乙银行 优先于丁公司。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列关于最高额抵押权的表述中，正确的有（）。（2025 年）", "options": ["实际发生的债权是连续的、不特定的", "抵押担保的债权额不确定，但没有最高限制额", "最高额抵押权只需首次登记即可设立", "债权人仅对抵押财产行使最高额限度内的优先受偿权"], "answer": [0, 2, 3], "explain": "最高额抵押，是指为担保债务的履行，债务人或者第三人对一定期间内将要连续 发生的债权提供担保财产，债务人不履行到期债务或者发生当事人约定的实现抵押权的情形， 抵押权人有权在最高债权额限度内就该担保财产优先受偿。因此最高额抵押是有最高债权额限 度的，选项B 不当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列关于最高额抵押权的表述中，错误的是（）。（2024 年）", "options": ["抵押权人如果实际发生的债权额高于最高限额的，抵押权无效", "最高额抵押权只需首次登记即可设立", "债务人被宣告破产时，最高额抵押权人的债权确定", "最高额抵押担保的债权确定前，部分债权转让的，最高额抵押权一般不得转让"], "answer": [0], "explain": "抵押权人实现最高额抵押权时，如果实际发生的债权余额高于最高限额的，以最 高限额为限，超过部分不具有优先受偿的效力。即最高限额内的债权，仍享有抵押权。选项A 当选。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，下列各项中，最高额抵押权所担保的债权确定的有（）。（2023 年）", "options": ["约定的债权确定期间届满", "抵押权人知道或应当知道抵押财产被查封、扣押", "债务人、抵押人被宣告破产或者被解散", "新的债权不可能发生"], "answer": [0, 1, 2, 3], "explain": "有下列情形之一的，抵押权人的债权确定：（1）约定的债权确定期间届满，选项 A 当选；（2）没有约定债权确定期间或约定不明确，抵押权人或抵押人自最高额抵押权设立之 日起满2 年后请求确定债权；（3）新的债权不可能发生，选项D 当选；（4）抵押权人知道或 应当知道抵押财产被查封、扣押，选项B 当选; （5）债务人、抵押人被宣告破产或者被解散， 选项C 当选；（6）法律规定债权确定的其他情形。"}, {"type": "single", "year": "", "title": "甲与乙签订借款合同，并约定由乙将自己的翡翠貔貅出质给甲。但其后乙并未将翡翠貔貅如约交付给甲，而是把该翡翠貔貅卖给了丙。丙取得翡翠貔貅后，与甲因该翡翠貔貅的权利归属发生纠纷。根据合同法律制度的规定，下列关于该翡翠貔貅权利归属的表述中，正确的是（）。", "options": ["丙不能取得该翡翠貔貅的所有权，因为该翡翠貔貅已质押给甲", "丙能取得该翡翠貔貅的所有权，但甲可依其质权向丙追偿", "丙能取得该翡翠貔貅的所有权，甲不能向丙要求返还该翡翠貔貅", "丙能否取得该翡翠貔貅的所有权，取决于甲同意与否"], "answer": [2], "explain": "选项A、B，动产质权自出质人交付质押财产时设立。本题中，乙未向甲交付翡翠 貔貅，质权并未设立。选项C、D：除法律另有规定或者当事人另有约定以外，动产所有权自交 付之日起发生物权变动效力。在本题中，乙将翡翠貔貅交付给丙，丙依法取得了该翡翠貔貅的 所有权。"}, {"type": "judge", "year": "", "title": "为债务人质押担保的第三人，在质权人实现质权后，有权向债务人追偿。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "为债务人质押担保的第三人，在质权人实现质权后，有权向债务人追偿。本题表 述正确。"}, {"type": "multi", "year": "", "title": "根据物权法律制度的规定，债务人有权处分的下列权利中，可以设定权利质押的有（）。（2018 年）", "options": ["建设用地使用权", "可以转让的基金份额", "房屋所有权", "应收账款"], "answer": [1, 3], "explain": "根据物权法律制度的规定，债务人或者第三人有权处分的下列权利可以出质：（1） 汇票、支票、本票；（2）债券、存款单；（3）仓单、提单；（4）可以转让的基金份额、股权； （5）可以转让的注册商标专用权、专利权、著作权等知识产权中的财产权；（6）应收账款； （7）法律、行政法规规定可以出质的其他财产权利。选项A、C 可以抵押。"}, {"type": "multi", "year": "", "title": "下列关于各权利质权的设立时间的说法中，正确的有（）。（2024 年）", "options": ["以汇票出质，质权自交付时生效", "以应收账款出质，质权自合同生效时生效", "以股权出质，质权自权利凭证交付时生效", "以商标出质，质权自办理出质登记时生效"], "answer": [0, 3], "explain": "以应收账款出质的，质权自办理出质登记时设立，选项B 不当选。以基金份额、 股权出质的，质权自办理出质登记时设立，选项C 不当选。选项A、D 当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度的规定，下列关于应收账款出质的表述中，错误的是（）。（2024 年）", "options": ["应收账款出质后，不得转让，但出质人与质权人协商同意的除外", "出质人以基础设施收益权出质的，如果该收益权未设立特定账户，质权人有权请求以折价或拍卖、变卖项目收益权所得的价款优先受偿", "质权人通知应收账款债务人向其履行债务后，应收账款债务人仍向应收账款债权人履行的，质权人有权要求应收账款债务人向其履行债务", "出质人转让应收账款所得的价款，应当用于向质权人提前清偿债务"], "answer": [3], "explain": "出质人转让应收账款所得的价款，应当向质权人提前清偿债务或者提存。"}, {"type": "single", "year": "", "title": "甲公司委托乙公司加工西服500 套，每套加工费200 元，共10 万元；约定甲公司取货时一次性支付加工费，并约定该批西服不得留置。后甲公司经济困难仅支付了8 万元加工费，乙公司留置了300 套西服。关于乙公司留置权的说法中，正确的是（）。（2025 年）", "options": ["乙公司不得行使留置权，因为约定了不得留置", "乙公司可以行使留置权，但不得留置300 套西服", "乙公司可以就全部西服行使留置权", "乙公司不得行使留置权，因为甲公司已经支付80%的加工费"], "answer": [0], "explain": "法律规定或者当事人约定不得留置的动产，不得留置。选项A 当选。"}, {"type": "single", "year": "", "title": "根据物权法律制度规定，下列权利中，其设立需要登记的是（）。（2024年）", "options": ["土地承包经营权", "留置权", "不动产抵押权", "动产质权"], "answer": [2], "explain": "土地承包经营权自土地承包经营权合同生效时设立，选项A 不当选。留置权的成 立要件：（1）债权人占有债务人之动产；（2）债权已届清偿期且债务人未按规定的期限履行 义务；（3）占有的动产应与债权属于同一法律关系，但企业之间留置的除外，选项B 不当选。 质押合同自成立时生效；但质权自出质人交付质押财产时设立，即动产质权的设立以质物的交 付为生效要件，选项D 不当选。选项C 当选。"}, {"type": "judge", "year": "", "title": "甲企业向乙企业购买了一批总价款100 万元的建筑材料，甲企业支付了60万元，约定其余的40 万元在3 个月内付清。后甲企业将一台价值30 万元的施工设备交由乙企业代为保管。3 个月后，几经催告，甲企业仍未支付乙企业40 万元货款。则甲企业要求提取该设备时，乙企业可以将该设备留置以担保货款债权的实现。（）", "options": ["对", "错"], "answer": [0], "explain": "本题中涉及两个法律关系，一个是《买卖合同》，一个是《施工设备保管合同》。 乙企业的债权产生于《买卖合同》，乙企业留置的动产产生于《保管合同》，二者显然不属于 同一法律关系，但是由于该项留置发生在甲企业和乙企业两个企业之间，因此不必拘泥于同一 法律关系，允许进行商事留置。"}, {"type": "judge", "year": "", "title": "留置权人无权收取留置财产的孳息。（）（2021 年）", "options": ["对", "错"], "answer": [1], "explain": "留置权人有权收取留置财产的孳息。"}, {"type": "multi", "year": "", "title": "2022 年3 月1 日,周某以其所有的一辆轿车设立抵押权，向吴某借款10 万元，双方签订抵押合同但未办理抵押登记。3 月23 日，周某为获得李某20 万元的借款，又将该轿车抵押给李某，双方签订抵押合同并办理了抵押登记。4 月10 日，该轿车因故障需要维修，周某将其送至王某处进行维修，周某一直未支付维修费用，故王某将汽车留置。上述债务均已到期，因周某无力偿还，该轿车被拍卖，吴某、李某、王某均主张就轿车拍卖价款优先受偿，下列关于债权人受偿顺序的表述中，正确的有（）。（2022 年）", "options": ["王某优先于李某受偿", "李某优先于吴某受偿", "吴某优先于李某受偿", "李某优先于王某受偿"], "answer": [0, 1], "explain": "（1）同一财产向两个以上债权人抵押的，拍卖、变卖抵押财产所得的价款依照下 列规定清偿：抵押权均已经登记的，按照登记的时间先后确定清偿顺序；抵押权并非都已经登 记的，抵押权已经登记的先于未登记的受偿；抵押权均未登记的，按照债权比例清偿。（2）同 一动产上已设立抵押权或者质权，该动产又被留置的，留置权人优先受偿。综上，选项A、B 当 选。"}]}, "ch5": {"name": "合同法律制度", "questions": [{"type": "single", "year": "", "title": "下列各项中，属于《民法典》合同编调整范围的是（）。（2019 年）", "options": ["陈某与张某签订的收养协议", "赵某与乙公司签订的租赁合同", "王某与钱某签订的子女监护权协议", "甲公司与李某签订的劳动合同"], "answer": [1], "explain": "婚姻、收养、监护等有关身份关系的协议，适用有关该身份关系的法律规定，没 有规定的，可以根据其性质参照适用《民法典》合同编规定。选项A、C 不当选。我国境内的企 业、个体经济组织、民办非企业单位等组织与劳动者之间，国家机关、事业单位、社会团体和 与其建立劳动关系的劳动者之间，依法订立、履行、变更解除或终止劳动合同，适用《劳动合 同法》，选项D 不当选。"}, {"type": "multi", "year": "", "title": "下列合同中，属于诺成合同的有（）。（2022 年）", "options": ["郑某与王某之间的借款合同", "周某与吴某之间的赠与合同", "孙某与李某之间的租赁合同", "赵某与钱某之间的买卖合同"], "answer": [1, 2, 3], "explain": "（1）诺成合同是指当事人的意思表示一致即成立的合同如买卖合同、租赁合同。现实 生活中，绝大多数合同为诺成合同，选项C、D 当选。（2）实践合同，又称要物合同，是指除当事 人的意思表示一致以外，尚须交付标的物或完成其他给付才能成立的合同，如自然人之间的借贷合 同、定金合同，选项A 不当选。（3）赠与合同是一种诺成、单务、无偿合同，选项B 当选。"}, {"type": "judge", "year": "", "title": "当事人一方未按照约定履行预约合同约定的订立合同义务的，另一方可以请求其承担预约合同的违约责任。（）（2023 年）", "options": ["对", "错"], "answer": [0], "explain": "当事人约定在将来一定期限内订立合同的认购书、订购书、预订书等，构成预约 合同。当事人一方不履行预约合同约定的订立合同义务的，对方可以请求其承担预约合同的违 约责任。本题表述正确。"}, {"type": "judge", "year": "", "title": "王某与吴某通过电子邮件签订的化妆品买卖合同属于书面形式的合同。（）", "options": ["对", "错"], "answer": [0], "explain": "以电子数据交换、电子邮件等方式能够有形地表现所载内容，并可以随时调取查 用的数据电文，视为书面形式。"}, {"type": "multi", "year": "", "title": "下列意思表示中，属于要约邀请的有（）。（2024 年）", "options": ["甲公司在报纸上发布的拍卖公告", "乙公司向客户寄送价目表", "丙公司发布的招股说明书", "丁公司发布的符合要约条件的商业广告"], "answer": [0, 1, 2], "explain": "拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告 和宣传、寄送的价目表等为要约邀请，选项A、B、C 当选；商业广告和宣传的内容符合要约条 件的，构成要约，选项D 不当选。"}, {"type": "single", "year": "", "title": "8 月1 日，周某未与吴某协商，自行通过电子邮件向吴某的QQ 邮箱发送一份要约；8 月2 日，周某微信告知吴某此事，吴某回复“收到”；8 月5 日，吴某拟登录该邮箱查阅，由于该邮箱已经10 年不使用，吴某遗忘密码未能成功登录；8 月8 日，吴某凭找回的登录密码登录邮箱阅读了该要约。该要约的生效时间是（）。", "options": ["8 月1 日", "8 月2 日", "8 月5 日", "8 月8 日"], "answer": [1], "explain": "本题属于采用数据电文形式发出要约且收件人不知情、未指定系统接收的情形， 要约应自8 月2 日吴某知悉该电子邮件进入其邮箱时生效。"}, {"type": "single", "year": "", "title": "甲公司向乙公司以信件的方式发出出售生产设备的要约，信封落款日期为2025年1 月6 日，发出日期为1 月8 日，到达乙公司注册住所的日期为1 月10 日，到达乙公司法定代表人手中的日期是1 月11 日，此要约的生效日期（）。（2025 年）", "options": ["1 月10 日", "1 月6 日", "1 月8 日", "1 月11 日"], "answer": [0], "explain": "以非对话方式作出的要约，自到达受要约人时生效。要约到达受要约人，并不是 指要约一定实际送达到受要约人或者其代理人手中，要约只要送达到受要约人通常的地址、住 所或者其他能够控制的现实或虚拟空间（如信箱或邮箱等），即为送达，选项A 当选。"}, {"type": "single", "year": "", "title": "甲公司拟购入一套大型生产设备。4 月1 日，甲公司向乙设备厂发出了一份详细的书面要约，并在要约中注明：请在4 月20 日前及时答复，在此期间我方将不更改前述内容或转购其他公司设备。该要约到达乙设备厂后，甲公司拟撤销该要约。有关该要约能否撤销的表述中，正确的是（）。", "options": ["该要约可以撤销，只要乙设备厂尚未发出承诺", "该要约可以撤销，只要乙设备厂的承诺尚未到达甲公司", "该要约可以撤销，只要乙设备厂尚未为履行合同做准备工作", "该要约不得撤销，因为要约人以确定承诺期限的形式明示要约不可撤销"], "answer": [3], "explain": "有下列情形之一的，要约不得撤销： （1）确定了承诺期限的要约（选项D）； （2）明示不可撤销的要约； （3）受要约人有理由认为要约是不可撤销的，并已经为履行合同做了合理的准备工作。"}, {"type": "multi", "year": "", "title": "甲公司以邮政快递的形式向乙公司发出了一份购买100 台空调的书面要约，下列情形中甲公司不得撤销要约的有（）。（2022 年）", "options": ["甲公司在要约中明示要约不可撤销", "甲公司的要约已经到达乙公司法定地址，且乙公司尚未作出承诺", "乙公司有理由认为要约不可撤销的，且已为履行合同做了合理准备工作", "甲公司在要约中确定了承诺期限"], "answer": [0, 2, 3], "explain": "有下列情形之一的，要约不得撤销： （1）确定了承诺期限的要约（选项D）； （2）明示不可撤销的要约（选项A）； （3）受要约人有理由认为要约是不可撤销的，并已经为履行合同做了合理的准备工作（选 项C）。"}, {"type": "multi", "year": "", "title": "下列情形中，属于要约失效的有（）。（非标准题型）", "options": ["承诺期限届满，受要约人未作出承诺", "受要约人拒绝要约的通知到达要约人", "受要约人对要约的内容作出实质性变更", "要约人依法撤销要约", "要约人依法撤回要约", "在受要约人作出承诺后，要约人表示撤销要约"], "answer": [0, 1, 2, 3], "explain": "有下列情形之一的，要约失效： （1）要约被拒绝（选项B）； （2）要约被依法撤销（选项D）； （3）承诺期限届满，受要约人未作出承诺（选项A）； （4）受要约人对要约的内容作出实质性变更（选项C）。"}, {"type": "single", "year": "", "title": "6 月1 日，甲公司向乙公司发出一封信件，欲购买十件绣花窗帘，1000 元一件。6 月2 日，乙公司收到了信件。6 月3 日，甲发出撤销要约的信件，结果因为天气原因6 月5 日才到达。6 月4 日乙回复甲称“只有印花窗帘，800 元一件”。6 月6 日甲回复不购买该窗帘。甲发出要约的失效日期是（）。（2024 年）", "options": ["6 月6 日", "6 月3 日", "6 月4 日", "6 月5 日"], "answer": [2], "explain": "要约失效的情形包括：（1）要约被拒绝；（2）要约被依法撤销；（3）承诺期限 届满，受要约人未作出承诺；（4）受要约人对要约的内容作出实质性变更。本题中，乙于6 月 4 日对要约作出实质性变更，原要约失效。选项C 当选。"}, {"type": "multi", "year": "", "title": "赵某有一台电脑，5 月1 日赵某向李某发出邮件称欲以8000 元出售该电脑，5 月3 日李某回复称如果价格能降至7500 元且能够送货上门则愿意购买，5 月5 日赵某复函称送货上门没有问题，但价格最低为7800 元。5 月7 日李某复函表示同意。根据合同法律制度的规定，下列各项中属于要约的有（）。（2022 年）", "options": ["5 月1 日赵某的第一次发函", "5 月3 日李某的第一次回函", "5 月5 日赵某的第二次发函", "5 月7 日李某的第二次回函"], "answer": [0, 1, 2], "explain": "收到要约后，如果对要约内容的价格、数量等作了实质性变更，视为新要约。本 题中，只有5 月7 日的回函为承诺，其余均为要约。选项A、B、C 当选。"}, {"type": "multi", "year": "", "title": "张某向李某发出一份要约，表示愿意以1 万元购买李某的限量版相机一部，如欲出售请在1 个月内答复。针对该份要约的下列表述中，符合规定的有（）。（根据2024年考生回忆改编）", "options": ["若李某在收到要约后1 个月内未作出承诺的，该要约失效", "若张某撤销要约的通知在李某做出承诺之前到达，则该要约被撤销", "若李某回复该相机需要2 万元才能出售，应当视为对张某要约的拒绝", "若李某回复愿意出售，但必须签订书面合同，该回复为新要约"], "answer": [0, 2], "explain": "选项A：承诺期限届满，受要约人未作出承诺的，要约失效；选项B：确定了承诺 期限的要约不可撤销；选项C：对要约内容作出实质性变更是对原要约的拒绝；选项D：合同订 立的形式不属于对要约内容的实质性变更，不作为新要约对待。"}, {"type": "single", "year": "", "title": "梁某在路上遇见同村的丁某，询问丁某是否愿意购买其某辆摩托车，价格2000元，丁某当场未答复，次日，丁某找到梁某表示同意以2000 元的价格购买该摩托车，梁某告知丁某该摩托车已卖给邻村的林某，丁某表示同意以2000 元的价格购买摩托车的意思表示是（）。（2020 年）", "options": ["要约邀请", "承诺", "单方法律行为", "要约"], "answer": [3], "explain": "（1）要约邀请是希望他人向自己发出要约的意思表示（寄送的价目表、拍卖公告、 招标公告、招股说明书等，性质为要约邀请）。（2）要约是希望与他人订立合同的意思表示。 （3）承诺是受要约人同意要约的意思表示。（4）本题中，梁某作出要约，丁某未回复，丁某 次日欲以2000 元购买摩托车的行为属于要约。选项D 当选。"}, {"type": "single", "year": "", "title": "赵某以信件形式向钱某发出要约，信件未载明承诺开始日期，仅规定承诺期限为15 天。7 月4 日，赵某将信件交付邮局，邮局将信件加盖7 月5 日邮戳发出；7 月7 日，信件送达受要约人钱某的信箱；钱某因出差，直至7 月15 日才阅读信件内容。该承诺期限的起算日为（）。", "options": ["7 月7 日", "7 月5 日", "7 月4 日", "7 月15 日"], "answer": [1], "explain": "要约以信件作出的，承诺期限自信件载明的日期开始计算；信件未载明日期的， 自投寄该信件的邮戳日期（7 月5 日）开始计算。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于承诺的表述正确的有（）。（2023 年）", "options": ["承诺到达要约人后，可以撤销", "承诺对要约的内容作出实质性变更的为新要约", "承诺通知方式可以是口头的也可以是书面的", "承诺通知到达要约人时生效"], "answer": [1, 2, 3], "explain": "承诺可以撤回，不能撤销。承诺到达要约人后，不可以撤销。选项A 不当选。"}, {"type": "single", "year": "", "title": "2024 年5 月22 日，甲公司向乙公司发出一份要约，并注明最晚的承诺期限为2024 年6 月10 日。乙公司于2024 年5 月23 日收到要约，并于2024 年5 月29 日回函承诺，由于投递错误，该承诺函件于2024 年6 月12 日到达甲公司处。下列说法中，错误的是（）。（根据2024 年考生回忆改编）", "options": ["若甲公司撤回要约的通知在5 月23 日前到达乙公司，要约可撤回", "若甲公司撤销要约的通知在5 月29 日前到达乙公司，要约可撤销", "乙公司回函表示同意按要约条件购买钢材构成承诺", "若甲公司及时通知乙公司其承诺超过其期限不接受该承诺，乙公司承诺无效"], "answer": [1], "explain": "确定了承诺期限的要约不得撤销，选项B 错误。"}, {"type": "single", "year": "", "title": "甲、乙两公司以电子邮件的方式就一批钢材的买卖合同进行磋商，经过多轮邮件，乙公司在回复同意甲公司最后一处修改的电子邮件后认为，双方已经就买卖合同的各项细节达成一致，遂向甲公司发出钢材，但钢材到达甲公司处被拒收，甲公司提出在双方的往来邮件中一直有一条“达成买卖合同以最终书面签订确认书为准”，经查该条款一直存在，乙公司未予注意。有关本案的下列说法中，正确的是（）。", "options": ["合同不成立，因为双方未最终签订确认书", "合同不成立，因为法律不承认以电子邮件磋商是合同的订立方式", "合同成立，因为乙公司已经履行了合同的主要义务", "合同成立，因为双方已就买卖合同的各项细节达成一致"], "answer": [0], "explain": "当事人采用信件、数据电文等形式订立合同要求签订确认书的，签订确认书时合 同成立。"}, {"type": "single", "year": "", "title": "甲、乙两公司拟签订一份书面买卖合同，甲公司签字盖章后尚未将书面合同邮寄给乙公司时，即接到乙公司按照合同约定发来的货物，甲公司经清点后将该批货物入库。次日将签字盖章后的书面合同发给乙公司。乙公司收到后，即在合同书上签字盖章。该合同成立的时间是（）。", "options": ["甲公司签字盖章时", "乙公司签字盖章时", "甲公司接受乙公司发来的货物时", "甲公司将签字盖章后的合同发给乙公司时"], "answer": [2], "explain": "根据规定，当事人采用合同书形式订立合同的，自双方当事人签字或者盖章时合 同成立，在签字或者盖章之前，当事人一方已经履行主要义务并且对方接受的，该合同成立。"}, {"type": "single", "year": "", "title": "甲、乙在M 市磋商拟定买卖合同，合同约定成立地为N 市，甲于住所地P 市完成合同的签名和盖章。之后乙于住所地Q 市完成合同的签名和盖章，则合同的成立地点为（）。（2025 年）", "options": ["M 市", "N 市", "P 市", "Q 市"], "answer": [1], "explain": "当事人对合同的成立地点另有约定的，按照其约定。采用书面形式订立合同，合 同约定的地点与实际签字或者盖章地点不符的，应当认定约定的地点为合同成立地点。本题中， 合同约定成立地为N 市，因此应按照该约定。选项B 当选。"}, {"type": "single", "year": "", "title": "赵某与钱某订立买卖合同，在A 地磋商达成基本意向，形成合同文本后，赵某在B 地签名并寄往C 地，钱某在C 地签名，合同约定的履行地点为D 地。已知，当事人对合同成立地点未作约定。根据合同法律制度的规定，该买卖合同的成立地点为（）。（2022 年）", "options": ["A 地", "B 地", "C 地", "D 地"], "answer": [2], "explain": "本题属于对合同的成立地点未作约定且采用合同书形式订立合同的情形，以最后 一方签名、盖章或者按指印的地点作为合同的成立地点。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，下列关于采用数据电文形式订立合同的表述中，不正确的是（）。（2021 年）", "options": ["以电子邮件等数据电文形式订立的合同，属于采用书面形式的合同", "对通过电子邮件发出的要约，当事人未约定生效时间的，该要约自电子邮件发出时生效", "采用数据电文形式订立合同，收件人没有主营业地的，收件人的住所地为合同成立的地点", "当事人采用数据电文形式订立合同，在合同成立前要求签订确认书的，签订确认书时合同成立"], "answer": [1], "explain": "要约属于有相对人的意思表示，其生效时间采取“到达主义”。以非对话方式作 出的采用数据电文形式的意思表示，相对人指定特定系统接收数据电文的，该数据电文进入该 特定系统时生效；未指定特定系统的，相对人知道或者应当知道该数据电文进入其系统时生效。 当事人对采用数据电文形式的意思表示的生效时间另有约定的，按照其约定。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于格式条款的表述中，正确的有（）。（2021 年）", "options": ["提供格式条款一方对免除或者限制其责任的内容，应举证其已尽合理提示及说明义务", "对格式条款有两种以上解释的，应当作出有利于提供格式条款一方的解释", "格式条款和非格式条款不一致的，应当采用格式条款", "提供格式条款一方排除合同对方当事人主要权利的，格式条款无效"], "answer": [0, 3], "explain": "（1）对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释， 选项B 不当选；（2）格式条款和非格式条款不一致的，应当采用非格式条款，选项C 不当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列情形中，属于无效格式条款的有（）。（2025年）", "options": ["造成对方人身伤害的免责格式条款", "无过错造成对方财产损失的免责格式条款", "提供格式条款的一方排除对方主要权利的格式条款", "提供格式条款一方不合理地加重对方责任的格式条款"], "answer": [0, 2, 3], "explain": "格式条款有下列情形之一的无效：（1）提供格式条款的一方不合理地免除或减轻 其责任、加重对方责任、限制对方主要权利，选项D 当选。（2）提供格式条款的一方排除对方 主要权利，选项C 当选。（3）造成对方人身损害的免责格式条款，选项A 当选。（4）因故意 或重大过失造成对方财产损失的免责格式条款，选项B 不当选。"}, {"type": "judge", "year": "", "title": "在承担缔约过失责任时，信赖利益的赔偿不得超过合同有效时相对人所可能得到的履行利益。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "信赖利益的赔偿不得超过合同有效时相对人所可能得到的履行利益。本题表述正确。"}, {"type": "judge", "year": "", "title": "债务人部分履行债务给债权人增加的费用，由债务人承担。（）（2024 年）", "options": ["对", "错"], "answer": [0], "explain": "债务人部分履行债务给债权人增加的费用，由债务人负担。本题表述正确。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，当事人就有关合同内容约定不明确的，可以补充协议，不能达成补充协议的，按照交易习惯或者合同有关条款确定，仍不能确定的，适用法定规则。下列关于法定规则的表述中，正确的有（）。（2020 年）", "options": ["履行期限不明确的，债务人可随时履行，但债权人不可以随时要求履行", "履行费用的负担不明确的，由权利人一方负担", "履行地点不明确，给付货币的，在接受货币一方所在地履行", "履行方式不明确的，按照有利于实现合同目的的方式履行"], "answer": [2, 3], "explain": "（1）合同生效后，当事人就质量、价款等内容没有约定或者约定不明确的，可以 协议补充；不能达成补充协议的，按照交易习惯或者合同有关条款确定。（2）具体规则：质量 要求不明确的，按照国家标准、行业标准履行；没有国家标准、行业标准的，按照通常标准或 者符合合同目的的特定标准履行。价款或者报酬不明确的，按照订立合同时履行地的市场价格 履行。履行地点不明确的，给付货币的，在接受货币一方所在地履行（选项C）；交付不动产的， 在不动产所在地履行﹔其他标的，在履行义务一方所在地履行。履行期限不明确的，债务人可 以随时履行，债权人也可以随时要求履行，但应当给对方必要的准备时间（选项A）。履行方式 不明确的，按照有利于实现合同目的的方式履行（选项D）。履行费用的负担不明确的，由履行 义务一方负担（选项B）。"}, {"type": "single", "year": "", "title": "甲、乙两公司的住所地分别位于北京和海口。甲向乙购买一批海南产香蕉，3 个月后交货。但合同对于履行地点和价款均无明确约定，双方也未能就有关内容达成补充协议，依照合同其他条款及交易习惯也无法确定。根据合同法律制度的规定，下列关于合同履行价格的表述中，正确的是（）。", "options": ["按合同订立时海口的市场价格履行", "按合同订立时北京的市场价格履行", "按合同履行时海口的市场价格履行", "按合同履行时北京的市场价格履行"], "answer": [0], "explain": "在法定规则中，未约定动产（香蕉）履行地点的，应当以卖方（乙）的所在地作 为履行地点（专业表述为：履行义务一方所在地），所以履行地点为海口；价款确定的法定规 则是按照订立合同时履行地的市场价格履行，即订立合同时海口的市场价格履行。"}, {"type": "single", "year": "", "title": "王某向张某购买一台电脑，与张某约定一个月后由李某支付电脑价款。一个月后，李某未支付电脑价款。下列关于张某请求承担违约责任的表述中，正确的是（）。", "options": ["请求王某或李某承担", "请求李某承担", "请求王某承担", "请求王某和李某共同承担"], "answer": [2], "explain": "在由第三人履行的合同中，虽然由第三人李某付款，但电脑买卖合同是在债务人 王某和债权人张某之间成立的，应由债务人王某向债权人张某承担违约责任。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于行使同时履行抗辩权必须具备条件的表述中，正确的有（）。（2022 年）", "options": ["双方因同一双务合同互负债务", "对方当事人未履行或未适当履行合同债务", "双方债务已届清偿期", "行使抗辩权的当事人负有先为给付义务"], "answer": [0, 1, 2], "explain": "同时履行抗辩权行使的条件：（1）双方因同一双务合同互负债务，选项A 当选； （2）双方债务已届清偿期，选项C 当选；（3）行使抗辩权之当事人无先为给付义务，即双方 的互负债务没有先后履行顺序。没有先后履行顺序，或者是当事人约定同时履行，也可能是当 事人对履行顺序未约定或约定不明确，且根据交易习惯不能确定，选项D 不当选；（4）须对方 当事人未履行或未适当履行合同债务，选项B 当选。"}, {"type": "single", "year": "", "title": "甲公司从乙公司处订购一批货物，双方约定甲公司先支付货款，一周后乙公司交付货物。甲公司未在约定期限付款，却请求乙公司先交付货物。对于甲公司的请求，乙公司可行使的抗辩权是（）。（2023 年）", "options": ["同时履行抗辩权", "后履行抗辩权", "先诉抗辩权", "不安抗辩权"], "answer": [1], "explain": "后履行抗辩权行使的条件：（1）当事人基于同一双务合同，互负债务；（2）当 事人的履行有先后顺序；（3）应当先履行的当事人不履行合同或者不适当履行合同；（4）后 履行抗权的行使人是履行义务顺序在后的一方当事人。选项B 当选。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，应当先履行债务的当事人有确切证据证明对方当事人发生了特定情形的，可以行使不安抗辩权，该特定情形不包括（）。（2021 年）", "options": ["丧失商业信誉", "转移财产以逃避债务", "经营状况严重恶化", "变更经营方式"], "answer": [3], "explain": "应当先履行债务的当事人有确切证据证明对方有下列情形之一的，可以中止履行： （1）经营状况严重恶化；（2）转移财产、抽逃资金，以逃避债务；（3）丧失商业信誉；（4） 有丧失或者可能丧失履行债务能力的其他情形。选项D 当选。"}, {"type": "single", "year": "", "title": "甲公司与乙公司签订买卖合同，合同约定乙公司先送货，甲公司收到货物后付款。乙公司得知甲公司经营状况恶化，通知甲公司中止履行并要求甲公司提前付款或提供担保。下列表述中，错误的是（）。（2025 年）", "options": ["若乙公司有确切证据，无须先中止履行，可直接解除合同", "若乙公司没有确切证据而中止履行，应承担违约责任", "若甲公司未恢复履行能力或提供相应担保，乙公司可以解除合同", "若甲公司在合理期限内恢复履行能力或提供相应担保，乙公司应当恢复履行"], "answer": [0], "explain": "应当先履行债务的当事人行使不安抗辩权而中止履行的，应当及时通知对方。如果对 方当事人恢复了履行能力或者提供了相应担保后，先履行一方当事人应当恢复履行。中止履行合同 后，如果对方在合理期限内未恢复履行能力并且未提供适当担保的，视为以自己的行为表明不履行 主要债务，中止履行合同的一方可以解除合同，并可以请求对方承担违约责任。先履行债务的当事 人没有确切证据而行使不安抗辩权，造成对方损失的，应当承担违约责任。选项A 当选。"}, {"type": "multi", "year": "", "title": "钱某欠赵某15 万元，王某欠钱某20 万元，欠款均已经到期。由于钱某怠于行使其对王某的债权，危害赵某债权的实现，赵某决定行使代位权。下列关于代位权的说法中，正确的有（）。（2025 年）", "options": ["赵某可以要求王某向其支付20 万元", "王某对钱某的抗辩，可以向赵某主张", "赵某行使代位权的费用，由王某承担", "赵某可以以自己名义提起诉讼"], "answer": [1, 3], "explain": "代位权的行使范围以债权人的到期债权为限，债权人行使代位权的请求数额不能 超过债务人所负债务数额，即赵某行使代位权的范围是15 万元，选项A 不当选；相对人对债务 人的抗辩，可以向债权人主张，选项B 当选；债权人行使代位权的必要费用，由债务人（钱某） 负担，选项C 不当选；因债务人怠于行使其债权或者与该债权有关的从权利，影响债权人的到 期债权实现的，债权人可以向人民法院请求以自己的名义代位行使债务人对相对人的权利，但 是该权利专属于债务人自身的除外，选项D 当选。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，债务人享有的下列权利中，可以被代位行使的是（）。（2020 年）", "options": ["劳动报酬请求权", "基本养老金请求权", "房屋租金请求权", "失业保险金请求权"], "answer": [2], "explain": "专属于债务人自身的债权，债权人不得行使代位权。专属于债务人自身的权利包 括：（1）抚养费、赡养费或者扶养费请求权；（2）人身损害赔偿请求权；（3）劳动报酬请求 权，但是超过债务人及其所扶养家属的生活必需费用的部分除外；（4）请求支付基本养老保险 金、失业保险金、最低生活保障金等保障当事人基本生活的权利；（5）其他专属于债务人自身 的权利。选项C 当选。"}, {"type": "single", "year": "", "title": "2024 年5 月1 日，赵某对钱某享有的10 万元债权到期，钱某无力清偿。2024年6 月1 日，赵某得知李某拖欠钱某货款8 万元，但钱某一直未向李某主张。现赵某拟对李某行使代位权。下列关于赵某行使代位权说法正确的是（）。（2024 年）", "options": ["若赵某胜诉，李某应当先将8 万元还给钱某，再由钱某还给赵某", "赵某可以通过仲裁的方式来行使代位权", "赵某提起代位权诉讼，应当将钱某与李某列为共同被告", "赵某行使代位权的必要费用由钱某负担"], "answer": [3], "explain": "代位权诉讼中，是以次债务人李某为被告，债务人钱某为第三人，选项C 不当选； 人民法院认定代位权成立的，由次债务人向债权人履行清偿义务，债权人接受履行后，债权人 与债务人、债务人与次债务人之间相应的权利义务终止，选项A 不当选；债权人行使代位权的 必要费用，由债务人负担，选项D 当选；权利人行使代位权，是向人民法院提起代位权诉讼， 而不能通过仲裁的方式，选项B 不当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于债权人撤销权的表述中，正确的有（）。（2025 年）", "options": ["撤销权的行使范围以债权人的债权为限", "债权人行使撤销权的必要费用，由债权人承担", "债权人以自己的名义行使撤销权", "债权人提起撤销权之诉，以债务人和相对人为共同被告"], "answer": [0, 2, 3], "explain": "债权人行使撤销权所支付的合理的律师代理费、差旅费等必要费用，由债务人负 担。选项B 不当选。"}, {"type": "judge", "year": "", "title": "对于债务人放弃到期债权、无偿转让财产等无偿行为，影响债权人的债权实现，不论第三人善意或者恶意，债权人均得以请求撤销。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "对于债务人放弃到期债权、无偿转让财产等无偿行为，影响债权人的债权实现， 不论第三人善意或者恶意，债权人均得以请求撤销。本题表述正确。"}, {"type": "single", "year": "", "title": "2021 年1 月12 日，赵某向李某借款100 万元，借款利率6%，约定一年后偿还，债务到期赵某未偿还借款。李某于2022 年4 月18 日得知赵某三个月前将自己价值200 万元的汽车以80 万元的价格卖给了张某。李某最晚可以行使撤销权的时间是（）。（2023 年）", "options": ["2023 年1 月12 日", "2027 年1 月12 日", "2023 年4 月18 日", "2027 年4 月18 日"], "answer": [2], "explain": "撤销权自债权人知道或者应当知道撤销事由之日起1 年内行使。自债务人的行为 发生之日起5 年内没有行使撤销权的，该撤销权消灭。选项C 当选。"}, {"type": "multi", "year": "", "title": "赵某拖欠钱某10 万元货款，经多次催告仍未履行。钱某遂将该10 万元债权拆分为10 等份，分别转让给10 位朋友，并已将债权转让事宜通知赵某，要求其向新债权人履行义务。双方就债权转让未作任何特别约定。下列表述中正确的有（）。（2025 年）", "options": ["债权转让因未经赵某同意而无效", "赵某接到转让通知后，应当分别向钱某的10 位朋友履行义务", "履行合同增加的费用应由钱某承担", "钱某无权将债权拆分转让"], "answer": [1, 2], "explain": "合同权利转让是指债权人将合同的权利全部或者部分转让给第三人。债权人转让 权利无须经债务人同意，但应当通知债务人；未经通知，该转让对债务人不发生效力。选项A、 D 不当选。合同权利全部转让的，原合同关系消灭，受让人取代原债权人的地位，成为新的债权 人，原债权人脱离合同关系，债务人应向新的债权人履行债务。选项B 当选。因债权转让增加 的履行费用，由让与人（即原债权人）负担。选项C 当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于合同权利转让的表述中，正确的有（）。（2025 年）", "options": ["当事人可以约定不得转让", "债务人接到债权转让通知后，债务人对让与人的抗辩，不可以向受让人主张", "因债权转让增加的履行费用，由让与人负担", "债权转让应经债务人同意"], "answer": [0, 2], "explain": "债务人接到债权转让通知后，债务人对让与人的抗辩，可以向受让人主张，选项B 不当选；债权人转让债权无须经债务人同意，但应当通知债务人，未通知债务人的，该转让对 债务人不发生效力，选项D 不当选。"}, {"type": "judge", "year": "", "title": "债务人将部分债务转移给第三人的，无须经债权人同意。（）", "options": ["对", "错"], "answer": [1], "explain": "债务人将合同的义务全部或者部分转移给第三人，应当经债权人同意。"}, {"type": "single", "year": "", "title": "甲公司向乙公司购买一台车床，价款50 万元，甲公司与丙公司约定，由丙公司承担甲公司对乙公司的50 万元价款债务，乙公司表示同意。后丙公司始终未清偿50 万元价款。下列关于乙公司债权主张的表述中，正确的是（）。", "options": ["乙公司可以要求甲公司和丙公司共同偿还50 万元价款", "乙公司可以选择向甲公司或者丙公司主张清偿50 万元价款", "乙公司应当向丙公司主张清偿50 万元价款", "乙公司应当向甲公司主张清偿50 万元价款"], "answer": [2], "explain": "债权人乙公司已经同意债务人甲公司和第三人丙公司的债务承担约定，所以甲公司已 经退出与乙公司的债权债务关系，乙公司不能再要求甲公司承担债务，只能要求丙公司承担债务。"}, {"type": "judge", "year": "", "title": "合同终止的，不影响合同中独立存在的有关解决争议方法条款的效力。（）（2020 年）", "options": ["对", "错"], "answer": [0], "explain": "合同终止的，不影响合同中独立存在的有关解决争议方法条款的效力。本题表述正确。"}, {"type": "single", "year": "", "title": "2021 年4 月1 日，甲公司向乙公司借款100 万元，约定借期3 年。2022 年3月1 日甲公司又向乙公司借款80 万元，约定借期2 年，并以其一处房屋设立抵押并办理登记。2023 年3 月5 日甲公司又向乙公司借款60 万元，约定借期1 年，由丙公司提供保证。最后三笔借款均到期，甲公司向乙公司偿还了50 万元，当事人对于清偿顺序没有约定，甲公司也没有指定。甲公司偿还的借款应当是（）。（2024 年）", "options": ["2022 年3 月1 日的借款", "2021 年4 月1 日的借款", "2023 年3 月5 日的借款", "三笔债权同时按比例履行"], "answer": [1], "explain": "《民法典》第五百六十条规定：“债务人对同一债权人负担的数项债务种类相同， 债务人的给付不足以清偿全部债务的，除当事人另有约定外，由债务人在清偿时指定其履行的 债务。债务人未作指定的，应当优先履行已经到期的债务；数项债务均到期的，优先履行对债 权人缺乏担保或者担保最少的债务（选项B）；均无担保或者担保相等的，优先履行债务人负担 较重的债务；负担相同的，按照债务到期的先后顺序履行；到期时间相同的，按照债务比例履 行。”"}, {"type": "single", "year": "", "title": "甲公司向乙公司借款100 万元，约定利息10 万元。甲公司将一动产质押给乙公司。后甲公司到期无法履行债务，乙公司将该质物拍卖得到价款60 万元，其中拍卖手续费5 万元。当事人对履行顺位没有约定。乙公司实现的主债权金额是（）。（2024 年）", "options": ["45 万元", "50 万元", "55 万元", "60 万元"], "answer": [0], "explain": "债务人在履行主债务外还应当支付利息和实现债权的有关费用，其给付不足以清 偿全部债务的，除当事人另有约定外，应当按照下列顺序履行：（1）实现债权的有关费用；（2） 利息；（3）主债务。选项A 当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，关于法定抵销，下列表述正确的有（）。（2023 年）", "options": ["等额债务抵销后消灭", "抵销可以附条件和期限", "抵销后剩余债务重新计算诉讼时效", "抵销通知到达对方时生效"], "answer": [0, 2, 3], "explain": "抵销不得附条件和期限，选项B 不当选。"}, {"type": "single", "year": "", "title": "周某与李某互负到期债务，李某对周某所负债务是支付利息。根据合同法律制度的规定，周某对李某负有的下列债务中，可以适用法定抵销的是（）。", "options": ["因侵害自然人人身权益产生的赔偿债务", "支付租金", "提供劳务", "不开展竞争性营业活动"], "answer": [1], "explain": "不得主张法定抵销的债务包括：（1）提供劳务的债务（选项C）；（2）不作为的 债务（选项D）；（3）支付抚恤金、最低生活保障金、退休金的债务；（4）按照约定应当向第 三人给付的债务；（5）因侵害自然人人身权益，或故意、重大过失侵害他人财产权益产生的损 害赔偿债务（选项A）；（6）当事人约定或者法律规定不得抵销的其他情形。"}, {"type": "single", "year": "", "title": "甲欠乙6 万元，诉讼时效已经届满。乙欠甲10 万元，诉讼时效尚未届满。2025年6 月25 日，甲向乙发出抵销通知，6 月26 日通知到达乙，下列表述正确的是（）。（2025 年）", "options": ["抵销后，甲对乙剩余债权的诉讼时效重新计算", "抵销自6 月25 日生效", "可以约定“抵销生效以提供担保为前提”", "通知约定7 月1 日起抵销"], "answer": [0], "explain": "当事人主张抵销的，应当通知对方，通知自到达对方时生效，选项B 不当选。抵 销不得附条件或者附期限，选项C、D 不当选。抵销后剩余债权的诉讼时效期间，应重新起算， 选项A 当选。"}, {"type": "single", "year": "", "title": "张某与李某约定2 月29 日交货，2 月29 日李某如约交货，此时张某下落不明，李某提存货物，后发生不可抗力导致提存货物毁损，则对货物毁损承担责任的是（）。（2023 年）", "options": ["张某", "李某", "提存机关", "张某和提存机关共同负责"], "answer": [0], "explain": "债权人下落不明，债务人提存的，自提存之日起，提存人的债务归于消灭。提存 期间，标的物的孳息归债权人所有；提存费用由债权人负担；标的物提存后，毁损、灭失的风 险由债权人承担。选项A 当选。"}, {"type": "judge", "year": "", "title": "债权人免除连带债务人之一的债务，其余连带债务人仍应就全部债务承担连带责任。（）（2024 年）", "options": ["对", "错"], "answer": [1], "explain": "债权人免除连带债务人之一的债务的，其余连带债务人在扣除该连带债务人应分 担的份额后，仍应就“剩余”债务承担连带责任。"}, {"type": "multi", "year": "", "title": "根据合同法律制度规定，下列债务免除的表述中，正确的有（）。（2023 年）", "options": ["免除债务后，债权的从权利并不随之消灭", "免除不得损害第三人的利益", "债权人或其代理人应向债务人或者其代理人作出抛弃债权的意思表示", "免除人须具备相应的民事行为能力"], "answer": [1, 2, 3], "explain": "免除债务，债权的从权利，如从属于债权的担保权利、利息权利、违约金请求权 等也随之消灭。选项A 不当选；免除不得损害第三人的利益。如债权人免除其债务人的债务， 使得债权人无法清偿自身债务，债权人的债权人可以依法行使撤销权，撤销债权人免除债务的 行为。选项B 当选；债权人或者其代理人应向债务人或者其代理人作出抛弃债权的意思表示。 选项C 当选；免除应符合法律行为要件的有关规定，如免除人须具备民事行为能力。选项D 当 选。"}, {"type": "single", "year": "", "title": "乙公司与甲公司签订5 万元的借款合同，乙公司尚未还款，后债务因甲、乙公司合并为丙公司而终止。该债权债务关系终止的情形属于（）。（2022 年）", "options": ["免除", "抵销", "法定解除", "混同"], "answer": [3], "explain": "债的关系应有两个不同的主体，因混同致债权债务归于同一人，债的关系无法维 系，故归于消灭。选项D 当选。"}, {"type": "single", "year": "", "title": "2025 年3 月，甲科研所与乙企业签订一份设备改造的技术服务合同，约定自2025 年7 月1 日至12 月1 日，甲科研所负责对乙企业的自动生产线进行技术改造。合同签订后，乙企业为履行合同做了相关准备工作。5 月，甲科研所通知乙企业，因负责该项目的技术人员辞职，不能履行合同，根据合同法律制度的规定，下列关于乙企业权利的表述中，正确的是（）。", "options": ["乙企业有权解除合同，并要求甲科研所赔偿损失", "乙企业有权主张合同无效，并要求甲科研所承担缔约过失责任", "乙企业有权撤销合同，并要求甲科研所承担缔约过失责任", "乙企业至7 月1 日方有权要求甲科研所承担违约责任"], "answer": [0], "explain": "在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务， 另一方有权（立即）解除合同并请求赔偿损失。在本题中，甲科研所与乙企业签订的技术服务 合同在2025 年3 月签订时生效，甲科研所在5 月份明确表示不能履行合同，乙企业有权（立即） 解除合同并要求甲科研所赔偿损失。"}, {"type": "single", "year": "", "title": "甲小学为了庆祝“六一”儿童节学生表演节目的需要，向乙服装厂订购了100套童装，约定在5 月27 日完成交付。5 月28 日，甲小学向乙服装厂催要童装，却被告知，因布匹供应问题6 月3 日才能交付童装，甲小学因此欲解除合同。下列关于该合同解除的表述中，正确的是（）", "options": ["甲小学应先催告乙服装厂履行，乙服装厂在合理期限内未履行的，甲小学才可以解除合同", "甲小学可以解除合同，无须催告", "甲小学无权解除合同，只能要求乙服装厂承担违约责任", "甲小学无权自行解除合同，但可以请求法院解除合同"], "answer": [1], "explain": "当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的，当事人可 以（立即）解除合同。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，当事人一方未通知对方，直接以提起诉讼的方式依法主张解除合同，人民法院确认该主张的，合同自（）时解除。（2023 年）", "options": ["人民法院作出受理裁定", "人民法院的判决生效", "起诉状副本送达对方", "人民法院的判决书送达对方"], "answer": [2], "explain": "当事人一方未通知对方，直接以诉讼或仲裁方式主张解除合同，法院或仲裁机构 确认解除的，合同自起诉状副本或仲裁申请书副本送达对方时解除。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，违约方承担违约责任的形式不包括（）。（2021 年）", "options": ["行使撤销权", "继续履行", "支付违约金", "赔偿损失"], "answer": [0], "explain": "承担违约责任的形式包括继续履行、采取补救措施、赔偿损失、支付违约金、定 金责任。选项A 当选。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，下列各项中，人民法院可以要求债务人继续履行的是（）。（2023 年）", "options": ["表演唱歌", "表演话剧", "支付房租", "归还灭失的古董"], "answer": [2], "explain": "当事人一方未支付价款、报酬、租金、利息，或者不履行其他金钱债务的，对方 可以请求其支付。当事人一方不履行非金钱债务或者履行非金债务不符合约定的，对方可以要 求履行，但有下列情形之一的除外：（1）法律上或者事实上不能履行；（2）债务的标的不适 于强制履行或者履行费用过高，前者如以具有人身性质的劳务为债务的，后者指履行费用大大 超过实际履行合同所能获得的利益；（3）债权人在合理期限内未请求履行。选项C 当选。"}, {"type": "judge", "year": "", "title": "当事人一方违约造成对方损失，对方对损失的发生有过错的，可以减少相应的损失赔偿额。（）（2025 年）", "options": ["对", "错"], "answer": [0], "explain": "当事人一方违约造成对方损失，对方对损失的发生有过错的，可以减少相应的损 失赔偿额。本题表述正确。"}, {"type": "single", "year": "", "title": "根据合同法律制度的规定，当事人一方不履行合同义务，给对方造成损失的，应当按照约定承担赔偿责任。损失赔偿额应当相当于因违约造成的损失，包括合同履行后可以获得的利益，但不得超过（）。（2023 年）", "options": ["违约一方订立合同时预见到或者应当预见到因违约可能造成的损失", "违约一方违约时预见到或者应当预见到因违约可能造成的损失", "守约一方订立合同时预见到或者应当预见到因违约可能造成的损失", "守约一方因对方违约预见到或者应当预见到因违约可能造成的损失"], "answer": [0], "explain": "当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损 失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过 违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。"}, {"type": "single", "year": "", "title": "赵某和钱某于2025 年8 月6 日签订二手房买卖合同，合同约定房价总额为300 万元，赵某应付定金100 万元，实际赵某只支付了定金80 万元，钱某接受。则产生定金效力数为（）。（2025 年）", "options": ["100 万元", "90 万元", "80 万元", "60 万元"], "answer": [3], "explain": "定金的数额由当事人约定，但不得超过主合同标的额的20%，超过部分不产生定金 的效力。选项D 当选。"}, {"type": "single", "year": "", "title": "2024 年2 月1 日，赵某与甲公司签订机器购买合同，约定3 月1 日前交付，机器价款10 万元，赵某支付定金3 万元，签订合同后赵某支付定金。甲公司未按约定时间交付机器，导致赵某发生经营损失1 万元，赵某要求甲公司最高返还金额为（）。（2024 年）", "options": ["3 万元", "4 万元", "5 万元", "6 万元"], "answer": [2], "explain": "定金的数额由当事人约定；但是，不得超过主合同标的额的20%，超过部分不产生 定金的效力。收受定金的一方不履行债务或者履行债务不符合约定，致使合同目的不能实现的， 应当双倍返还定金。选项C 当选。"}, {"type": "single", "year": "", "title": "甲、乙签订100 万元的买卖合同，合同约定一方违约，应支付违约金18 万元。双方还签订了定金合同，约定甲交付定金30 万元，但甲实际只向乙交付了定金28 万元。之后乙违约，给甲实际造成损失15 万元。甲最多可以要求乙赔付的金额是（）。（2024 年）", "options": ["28 万元", "15 万元", "18 万元", "20 万元"], "answer": [3], "explain": "当事人既约定违约金，又约定定金的，一方违约时，对方可以选择适用违约金或 者定金条款。定金的数额由当事人约定；但是，不得超过主合同标的额的20%，超过部分不产生 定金的效力。如果甲选择定金罚则，乙赔付的金额是20 万元（超过的8 万元不产生定金效力， 即乙原数返还甲交付的28 万元，然后再赔付20 万元定金，也就是乙双倍返还定金），如果甲 选择违约金条款，乙赔付的金额是18 万元。选项D 当选。"}, {"type": "single", "year": "", "title": "张某有一件画作拟出售，于2019 年5 月10 日与王某签订买卖合同，约定四日后交货付款；5 月11 日，丁某愿以更高的价格购买该画作，张某遂与丁某签订合同，约定三日后交货付款；5 月12 日，张某又与林某签订合同，将该画作卖给林某，林某当即支付了价款，约定两日后交货。后因张某未交付画作，王某、丁某、林某均要求张某履行合同，诉至人民法院，下列关于该画作交付和所有权归属的表述中，正确的是（）。（2020 年）", "options": ["应支持林某对张某交付该画作的请求", "应支持王某对张某交付该画作的请求", "应支持丁某对张某交付该画作的请求", "应认定王某、丁某、林某共同取得该画作的所有权"], "answer": [0], "explain": "普通动产一物多卖，合同均有效：交付在先>付款在先>成立合同在先。"}, {"type": "single", "year": "", "title": "甲拥有一辆汽车欲出售，乙与甲签订了买卖合同，甲将汽车交付给乙，但尚未办理所有权转移登记。后，丙愿意出更高的价格购买，甲遂与丙签订买卖合同，到车辆管理部门办理了登记手续，并与丙约定一个月后交付。不久后丁也愿意购买该汽车且出价最高，甲遂与丁签订了买卖合同，并约定一星期后交付。下列关于汽车归属的表述中，正确的是（）。（2022 年）", "options": ["归属甲，因涉及多重买卖，合同均无效", "归属丙，因甲为丙办理了汽车所有权转移登记", "归属乙，因为汽车已交付给乙", "归属丁，因为丁出价最高"], "answer": [2], "explain": "特殊动产一物多卖，合同均有效：交付在先>转移登记在先>成立合同在先。"}, {"type": "single", "year": "", "title": "2021 年3 月1 日，出卖人甲公司与买受人乙公司订立电脑买卖合同，未约定交付地点和风险转移时间。甲公司分别委托独立承运人丙公司和丁公司负责海上运输和公路运输。3 月15 日，甲公司将电脑交给丙公司。3 月30 日，丙公司将电脑交给丁公司。4 月10 日，丁公司按照约定将电脑运送至乙公司，因乙公司未做好收货准备而未能交付。4 月15 日，丁公司将电脑交给乙公司。根据合同法律制度的规定，该批电脑毁损、灭失的风险转移给乙公司的时间为（）。", "options": ["4 月15 日", "3 月30 日", "3 月15 日", "4 月10 日"], "answer": [2], "explain": "当事人没有约定交付地点或者约定不明确的，可以协议补充；不能达成补充协议 的，按照交易习惯或者合同有关条款确定；仍不能确定，标的物需要运输的，出卖人将标的物 交付给第一承运人后，标的物毁损、灭失的风险由买受人承担。选项C 当选。"}, {"type": "single", "year": "", "title": "2022 年6 月1 日，甲公司与乙公司签订一份买卖合同，约定甲公司购买乙公司1000 套印有甲公司标志的运动服，6 月24 日由甲公司上门提货，合同对货物毁损风险承担未作特别约定，6 月24 日，甲公司因没安排好车辆未能及时提货，6 月25 日，乙公司的仓库遭雷击毁损，导致该批运动服全部毁损，下列关于该批运动服毁损风险承担的表述中，正确的是（）。（2022 年）", "options": ["乙公司承担，因货物是在其控制之下", "甲公司承担，因其没有按时上门提货", "甲公司和乙公司共同承担，因不可抗力造成货物毁损", "乙公司承担，因货物所有权没有转移"], "answer": [1], "explain": "标的物毁损、灭失的风险，在标的物交付之前由出卖人承担，交付之后由买受人 承担，但是法律另有规定或者当事人另有约定的除外。因买受人的原因致使标的物不能按照约 定的期限交付的，买受人应当自违反约定之日起承担标的物毁损、灭失的风险。选项B 当选。"}, {"type": "multi", "year": "", "title": "根据合同法律制度规定，当事人未作特别约定的情况下，下列关于买卖合同标的物损毁、灭失风险承担的表述中，正确的有（）。", "options": ["出卖人将标的物运抵交付地点后，买受人因标的物质量不合格而拒绝接受的，标的物损毁、灭失的风险由出卖人承担", "因买受人下落不明，出卖人无法向其交付标的物而将标的物提存的，在买受人领取标的物前，标的物损毁、灭失的风险由出卖人承担", "出卖人按照约定未交付有关标的物的单证和资料的，不影响标的物损毁、灭失风险的转移", "出卖人根据合同约定将标的物运送至买受人指定地点并交付给承运人后，标的物损毁、灭失的风险由买受人承担"], "answer": [0, 2, 3], "explain": "选项B：出卖人已经提存标的物的，视为标的物已经完成交付，标的物损毁、灭失 的风险由买受人承担。"}, {"type": "multi", "year": "", "title": "甲公司向乙公司购买一台大型设备，由于疏忽未在合同中约定检验期。该设备运回后，甲公司即组织人员进行检验，未发现质量问题，于是投入使用。至第3 年，该设备出现故障，经反复查找，发现该设备关键部位存在隐蔽瑕疵。该设备说明书表明质量保证期为4年。根据相关规定，下列关于乙公司是否承担责任的表述中，不正确的有（）。", "options": ["乙公司在合理期限内，未收到甲公司有关设备质量不合格的通知，故该设备质量应视为合格，乙公司不承担责任", "乙公司在2 年内未收到甲公司有关设备存在瑕疵的通知，故该设备质量应视为合格，乙公司不承担责任", "该设备说明书标明质量保证期为4 年，故乙公司应承担责任", "甲公司与乙公司双方未约定质量检验期间，都存在过错，应分担责任"], "answer": [0, 1, 3], "explain": "本题中，甲公司与乙公司约定质保期为4 年，甲公司在质保期内提出质量异议， 乙公司应当承担责任。"}, {"type": "single", "year": "", "title": "甲、乙签订一买卖合同，甲向乙购买机器5 台及附带的维修工具，机器编号分别为E、F、G、X、Y，拟分别用于不同厂区。乙向甲如期交付5 台机器及附带的维修工具。经验收，E 机器存在重大质量瑕疵而无法使用，F 机器附带的维修工具亦属不合格品，其他机器及维修工具不存在质量问题。根据合同法律制度的规定，下列关于甲如何解除合同的表述中，正确的是（）。", "options": ["甲可以解除5 台机器及维修工具的买卖合同", "甲只能就买卖合同中E 机器的部分解除", "甲可以就买卖合同中E 机器与F 机器的部分解除", "甲可以就买卖合同中F 机器的维修工具与E 机器的部分解除"], "answer": [3], "explain": "根据规定，标的物为数物，其中一物不符合约定的，买受人可以就该物解除，但 该物与他物分离使标的物的价值显受损害的，当事人可以就数物解除合同。本题中，由于标的 物是数物，E 机器存在重大质量瑕疵而无法使用，且分离不影响其他机器的价值（5 台机器拟分 别用于不同厂区），可以解除E 机器的买卖合同；又根据规定，因标的物的从物不符合约定被 解除的，解除的效力不及于主物。本题中，因F 机器附带的维修工具（从物）亦属不合格品， 仅可以解除F 机器附带的维修工具的合同。"}, {"type": "single", "year": "", "title": "甲、乙双方于2023 年1 月7 日订立买卖1 000 台彩电的合同，价款200 万元，双方约定：甲支付全部价款后，彩电的所有权才转移给甲。乙于2 月4 日交付了1 000 台彩电，甲于3 月5 日支付了100 万元，5 月6 日支付了剩余的100 万元。下列关于彩电所有权转移的表述中，符合规定的是（）。", "options": ["2 月4 日1 000 台彩电所有权转移", "3 月5 日1 000 台彩电所有权转移", "3 月5 日500 台彩电所有权转移", "5 月6 日1 000 台彩电所有权转移"], "answer": [3], "explain": "当事人可以在买卖合同中约定，买受人未履行支付价款或者其他义务时，标的物 的所有权属于出卖人。本题中，甲、乙约定：甲支付全部价款后，彩电的所有权才转移给甲。 所以5 月6 日甲付清全款时，1 000 台彩电所有权才转移给甲。"}, {"type": "judge", "year": "", "title": "2021 年5 月1 日，甲到某商场购买一台价值为20 000 元的冰箱，双方约定采取分期付款的方式；5 月1 日由甲先支付6 000 元并提货，6 月1 日再付6 000 元，其余8 000元在7 月10 日前付清。6 月1 日，甲未按期支付6 000 元价款，该商场对其进行了催告，仍无法收回款项。此时，该商场有权要求解除合同，并可以要求甲支付使用费。（）", "options": ["对", "错"], "answer": [0], "explain": "分期付款买卖中，未支付到期价款的金额已经达到全部价款的1/5 的，出卖人可 以主张解除合同并要求买受人支付相应的使用费。本题中，未支付到期价款占全部价款比例＝ （6 000÷20 000）×100%=30%。因此，该商场有权要求解除合同，并可以要求甲支付使用费。"}, {"type": "multi", "year": "", "title": "根据合同法律制度的规定，下列关于试用买卖合同的表述中，正确的有（）。（2025 年）", "options": ["试用期限届满买受人对是否购买标的物未作表示的，视为购买", "试用买卖的当事人没有约定标的物的使用费，视为无偿试用", "试用期内买受人将标的物出租的，视为购买", "试用期内标的物毁损、灭失的风险由买受人承担"], "answer": [0, 1, 2], "explain": "试用买卖的买受人在试用期内可以购买标的物，也可以拒绝购买。试用期限届满， 买受人对是否购买标的物未作表示的，视为购买，选项A 当选。试用买卖的当事人没有约定使 用费或者约定不明确的，出卖人无权主张买受人支付使用费，选项B 当选。试用买卖的买受人 在试用期内已经支付部分价款或者对标的物实施出卖、出租、设立担保物权等行为的，视为同 意购买，选项C 当选。标的物在试用期内毁损、灭失的风险由出卖人承担，选项D 不当选。"}, {"type": "judge", "year": "", "title": "赠与人故意不告知赠与财产的瑕疵，造成受赠人损失的，应当承担损害赔偿责任。（）", "options": ["对", "错"], "answer": [0], "explain": "赠与人故意不告知赠与财产的瑕疵，造成受赠人损失的，应当承担损害赔偿责任。 本题表述正确。"}, {"type": "judge", "year": "", "title": "受赠人严重侵害赠与人或者赠与人近亲属的合法权益，赠与人可以撤销赠与。（）（2023 年）", "options": ["对", "错"], "answer": [0], "explain": "受赠人严重侵害赠与人或者赠与人近亲属的合法权益，赠与人可以撤销赠与。本 题表述正确。"}, {"type": "multi", "year": "", "title": "下列情形中，赠与人不得主张撤销赠与的有（）。", "options": ["张某将1 辆小轿车赠与李某，且已交付", "甲公司与某地震灾区小学签订赠与合同，将赠与50 万元用于修复教学楼", "乙公司表示将赠与某大学3 辆校车，双方签订了赠与合同，且对该赠与合同进行了公证", "陈某将1 块钟表赠与王某，且已交付，但王某不履行赠与合同约定的义务"], "answer": [0, 1, 2], "explain": "（1）根据规定，赠与人在赠与财产的权利转移之前可以撤销赠与。本题中，张某 已将轿车交
